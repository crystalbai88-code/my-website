<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三年级语文暑期复习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap">
<style>
:root{
  --paper:#F7F2E6; --paper-card:#FDFAF2; --paper-warm:#EDE5CD;
  --ink:#1C1310; --ink-mid:#4A3628; --ink-light:#7B6555;
  --cinnabar:#C03B2C;  --cin-bg:#F9EEEC;
  --jade:#2B7A56;      --jade-bg:#EAF5EE;
  --gold:#B8841A;      --gold-bg:#FBF3E0;
  --azure:#2C5F8A;     --azure-bg:#EBF1F8;
  --purple:#7C4DB8;    --purple-bg:#F1ECF9;
  --border:#D9CEBC;    --border-lt:#EDE7DA;
  --sh-sm:0 1px 4px rgba(28,19,16,.08);
  --sh-md:0 3px 12px rgba(28,19,16,.10);
  --r:2px;
  --font-brush:'Ma Shan Zheng','STKaiti',cursive;
  --font-serif:'Noto Serif SC','STSong','SimSun',serif;
  --font-sans:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink-mid);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:inherit}
input{font-family:inherit}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* ════ HOME ════ */
#home{background:var(--paper)}
.home-hero{
  padding:32px 24px 22px;text-align:center;
  border-bottom:1px solid var(--border);
  position:relative;
}
.home-hero::after{
  content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:48px;height:2px;background:var(--cinnabar);
}
.home-hero h1{
  font-family:var(--font-brush);font-size:2.1rem;font-weight:400;
  color:var(--ink);line-height:1.3;letter-spacing:.06em;
}
.home-hero p{color:var(--ink-light);font-size:.88rem;margin-top:8px;line-height:1.6;font-family:var(--font-serif)}

.stats-row{display:flex;gap:8px;padding:14px 16px 10px;justify-content:center;flex-wrap:wrap}
.stat-chip{
  background:var(--paper-card);border:1px solid var(--border);border-radius:var(--r);
  padding:7px 16px;font-size:.9rem;display:flex;align-items:center;gap:5px;
  color:var(--ink-mid);box-shadow:var(--sh-sm);
}
.stat-chip b{color:var(--cinnabar)}

.progress-bar-wrap{padding:4px 16px 16px}
.prog-bar{height:4px;background:var(--border-lt);position:relative;overflow:hidden;border-radius:2px}
.prog-fill{height:100%;background:var(--cinnabar);transition:width .8s cubic-bezier(.4,0,.2,1);border-radius:2px}
.prog-label{font-family:var(--font-serif);font-size:.76rem;color:var(--ink-light);margin-top:5px;text-align:right}

/* calendar */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:4px 10px 28px}
.cal-head{text-align:center;font-size:.72rem;color:var(--ink-light);padding:4px 0 6px;font-weight:600;letter-spacing:.06em}
.day-cell{
  aspect-ratio:1;border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;
  border:1px solid var(--border-lt);background:var(--paper-card);
  transition:transform .12s,box-shadow .12s,border-color .2s;
}
.day-cell:not(.locked):hover{transform:translateY(-1px);box-shadow:var(--sh-md);border-color:var(--border)}
.day-cell.locked{background:var(--paper);border-color:transparent;cursor:not-allowed}
.day-cell.today{background:var(--gold-bg);border-color:var(--gold);border-width:1.5px}
.day-cell.poem-day{background:var(--jade-bg);border-color:#9AC9A8}
/* stamp: completed day */
.day-cell.done{background:var(--paper);border-color:var(--border-lt)}
.day-cell.done .day-num,.day-cell.done .day-icon{opacity:.25}
.day-cell.done::after{
  content:'完';
  position:absolute;inset:0;margin:auto;
  width:60%;aspect-ratio:1;height:auto;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-brush);font-size:1.4rem;font-weight:400;
  color:var(--cinnabar);
  border:2px solid var(--cinnabar);border-radius:50%;
  opacity:.8;transform:rotate(-12deg);
  animation:stamp .4s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.8}}

.day-num{font-size:.8rem;font-weight:700;color:var(--ink-light);line-height:1;z-index:1;position:relative}
.day-cell.today .day-num{color:var(--gold);font-weight:800}
.day-cell.poem-day .day-num{color:var(--jade)}
.day-cell.locked .day-num{color:var(--border)}
.day-icon{font-size:1rem;line-height:1;z-index:1;position:relative;margin-top:3px;font-family:var(--font-brush);color:var(--ink-light)}
.day-cell.poem-day .day-icon{color:var(--jade)}
.day-cell.today .day-icon{color:var(--gold)}
.day-cell.locked .day-icon{color:var(--border-lt)}

/* ════ LESSON ════ */
#lesson{background:var(--paper)}
.lesson-header{
  padding:11px 16px 9px;background:var(--paper-card);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:50;box-shadow:var(--sh-sm);
  position:sticky;
}
.lesson-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cinnabar)}
.back-btn{
  width:36px;height:36px;border-radius:var(--r);
  background:transparent;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--ink-mid);flex-shrink:0;
}
.lesson-title{flex:1;font-family:var(--font-serif);font-size:1rem;font-weight:600;color:var(--ink);line-height:1.2}
.lesson-day-badge{background:var(--cinnabar);color:#fff;border-radius:var(--r);padding:3px 12px;font-size:.82rem;font-weight:700;letter-spacing:.04em;flex-shrink:0}

/* step progress — ink dashes */
.step-dots{display:flex;gap:6px;padding:10px 16px 6px;justify-content:center;align-items:center}
.step-dot{height:5px;width:22px;border-radius:3px;background:var(--border);transition:background .25s,width .25s}
.step-dot.done{background:var(--jade)}
.step-dot.active{background:var(--cinnabar);width:38px}

.lesson-body{flex:1;overflow-y:auto;padding:16px}

/* step labels */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.step-label{
  font-size:.65rem;font-weight:700;color:var(--cinnabar);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.step-label::before{content:'';display:inline-block;width:14px;height:1.5px;background:var(--cinnabar)}
.step-heading{font-family:var(--font-serif);font-size:1.1rem;font-weight:600;color:var(--ink);margin-bottom:16px;line-height:1.45}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r);padding:13px 26px;font-size:.96rem;font-weight:700;transition:transform .12s,opacity .15s;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.btn-amber{background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(184,132,26,.28)}
.btn-green{background:var(--jade);color:#fff;box-shadow:0 2px 8px rgba(43,122,86,.22)}
.btn-blue{background:var(--azure);color:#fff;box-shadow:0 2px 8px rgba(44,95,138,.22)}
.btn-purple{background:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(124,77,184,.22)}
.btn-red{background:var(--cinnabar);color:#fff;box-shadow:0 2px 8px rgba(192,59,44,.28)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink-light)}
.btn-full{width:100%;justify-content:center;margin-top:12px}
.lesson-nav{padding:10px 16px 22px;display:flex;gap:10px}

/* vocab cards */
.vocab-list{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.vocab-card{
  background:var(--paper-card);border-radius:var(--r);
  border:1px solid var(--border);border-left:4px solid var(--cinnabar);
  padding:14px 16px;cursor:pointer;
  transition:border-left-color .18s,background .18s;
  position:relative;
}
.vocab-card::after{content:'▸ 翻看';position:absolute;right:58px;top:50%;transform:translateY(-50%);font-size:.74rem;color:var(--border);transition:opacity .2s}
.vocab-card.flipped::after{opacity:0}
.vocab-word{font-family:var(--font-brush);font-size:1.9rem;font-weight:400;color:var(--ink);letter-spacing:.1em}
.vocab-pinyin{font-size:.84rem;color:var(--ink-light);margin-bottom:3px;letter-spacing:.06em}
.vocab-def{display:none;font-size:.92rem;color:var(--ink-mid);margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);line-height:1.7}
.vocab-card.flipped .vocab-def{display:block}
.vocab-card.flipped{border-left-color:var(--jade);background:#F5FAF7}

/* ════ POEM — 卷轴 scroll ════ */
.poem-scroll{margin-bottom:16px}
.scroll-rod{height:9px;border-radius:3px}
.scroll-rod.top{background:linear-gradient(180deg,#7A2C1E,#C03B2C)}
.scroll-rod.bot{background:linear-gradient(0deg,#7A2C1E,#C03B2C)}
.scroll-body{
  background:linear-gradient(180deg,#EFE9D5 0%,#F5F0E0 30%,#F5F0E0 70%,#EFE9D5 100%);
  padding:26px 22px 22px;
  border-left:1px solid rgba(192,59,44,.18);
  border-right:1px solid rgba(192,59,44,.18);
}
.scroll-title{
  display:flex;align-items:baseline;gap:10px;
  border-bottom:1px solid rgba(192,59,44,.2);padding-bottom:12px;margin-bottom:20px;
}
.scroll-name{font-family:var(--font-brush);font-size:1.65rem;color:var(--ink);letter-spacing:.1em}
.scroll-author{font-family:var(--font-serif);font-size:.78rem;color:var(--ink-light);letter-spacing:.06em}
.scroll-lines{display:flex;flex-direction:column;gap:0}
.scroll-line{
  font-family:var(--font-serif);font-size:1.18rem;font-weight:400;
  line-height:2.5;letter-spacing:.14em;color:var(--ink);text-align:center;
}
.scroll-line.classical{font-size:.98rem;text-align:left;line-height:2;letter-spacing:.06em}
.prose-text{
  background:var(--paper-warm);padding:18px 16px;margin:10px 0;
  border-top:2px solid var(--cinnabar);border-bottom:2px solid var(--cinnabar);
  font-family:var(--font-serif);font-size:.93rem;line-height:2.2;color:var(--ink);
  white-space:pre-wrap;
}
.prose-tip{background:var(--gold-bg);border-left:3px solid var(--gold);padding:10px 14px;font-size:.82rem;line-height:1.7;color:var(--ink-mid);margin:10px 0;font-family:var(--font-serif)}
#recite-phase2{display:none}

/* meaning in scroll */
.scroll-meaning{
  font-family:var(--font-serif);font-size:.9rem;color:rgba(28,19,16,.8);
  line-height:1.95;padding-top:4px;text-align:left;letter-spacing:.02em;
}

.poem-sub-dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
.poem-sub-dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:background .2s,transform .2s}
.poem-sub-dot.done{background:var(--jade)}
.poem-sub-dot.active{background:var(--cinnabar);transform:scale(1.35)}

/* notes */
.notes-list{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.note-item{background:var(--paper-card);border-left:3px solid var(--gold);padding:9px 13px;font-size:.86rem;line-height:1.65;color:var(--ink-mid)}
.note-term{font-family:var(--font-serif);font-weight:600;color:var(--gold);margin-right:4px}

/* appreciation */
.appreciation-box{
  background:var(--paper-card);border-left:4px solid var(--cinnabar);
  padding:16px 18px;font-family:var(--font-serif);font-size:.9rem;line-height:1.95;
  color:var(--ink-mid);margin:12px 0;
}
.appr-head{font-size:.65rem;font-weight:700;color:var(--cinnabar);letter-spacing:.12em;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.appr-head::before{content:'';display:inline-block;width:14px;height:1.5px;background:var(--cinnabar)}

/* fill-in */
.blank-question{margin:9px 0;padding:13px 15px;background:var(--paper-card);border:1px solid var(--border)}
.blank-q-text{font-family:var(--font-serif);font-size:1.08rem;font-weight:400;margin-bottom:9px;line-height:2.1;letter-spacing:.12em;color:var(--ink)}
.blank-input{border:1px solid var(--border);border-radius:var(--r);padding:7px 12px;font-size:.95rem;font-family:var(--font-serif);width:100%;outline:none;background:var(--paper);color:var(--ink);transition:border-color .18s}
.blank-input:focus{border-color:var(--azure)}
.blank-input.ok{border-color:var(--jade);background:var(--jade-bg)}
.blank-input.bad{border-color:var(--cinnabar);background:var(--cin-bg)}
.blank-ans{font-size:.8rem;margin-top:4px;display:none;line-height:1.5}
.blank-ans.show{display:block}

/* recitation */
.recite-display{
  background:var(--paper-warm);padding:24px 20px;margin:12px 0;text-align:center;
  border-top:2px solid var(--cinnabar);border-bottom:2px solid var(--cinnabar);
}
.recite-poem{font-family:var(--font-serif);font-size:1.05rem;line-height:2.5;letter-spacing:.14em;color:var(--ink)}
.recite-status{margin-top:10px;font-size:.82rem;color:var(--ink-light)}
.recite-btn{width:66px;height:66px;border-radius:50%;background:var(--cinnabar);color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;margin:14px auto;box-shadow:0 4px 16px rgba(192,59,44,.35);transition:transform .2s,box-shadow .2s}
.recite-btn:active{transform:scale(.92)}
.recite-btn.listening{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 16px rgba(192,59,44,.35)}50%{box-shadow:0 4px 32px rgba(192,59,44,.65)}}
.recite-result{padding:10px 14px;font-size:.86rem;margin-top:8px;display:none;font-family:var(--font-serif);line-height:1.6}
.recite-result.show{display:block}
.recite-result.pass{background:var(--jade-bg);color:var(--jade);border-left:3px solid var(--jade)}
.recite-result.fail{background:var(--cin-bg);color:var(--cinnabar);border-left:3px solid var(--cinnabar)}

/* 田字格 */
.tian-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:16px 0}
.tian-row{display:flex;gap:8px}
.tian-canvas{border:1.5px solid var(--ink-mid);touch-action:none;background:#FFFEF8;cursor:crosshair}
.tian-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tian-btn{border-radius:var(--r);padding:6px 14px;font-size:.8rem;font-weight:600;background:var(--paper-card);border:1px solid var(--border);color:var(--ink-mid);transition:background .14s}
.tian-btn:hover{background:var(--paper-warm)}
.char-to-write{font-family:var(--font-brush);font-size:2.8rem;font-weight:400;color:var(--ink);text-align:center;letter-spacing:.22em;margin-bottom:2px}
.char-stroke-order{font-size:.76rem;color:var(--ink-light);text-align:center;font-family:var(--font-serif)}

/* harvest — 证书 */
.harvest-card{
  background:linear-gradient(165deg,#FBF5E4 0%,#F5EDD0 100%);
  border:1px solid var(--gold);padding:30px 24px;
  text-align:center;position:relative;margin-bottom:16px;overflow:hidden;
}
.harvest-card::before{content:'';position:absolute;inset:7px;border:1px solid rgba(184,132,26,.28);pointer-events:none}
.harvest-card::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:44px;height:3px;background:var(--cinnabar)}
.harvest-emoji{font-size:2.8rem;display:block;margin-bottom:10px}
.harvest-title{font-family:var(--font-brush);font-size:1.6rem;font-weight:400;color:var(--ink);margin-bottom:10px;letter-spacing:.1em}
.harvest-text{font-family:var(--font-serif);font-size:.88rem;color:var(--ink-mid);line-height:1.95}
.harvest-stars{font-size:1.3rem;margin-top:14px;letter-spacing:7px}
.harvest-date{font-family:var(--font-serif);font-size:.7rem;color:var(--ink-light);margin-top:10px}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:7px;height:7px;border-radius:1px;animation:confetti-fall 1.5s ease-in forwards}
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(540deg);opacity:0}}

/* quiz */
.quiz-question{margin-bottom:18px}
.quiz-q-text{font-family:var(--font-serif);font-size:.92rem;margin-bottom:10px;line-height:1.75;color:var(--ink)}
.quiz-options{display:flex;flex-direction:column;gap:4px}
.quiz-opt{border-radius:var(--r);padding:9px 13px;font-size:.88rem;background:var(--paper-card);border:1px solid var(--border);text-align:left;transition:background .14s,border-color .14s;color:var(--ink-mid)}
.quiz-opt.selected{border-color:var(--azure);background:var(--azure-bg);color:var(--azure)}
.quiz-opt.correct{border-color:var(--jade);background:var(--jade-bg);color:var(--jade)}
.quiz-opt.wrong{border-color:var(--cinnabar);background:var(--cin-bg);color:var(--cinnabar)}
.quiz-feedback{padding:7px 12px;font-size:.82rem;margin-top:4px;display:none;line-height:1.55;font-family:var(--font-serif)}
.quiz-feedback.show{display:block}
.quiz-feedback.ok{background:var(--jade-bg);color:var(--jade);border-left:3px solid var(--jade)}
.quiz-feedback.bad{background:var(--cin-bg);color:var(--cinnabar);border-left:3px solid var(--cinnabar)}
.quiz-score{text-align:center;font-family:var(--font-brush);font-size:1.5rem;padding:14px;display:none;color:var(--ink);letter-spacing:.06em}
.quiz-score.show{display:block}

/* misc */
.info-box{background:var(--paper-card);border:1px solid var(--border);border-left:3px solid var(--azure);padding:13px 15px;margin-bottom:12px}
.info-box h3{font-family:var(--font-serif);font-size:.88rem;font-weight:600;margin-bottom:5px;color:var(--ink)}
.info-box p{font-size:.83rem;color:var(--ink-light);line-height:1.7}
.fade-guide{text-align:center;color:var(--ink-light);font-size:.8rem;padding:10px;font-family:var(--font-serif);animation:fadeIn .5s}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:0}

/* ── TTS button ── */
.tts-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:transparent;border:1px solid var(--border);border-radius:var(--r);
  padding:7px 14px;font-size:.88rem;color:var(--ink-light);cursor:pointer;
  transition:background .15s,color .15s;
}
.tts-btn:hover{background:var(--cin-bg);color:var(--cinnabar);border-color:var(--cinnabar)}
.tts-btn.speaking{background:var(--cin-bg);color:var(--cinnabar);border-color:var(--cinnabar);animation:pulse .8s ease-in-out infinite}
.tts-btn.loading{background:var(--paper-warm);color:var(--ink-light);border-color:var(--border);cursor:wait;animation:pulse .6s ease-in-out infinite}
.tts-seal.loading{opacity:.5;cursor:wait;animation:pulse .6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.tts-bar{display:flex;gap:8px;margin:8px 0 4px;flex-wrap:wrap}

/* ── Intro step paper strips ── */
.intro-strips{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.intro-strip{background:var(--paper-card);border:1px solid var(--border-lt);border-left:4px solid var(--border);border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;gap:12px}
.intro-strip-cin{border-left-color:var(--cinnabar)}
.intro-strip-jade{border-left-color:var(--jade)}
.intro-strip-gold{border-left-color:var(--gold)}
.intro-strip-azure{border-left-color:var(--azure)}
.intro-glyph{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-brush);font-size:1.2rem;flex-shrink:0}
.intro-strip-cin .intro-glyph{background:var(--cin-bg);color:var(--cinnabar)}
.intro-strip-jade .intro-glyph{background:var(--jade-bg);color:var(--jade)}
.intro-strip-gold .intro-glyph{background:var(--gold-bg);color:var(--gold)}
.intro-strip-azure .intro-glyph{background:var(--azure-bg);color:var(--azure)}
.intro-strip-title{font-weight:700;color:var(--ink);font-family:var(--font-serif);font-size:.9rem}
.intro-strip-sub{font-size:.78rem;color:var(--ink-light);margin-top:2px}
/* ── TTS seal button (vocab cards) ── */
.tts-seal{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--ink-light);font-family:var(--font-brush);font-size:.95rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tts-seal:hover{background:var(--cin-bg);color:var(--cinnabar);border-color:var(--cinnabar)}
.tts-seal.speaking{background:var(--cin-bg);color:var(--cinnabar);border-color:var(--cinnabar);animation:pulse .8s ease-in-out infinite}

/* ── Match game (连连看) ── */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.match-item{
  padding:13px 14px;border-radius:var(--r);border:1.5px solid var(--border);
  background:var(--paper-card);font-family:var(--font-serif);
  cursor:pointer;text-align:center;font-size:1rem;
  transition:border-color .2s,background .2s,transform .12s;
  user-select:none;line-height:1.4;
}
.match-item:hover:not(.matched):not(.wrong-flash){border-color:var(--ink-mid);transform:translateY(-1px)}
.match-item.selected{border-color:var(--cinnabar);background:var(--cin-bg);color:var(--cinnabar)}
.match-item.matched{border-color:var(--jade);background:var(--jade-bg);color:var(--jade);cursor:default}
@keyframes wrongFlash{0%,100%{background:var(--paper-card)}30%,70%{background:#fee2e2;border-color:var(--cinnabar)}}
.match-item.wrong-flash{animation:wrongFlash .5s ease}
.match-score{text-align:center;font-family:var(--font-serif);font-size:1rem;padding:10px;color:var(--jade);font-weight:600;display:none}
.match-score.show{display:block}

/* ── Dictation (听写) ── */
.dictation-speaker{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:24px;background:var(--paper-card);border:1px solid var(--border);
  border-radius:var(--r);margin:12px 0;
}
.dictation-play-btn{
  width:72px;height:72px;border-radius:50%;
  background:var(--cinnabar);color:#fff;font-size:2rem;
  display:flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;box-shadow:0 4px 16px rgba(192,59,44,.3);
  transition:transform .12s,box-shadow .12s;
}
.dictation-play-btn:active{transform:scale(.94)}
.dictation-play-btn.playing{animation:pulse .8s ease-in-out infinite}
.dictation-hint{font-size:.78rem;color:var(--ink-light);font-family:var(--font-serif)}
.dictation-input-row{display:flex;gap:8px;width:100%}
.dictation-input{
  flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r);
  font-family:var(--font-serif);font-size:1rem;background:var(--paper-card);
  outline:none;transition:border-color .2s;
}
.dictation-input:focus{border-color:var(--cinnabar)}
.dictation-check-btn{
  padding:10px 18px;background:var(--cinnabar);color:#fff;border:none;
  border-radius:var(--r);font-size:.9rem;font-weight:700;cursor:pointer;
  white-space:nowrap;
}
.dictation-feedback{margin-top:8px;font-family:var(--font-serif);font-size:.9rem;min-height:24px;text-align:center}
.dictation-progress{font-size:.78rem;color:var(--ink-light);font-family:var(--font-serif)}
</style>

// ══════════════════════════════════════════
// STATE & PERSISTENCE
// ══════════════════════════════════════════
function getStartDate(){
  const saved=localStorage.getItem('sr_start_date');
  return saved?new Date(saved):new Date('2026-07-01');
}
let START_DATE=getStartDate();

function getProgress(){
  try{return JSON.parse(localStorage.getItem('sr_progress')||'{}')}catch{return{}}
}
function saveProgress(p){localStorage.setItem('sr_progress',JSON.stringify(p))}

function getDaysSinceStart(){
  const now=new Date();
  const diff=Math.floor((now-START_DATE)/(1000*60*60*24));
  return Math.max(0,diff);
}

function getTodayDayNum(){
  return Math.min(getDaysSinceStart()+1,36);
}

// ══════════════════════════════════════════
// HOME SCREEN
// ══════════════════════════════════════════
function renderHome(){
  const progress=getProgress();
  const today=getTodayDayNum();
  const doneDays=Object.keys(progress).filter(k=>progress[k].done).length;
  const poemsDone=Object.keys(progress).filter(k=>progress[k].poemDone).length;
  const totalStars=Object.values(progress).reduce((s,v)=>s+(v.stars||0),0);

  document.getElementById('stat-days').textContent=doneDays;
  document.getElementById('stat-stars').textContent=totalStars;
  document.getElementById('stat-poems').textContent=poemsDone;

  const pct=Math.round((doneDays/36)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=
    doneDays===0?'尚未开始':doneDays===36?'全部完成！🎉':`已完成 ${pct}%，还有 ${36-doneDays} 天`;

  // greeting
  const greetEl=document.getElementById('home-greeting');
  if(doneDays===0) greetEl.textContent='从今天开始，每天20分钟，快乐复习！';
  else if(doneDays===36) greetEl.textContent='🎊 全部36天完成！你真的太棒了！';
  else greetEl.textContent=`已坚持${doneDays}天，继续加油！第${today}天等你来打卡`;

  // calendar
  const grid=document.getElementById('calendar-grid');
  // remove old cells (keep 7 headers)
  while(grid.children.length>7) grid.removeChild(grid.lastChild);

  // start day of week for July 1 2026 (Wednesday=3, 0=Monday in our grid)
  const startDow=(START_DATE.getDay()+6)%7; // Mon=0..Sun=6
  for(let i=0;i<startDow;i++){
    const blank=document.createElement('div');
    grid.appendChild(blank);
  }

  for(let d=1;d<=36;d++){
    const sched=SCHEDULE[d-1];
    const cell=document.createElement('div');
    cell.className='day-cell';
    const done=progress[d]&&progress[d].done;
    const isPoemDay=!!sched.poemId;
    const isToday=d===today;
    const isLocked=d>today;

    if(done){
      cell.classList.add('done');
    } else if(isToday){
      cell.classList.add('today');
    } else if(isLocked){
      cell.classList.add('locked');
    } else if(isPoemDay){
      cell.classList.add('poem-day');
    }

    const stars=progress[d]&&progress[d].stars||0;
    cell.innerHTML=`
      <span class="day-num">${d}</span>
      <span class="day-icon">${isPoemDay?'诗':'文'}</span>
      ${stars>0?`<span class="day-star">${'⭐'.repeat(stars)}</span>`:''}
    `;

    if(!isLocked){
      cell.onclick=()=>openLesson(d);
    }
    grid.appendChild(cell);
  }
}

// ══════════════════════════════════════════
// LESSON FLOW
// ══════════════════════════════════════════
let currentDay=null;
let currentSteps=[];
let currentStepIdx=0;
let currentPoem=null;
let poemStepIdx=0;
let quizAnswered=[];
let recognition=null;
let drawing=false;
let canvasCtx=null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){
  if(recognition){try{recognition.stop()}catch{}}
  showScreen('home');
  renderHome();
}

function openLesson(dayNum){
  currentDay=dayNum;
  const sched=SCHEDULE[dayNum-1];
  currentStepIdx=0;
  poemStepIdx=0;
  quizAnswered=[];

  document.getElementById('lesson-title').textContent=sched.title;
  document.getElementById('lesson-day-badge').textContent='第'+dayNum+'天';

  // Every day: intro → vocab → activity → recite → writing → harvest
  currentSteps=[];
  currentSteps.push({type:'intro', sched});

  // Step 2: vocab for today's poem/prose
  if(sched.vocabKey && VOCAB_SETS[sched.vocabKey]){
    currentSteps.push({type:'vocab', vocabKey:sched.vocabKey});
  }

  // Step 3: rotating activity
  const at=sched.actType;
  if(at==='sentence'){
    const key=sched.poemId||sched.proseId;
    currentSteps.push({type:'sentence', sentKey:key});
  } else if(at==='quiz'){
    currentSteps.push({type:'quiz', sched});
  } else if(at==='match'){
    currentSteps.push({type:'match', vocabKey:sched.vocabKey});
  } else if(at==='dictation'){
    currentSteps.push({type:'dictation', vocabKey:sched.vocabKey});
  } else if(at==='imitate'||at==='creative'){
    currentSteps.push({type:'writingPrompt', promptKey:sched.actKey, promptType:at});
  } else if(at==='riji'){
    currentSteps.push({type:'riji', rijiKey:sched.rijiKey});
  }

  // Step 4: recitation (poem or prose, alternates by schedule)
  if(sched.poemId){
    currentSteps.push({type:'poem', poem:POEMS.find(p=>p.id===sched.poemId)});
  } else if(sched.proseId){
    currentSteps.push({type:'prose', prose:PROSE_TEXTS.find(p=>p.id===sched.proseId)});
  }

  // Step 5: writing (田字格)
  currentSteps.push({type:'writing', chars:sched.writingChars});

  // Step 6: harvest
  currentSteps.push({type:'harvest', sched});

  renderStepDots();
  renderStep(0);
  showScreen('lesson');
}

function renderStepDots(){
  const dots=document.getElementById('step-dots');
  dots.innerHTML='';
  currentSteps.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='step-dot'+(i===0?' active':'');
    dots.appendChild(d);
  });
}

function updateDots(){
  const dots=document.querySelectorAll('.step-dot');
  dots.forEach((d,i)=>{
    d.className='step-dot'+(i<currentStepIdx?' done':i===currentStepIdx?' active':'');
  });
}

function renderStep(idx){
  currentStepIdx=idx;
  updateDots();
  const step=currentSteps[idx];
  const body=document.getElementById('lesson-body');
  body.innerHTML='';

  const prevBtn=document.getElementById('btn-prev');
  const nextBtn=document.getElementById('btn-next');
  prevBtn.style.display=idx>0?'inline-flex':'none';
  // reset handlers (poem/prose steps override them, restore here)
  nextBtn.onclick=nextStep;
  prevBtn.onclick=prevStep;

  if(step.type==='intro') renderIntroStep(body,step.sched);
  else if(step.type==='vocab') renderVocabStep(body,step.vocabKey,'词语闯关');
  else if(step.type==='sentence') renderSentenceStep(body,step.sentKey);
  else if(step.type==='quiz') renderQuizStep(body,step.sched);
  else if(step.type==='match') renderMatchStep(body,step.vocabKey);
  else if(step.type==='dictation') renderDictationStep(body,step.vocabKey);
  else if(step.type==='writingPrompt') renderWritingPromptStep(body,step.promptKey,step.promptType);
  else if(step.type==='riji') renderVocabStep(body,step.rijiKey,'日积月累');
  else if(step.type==='poem') renderPoemStep(body,step.poem);
  else if(step.type==='prose') renderProseStep(body,step.prose);
  else if(step.type==='writing') renderWritingStep(body,step.chars);
  else if(step.type==='harvest') renderHarvestStep(body,step.sched);

  const isLast=idx===currentSteps.length-1;
  nextBtn.textContent=isLast?'完成今天 🎉':'继续 →';
  nextBtn.className=isLast?'btn btn-green btn-full':'btn btn-amber btn-full';
  body.scrollTop=0;
}

function prevStep(){
  if(currentStepIdx>0) renderStep(currentStepIdx-1);
}

function nextStep(){
  if(currentStepIdx===currentSteps.length-1){
    finishDay();
  } else {
    renderStep(currentStepIdx+1);
  }
}

function finishDay(){
  const progress=getProgress();
  const sched=SCHEDULE[currentDay-1];
  if(!progress[currentDay]) progress[currentDay]={};
  progress[currentDay].done=true;
  progress[currentDay].stars=3;
  progress[currentDay].poemDone=true;
  saveProgress(progress);
  launchConfetti();
  setTimeout(()=>{goHome();},2000);
}

// ══════════════════════════════════════════
// STEP RENDERERS
// ══════════════════════════════════════════
function renderIntroStep(body,sched){
  const poem=sched.poemId?POEMS.find(p=>p.id===sched.poemId):null;
  const prose=sched.proseId?PROSE_TEXTS.find(p=>p.id===sched.proseId):null;
  const actLabels={
    sentence:'句子填空 · 巩固记忆',
    quiz:'小测验 · 检验学习',
    match:'词义连连看 · 互动游戏',
    dictation:'听写挑战 · 听音写词',
    imitate:'仿写练习 · 创意写作',
    creative:'想象写话 · 自由表达',
    riji:'日积月累 · 积累词语',
  };
  body.innerHTML=`
    <div class="step-label">今日任务</div>
    <div class="step-heading">${sched.title}</div>
    <div class="info-box">
      <h3>${sched.unit}</h3>
      <p>今天的内容：字词 → ${actLabels[sched.actType]||'练习'} → 背诵 → 写字</p>
    </div>
    <div class="intro-strips">
      <div class="intro-strip intro-strip-cin">
        <div class="intro-glyph">词</div>
        <div><div class="intro-strip-title">词语闯关</div><div class="intro-strip-sub">${sched.vocabKey&&VOCAB_SETS[sched.vocabKey]?VOCAB_SETS[sched.vocabKey].length+' 个词语 · 翻牌记忆':'积累词语'}</div></div>

function checkBlank(i,answer){
  const inp=document.getElementById('blank-'+i);
  const ansEl=document.getElementById('blank-ans-'+i);
  const val=inp.value.trim();
  if(!val) return;
  if(val===answer){
    inp.className='blank-input ok';
    ansEl.innerHTML='<span style="color:var(--accent2)">✓ 正确！</span>';
    ansEl.className='blank-ans show';
  } else if(val.length>=answer.length){
    inp.className='blank-input bad';
    ansEl.innerHTML=`<span style="color:var(--red)">✗ 正确答案：<strong>${answer}</strong></span>`;
    ansEl.className='blank-ans show';
  }
}

function toggleRecite(){
  const btn=document.getElementById('recite-btn');
  const status=document.getElementById('recite-status');
  const result=document.getElementById('recite-result');

  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    result.className='recite-result show fail';
    result.textContent='您的浏览器不支持语音识别，请尝试Chrome浏览器。可以手动默背或跳过。';
    return;
  }

  if(recognition){
    try{recognition.stop()}catch{}
    recognition=null;
    btn.classList.remove('listening');
    btn.textContent='🎤';
    status.textContent='已停止，点击再次尝试';
    return;
  }

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='zh-CN';
  recognition.continuous=false;
  recognition.interimResults=false;

  btn.classList.add('listening');
  btn.textContent='⏹';
  status.textContent='🔴 正在听...请大声背诵古诗';
  result.className='recite-result';

  recognition.onresult=function(e){
    const transcript=e.results[0][0].transcript.replace(/[，。！？\s]/g,'');
    const expected=currentPoem.fullText.replace(/[，。！？\s]/g,'');
    const hit=computeSimilarity(transcript,expected);
    result.className='recite-result show '+(hit>=0.7?'pass':'fail');
    if(hit>=0.7){
      result.innerHTML=`✓ 太棒了！识别到：${transcript}<br>相似度：${Math.round(hit*100)}%，背诵成功！`;
    } else {
      result.innerHTML=`识别到：${transcript||'（未识别到）'}<br>相似度：${Math.round(hit*100)}%，再背一遍吧！`;
    }
    btn.classList.remove('listening');
    btn.textContent='🎤';
    status.textContent='点击再试，或点"继续"完成';
    recognition=null;
  };
  recognition.onerror=function(){
    btn.classList.remove('listening');
    btn.textContent='🎤';
    status.textContent='识别出错，请重试';
    recognition=null;
  };
  recognition.onend=function(){
    btn.classList.remove('listening');
    btn.textContent='🎤';
    recognition=null;
  };
  recognition.start();
}

function computeSimilarity(a,b){
  if(!a||!b) return 0;
  let match=0;
  const shorter=a.length<b.length?a:b;
  const longer=a.length<b.length?b:a;
  for(let c of shorter){
    if(longer.includes(c)) match++;
  }
  return match/Math.max(a.length,b.length);
}

let penSize=4;
let activeCanvas=null;

function setupTianCanvas(count){
  const row=document.getElementById('tian-row');
  row.innerHTML='';
  const size=120;
  const canvases=[];

  for(let i=0;i<count;i++){
    const cv=document.createElement('canvas');
    cv.className='tian-canvas';
    cv.width=size;cv.height=size;
    const ctx=cv.getContext('2d');
    drawTianGrid(ctx,size);
    canvases.push(cv);
    row.appendChild(cv);

    // Drawing events
    let isDrawing=false;
    let lastX=0,lastY=0;

    function getPos(e){
      const r=cv.getBoundingClientRect();
      const scaleX=cv.width/r.width;
      const scaleY=cv.height/r.height;
      if(e.touches){
        return{x:(e.touches[0].clientX-r.left)*scaleX,y:(e.touches[0].clientY-r.top)*scaleY};
      }
      return{x:(e.clientX-r.left)*scaleX,y:(e.clientY-r.top)*scaleY};
    }
    function startDraw(e){
      e.preventDefault();
      isDrawing=true;
      const p=getPos(e);
      lastX=p.x;lastY=p.y;
      activeCanvas=cv;
    }
    function draw(e){
      if(!isDrawing)return;
      e.preventDefault();
      const p=getPos(e);
      ctx.strokeStyle='#1e293b';
      ctx.lineWidth=penSize;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(lastX,lastY);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
      lastX=p.x;lastY=p.y;
    }
    function stopDraw(){isDrawing=false;}
    cv.addEventListener('mousedown',startDraw);
    cv.addEventListener('mousemove',draw);
    cv.addEventListener('mouseup',stopDraw);
    cv.addEventListener('mouseleave',stopDraw);
    cv.addEventListener('touchstart',startDraw,{passive:false});
    cv.addEventListener('touchmove',draw,{passive:false});
    cv.addEventListener('touchend',stopDraw);
    cv.addEventListener('touchcancel',stopDraw);
  }

  // store refs
  window._tiCanvases=canvases;
}

function drawTianGrid(ctx,size){
  ctx.clearRect(0,0,size,size);
  ctx.strokeStyle='#d1d5db';
  ctx.lineWidth=1;
  // outer border
  ctx.strokeRect(1,1,size-2,size-2);
  // dashed center lines
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  ctx.moveTo(size/2,0);ctx.lineTo(size/2,size);
  ctx.moveTo(0,size/2);ctx.lineTo(size,size/2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function clearCanvas(){
  if(window._tiCanvases){
    window._tiCanvases.forEach(cv=>{
      const ctx=cv.getContext('2d');
      drawTianGrid(ctx,cv.width);
    });
  }
}

function changePenSize(delta){
  penSize=Math.max(2,Math.min(12,penSize+delta));
}

let _currentQuestions=[];
function renderQuizStep(body,sched){
  _currentQuestions=generateQuestions(sched);
  quizAnswered=new Array(_currentQuestions.length).fill(null);
  body.innerHTML=`
    <div class="step-label">小测验</div>
    <div class="step-heading">检验一下今天的学习成果！</div>
    <div id="quiz-container">
      ${_currentQuestions.map((q,qi)=>renderQuestionHTML(q,qi)).join('')}
    </div>
    <div class="quiz-score" id="quiz-score"></div>
    <button class="btn btn-green btn-full" id="quiz-submit" onclick="submitQuiz()">提交答案 ✓</button>
  `;
}

function renderQuestionHTML(q,qi){
  return`<div class="quiz-question">
    <div class="quiz-q-text">${qi+1}. ${q.q}</div>
    <div class="quiz-options">
      ${q.opts.map((o,oi)=>`<button class="quiz-opt" id="qopt-${qi}-${oi}" onclick="selectOpt(${qi},${oi},${q.opts.length})">${o}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="qfb-${qi}"></div>
  </div>`;
}

function selectOpt(qi,oi,total){
  quizAnswered[qi]=oi;
  for(let i=0;i<total;i++){
    const btn=document.getElementById(`qopt-${qi}-${i}`);
    if(btn) btn.className='quiz-opt'+(i===oi?' selected':'');
  }
}

function submitQuiz(){
  const q=_currentQuestions;
  if(!q||!q.length)return;
  let correct=0;
  q.forEach((qu,qi)=>{
    const ans=quizAnswered[qi];
    const fb=document.getElementById('qfb-'+qi);
    for(let oi=0;oi<qu.opts.length;oi++){
      const btn=document.getElementById(`qopt-${qi}-${oi}`);
      if(btn){
        if(oi===qu.correct) btn.className='quiz-opt correct';
        else if(oi===ans) btn.className='quiz-opt wrong';
        else btn.className='quiz-opt';
        btn.disabled=true;
      }
    }
    if(fb){
      fb.className='quiz-feedback show '+(ans===qu.correct?'ok':'bad');
      fb.textContent=ans===qu.correct?'✓ 正确！':'✗ '+qu.explanation;
    }
    if(ans===qu.correct) correct++;
  });
  const score=document.getElementById('quiz-score');
  score.className='quiz-score show';
  score.innerHTML=`你答对了 ${correct}/${q.length} 题 ${correct===q.length?'🎉 全对！太棒了！':correct>=q.length*0.7?'👍 不错哦！':' 多复习几遍吧！'}`;
  document.getElementById('quiz-submit').style.display='none';
}

function generateQuestions(sched){
  const key=sched.vocabKey&&QUESTION_BANK[sched.vocabKey]?sched.vocabKey:'review';
  const bank=QUESTION_BANK[key];
  const offset=(sched.day-1)%bank.length;
  const pool=[...bank.slice(offset),...bank.slice(0,offset)];
  return pool.slice(0,3);
}

// ── SENTENCE STEP ──
function renderSentenceStep(body,key){
  const exs=SENTENCE_EXERCISES[key];
  if(!exs){
    body.innerHTML=`<div class="step-label">句子练习</div><div class="fade-guide">暂无句子练习，点"继续"</div>`;
    return;
  }
  body.innerHTML=`
    <div class="step-label">句子练习</div>
    <div class="step-heading">根据原文，填写横线上的字</div>
    <div id="sentence-list">
      ${exs.map((s,i)=>`
        <div class="blank-question">
          <div class="blank-q-text">${s.q.replace('___','<span style="display:inline-block;border-bottom:2px solid var(--cinnabar);min-width:2em;color:transparent">__</span>')}</div>
          <input class="blank-input" id="sent-${i}" placeholder="填写横线处"
            oninput="checkSent(${i},'${s.a.replace(/'/g,"\\'")}')" autocomplete="off" autocorrect="off" spellcheck="false">
          <div class="blank-ans" id="sent-ans-${i}"></div>
          <div class="prose-tip" style="margin-top:6px;font-size:.78rem">${s.hint}</div>
        </div>
      `).join('')}
    </div>
    <div class="fade-guide">全部填完后点"继续"！</div>
  `;
}

function checkSent(i,answer){
  const inp=document.getElementById('sent-'+i);
  const ansEl=document.getElementById('sent-ans-'+i);
  const val=inp.value.trim();
  if(!val) return;
  if(val===answer){
    inp.className='blank-input ok';
    ansEl.innerHTML='<span style="color:var(--jade)">✓ 正确！</span>';
    ansEl.className='blank-ans show';
  } else if(val.length>=answer.length){
    inp.className='blank-input bad';
    ansEl.innerHTML=`<span style="color:var(--cinnabar)">✗ 正确答案：<strong>${answer}</strong></span>`;
    ansEl.className='blank-ans show';
  }
}

// ── WRITING PROMPT STEP ──

  const pr=WRITING_PROMPTS[key];
  if(!pr){
    body.innerHTML=`<div class="step-label">写作练习</div><div class="fade-guide">暂无写作内容，点"继续"</div>`;
    return;
  }
  const label=promptType==='imitate'?'仿写练习':'想象写话';
  const accentColor=promptType==='imitate'?'var(--azure)':'var(--purple)';
  const accentBg=promptType==='imitate'?'var(--azure-bg)':'var(--purple-bg)';
  body.innerHTML=`
    <div class="step-label">${label}</div>
    <div class="step-heading">${pr.title}</div>
    ${pr.model?`
      <div class="prose-text" style="border-top-color:${accentColor};border-bottom-color:${accentColor}">${pr.model.replace(/\n/g,'<br>')}</div>

// TTS — MINIMAX T2A v2
// ══════════════════════════════════════════
const MM_KEY   = 'sk-cp-L4NDfWkm3NEiTPPmwVMY4S5cZSc2vkGs2yKPil3Ii8Dur43mZRs-YZ_xGxld0YbeSaECrr6YJtcz1Ykr4ZrPiUvIpgp3ENJLTuPqPO_IS8pduv1fQCh2WPM';
const MM_GROUP = '2055126194306687029';
const MM_VOICE = 'female-shaonv';

let _mmAudio = null;
let currentUtterance = null; // browser TTS fallback

async function speak(text, rate=0.85, onEnd){
  stopSpeak();
  const mmSpeed = Math.max(0.5, Math.min(2.0, rate + 0.1));
  try {
    const res = await fetch(
      `https://api.minimax.chat/v1/t2a_v2?GroupId=${MM_GROUP}`,
      {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${MM_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'speech-02-hd',
          text,
          stream: false,
          voice_setting: { voice_id: MM_VOICE, speed: mmSpeed, vol: 1.0, pitch: 0 },
          audio_setting: { sample_rate: 32000, bitrate: 128000, format: 'mp3', channel: 1 }
        })
      }
    );
    const json = await res.json();
    if(json.base_resp?.status_code !== 0) throw new Error(json.base_resp?.status_msg || 'API error');
    const hex = json.data?.audio;
    if(!hex) throw new Error('no audio data');
    const bytes = new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
    const blob = new Blob([bytes], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    _mmAudio = new Audio(url);
    _mmAudio.onended = () => { URL.revokeObjectURL(url); _mmAudio = null; if(onEnd) onEnd(); };
    await _mmAudio.play();
  } catch(e) {
    console.warn('MiniMax TTS 失败，回退浏览器语音:', e);
    _speakFallback(text, rate, onEnd);
  }
}

function _speakFallback(text, rate=0.85, onEnd){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.lang = 'zh-CN';
  currentUtterance.rate = rate;
  if(onEnd) currentUtterance.onend = onEnd;
  speechSynthesis.speak(currentUtterance);
}

function stopSpeak(){
  if(_mmAudio){ _mmAudio.pause(); _mmAudio = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

async function ttsToggle(btn, text, rate=0.85){
  if(btn.classList.contains('speaking') || btn.classList.contains('loading')){
    stopSpeak();
    btn.classList.remove('speaking','loading');
    btn.textContent = '🔊 朗读';
    return;
  }
  document.querySelectorAll('.tts-btn.speaking,.tts-btn.loading').forEach(b=>{
    b.classList.remove('speaking','loading'); b.textContent = '🔊 朗读';
  });
  btn.classList.add('loading');
  btn.textContent = '◎ 生成中';
  await speak(text, rate, ()=>{
    btn.classList.remove('speaking','loading');
    btn.textContent = '🔊 朗读';
  });
  if(btn.classList.contains('loading')){
    btn.classList.remove('loading');
    btn.classList.add('speaking');
    btn.textContent = '⏹ 停止';
  }
}

async function speakWord(word, btn){
  if(btn){ btn.classList.add('loading'); }
  await speak(word, 0.75, ()=>{ if(btn) btn.classList.remove('loading'); });
  if(btn && btn.classList.contains('loading')){ btn.classList.remove('loading'); }
}

// ══════════════════════════════════════════
// MATCH GAME (词义连连看)
// ══════════════════════════════════════════
let _matchSelected=null;
let _matchCorrect=0;
let _matchTotal=0;

function renderMatchStep(body,vocabKey){
  const words=(VOCAB_SETS[vocabKey]||[]).slice(0,5);
  _matchSelected=null; _matchCorrect=0; _matchTotal=words.length;

  const defs=[...words].sort(()=>Math.random()-.5);

  body.innerHTML=`
    <div class="step-label">词义连连看</div>
    <div class="step-heading">点左边词语 → 再点右边意思，完成配对！</div>
    <div class="match-grid" id="match-grid">
      ${words.map((w,i)=>`
        <div class="match-item" id="mw-${i}" data-type="word" data-idx="${i}"
          onclick="matchClick('word',${i},'${w.w.replace(/'/g,"\\'")}')">
          <div style="font-weight:700;font-size:1.1rem;letter-spacing:.08em">${w.w}</div>
          <div style="font-size:.72rem;color:var(--ink-light);margin-top:2px">${w.py}</div>
        </div>
        <div class="match-item" id="md-${i}" data-type="def" data-word="${defs[i].w.replace(/'/g,"\\'")}""
          onclick="matchClick('def',${i},'${defs[i].w.replace(/'/g,"\\'")}')">
          <div style="font-size:.82rem;line-height:1.5;color:var(--ink-mid)">${defs[i].def}</div>
        </div>
      `).join('')}
    </div>
    <div class="match-score" id="match-score"></div>
    <div class="fade-guide">配对完成后点"继续"！</div>
  `;
}

function matchClick(type,idx,word){
  if(type==='word'){
    // deselect previous word
    if(_matchSelected&&_matchSelected.type==='word'){
      const old=document.getElementById('mw-'+_matchSelected.idx);
      if(old&&!old.classList.contains('matched')) old.classList.remove('selected');
    }
    const el=document.getElementById('mw-'+idx);
    if(!el||el.classList.contains('matched')) return;
    el.classList.add('selected');
    _matchSelected={type:'word',idx,word};
  } else {
    // clicked a def
    const defEl=document.getElementById('md-'+idx);
    if(!defEl||defEl.classList.contains('matched')) return;
    const defWord=defEl.dataset.word;
    if(!_matchSelected||_matchSelected.type!=='word') return;
    const wordEl=document.getElementById('mw-'+_matchSelected.idx);
    if(_matchSelected.word===defWord){
      // correct
      wordEl.classList.remove('selected');
      wordEl.classList.add('matched');
      defEl.classList.add('matched');
      _matchCorrect++;
      speak(defWord,0.75);
      _matchSelected=null;
      if(_matchCorrect===_matchTotal){
        const sc=document.getElementById('match-score');
        if(sc){sc.textContent='🎉 全部配对成功！太棒了！';sc.classList.add('show');}
      }
    } else {
      // wrong — flash both
      wordEl.classList.add('wrong-flash');
      defEl.classList.add('wrong-flash');
      setTimeout(()=>{wordEl.classList.remove('wrong-flash','selected');defEl.classList.remove('wrong-flash')},500);
      _matchSelected=null;
    }
  }
}

// ══════════════════════════════════════════
// DICTATION (听写挑战)
// ══════════════════════════════════════════
let _dictWords=[];
let _dictIdx=0;
let _dictCorrect=0;

function renderDictationStep(body,vocabKey){
  const pool=(VOCAB_SETS[vocabKey]||[]).slice(0,5);
  _dictWords=pool.sort(()=>Math.random()-.5);
  _dictIdx=0; _dictCorrect=0;
  body.innerHTML=`
    <div class="step-label">听写挑战</div>
    <div class="step-heading">听声音，把词语写出来！</div>
    <div id="dictation-body"></div>
  `;
  renderDictationItem();
}

function renderDictationItem(){
  const container=document.getElementById('dictation-body');
  if(!container) return;
  if(_dictIdx>=_dictWords.length){
    container.innerHTML=`
      <div class="dictation-speaker">
        <div style="font-size:2.5rem">🎉</div>
        <div style="font-family:var(--font-serif);font-size:1.1rem;font-weight:700;color:var(--jade)">
          听写完成！答对 ${_dictCorrect}/${_dictWords.length} 个
        </div>
        <div style="font-size:.85rem;color:var(--ink-light);font-family:var(--font-serif)">
          ${_dictCorrect===_dictWords.length?'全对！听力超棒！':_dictCorrect>=_dictWords.length*0.6?'不错！继续加油！':'多听几遍练练吧！'}
        </div>
      </div>
      <div class="fade-guide">点"继续"进行背诵！</div>
    `;
    return;
  }
  const w=_dictWords[_dictIdx];
  container.innerHTML=`
    <div class="dictation-speaker">
      <div class="dictation-progress">第 ${_dictIdx+1}/${_dictWords.length} 个词</div>
      <button class="dictation-play-btn" id="dict-play" onclick="playDictWord()">🔊</button>
      <div class="dictation-hint">点喇叭收听，再写出这个词语</div>
    </div>
    <div class="dictation-input-row">
      <input class="dictation-input" id="dict-input" placeholder="在这里写出听到的词语"
        autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter')checkDictation()">
      <button class="dictation-check-btn" onclick="checkDictation()">确认</button>
    </div>
    <div class="dictation-feedback" id="dict-fb"></div>
    <div class="fade-guide" style="margin-top:16px">听不清？可以再听一遍</div>
  `;
  setTimeout(()=>playDictWord(),400);
}

function playDictWord(){
  if(_dictIdx>=_dictWords.length) return;
  const btn=document.getElementById('dict-play');
  if(btn) btn.classList.add('playing');
  speak(_dictWords[_dictIdx].w,0.7,()=>{
    const b=document.getElementById('dict-play');
    if(b) b.classList.remove('playing');
  });
}

function checkDictation(){
  const inp=document.getElementById('dict-input');
  const fb=document.getElementById('dict-fb');
  if(!inp||!fb) return;
  const val=inp.value.trim();
  if(!val){inp.focus();return;}
  const answer=_dictWords[_dictIdx].w;
  if(val===answer){
    fb.innerHTML=`<span style="color:var(--jade);font-weight:700">✓ 正确！是「${answer}」</span>`;
    _dictCorrect++;
    inp.disabled=true;
    setTimeout(()=>{_dictIdx++;renderDictationItem();},900);
  } else {
    fb.innerHTML=`<span style="color:var(--cinnabar)">✗ 是「${answer}」，读了几遍就能记住啦！</span>`;
    inp.value='';
    inp.disabled=true;
    speak(answer,0.7);
    setTimeout(()=>{_dictIdx++;renderDictationItem();},1400);
  }
}

function showSettings(){

  const val=prompt(`设置暑假开始日期（格式：YYYY-MM-DD）\n\n当前开始日期：${cur}\n\n提示：设为今天可以立即预览所有天的内容`, cur);
  if(!val) return;
  const d=new Date(val);
  if(isNaN(d.getTime())){alert('日期格式不正确，请用 YYYY-MM-DD 格式');return;}
  localStorage.setItem('sr_start_date',val);
  START_DATE=d;
  renderHome();
}

function resetProgress(){
  if(confirm('确定要清除所有进度吗？')){
    localStorage.removeItem('sr_progress');
    renderHome();
  }
}
