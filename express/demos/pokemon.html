<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>宝可梦式 · 故事图鉴</title>
<style>
:root{--brand:#2f6f5e;--soft:#e4f0eb;--accent:#e8884a;--ink:#2c2a26;--soft2:#fce8d7;--gold:#d8a93a;--line:#ece4d7;--c:#d64545}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
 background:linear-gradient(180deg,#ffe3e0,#fdeede 45%,#fbf7f0);display:flex;flex-direction:column;height:100dvh;line-height:1.55}
button{font-family:inherit;cursor:pointer}
.top{flex:0 0 auto;text-align:center;padding:10px}
.eng{font-size:.72rem;font-weight:800;letter-spacing:1px;color:var(--c)}
h1{font-size:1.1rem;margin:2px 0}.sub{font-size:.76rem;color:#6b6459}
.cnt{font-size:.78rem;color:var(--c);font-weight:800;margin-top:2px}
.wrap{flex:1 1 auto;overflow-y:auto;padding:6px 14px}
.owltop{text-align:center}.owl .bob{animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.say{background:#fff;border:1.5px solid var(--soft);border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:1rem;font-weight:600;margin:6px 0 12px;display:inline-block;max-width:90%}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:6px 0}
.card{background:#fff;border:2px solid var(--soft);border-radius:14px;padding:8px;text-align:center;animation:cap .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cap{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1)}}
.card .em{font-size:30px}
.card .no{font-size:.62rem;color:#b06}.card .tx{font-size:.7rem;color:#5a6a64;line-height:1.4;margin-top:2px}
.slot{background:#fbeaea;border:2px dashed #e7b7b7;border-radius:14px;min-height:78px;display:flex;align-items:center;justify-content:center;color:#c98;font-size:24px}
.inbar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);border-top:1px solid var(--line)}
.tin{flex:1;border:1.5px solid var(--soft);border-radius:16px;padding:13px;font-size:1.02rem;font-family:inherit}
.tin:focus{outline:none;border-color:var(--c)}
.go{border:none;border-radius:14px;background:var(--c);color:#fff;font-weight:800;padding:0 16px;box-shadow:0 4px 0 #9c2f2f}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #9c2f2f}
.nav{position:fixed;top:8px;right:10px;font-size:.72rem;z-index:5}
.nav a{color:var(--brand);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--c);color:var(--c);font-weight:800;padding:6px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.12);animation:tu 1.2s forwards;z-index:9}
@keyframes tu{0%{opacity:0;transform:translate(-50%,10px)}25%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}
</style></head>
<body><div class="nav"><a href="index.html">← 全部</a></div>
<div class="top">
  <div class="eng">宝可梦式 · 收集引擎</div>
  <h1>把你说的好细节，收进故事图鉴</h1>
  <div class="sub">动力＝"集齐它们"——每个生动的细节都是一张可收藏的卡</div>
  <div class="cnt" id="cnt">📕 故事图鉴：已收集 0 张</div>
</div>
<div class="wrap">
  <div class="owltop"><div id="owl"></div><div class="say" id="say">跟我说一件今天的事——只要说得"看得见"，我就帮你把它捕捉成一张图鉴卡！</div></div>
  <div class="dex" id="dex"></div>
</div>
<div class="inbar">
  <input class="tin" id="tin" placeholder="比如：那只猫一下子蹿上了书架…"/>
  <button class="go" id="go">捕捉！</button>
</div>
<script>
const owl=`<svg class="owl" width="74" viewBox="0 0 100 112" style="overflow:visible"><g class="bob">
<ellipse cx="50" cy="74" rx="30" ry="36" fill="#4a8273"/><ellipse cx="50" cy="88" rx="18" ry="20" fill="#f7ecd7"/>
<circle cx="38" cy="58" r="12" fill="#fff"/><circle cx="62" cy="58" r="12" fill="#fff"/>
<circle cx="40" cy="60" r="5.5" fill="#27241d"/><circle cx="60" cy="60" r="5.5" fill="#27241d"/>
<path d="M50,66 L45,72 L55,72 Z" fill="#f0a04b"/>
<ellipse cx="50" cy="40" rx="21" ry="5" fill="#4a3f86"/><path d="M32,40 Q41,12 56,9 Q67,28 67,40 Q50,46 32,40 Z" fill="#4a3f86"/></g></svg>`;
document.getElementById("owl").innerHTML=owl;
const EMAP=[["猫","🐱"],["狗","🐶"],["仓鼠","🐹"],["鸟","🐦"],["鱼","🐟"],["恐龙","🦖"],["蝴蝶","🦋"],["太阳","☀️"],["雨","🌧️"],["雪","❄️"],["彩虹","🌈"],["树","🌳"],["花","🌸"],["海","🌊"],["球","⚽"],["车","🚗"],["伞","☂️"],["蛋糕","🍰"],["书","📖"],["绳","🪢"],["妈妈","👩"],["同学","🧒"],["跑","🏃"],["跳","🤸"],["哭","😢"],["笑","😄"],["飞","🕊️"]];
const ACT=/跑|跳|抓|推|拉|喊|叫|握|拿|踢|笑|哭|攥|蹿|窜|看见|听见|发抖|抖|翻|踩|碰|摸|咬|扔|抱|蹲|爬|冲|躲|舔|撞|倒|擦/;
const SENSE=/声音|啪|响|喵|汪|轰|味道|香|冷|热|疼|亮/;
const NOUN=/猫|狗|仓鼠|鸟|鱼|恐龙|绳|球|花|树|窗|门|拳头|头发|腿|手|书架|沙发|花盆|操场|妈妈|爸爸|同学|老师/;
const VAGUE=/^(我)?(很|好|有点|特别|挺)?(开心|高兴|难过|紧张|害怕|无聊|生气|累|还好|不错|好玩|有趣)+[。.!！~]*$/;
let n=0;
function pickEm(v){ for(const[w,e]of EMAP) if(v.includes(w)) return e; return "💭"; }
function go(){
  const v=document.getElementById("tin").value.trim(); if(!v) return;
  const concrete=(ACT.test(v)||SENSE.test(v)||NOUN.test(v))&&!VAGUE.test(v);
  document.getElementById("tin").value="";
  if(!concrete){ document.getElementById("say").textContent=`「${v}」这张还显影不出来呀～它在做什么、发出什么声音？说得看得见，我就能捕捉！`; return; }
  n++;
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="em">${pickEm(v)}</div><div class="no">No.${String(n).padStart(3,"0")}</div><div class="tx">${v.slice(0,22)}</div>`;
  document.getElementById("dex").prepend(card);
  document.getElementById("cnt").textContent=`📕 故事图鉴：已收集 ${n} 张`;
  document.getElementById("say").textContent=`捕捉成功！第 ${n} 张进图鉴啦。再来一张？集得越多，你的图鉴越厉害。`;
  const t=document.createElement("div"); t.className="toast"; t.textContent="✨ 收进图鉴 +1"; document.body.appendChild(t); setTimeout(()=>t.remove(),1200);
}
document.getElementById("go").onclick=go;
document.getElementById("tin").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
</script>
</body></html>
