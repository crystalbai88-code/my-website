<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>图卡世界式 · 想怎么玩就怎么玩</title>
<style>
:root{--brand:#2f6f5e;--soft:#e4f0eb;--ink:#2c2a26;--line:#ece4d7;--c:#e85a9c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
 background:linear-gradient(180deg,#ffe1ef,#fdeaf3 45%,#fbf7f0);display:flex;flex-direction:column;height:100dvh;line-height:1.55}
button{font-family:inherit;cursor:pointer}
.top{flex:0 0 auto;text-align:center;padding:10px}
.eng{font-size:.72rem;font-weight:800;letter-spacing:1px;color:var(--c)}
h1{font-size:1.1rem;margin:2px 0}.sub{font-size:.76rem;color:#6b6459}
.wrap{flex:1 1 auto;overflow-y:auto;padding:6px 14px;display:flex;flex-direction:column}
.room{flex:1 1 auto;min-height:260px;border-radius:16px;border:3px solid #fff;position:relative;overflow:hidden;
 background:linear-gradient(180deg,#fff3d9,#ffe7c2 62%,#e9b98a 62%);box-shadow:0 8px 24px rgba(120,60,90,.12)}
.obj{position:absolute;font-size:40px;cursor:pointer;user-select:none;transition:transform .12s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
.obj:active{transform:scale(.86)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-12deg)}100%{transform:scale(1)}}
.pop{animation:pop .5s}
.burst{position:absolute;font-size:24px;pointer-events:none;animation:fly .9s forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-46px) scale(1.3)}}
.say{flex:0 0 auto;background:#fff;border:1.5px solid var(--soft);border-radius:12px;padding:10px 13px;font-size:.98rem;font-weight:600;margin:8px 0 0}
.inbar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);border-top:1px solid var(--line)}
.tin{flex:1;border:1.5px solid var(--soft);border-radius:16px;padding:13px;font-size:1.02rem;font-family:inherit}
.tin:focus{outline:none;border-color:var(--c)}
.go{border:none;border-radius:14px;background:var(--c);color:#fff;font-weight:800;padding:0 16px;box-shadow:0 4px 0 #b83b75}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b83b75}
.nav{position:fixed;top:8px;right:10px;font-size:.72rem;z-index:5}
.nav a{color:var(--brand);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
</style></head>
<body><div class="nav"><a href="index.html">← 全部</a></div>
<div class="top">
  <div class="eng">图卡世界式 · 自由玩耍引擎</div>
  <h1>没有目标，想怎么玩就怎么玩</h1>
  <div class="sub">拍一拍屋里的东西，它就有反应——然后告诉小羽，你想让它发生什么</div>
</div>
<div class="wrap">
  <div class="room" id="room">
    <div class="obj" style="left:8%;top:58%" data-n="冰箱" data-b="🍦🥛🧊">🧊</div>
    <div class="obj" style="left:30%;top:20%" data-n="灯" data-b="✨💡🌟">💡</div>
    <div class="obj" style="left:50%;top:60%" data-n="小猫" data-b="🐾💕🐟">🐱</div>
    <div class="obj" style="left:72%;top:22%" data-n="窗户" data-b="🌤️🐦🍃">🪟</div>
    <div class="obj" style="left:74%;top:58%" data-n="玩具箱" data-b="🧸🎈🚗">🧸</div>
    <div class="obj" style="left:20%;top:70%" data-n="蛋糕" data-b="🍰🎉🍓">🎂</div>
    <div class="obj" style="left:52%;top:18%" data-n="门" data-b="🚪🌈🐶">🚪</div>
  </div>
  <div class="say" id="say">这是你的小屋，随便玩！拍拍冰箱、戳戳小猫、开开灯……拍完了，跟我说说：你刚才让谁做了什么好玩的事？</div>
</div>
<div class="inbar">
  <input class="tin" id="tin" placeholder="比如：我打开冰箱，小猫一下子跳进去了…"/>
  <button class="go" id="go">说给小羽</button>
</div>
<script>
const QS=[
 "哈哈，那 {x} 后来怎么样了？",
 "你让 {x} 做的这件事，要是真的发生，会是什么声音？",
 "诶，那时候 {x} 是什么表情？给它配一句话呀。",
 "好好玩！接下来你想让屋里的谁加进来一起？",
 "如果这是个故事的开头，下一页会发生什么？"
];
let qi=0, lastObj="它";
const room=document.getElementById("room");
room.querySelectorAll(".obj").forEach(o=>{
  o.addEventListener("click",()=>{
    o.classList.remove("pop"); void o.offsetWidth; o.classList.add("pop");
    lastObj=o.dataset.n;
    const bs=[...o.dataset.b]; // emoji array
    const b=document.createElement("div"); b.className="burst";
    b.textContent=bs[Math.floor(Math.random()*bs.length)];
    b.style.left=o.style.left; b.style.top=o.style.top; room.appendChild(b);
    setTimeout(()=>b.remove(),900);
    document.getElementById("say").textContent=`你碰了碰${o.dataset.n}！它动起来啦～你想让它做什么呢？说给我听。`;
  });
});
function go(){
  const v=document.getElementById("tin").value.trim(); if(!v) return;
  document.getElementById("tin").value="";
  document.getElementById("say").textContent=QS[qi%QS.length].replace("{x}",lastObj);
  qi++;
}
document.getElementById("go").onclick=go;
document.getElementById("tin").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
</script>
</body></html>
