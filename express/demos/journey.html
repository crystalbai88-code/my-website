<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>风之旅人式 · 一起走</title>
<style>
:root{--brand:#2f6f5e;--ink:#3a2f28;--line:#e7dcc8;--c:#c98a3a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
 background:linear-gradient(180deg,#f6d9a0,#f3c98a 40%,#e8a86a);display:flex;flex-direction:column;height:100dvh;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.top{flex:0 0 auto;text-align:center;padding:12px 14px 4px}
.eng{font-size:.72rem;font-weight:800;letter-spacing:1px;color:#a86a1e}
h1{font-size:1.08rem;margin:2px 0}.sub{font-size:.76rem;color:#7a5a32}
.scene{flex:1 1 auto;position:relative;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%}
.say{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:88%;max-width:460px;
 background:rgba(255,255,255,.92);border-radius:16px;padding:12px 15px;font-size:1rem;font-weight:600;
 text-align:center;box-shadow:0 6px 18px rgba(120,80,30,.18)}
.dist{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:.8rem;color:#fff;
 background:rgba(168,106,30,.5);padding:3px 12px;border-radius:999px;font-weight:700}
.inbar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(255,250,242,.92);border-top:1px solid var(--line)}
.tin{flex:1;border:1.5px solid #ecd9b8;border-radius:16px;padding:13px;font-size:1.02rem;font-family:inherit;background:#fffdf8}
.tin:focus{outline:none;border-color:var(--c)}
.go{border:none;border-radius:14px;background:var(--c);color:#fff;font-weight:800;padding:0 18px;box-shadow:0 4px 0 #9a6620}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6620}
.nav{position:fixed;top:8px;right:10px;font-size:.72rem;z-index:5}
.nav a{color:#fff;text-decoration:none;background:rgba(168,106,30,.55);border-radius:999px;padding:4px 10px}
.trav,.owlf{transition:transform 1.1s cubic-bezier(.4,0,.2,1)}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.scarf{transform-origin:top center;animation:sway 2.5s ease-in-out infinite}
</style></head>
<body><div class="nav"><a href="index.html">← 全部</a></div>
<div class="top">
  <div class="eng">风之旅人式 · 陪伴引擎</div>
  <h1>不计分、不评判，我们一起走一段</h1>
  <div class="sub">你每分享一点心里的事，我们就往前走一步，你的围巾会变长</div>
</div>
<div class="scene">
  <div class="dist" id="dist">🧣 围巾：一小截 · 才刚出发</div>
  <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e2b0"/><stop offset="1" stop-color="#e8a86a"/></linearGradient></defs>
    <rect width="400" height="300" fill="url(#sky)"/>
    <circle cx="320" cy="70" r="34" fill="#fff3d6" opacity=".85"/>
    <!-- 远山 -->
    <path d="M0,200 L90,150 L160,195 L240,140 L330,190 L400,160 L400,300 L0,300Z" fill="#e09a58" opacity=".55"/>
    <path d="M0,235 L120,200 L210,240 L320,205 L400,235 L400,300 L0,300Z" fill="#d98b48"/>
    <!-- 路径上的光点 -->
    <g id="marks"></g>
    <!-- 旅人 + 小羽 -->
    <g id="party" class="trav" transform="translate(40,240)">
      <g class="owlf" transform="translate(-26,-2)">
        <ellipse cx="0" cy="0" rx="11" ry="13" fill="#6a4a86"/>
        <circle cx="-4" cy="-4" r="4" fill="#fff"/><circle cx="4" cy="-4" r="4" fill="#fff"/>
        <circle cx="-4" cy="-3" r="2" fill="#27241d"/><circle cx="4" cy="-3" r="2" fill="#27241d"/>
        <path d="M0,1 l-3,4 h6 z" fill="#f0a04b"/>
      </g>
      <g>
        <path class="scarf" id="scarf" d="M0,-14 q4,8 0,16" stroke="#d6452f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="0" cy="-18" r="7" fill="#c14a2a"/>
        <path d="M-6,-12 L6,-12 L8,12 L-8,12 Z" fill="#d65a32"/>
      </g>
    </g>
  </svg>
  <div class="say" id="say">你好呀。今天，有没有一件小事，一直待在你心里？小声告诉我就好——说了，我们就出发。</div>
</div>
<div class="inbar">
  <input class="tin" id="tin" placeholder="说一点点……什么都可以"/>
  <button class="go" id="go">→</button>
</div>
<script>
const REPLY=[
 "嗯……我听见了。那一刻，你身边还有什么？",
 "原来是这样。说出来的时候，你心里是变轻了一点，还是更沉了？",
 "我们又往前走了一点。那件事里，最先想起的画面是哪个？",
 "谢谢你愿意告诉我。如果那个时刻能停住，你想多看它一眼吗？",
 "风把你的话带远了。后来呢，发生了什么？",
 "你看，围巾又长了一截——这都是你说出来的。还有吗？"
];
const STAGE=["才刚出发","走过沙丘","翻过远山","看见了海","快到山顶了","抵达了"];
let step=0;
const party=document.getElementById("party");
const scarf=document.getElementById("scarf");
const marks=document.getElementById("marks");
function go(){
  const v=document.getElementById("tin").value.trim(); if(!v) return;
  document.getElementById("tin").value="";
  step++;
  // 旅人前进
  const x=40+Math.min(step,7)*44, y=240-Math.min(step,7)*9;
  party.setAttribute("transform",`translate(${x},${y})`);
  // 在出发点留一个光点
  const px=40+(step-1)*44, py=240-(step-1)*9;
  const m=document.createElementNS("http://www.w3.org/2000/svg","circle");
  m.setAttribute("cx",px);m.setAttribute("cy",py+14);m.setAttribute("r",3.2);
  m.setAttribute("fill","#fff");m.setAttribute("opacity",".85"); marks.appendChild(m);
  // 围巾变长
  let d="M0,-14"; for(let i=0;i<step;i++){ d+=` q4,8 0,16 q-4,8 0,16`; }
  scarf.setAttribute("d",d);
  const sIdx=Math.min(Math.floor(step/2),STAGE.length-1);
  document.getElementById("dist").textContent=`🧣 围巾长了 ${step} 截 · ${STAGE[sIdx]}`;
  document.getElementById("say").textContent=REPLY[(step-1)%REPLY.length];
}
document.getElementById("go").onclick=go;
document.getElementById("tin").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
</script>
</body></html>
