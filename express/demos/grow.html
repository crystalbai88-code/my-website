<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>引擎① 表达养成 · 小羽</title>
<style>
:root{--brand:#2f6f5e;--soft:#e4f0eb;--accent:#e8884a;--ink:#2c2a26;--soft2:#fce8d7;--gold:#d8a93a;--line:#ece4d7}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
 background:linear-gradient(180deg,#cdeafe,#e7f6ef 45%,#fbf7f0);display:flex;flex-direction:column;height:100dvh;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.top{flex:0 0 auto;text-align:center;padding:10px}
.eng{font-size:.72rem;font-weight:800;letter-spacing:1px;color:var(--accent)}
h1{font-size:1.1rem;margin:2px 0}
.sub{font-size:.76rem;color:#6b6459}
.stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px}
.owlwrap{position:relative}
.spark{position:absolute;font-size:20px;animation:fly 1.1s ease forwards;pointer-events:none}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:1}100%{transform:translate(var(--dx),-90px) scale(1.2);opacity:0}}
.lvl{font-weight:800;color:var(--brand)}
.bar{width:240px;max-width:80vw;height:14px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid var(--soft)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));width:0;transition:width .5s}
.stars{font-size:.9rem;color:#9a7a1f;font-weight:800}
.say{min-height:44px;background:#fff;border:1.5px solid var(--soft);border-radius:4px 16px 16px 16px;
 padding:11px 15px;font-size:1.04rem;max-width:86vw;font-weight:600}
.milestone{background:#fffae8;border:1.5px solid var(--gold);border-radius:12px;padding:8px 14px;font-size:.9rem;color:#8a6a14;font-weight:700;animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1)}}
.inbar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);border-top:1px solid var(--line)}
.tin{flex:1;border:1.5px solid var(--soft);border-radius:16px;padding:13px;font-size:1.04rem;font-family:inherit}
.tin:focus{outline:none;border-color:var(--brand)}
.go{border:none;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;padding:0 18px;box-shadow:0 4px 0 #b35c1f}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b35c1f}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.chip{border:1.5px solid var(--soft);background:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem}
.owl{transition:transform .4s}
.owl .bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.owl.happy{animation:jump .5s}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
.nav{position:fixed;top:8px;right:10px;font-size:.72rem}
.nav a{color:var(--brand);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
</style></head>
<body>
<div class="nav"><a href="index.html">← 三选一</a></div>
<div class="top">
  <div class="eng">引擎① · 表达养成（Finch 引擎）</div>
  <h1>你说一件事，小羽就长大一点</h1>
  <div class="sub">动力＝把"表达自己"变成"养大一个属于你的伙伴"</div>
</div>

<div class="stage">
  <div class="owlwrap"><div id="owl"></div></div>
  <div class="lvl" id="lvl"></div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="stars" id="stars">🌟 故事星 0</div>
  <div class="say" id="say">把你今天的一件小事说给我听——越具体，我长得越快！</div>
  <div id="ms"></div>
  <div class="chips" id="chips"></div>
</div>

<div class="inbar">
  <input class="tin" id="tin" placeholder="比如：我家的猫今天跳上了窗台…"/>
  <button class="go" id="go">喂给小羽</button>
</div>

<script>
const STAGES=[
 {min:0,label:"🥚 蛋宝宝",hat:false,size:.7},
 {min:3,label:"🐣 小奶羽",hat:false,size:.85},
 {min:7,label:"🦉 小羽",hat:false,size:1},
 {min:12,label:"🎩 见习魔法师小羽",hat:true,size:1.1},
 {min:18,label:"✨ 大魔法师小羽",hat:true,size:1.2},
];
let stars=0;
const ACT=/跑|跳|抓|推|拉|喊|叫|走|站|坐|握|拿|踢|笑|哭|看见|听见|发抖|出汗|翻|踩|碰|摸|咬|皱|扔|抱|蹲|爬|冲|躲/;
const SENSE=/声音|颜色|味道|闻|听|看|冷|热|疼|香|响|亮|软|硬|滚|尖叫|喵|汪/;

function owlSVG(st){
  const hat=st.hat?`<ellipse cx="50" cy="40" rx="26" ry="6" fill="#4a3f86"/><path d="M30,40 Q40,8 56,5 Q70,26 70,40 Q50,47 30,40 Z" fill="#4a3f86"/><path d="M40,22 l1.5,3.6 3.6,1.5 -3.6,1.5 -1.5,3.6 -1.5,-3.6 -3.6,-1.5 3.6,-1.5 Z" fill="#ffd95e"/>`:"";
  return `<svg class="owl" id="owlsvg" viewBox="0 0 100 120" width="${Math.round(150*st.size)}" style="overflow:visible"><g class="bob">
  <ellipse cx="50" cy="116" rx="20" ry="3.5" fill="#000" opacity=".08"/>
  <ellipse cx="50" cy="74" rx="32" ry="38" fill="#4a8273"/>
  <ellipse cx="50" cy="88" rx="20" ry="22" fill="#f7ecd7"/>
  <circle cx="38" cy="58" r="13" fill="#fff"/><circle cx="62" cy="58" r="13" fill="#fff"/>
  <circle cx="40" cy="60" r="6" fill="#27241d"/><circle cx="60" cy="60" r="6" fill="#27241d"/>
  <circle cx="42" cy="57.5" r="2" fill="#fff"/><circle cx="62" cy="57.5" r="2" fill="#fff"/>
  <path d="M50,66 L44,73 L56,73 Z" fill="#f0a04b"/>
  ${hat}</g></svg>`;
}
function curStage(){ let s=STAGES[0]; for(const x of STAGES) if(stars>=x.min) s=x; return s; }
function render(){
  const st=curStage();
  document.getElementById("owl").innerHTML=owlSVG(st);
  document.getElementById("lvl").textContent=st.label;
  document.getElementById("stars").textContent="🌟 故事星 "+stars;
  const next=STAGES.find(x=>x.min>stars);
  const lo=st.min, hi=next?next.min:st.min+6;
  document.getElementById("barfill").style.width=Math.min(100,(stars-lo)/(hi-lo)*100)+"%";
}
function chips(){
  const ideas=["今天有件事和平常不一样…","我看到一个有趣的画面…","有个人做了一件事…","我学会了一样东西…"];
  document.getElementById("chips").innerHTML=ideas.map(t=>`<button class="chip">${t}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.getElementById("tin").value=b.textContent.replace("…","");document.getElementById("tin").focus();});
}
function spark(n){
  const w=document.getElementById("owl").getBoundingClientRect();
  for(let i=0;i<n;i++){ const s=document.createElement("div"); s.className="spark"; s.textContent="🌟";
    s.style.left=(w.left+w.width/2-10)+"px"; s.style.top=(w.top+w.height/2)+"px";
    s.style.setProperty("--dx",(Math.random()*120-60)+"px"); document.body.appendChild(s);
    setTimeout(()=>s.remove(),1200);}
}
function feed(){
  const v=document.getElementById("tin").value.trim(); if(!v) return;
  const len=v.replace(/\s/g,"").length;
  let gain=1, react="";
  const hasAct=ACT.test(v), hasSense=SENSE.test(v);
  if(len<6){ gain=1; react="再多说一点点？比如那是在哪里发生的？"; }
  else if(hasAct||hasSense){ gain=3; const frag=v.slice(0,12); react=`「${frag}…」——这个我能看见画面！+3 颗故事星！`; }
  else { gain=2; react="嗯，记下了！如果加上一个动作，我会长得更快～"; }
  const before=curStage().label;
  stars+=gain; spark(gain);
  document.getElementById("say").textContent=react;
  document.getElementById("tin").value="";
  const owl=document.getElementById("owl"); render();
  const sv=document.getElementById("owlsvg"); if(sv){ sv.classList.add("happy"); setTimeout(()=>sv.classList.remove("happy"),500);}
  const after=curStage().label;
  const ms=document.getElementById("ms");
  if(before!==after){ ms.innerHTML=`<div class="milestone">🎉 小羽长大啦：${after}！都是你喂出来的。</div>`; }
  else ms.innerHTML="";
}
document.getElementById("go").onclick=feed;
document.getElementById("tin").addEventListener("keydown",e=>{if(e.key==="Enter")feed();});
render(); chips();
</script>
</body></html>
