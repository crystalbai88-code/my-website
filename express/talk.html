<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>和小羽聊天</title>
<style>
:root{ --brand:#2f6f5e; --brand-soft:#e4f0eb; --accent:#e8884a; --accent-soft:#fce8d7;
  --ink:#2c2a26; --ink-soft:#6b6459; --line:#ece4d7; --gold:#d8a93a; }
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{ font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:linear-gradient(180deg,#c9ecfb,#e4f6f0 38%,#fbf7f0 70%) fixed;
  display:flex; flex-direction:column; height:100dvh; line-height:1.6; -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer}

/* 顶部：小羽老师 */
.stage{ flex:0 0 auto; text-align:center; padding:14px 12px 8px; position:relative; }
.stage .sun{ position:absolute; top:8px; right:18px; width:46px; height:46px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff6cf,#ffd95e 60%,rgba(255,217,94,0) 75%); }
.title{ font-weight:800; font-size:1rem; }
.title .live{ font-size:.66rem; color:#fff; background:#e0413a; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle;}
.title .live i{ display:inline-block; width:6px; height:6px; background:#fff; border-radius:50%; margin-right:4px; animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.subtitle{ font-size:.74rem; color:var(--ink-soft); }

/* 对话区 */
.chat{ flex:1 1 auto; overflow-y:auto; padding:8px 14px 4px; }
.row{ margin:10px 0; display:flex; }
.row.kid{ justify-content:flex-end; }
.bub{ max-width:82%; padding:11px 15px; border-radius:16px; font-size:1.06rem; }
.row.quill .bub{ background:#fff; border:1.5px solid var(--brand-soft); border-radius:4px 16px 16px 16px; }
.row.kid .bub{ background:var(--accent-soft); color:#a8521a; border-radius:16px 4px 16px 16px; }
.row .say{ border:none;background:transparent;font-size:1rem;margin-left:6px;cursor:pointer;opacity:.6 }
.spark{ display:block; margin-top:7px; font-size:.82rem; color:#9a7a1f; background:#fffae8;
  border-radius:8px; padding:6px 10px; }
.typing i{ display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin:0 2px;opacity:.3;animation:td 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes td{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* 输入条 */
.inputbar{ flex:0 0 auto; padding:10px 14px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px); border-top:1px solid var(--line); display:flex; gap:8px; align-items:flex-end; }
.mic{ flex:0 0 auto; width:58px; height:58px; border-radius:50%; border:none; font-size:26px;
  background:var(--accent); color:#fff; box-shadow:0 4px 0 #b35c1f; transition:.1s; }
.mic:active{ transform:translateY(3px); box-shadow:0 1px 0 #b35c1f; }
.mic.live{ background:#e0413a; box-shadow:0 4px 0 #97241f; animation:pulse 1.1s infinite; }
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tin{ flex:1 1 auto; border:1.5px solid var(--line); border-radius:18px; padding:14px; font-size:1.05rem;
  font-family:inherit; resize:none; min-height:54px; max-height:120px; background:#fffdf9; }
.tin:focus{outline:none;border-color:var(--brand)}
.send{ flex:0 0 auto; border:none; border-radius:16px; background:var(--brand); color:#fff;
  font-weight:800; padding:0 18px; height:54px; box-shadow:0 4px 0 #1f5447; }
.send:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5447}
.send:disabled{opacity:.4}

/* 设置/欢迎遮罩 */
.veil{ position:fixed; inset:0; background:rgba(40,40,40,.45); display:flex; align-items:center; justify-content:center; padding:18px; z-index:20;}
.panel{ background:#fff; border-radius:20px; max-width:420px; width:100%; padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.2);}
.panel h2{ margin:.2em 0 .3em; font-size:1.15rem; }
.panel p{ font-size:.9rem; color:var(--ink-soft); margin:.4em 0; }
.panel input{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:1rem; margin:8px 0; }
.panel .go{ width:100%; border:none; border-radius:14px; background:var(--brand); color:#fff; font-weight:800; padding:13px; font-size:1rem; margin-top:6px; }
.panel a{ color:var(--accent); font-weight:700; }
.panel .err{ color:#c1453b; font-size:.85rem; min-height:1.2em; }
.gear{ position:absolute; top:10px; left:14px; border:none; background:transparent; font-size:18px; opacity:.5; }
.hidden{display:none}

/* 小羽头像 SVG */
.qa{ width:90px; height:auto; }
.qa .bob{ animation:bob 3.2s ease-in-out infinite; transform-origin:center; }
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.qa .lid{ transform-box:fill-box; transform-origin:center top; transform:scaleY(0); animation:blinkEye 4.8s infinite;}
@keyframes blinkEye{0%,92%,100%{transform:scaleY(0)}95%,98%{transform:scaleY(1)}}
.qa .jaw{ transform-box:fill-box; transform-origin:top center; transform:scaleY(calc(0.15 + var(--jaw,0)*0.9)); }
body.talking .qa .bob{ animation-duration:.9s; }
</style>
</head>
<body>
  <div class="stage">
    <button class="gear" id="gear" title="设置">⚙️</button>
    <div class="sun"></div>
    <div id="quillTop"></div>
    <div class="title">小羽老师 <span class="live"><i></i>在线</span></div>
    <div class="subtitle" id="subtitle">点 🎤 说话，或打字。孩子说不出来时，旁边的大人也可以帮着一起说。</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="inputbar">
    <button class="mic" id="mic" title="按住或点一下说话">🎤</button>
    <textarea class="tin" id="tin" rows="1" placeholder="跟小羽说点什么…"></textarea>
    <button class="send" id="send">说</button>
  </div>

  <!-- 钥匙/欢迎 -->
  <div class="veil" id="veil">
    <div class="panel">
      <h2>🦉 你好，我是小羽！</h2>
      <p>我是一只爱听故事的猫头鹰。我们这就开始聊——不过，我需要先连上我的"大脑"。</p>
      <p>请大人帮忙：去 <a href="https://bailian.console.aliyun.com/?apiKey=1#/api-key" target="_blank" rel="noopener">阿里云百炼</a> 创建一个 <b>API-KEY</b>（sk- 开头，免费、5 分钟），粘贴到下面：</p>
      <input type="password" id="keyInput" placeholder="粘贴 sk-... 这串钥匙" autocomplete="off"/>
      <div class="err" id="keyErr"></div>
      <button class="go" id="keyGo">连上小羽，开始聊天 →</button>
      <p style="font-size:.78rem;margin-top:10px">钥匙只存在这台设备的浏览器里，不会上传。</p>
    </div>
  </div>

<script>
const QWEN_CHAT="https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";
const QWEN_TTS="https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation";
const KEYK="xiaoyu-key", VOICEK="xiaoyu-voice";
let KEY=localStorage.getItem(KEYK)||"";
let VOICE=localStorage.getItem(VOICEK)||"Cherry";
let chat=[]; let busy=false; let curAudio=null;

const SYS=`你是「小羽」，一只爱听故事的小猫头鹰，正在和一个小学三到六年级的孩子一对一聊天。旁边可能坐着家长。

你的使命不是教写作，而是访谈：陪孩子聊天，把他心里和经历里真实的东西一点点引导出来。你从不急着要"答案"，而是让孩子每说一轮，都多看见一点自己的经历。你要让孩子心里慢慢冒出三种感觉：「原来这件事可以写。」「原来我刚才那个动作很重要。」「原来我不是没想法，只是不知道从哪里开始说。」

怎么聊：
1. 先接住，再提问：每次先用孩子自己的原词回应他刚说的（复述/真诚的惊讶/会心一笑），让他确信你真的在听；然后最多问一个小问题。
2. 问小不问大：问看得见摸得着的（"你的手当时在做什么""那一刻你听见了什么声音""旁边有谁"），不问抽象的（"你有什么感受""为什么"）。
3. 看见闪光就说出来：孩子说出具体的动作、声音、念头、对话时，明确告诉他这个细节特别好，并把那句原话放进 keep 字段。
4. 允许"不知道"：孩子说不知道/不记得时，绝不重复同一个问题，换一个更小的入口，或给两三个方向让他挑。
5. 跑偏了先跟一步：孩子聊到别处，先回应一句表示听见了，再用一个问题轻轻带回来。
6. 开场：用一两句话亲切打招呼，问他今天想聊点什么（学校、游戏、动物、看的视频、同学……都行）。
7. 不评判、不纠正、不讲大道理、不催、不空夸（"真棒"没用，要指出具体哪里好）。语气温暖、好奇、有点孩子气，像同桌不像老师。每次说的话不超过60个字。

铁律：绝不替孩子写句子或范文；绝不编造他没说过的事；一次最多一个问题；不问真实姓名/学校/住址/电话；孩子提到被伤害或不安全的事，温和地建议他告诉信任的大人。

只输出 JSON：{"say":"你对孩子说的话","keep":"孩子这句话里最闪光的一句原话摘录，没有就 null"}`;

/* 小羽 SVG（魔法学院款，含可动下颌 .jaw） */
function quill(size){return `<svg class="qa" viewBox="0 0 100 132" width="${size}" height="${Math.round(size*1.32)}" aria-hidden="true">
<defs>
<radialGradient id="qb" cx="35%" cy="26%" r="90%"><stop offset="0%" stop-color="#73b09b"/><stop offset="52%" stop-color="#4a8273"/><stop offset="100%" stop-color="#315e52"/></radialGradient>
<linearGradient id="qy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdf5de"/><stop offset="100%" stop-color="#ecd5a4"/></linearGradient>
<linearGradient id="qh" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#544c8f"/><stop offset="100%" stop-color="#272050"/></linearGradient>
</defs>
<ellipse cx="50" cy="127" rx="24" ry="4" fill="#000" opacity=".1"/>
<g class="bob">
<ellipse cx="50" cy="82" rx="34" ry="40" fill="url(#qb)"/>
<ellipse cx="50" cy="96" rx="21" ry="23" fill="url(#qy)"/>
<path class="wl" d="M15,74 Q3,92 16,107 Q25,92 21,74 Z" fill="#39685b"/>
<path class="wr" d="M85,74 Q97,92 84,107 Q75,92 79,74 Z" fill="#39685b"/>
<path d="M25,78 Q50,90 75,78 L75,87 Q50,99 25,87 Z" fill="#8c3a3f"/>
<path d="M25,81.4 Q50,93.4 75,81.4 L75,84 Q50,96 25,84 Z" fill="#e0b14b"/>
<circle cx="37" cy="62" r="14" fill="#fff"/><circle cx="63" cy="62" r="14" fill="#fff"/>
<circle cx="39" cy="64" r="6.5" fill="#27241d"/><circle cx="61" cy="64" r="6.5" fill="#27241d"/>
<circle cx="41.2" cy="61.6" r="2.2" fill="#fff"/><circle cx="63.2" cy="61.6" r="2.2" fill="#fff"/>
<circle class="lid" cx="37" cy="62" r="14.6" fill="#4a8273"/><circle class="lid" cx="63" cy="62" r="14.6" fill="#4a8273"/>
<circle cx="37" cy="62" r="15.6" fill="none" stroke="#caa84e" stroke-width="2.6"/><circle cx="63" cy="62" r="15.6" fill="none" stroke="#caa84e" stroke-width="2.6"/>
<path d="M52.6,62 q-2.6,-3.4 -5.2,0" stroke="#caa84e" stroke-width="2.4" fill="none"/>
<path d="M50,70 L44,76 L56,76 Z" fill="#f0a04b"/>
<g class="jaw"><path d="M45,76.5 L55,76.5 L50,82.5 Z" fill="#d98a3a"/></g>
<path d="M41,121 q1,6 5,8 M59,121 q-1,6 -5,8" stroke="#f0a04b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<ellipse cx="50" cy="44" rx="30" ry="7.5" fill="url(#qh)"/>
<path d="M29,44 Q40,8 57,4 Q56,14 64,18 Q74,30 71,44 Q50,52 29,44 Z" fill="url(#qh)"/>
<path d="M31,38.6 Q50,46 69,38.6 L69,33.4 Q50,41 31,33.4 Z" fill="#e0b14b"/>
<path d="M44,24 l1.8,4.4 4.4,1.8 -4.4,1.8 -1.8,4.4 -1.8,-4.4 -4.4,-1.8 4.4,-1.8 Z" fill="#ffd95e"/>
</g></svg>`;}
document.getElementById("quillTop").innerHTML=quill(90);

const chatEl=document.getElementById("chat");
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function addRow(who,text,keep){
  const r=document.createElement("div"); r.className="row "+who;
  r.innerHTML = who==="quill"
    ? `<div class="bub">${esc(text)}<button class="say" title="再读一遍">🔊</button>${keep?`<span class="spark">✨ 这句我记住了：「${esc(keep)}」</span>`:""}</div>`
    : `<div class="bub">${esc(text)}</div>`;
  chatEl.appendChild(r);
  if(who==="quill"){ const b=r.querySelector(".say"); if(b) b.onclick=()=>speak(text); }
  chatEl.scrollTop=chatEl.scrollHeight;
  return r;
}
function addTyping(){ const r=document.createElement("div"); r.className="row quill"; r.id="typing";
  r.innerHTML=`<div class="bub typing"><i></i><i></i><i></i></div>`; chatEl.appendChild(r); chatEl.scrollTop=chatEl.scrollHeight; }
function rmTyping(){ const t=document.getElementById("typing"); if(t)t.remove(); }

/* —— 调千问聊天 —— */
async function ask(userText){
  chat.push({role:"user",content:userText});
  const body={ model:"qwen-plus",
    messages:[{role:"system",content:SYS},...chat],
    max_tokens:400, temperature:0.6, response_format:{type:"json_object"} };
  const r=await fetch(QWEN_CHAT,{method:"POST",
    headers:{"content-type":"application/json","authorization":"Bearer "+KEY},
    body:JSON.stringify(body)});
  if(!r.ok){ throw new Error((await r.text()).slice(0,120)); }
  const data=await r.json();
  const raw=data?.choices?.[0]?.message?.content||"{}";
  let out; try{ out=JSON.parse(raw); }catch(_){ out={say:raw,keep:null}; }
  chat.push({role:"assistant",content:JSON.stringify(out)});
  if(chat.length>40) chat.splice(0,chat.length-40);
  return out;
}

/* —— 千问真人声（失败回退系统声）+ 嘴型 —— */
let AC=null,jawRAF=null;
function startJaw(audioEl){ cancelAnimationFrame(jawRAF); let useAna=false,ana=null,buf=null,silent=0;
  if(audioEl){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume();
    const src=AC.createMediaElementSource(audioEl); ana=AC.createAnalyser(); ana.fftSize=256; src.connect(ana); ana.connect(AC.destination);
    buf=new Uint8Array(ana.frequencyBinCount); useAna=true; }catch(_){useAna=false;} }
  const loop=(t)=>{ let jaw; if(useAna&&buf){ ana.getByteFrequencyData(buf); let s=0; for(let i=2;i<30;i++)s+=buf[i];
    const amp=s/28/255; if(amp<0.012)silent+=16; else silent=0; if(silent>700)useAna=false; jaw=Math.min(1,amp*3.2);
  } else { jaw=(Math.sin(t/85)*0.5+0.5)*(Math.sin(t/215)*0.3+0.7); }
  document.documentElement.style.setProperty("--jaw",jaw.toFixed(2)); jawRAF=requestAnimationFrame(loop); };
  jawRAF=requestAnimationFrame(loop);
}
function stopJaw(){ cancelAnimationFrame(jawRAF); document.documentElement.style.setProperty("--jaw","0"); document.body.classList.remove("talking"); }
function stopVoice(){ if("speechSynthesis"in window)speechSynthesis.cancel(); if(curAudio){try{curAudio.pause();}catch(_){}}; stopJaw(); }
function sysSpeak(text){ if(!("speechSynthesis"in window))return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=.98;
  u.onstart=()=>{document.body.classList.add("talking");startJaw(null);}; u.onend=stopJaw; speechSynthesis.speak(u); }
async function speak(text){
  stopVoice();
  try{
    const r=await fetch(QWEN_TTS,{method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+KEY},
      body:JSON.stringify({model:"qwen-tts",input:{text:text.slice(0,400),voice:VOICE}})});
    if(!r.ok) throw 0;
    const url=(await r.json())?.output?.audio?.url; if(!url) throw 0;
    const a=new Audio(url); curAudio=a;
    a.onplay=()=>{document.body.classList.add("talking");startJaw(a);}; a.onended=stopJaw; a.onpause=stopJaw;
    await a.play();
  }catch(_){ sysSpeak(text); }
}

/* —— 发送一轮 —— */
async function turn(text){
  if(busy||!text) return; busy=true;
  document.getElementById("send").disabled=true;
  addRow("kid",text);
  addTyping();
  try{
    const out=await ask(text);
    rmTyping(); addRow("quill",out.say,out.keep); speak(out.say);
  }catch(e){
    rmTyping(); addRow("quill","哎呀，我的大脑断线了一下（"+(e.message||"网络")+"）。点⚙️检查一下钥匙，或者再说一次？");
  }
  busy=false; document.getElementById("send").disabled=false;
}

/* —— 开场 —— */
async function greet(){
  addTyping(); busy=true;
  try{ const out=await ask("（请你先亲切打个招呼，问我今天想聊点什么）"); rmTyping(); addRow("quill",out.say,out.keep); speak(out.say); }
  catch(e){ rmTyping(); addRow("quill","你好呀！我是小羽。今天想跟我聊点什么呀？学校、游戏、动物，什么都行！"); }
  busy=false;
}

/* —— 输入：打字 —— */
const tin=document.getElementById("tin");
tin.addEventListener("input",()=>{ tin.style.height="auto"; tin.style.height=Math.min(120,tin.scrollHeight)+"px"; });
document.getElementById("send").onclick=()=>{ const v=tin.value.trim(); if(!v)return; tin.value=""; tin.style.height="auto"; turn(v); };
tin.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); document.getElementById("send").click(); } });

/* —— 输入：语音 —— */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micBtn=document.getElementById("mic"); let rec=null,reclive=false;
if(!SR){ micBtn.style.opacity=.35; micBtn.title="这台设备不支持语音，请打字"; }
micBtn.onclick=()=>{
  if(!SR) return;
  if(reclive&&rec){ rec.stop(); return; }
  stopVoice();
  rec=new SR(); rec.lang="zh-CN"; rec.interimResults=true; rec.continuous=false;
  let txt="";
  rec.onstart=()=>{ reclive=true; micBtn.classList.add("live"); micBtn.textContent="🔴"; tin.placeholder="在听你说…慢慢说"; };
  rec.onresult=e=>{ txt=""; for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript; tin.value=txt; };
  rec.onerror=()=>{ tin.placeholder="没听清，再点🎤试一次，或打字"; };
  rec.onend=()=>{ reclive=false; micBtn.classList.remove("live"); micBtn.textContent="🎤";
    const v=tin.value.trim(); if(v){ tin.value=""; turn(v); } };
  rec.start();
};

/* —— 钥匙遮罩 —— */
const veil=document.getElementById("veil");
function openKey(){ veil.classList.remove("hidden"); document.getElementById("keyInput").value=KEY; }
function closeKey(){ veil.classList.add("hidden"); }
document.getElementById("gear").onclick=openKey;
document.getElementById("keyGo").onclick=()=>{
  const v=document.getElementById("keyInput").value.trim();
  if(!/^sk-/.test(v)){ document.getElementById("keyErr").textContent="钥匙应该是 sk- 开头的那串，再检查一下～"; return; }
  KEY=v; localStorage.setItem(KEYK,v); closeKey();
  if(chat.length===0) greet();
};

/* —— 启动 —— */
if(KEY){ closeKey(); greet(); } else { openKey(); }
</script>
</body>
</html>
