<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>人类文明之河 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=2"/>
<style>
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #app{position:relative;z-index:10;height:100dvh;display:flex;flex-direction:column}
  /* 顶栏 */
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:9px;
    padding:11px 15px 9px;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent)}
  .top .brand{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--ink);text-shadow:var(--label-shadow)}
  .top .spacer{margin-left:auto}
  .tbtn{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink2);
    background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:999px;padding:6px 13px;cursor:pointer;backdrop-filter:blur(8px)}
  .tbtn.on{color:#fff;background:linear-gradient(90deg,#c86820,#b83018);border:none}
  .ds-theme-switch button{cursor:pointer}
  /* 时代跳转条 */
  #eraBar{position:fixed;top:46px;left:0;right:0;z-index:29;display:flex;gap:6px;overflow-x:auto;
    padding:6px 15px 8px;scrollbar-width:none;-ms-overflow-style:none;
    background:linear-gradient(180deg,rgba(0,0,0,.18),transparent);transition:opacity .25s,transform .25s}
  #eraBar::-webkit-scrollbar{display:none}
  #eraBar.hide{opacity:0;transform:translateY(-12px);pointer-events:none}
  .erachip{flex:0 0 auto;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--ink2);
    background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(8px)}
  .erachip:active{transform:scale(.95)}
  /* 卡片舞台 */
  #stage{flex:1;position:relative;overflow:hidden}
  #card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:84px 26px 110px;box-sizing:border-box;text-align:center;cursor:pointer}
  .card-anim-up{animation:inUp .42s cubic-bezier(.22,1,.36,1)}
  .card-anim-down{animation:inDown .42s cubic-bezier(.22,1,.36,1)}
  @keyframes inUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes inDown{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
  .c-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px;font-weight:800;
    color:#fff;border-radius:999px;padding:4px 13px;letter-spacing:.03em;margin-bottom:4px}
  .c-icon{font-size:64px;line-height:1;margin:6px 0 4px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
  .c-era{font-family:var(--mono);font-size:12.5px;color:var(--gold);letter-spacing:.06em;margin-bottom:8px}
  .c-title{font-family:var(--serif);font-weight:900;font-size:clamp(24px,6vw,38px);color:var(--ink);
    line-height:1.22;text-shadow:var(--label-shadow);max-width:18em}
  .c-sub{font-family:var(--mono);font-size:13px;color:var(--ink3);margin-top:7px}
  .c-one{font-family:var(--sans);font-size:clamp(14px,3.6vw,17px);color:var(--ink2);line-height:1.7;
    max-width:23em;margin-top:16px}
  .c-region{font-family:var(--sans);font-size:11.5px;color:var(--ink3);margin-top:14px}
  .c-cta{margin-top:26px;font-family:var(--sans);font-size:13px;font-weight:800;color:#fff;
    background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 22px;backdrop-filter:blur(6px)}
  /* 进度 + 滑动提示 */
  #prog{position:fixed;right:9px;top:50%;transform:translateY(-50%);z-index:25;width:3px;height:120px;
    background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  #prog i{display:block;width:100%;background:linear-gradient(180deg,#d4a858,#c86820);border-radius:3px}
  .swipe-hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:25;
    font-family:var(--sans);font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;animation:bob 2s infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
  .swipe-hint .ar{font-size:18px}
  .navbtns{position:fixed;right:14px;bottom:18px;z-index:26;display:flex;flex-direction:column;gap:8px}
  .navbtns button{width:42px;height:42px;border-radius:50%;border:1px solid var(--panel-line);
    background:var(--panel-bg);color:var(--ink);font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
  /* 深度抽屉 */
  #scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
  #scrim.show{opacity:1;pointer-events:auto}
  #drawer{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88dvh;
    background:var(--panel-bg,rgba(18,22,34,.97));border-top:1px solid var(--panel-line);
    border-radius:22px 22px 0 0;backdrop-filter:blur(20px);box-shadow:0 -10px 50px #0008;
    transform:translateY(102%);transition:transform .36s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
  #drawer.show{transform:translateY(0)}
  #drawer .grip{width:42px;height:5px;border-radius:5px;background:var(--ink3);opacity:.5;margin:9px auto 4px;flex:0 0 auto}
  #drawer .dclose{position:absolute;right:14px;top:12px;font-size:15px;color:var(--ink3);background:none;border:none;cursor:pointer;z-index:2}
  #dbody{overflow-y:auto;padding:6px 22px 40px;-webkit-overflow-scrolling:touch}
  .d-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:3px 11px;margin-bottom:8px}
  .d-title{font-family:var(--serif);font-weight:900;font-size:23px;color:var(--ink);line-height:1.25}
  .d-era{font-family:var(--mono);font-size:12px;color:var(--gold);margin:3px 0 12px}
  .d-bio{font-size:14.5px;color:var(--ink);line-height:1.8;white-space:pre-wrap}
  .d-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--panel-line)}
  .d-sec h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--gold);margin:0 0 10px;text-transform:uppercase}
  .d-item{font-size:13.5px;color:var(--ink2);line-height:1.7;margin-bottom:10px}
  .d-item b{color:var(--ink)}
  .rel-chips{display:flex;flex-wrap:wrap;gap:7px}
  .rel-chip{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--panel-line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:all .12s}
  .rel-chip:hover{border-color:var(--gold);color:var(--gold)}
  .rel-chip .rt{font-size:10px;color:var(--ink3);margin-right:5px}
  .flow-node{background:rgba(255,255,255,.05);border-left:4px solid var(--kc,#888);border-radius:10px;padding:9px 13px;margin-bottom:3px}
  .flow-node .fk{font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;background:var(--kc,#888);border-radius:5px;padding:1px 7px}
  .flow-node .fl{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--ink);margin-top:4px}
  .flow-node .fd{font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:3px}
  .flow-arrow{text-align:center;color:var(--gold);font-size:16px;margin:1px 0}
  .voice{background:rgba(255,255,255,.05);border:1px solid var(--panel-line);border-radius:12px;padding:11px 14px;margin-bottom:9px}
  .voice .vw{font-weight:800;font-size:13.5px;color:var(--ink);margin-bottom:4px}
  .voice .va{font-size:13px;color:var(--ink);line-height:1.65}
  .voice .ve{font-size:11.5px;color:var(--ink3);margin-top:6px;font-style:italic}
  .reflect-box{background:rgba(200,160,60,.1);border-left:4px solid var(--gold);border-radius:8px;padding:11px 14px;font-size:13.5px;color:var(--ink);line-height:1.75;margin-top:12px}
  .reflect-box b{color:var(--gold)}
  .meanw-reg{margin-bottom:11px}
  .meanw-reg .mr{font-family:var(--sans);font-weight:800;font-size:13px;color:var(--gold);margin-bottom:4px}
  .meanw-reg .mi{font-size:13px;color:var(--ink2);line-height:1.7}
  .deep-link{display:inline-block;margin-top:16px;font-family:var(--sans);font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(90deg,#c86820,#b83018);border:none;border-radius:999px;padding:9px 20px;cursor:pointer;text-decoration:none}
</style>
</head>
<body data-theme="deepblue">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <span class="brand">🌌 人类文明之河</span>
    <div class="spacer"></div>
    <button class="tbtn" id="autoBtn">▶ 自动</button>
    <div class="ds-theme-switch" id="themeSwitch">
      <button data-t="deepblue"></button><button data-t="museum"></button><button data-t="textbook"></button><button data-t="parchment"></button><button data-t="aurora" title="极光"></button><button data-t="sunset" title="暮霞"></button><button data-t="nebula" title="星云"></button>
    </div>
  </div>
  <div id="eraBar"></div>
  <div id="stage">
    <div id="card"></div>
  </div>
  <div id="prog"><i></i></div>
  <div class="swipe-hint" id="swipeHint"><span class="ar">↑</span><span>上滑</span></div>
  <div class="navbtns">
    <button id="upBtn">↑</button><button id="downBtn">↓</button>
  </div>
</div>

<div id="scrim"></div>
<div id="drawer"><div class="grip"></div><button class="dclose" id="dclose">✕</button><div id="dbody"></div></div>

<script src="./track.js?v=1"></script>
<script src="./feed_data.js?v=1"></script>
<script>
const TYPE={
  intro:{label:'开始',color:'#c8923a'},
  event:{label:'历史事件',color:'#c84830'},
  person:{label:'人物',color:'#d4a858'},
  evidence:{label:'文物证据',color:'#4a9e6e'},
  chain:{label:'因果链',color:'#8a7ad0'},
  perspective:{label:'多角度',color:'#3f90c0'},
  meanwhile:{label:'此时世界',color:'#cc6090'},
};
const KIND_COLOR={环境:'#5ab87a',制度:'#5aa0c8',技术:'#d4a858',人物:'#d4708a',事件:'#c84830',影响:'#8a7ad0'};
const ROLE_NAMES={ruler:'统治者',general:'将领',thinker:'思想家',religious:'宗教人物',scientist:'科学家',artist:'艺术家',explorer:'探险家',reformer:'改革者',other:'人物'};

const byId={}; FEED.forEach((c,i)=>byId[c.id]=i);
let idx=0, auto=false, autoTimer=null;
const cardEl=document.getElementById('card');
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const strong=s=>esc(s).replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');

function renderCard(dir){
  const c=FEED[idx]; const ty=TYPE[c.t]||{label:'',color:'#888'};
  let html=`<div class="c-chip" style="background:${ty.color}">${ty.label}</div>`;
  html+=`<div class="c-icon">${c.icon||'•'}</div>`;
  if(c.era) html+=`<div class="c-era">${esc(c.era)}</div>`;
  html+=`<div class="c-title">${esc(c.title)}</div>`;
  if(c.sub) html+=`<div class="c-sub">${esc(c.sub)}</div>`;
  if(c.one) html+=`<div class="c-one">${strong(c.one)}</div>`;
  if(c.region) html+=`<div class="c-region">📍 ${esc(c.region)}</div>`;
  if(c.t!=='intro') html+=`<div class="c-cta">轻点 · 深入了解 ›</div>`;
  cardEl.className='';
  void cardEl.offsetWidth;
  cardEl.className = dir==='down'?'card-anim-down':'card-anim-up';
  cardEl.innerHTML=html;
  document.querySelector('#prog i').style.height=((idx+1)/FEED.length*100)+'%';
  if(idx>0) document.getElementById('swipeHint').style.display='none';
  if(window.Track){ Track.log('文明之河'); if(c.region)Track.region&&Track.region(c.region); }
}
function go(delta){
  const n=Math.max(0,Math.min(FEED.length-1,idx+delta));
  if(n===idx) return;
  const dir=delta>0?'up':'down'; idx=n; renderCard(dir);
}
function jumpTo(i,openIt){ if(i==null||i<0)return; idx=i; renderCard('up'); if(openIt) setTimeout(openDrawer,120); }

// ── 深度抽屉 ──
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim'), dbody=document.getElementById('dbody');
function openDrawer(){
  const c=FEED[idx]; if(c.t==='intro'){ return; }
  dbody.innerHTML=renderDeep(c);
  drawer.classList.add('show'); scrim.classList.add('show');
  dbody.scrollTop=0;
  bindDeepLinks();
}
function closeDrawer(){ drawer.classList.remove('show'); scrim.classList.remove('show'); }
function bindDeepLinks(){
  dbody.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{
    const t=el.getAttribute('data-jump'); if(byId[t]!=null){ closeDrawer(); jumpTo(byId[t],true); }
  });
}
function deepHead(c){ const ty=TYPE[c.t]||{}; return `<div class="d-chip" style="background:${ty.color}">${ty.label}</div>
  <div class="d-title">${c.icon||''} ${esc(c.title)}</div>${c.era?`<div class="d-era">${esc(c.era)}${c.region?' · '+esc(c.region):''}</div>`:''}`; }

function renderDeep(c){
  const d=c.deep||{}; let h=deepHead(c);
  if(c.t==='person'){
    h+=`<div class="d-bio">${strong(d.bio||c.one)}</div>`;
    if(d.ach&&d.ach.length){ h+=`<div class="d-sec"><h4>🏆 主要成就</h4>`+d.ach.map(a=>`<div class="d-item"><b>${esc(a.name)}</b> — ${esc(a.detail)}</div>`).join('')+`</div>`; }
    if(d.legacy){ h+=`<div class="d-sec"><h4>🌟 历史遗产</h4><div class="d-item">${strong(d.legacy)}</div></div>`; }
    if(d.rels&&d.rels.length){ h+=`<div class="d-sec"><h4>🕸 关系人物(点可跳转)</h4><div class="rel-chips">`+d.rels.map(r=>`<span class="rel-chip" data-jumpname="${esc(r.name)}"><span class="rt">${esc(r.t)}</span>${esc(r.name)}</span>`).join('')+`</div></div>`; }
  } else if(c.t==='event'){
    h+=`<div class="d-bio">${strong(d.one||c.one)}</div>`;
    if(d.same&&d.same.length){ h+=`<div class="d-sec"><h4>🌍 此时世界 · 其他角落正在发生</h4>`+d.same.map(s=>`<div class="d-item">📍 <b>${esc(s.region)}</b> · ${esc(s.title)}<br><span style="color:var(--ink3)">${esc(s.one||'')}</span></div>`).join('')+`</div>`; }
    if(d.evidence&&d.evidence.length){ h+=`<div class="d-sec"><h4>🏺 留下的证据</h4>`+d.evidence.map(e=>`<div class="d-item"><b>${esc(e.artifact)}</b> — ${esc(e.what)} <span style="color:var(--ink3)">(${esc(e.held)})</span></div>`).join('')+`</div>`; }
  } else if(c.t==='evidence'){
    h+=`<div class="d-bio">${strong(d.what)}</div>`;
    h+=`<div class="d-sec"><h4>📦 收藏 / 来源</h4><div class="d-item">${esc(d.held)}</div></div>`;
    if(d.eventTitle) h+=`<div class="d-sec"><h4>🔗 关联历史事件</h4><div class="d-item">${esc(d.eventTitle)}</div></div>`;
  } else if(c.t==='chain'){
    h+=`<div class="d-sec"><h4>${esc(d.theme||'因果链')}</h4>`;
    (d.nodes||[]).forEach((n,i)=>{ if(i)h+=`<div class="flow-arrow">↓</div>`;
      h+=`<div class="flow-node" style="--kc:${KIND_COLOR[n.kind]||'#888'}"><span class="fk">${esc(n.kind)}</span>${n.year?` <span style="font-family:var(--mono);font-size:10px;color:var(--ink3)">${esc(n.year)}</span>`:''}<div class="fl">${esc(n.label)}</div>${n.desc?`<div class="fd">${esc(n.desc)}</div>`:''}</div>`; });
    h+=`</div>`;
  } else if(c.t==='perspective'){
    h+=`<div class="d-bio">${strong(d.fact)}</div>`;
    h+=`<div class="d-sec"><h4>🗣 不同的声音</h4>`+ (d.voices||[]).map(v=>`<div class="voice"><div class="vw">${esc(v.flag||'')} ${esc(v.who)}</div><div class="va">"${esc(v.account)}"</div><div class="ve">${esc(v.emphasis)}</div></div>`).join('') +`</div>`;
    if(d.reflection) h+=`<div class="reflect-box">${strong(d.reflection)}</div>`;
  } else if(c.t==='meanwhile'){
    h+=`<div class="d-bio">${strong(c.one)}</div><div class="d-sec"><h4>🌍 同一时刻的世界</h4>`+
      (d.regions||[]).map(r=>`<div class="meanw-reg"><div class="mr">${esc(r.region)}</div><div class="mi">${r.items.map(esc).join(' · ')}</div></div>`).join('')+`</div>`;
  }
  return h;
}
// 关系跳转:按名字找卡片
function jumpByName(name){
  const i=FEED.findIndex(c=>c.t==='person'&&c.title===name);
  if(i>=0){ closeDrawer(); jumpTo(i,true); }
}

// ── 手势/输入 ──
let wheelLock=false;
document.getElementById('stage').addEventListener('wheel',e=>{
  e.preventDefault(); if(wheelLock)return; if(Math.abs(e.deltaY)<8)return;
  wheelLock=true; go(e.deltaY>0?1:-1); setTimeout(()=>wheelLock=false,430);
},{passive:false});
let ty0=null,tx0=null,tmoved=false;
document.getElementById('stage').addEventListener('touchstart',e=>{ const t=e.touches[0]; ty0=t.clientY; tx0=t.clientX; tmoved=false; },{passive:true});
document.getElementById('stage').addEventListener('touchmove',e=>{ const t=e.touches[0]; if(Math.abs(t.clientY-ty0)>10||Math.abs(t.clientX-tx0)>10)tmoved=true; },{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{
  const t=e.changedTouches[0]; const dy=t.clientY-ty0, dx=t.clientX-tx0;
  if(!tmoved){ openDrawer(); return; }
  if(Math.abs(dy)>50 && Math.abs(dy)>Math.abs(dx)){ go(dy<0?1:-1); }
},{passive:true});
cardEl.addEventListener('click',e=>{ /* 点击(非滑动)在 touchend 处理; 桌面端: */ if(!('ontouchstart'in window)) openDrawer(); });
document.addEventListener('keydown',e=>{
  if(drawer.classList.contains('show')){ if(e.key==='Escape')closeDrawer(); return; }
  if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();go(-1);}
  else if(e.key==='Enter'){openDrawer();}
});
document.getElementById('upBtn').onclick=()=>go(-1);
document.getElementById('downBtn').onclick=()=>go(1);
document.getElementById('dclose').onclick=closeDrawer;
scrim.onclick=closeDrawer;
// 抽屉下滑关闭
let dy0=null;
drawer.addEventListener('touchstart',e=>{ if(dbody.scrollTop<=0) dy0=e.touches[0].clientY; else dy0=null; },{passive:true});
drawer.addEventListener('touchend',e=>{ if(dy0!=null && e.changedTouches[0].clientY-dy0>80) closeDrawer(); dy0=null; },{passive:true});

// 自动播放
function setAuto(v){ auto=v; const b=document.getElementById('autoBtn'); b.classList.toggle('on',v); b.textContent=v?'⏸ 自动':'▶ 自动';
  clearInterval(autoTimer); if(v) autoTimer=setInterval(()=>{ if(drawer.classList.contains('show'))return; if(idx<FEED.length-1)go(1); else setAuto(false); },5200); }
document.getElementById('autoBtn').onclick=()=>setAuto(!auto);

// 时代跳转
const ERAS=[['🌱 起源','-3500'],['📜 早期文明','-3000'],['💡 古典','-600'],['🏛 帝国','-200'],['🌍 中世纪','600'],['⛵ 大航海','1500'],['⚙️ 工业','1780'],['🌐 现代','1900'],['🤖 当代','1960']];
const eraBar=document.getElementById('eraBar');
eraBar.innerHTML=ERAS.map(([l,y])=>`<span class="erachip" data-y="${y}">${l}</span>`).join('');
eraBar.querySelectorAll('.erachip').forEach(ch=>ch.onclick=()=>{
  const ty=+ch.dataset.y; let i=FEED.findIndex(c=>c.y>=ty); if(i<0)i=FEED.length-1; idx=i; renderCard('up');
});

// 主题
function applyTheme(t){ if(t&&t!=='deepblue')document.body.setAttribute('data-theme',t); else document.body.removeAttribute('data-theme');
  localStorage.setItem('civ_theme',t||'deepblue');
  document.querySelectorAll('#themeSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.t===(t||'deepblue'))); }
document.getElementById('themeSwitch').onclick=e=>{const b=e.target.closest('button');if(b)applyTheme(b.dataset.t);};
applyTheme(localStorage.getItem('civ_theme')||'deepblue');

// 关系链点击(委托,用名字跳)
dbody.addEventListener('click',e=>{ const chip=e.target.closest('.rel-chip'); if(chip){ const nm=chip.getAttribute('data-jumpname'); if(nm)jumpByName(nm);} });

// 启动:支持 ?id= 或 ?y= 直达
const params=new URLSearchParams(location.search);
if(params.get('id')&&byId[params.get('id')]!=null) idx=byId[params.get('id')];
else if(params.get('y')){ const ty=+params.get('y'); let i=FEED.findIndex(c=>c.y>=ty); if(i>=0)idx=i; }
renderCard('up');
</script>
</body>
</html>
