<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 汉谟拉比立法 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「以眼还眼,以牙还牙。」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 《汉谟拉比法典》</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·汉谟拉比立法"(母题:让规矩说话/把规则写下来约束所有人)。史实:约公元前1754年,古巴比伦国王汉谟拉比统一两河流域大部。当时各地缺乏统一标准,强者欺凌弱者、私人复仇无休止。汉谟拉比把282条法律刻在一根黑色玄武岩石碑上,公开竖立示众(石碑顶部浮雕:太阳神/正义之神沙马什把权杖交给汉谟拉比,象征法律来自神与正义)。这是人类最早、最完整的成文法典之一(并非最早,更早有乌尔纳姆法典等,但汉谟拉比法典最著名最完整)。最著名的原则是"以眼还眼、以牙还牙"(同态复仇 lex talionis)——它的进步意义在于:把报复限制在"对等"范围内,不许无限报复;并且法律公开,人人可知,有据可依,甚至带有"无罪推定""可呈堂证据"的雏形。但它也有明显局限:刑罚按社会阶级不同(贵族、平民、奴隶受罚不同,伤害贵族赔得重、伤害奴隶赔得轻),并不平等;"以眼还眼"本身在今天看来也很残酷。教学要点:成文法、公开的规则,是文明的一大步——它让"规矩"取代"谁拳头大谁说了算";但早期法律也带着时代的不平等。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论。这个抉择和商鞅"太子犯法罚不罚"(法律面前人人平等)属于同一母题:规则,能不能管住有权的人。';
const DOSSIER=[
  {i:'👑',t:'你是谁',b:'你是<b>汉谟拉比</b>,古巴比伦的国王。你南征北战,把两河流域的大片土地统一在自己手下——可治理这么大的地方,你遇到了一个大麻烦。'},
  {i:'⚔️',t:'没有规矩的世界',b:'你的国土上,各地<b>各有各的规矩</b>。强者欺负弱者,有了纠纷就<b>私自报复</b>,你打我一拳、我就要你一条命,冤冤相报没完没了。说到底:<b>谁拳头硬,谁就说了算。</b>'},
  {i:'⚖️',t:'一个大胆的念头',b:'你想:能不能把<b>该怎么判</b>一条条<b>写下来、刻成石碑、公开示众</b>?让全国上下——不管你是谁——都照<b>同一部法律</b>办事。有了白纸黑字,断案就有了准绳。'},
  {i:'👁️',t:'"以眼还眼"',b:'你打算定一条核心原则:"<b>以眼还眼,以牙还牙</b>"。它听起来很狠,但其实是给报复<b>定了上限</b>——你弄瞎别人一只眼,最多也只赔一只眼,<b>不准再多</b>。这, 在那个无限报复的年代,反而是一种约束。'},
  {i:'🏛️',t:'最难的一关',b:'可问题来了:法律一旦公开,就意味着连<b>贵族、官员、甚至你自己</b>,都得受它约束。手握大权的人,会愿意把自己也关进规矩的笼子里吗?'},
  {i:'🪨',t:'眼前的难题',b:'石匠已经备好巨大的石碑。<b>把法律刻上去公示</b>,你就给了所有人一个准绳,却也限制了权贵(和你)的随意;<b>不刻、继续由人临时裁断</b>,你和贵族说了算,却永远摆不平那无休止的私斗。'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">约公元前 1754 年 · 巴比伦</div>
  <div class="htitle">把法律刻在石碑上,公开给所有人看?</div>
  <div class="hsub">即将由你 —— 汉谟拉比 —— 决定</div>
  <div class="scene">约公元前1754年,你是巴比伦国王<b>汉谟拉比</b>。你统一了两河大片土地,却管不住一件事:强者欺负弱者、私人复仇没完没了。<br><br>你想把"该怎么判"<b>一条条刻成石碑、公开示众</b>,让所有人按同一部法律办事——哪怕这也约束你自己。<br><br><b>刻,还是不刻?</b> 先别急,先把这件大事看清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先弄懂这件事 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">看清这件大事</div>
  <div class="dossier-intro">点开每一张情报卡,弄懂你面对的乱局、"以眼还眼"到底是什么、又难在哪。<br>全部看完,你才有资格替汉谟拉比做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张情报卡后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是汉谟拉比</div>
  <div class="ask">刻,还是不刻?</div>
  <div class="asksub">石碑已备好。一旦刻上公示,连权贵和你自己都要守它。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>刻成石碑、公开示众——人人按同一部法律办事,连贵族和我自己也受约束。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>不立成文法——凡事由我和贵族临时裁断,想怎么判就怎么判。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>只立法管平民——百姓守法,贵族和王室不受这部法律约束。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">汉谟拉比,选了 A</div>
  <div class="scene">他下令把<b>282条法律</b>,一条条刻在一根高大的<b>黑色石碑</b>上,公开竖立。石碑顶端,刻着正义之神把象征权力的权杖交给他——意思是:<b>这法律,来自神和正义,不是我一个人的脾气。</b><br><br>从此,巴比伦人断案有了白纸黑字的准绳。"<b>以眼还眼</b>"给报复定了上限,私斗不再无休无止。这,是人类最早、最完整的成文法典之一。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……它带来了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 一块石碑,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 短期</div><div class="lt">私人复仇被<b>法律取代</b>,纠纷有据可依、判罚有准绳。"以眼还眼"听着狠,却给报复<b>设了上限</b>,不许无限循环。</div></div>
    <div class="line"><div class="lh">🌅 长远</div><div class="lt">它是人类最早、最完整的<b>成文法典</b>之一,影响深远——它告诉后人一个伟大的观念:<b>规则应当写下来、公开,让人人都知道,而不是凭谁的喜怒。</b></div></div>
    <div class="line"><div class="lh">⚖️ 它的局限</div><div class="lt">可它<b>并不平等</b>:伤害贵族、平民、奴隶,赔的差得很远。早期的法律,也带着那个时代的偏见——<b>"写下规则"是第一步,"人人平等"还要走很久。</b></div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看这块石碑? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一块石碑,不同的声音</div>
  <div class="voice"><div class="vw">🧑‍🌾 一个平民</div><div class="va">"以前全凭官老爷一句话,现在好歹有白纸黑字了——我也能指着石碑说'法律是这么写的'。"</div></div>
  <div class="voice"><div class="vw">🎩 一个贵族</div><div class="va">"凭什么连我也要守这石碑上的条文?不过……伤了我,赔得也比伤平民重,倒也不亏。"</div></div>
  <div class="voice"><div class="vw">📜 后世法学家</div><div class="va">"把规则写下来、公开示众,让权力也受约束——这是文明迈出的一大步。哪怕它还不平等。"</div></div>
  <div class="voice"><div class="vw">👑 汉谟拉比</div><div class="va">"我以正义之神的名义立法,为的是'让强者不能欺凌弱者'。"</div></div>
  <div class="note">同一个抉择,没有标准答案。 · 史料:据《汉谟拉比法典》石碑(藏卢浮宫)</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">它改变了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 从"谁拳头大"到"规则说了算"</div>
  <div class="scene">汉谟拉比把法律刻上石碑的那一刻,人类做了一件了不起的事:让"<b>白纸黑字的规则</b>",开始取代"<b>谁拳头大谁说了算</b>"。<br><br>它远不完美——刑罚按身份分三六九等,"以眼还眼"也很残酷。但它立下了一个一直影响到今天的观念:<b>规则要写下来、要公开,让所有人(包括有权的人)都知道、都遵守。</b><br><br>一千多年后,遥远的东方,商鞅也会面对同一个考验:当太子犯了法,法律,管不管这个最有权的人?</div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=babylon">🗺 去地图看 古巴比伦</a>
    <a class="ghost" href="./decision-shangyang.html">⚖️ 看商鞅的同款考验 →</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">如果没有写下来、公开的规则,世界会变成什么样?你愿意活在"<b>谁拳头大谁说了算</b>"的地方吗?</div>
  <div class="q">汉谟拉比的法律<b>并不平等</b>。"把规则写下来"和"让规则对人人平等",你觉得哪个更难?为什么?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和汉谟拉比(A)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你从这块石碑看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:把规矩写下来、公开给所有人看,是文明的一大步——哪怕它还要慢慢变得更公平……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到抉择,顺着母题线找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'hammurabi',DOSSIER:DOSSIER,beats:beats,reactions:{A:'让规则取代拳头,了不起!可你也把自己关进了规矩的笼子——手握大权的人,真愿意守自己定的法吗?',
    B:'凡事自己说了算,看似方便。可百姓永远没有准绳,私斗也永远停不下来——这样的国,稳得住吗?',
    C:'只管平民、放过权贵?那石碑上的"正义",百姓会真心信服吗?规则一旦只管弱者,就成了欺压的工具。'},confirmLabel:'👉 看真实的汉谟拉比怎么选'};
</script>
<script src="./decision-engine.js?v=2"></script>
<script src="./ai_float.js?v=3"></script>
</body>
</html>
