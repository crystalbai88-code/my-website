<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>形态 A · 章节书 · 早期文明 (前 3500 → 前 1000)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0e; --paper:#fdf8ed; --paper2:#f5e8c8;
  --ink:#1a1410; --ink2:#5c4530; --ink3:#8a7050;
  --gold:#d4a858; --vermilion:#c84820;
  --serif:'Noto Serif SC',serif;
  --sans:'Noto Sans SC',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:#0a0a0e;color:var(--ink);overflow:hidden}

.topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:20;background:rgba(15,15,22,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,168,88,.2);display:flex;align-items:center;gap:14px;padding:0 22px}
.topbar .home{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.18em}
.topbar h1{font-family:var(--serif);font-size:14px;color:#f5e8c8;font-weight:700;letter-spacing:.04em}
.topbar h1 em{color:var(--gold);font-style:normal;margin-left:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em}
.chapter-dots{margin-left:auto;display:flex;gap:8px;align-items:center}
.dot{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(212,168,88,.3);background:transparent;color:rgba(212,168,88,.5);font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s}
.dot.done{background:rgba(212,168,88,.15);color:var(--gold);border-color:var(--gold)}
.dot.current{background:var(--gold);color:#1a1410;border-color:var(--gold);transform:scale(1.15);box-shadow:0 0 16px rgba(212,168,88,.5)}
.dot.locked{opacity:.3;cursor:not-allowed}

.stage{position:fixed;top:54px;left:0;right:0;bottom:0;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column}

.hero{height:42%;min-height:280px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 48px 28px;color:white}
.hero .bg{position:absolute;inset:0;z-index:0}
.hero .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.4) 70%,rgba(0,0,0,.7) 100%)}
.hero .star-layer{position:absolute;inset:0;opacity:.4;background:radial-gradient(1.2px 1.2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 40%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent)}
.hero .icon{font-size:46px;margin-bottom:10px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4));position:relative;z-index:1}
.hero .num{font-family:var(--mono);font-size:11px;letter-spacing:.4em;opacity:.7;margin-bottom:6px;position:relative;z-index:1}
.hero .range{font-family:var(--mono);font-size:13px;letter-spacing:.18em;color:rgba(255,255,255,.85);margin-bottom:10px;position:relative;z-index:1}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:900;letter-spacing:-.01em;line-height:1.05;margin-bottom:6px;position:relative;z-index:1;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.hero .subtitle{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.3em;opacity:.6;margin-bottom:18px;position:relative;z-index:1;text-transform:uppercase}
.hero .question{font-family:var(--serif);font-size:18px;line-height:1.55;font-weight:500;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-left:3px solid var(--gold);padding:14px 18px;border-radius:0 12px 12px 0;max-width:680px;position:relative;z-index:1}

.scroll-body{flex:1;background:var(--paper);overflow-y:auto;padding:30px 48px 80px;position:relative}
.world-ctx{font-family:var(--serif);font-size:14px;line-height:1.75;color:var(--ink2);background:linear-gradient(135deg,rgba(212,168,88,.12),rgba(200,72,32,.06));border:1px solid rgba(212,168,88,.25);border-radius:14px;padding:14px 18px;margin-bottom:24px}
.world-ctx::before{content:'🌐 当时世界 · ';color:var(--vermilion);font-weight:700;font-family:var(--sans);font-size:11px;letter-spacing:.16em;display:block;margin-bottom:6px}

.section-title{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--vermilion);margin:0 0 16px;padding-bottom:8px;border-bottom:2px solid rgba(200,72,32,.2);display:flex;align-items:center;gap:10px}
.section-title .count{font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.1em;margin-left:auto}

.civ-card{background:white;border-radius:14px;margin-bottom:14px;border:1px solid rgba(160,100,30,.18);box-shadow:0 2px 8px rgba(0,0,0,.04);overflow:hidden;transition:all .25s}
.civ-card.expanded{box-shadow:0 8px 24px rgba(160,100,30,.15);border-color:var(--gold)}
.civ-head{padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:56px}
.civ-head:hover{background:rgba(212,168,88,.05)}
.civ-head .dot-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.civ-head .info{flex:1;min-width:0}
.civ-head .name{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink);line-height:1.3}
.civ-head .l1{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.civ-head .state-chip{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:99px;letter-spacing:.08em;font-weight:700;flex-shrink:0;background:rgba(212,168,88,.15);color:#8a6028}
.civ-head .state-chip[data-state="巅峰"]{background:rgba(60,160,80,.15);color:#2a6038}
.civ-head .state-chip[data-state="崩溃"],.civ-head .state-chip[data-state="集体崩溃"]{background:rgba(200,72,32,.15);color:var(--vermilion)}
.civ-head .state-chip[data-state="衰落"]{background:rgba(140,100,40,.15);color:#7a5530}
.civ-head .expand-ic{width:32px;height:32px;border-radius:50%;background:rgba(212,168,88,.1);color:var(--vermilion);display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform .25s;flex-shrink:0}
.civ-card.expanded .expand-ic{transform:rotate(180deg)}

.civ-body{display:none;padding:4px 20px 20px;border-top:1px dashed rgba(160,100,30,.2)}
.civ-card.expanded .civ-body{display:block}
.layer{margin-top:16px;animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.layer .l-label{font-family:var(--mono);font-size:9.5px;color:var(--vermilion);letter-spacing:.18em;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.layer.l2 .l-text{font-family:var(--serif);font-size:14.5px;line-height:1.85;color:var(--ink)}
.layer.l5 .narrative{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(245,232,200,.5));border-left:3px solid var(--gold);padding:14px 18px;border-radius:0 12px 12px 0;font-family:var(--serif);font-size:14px;line-height:1.95;color:var(--ink)}
.layer.l5 .narrative p{margin-bottom:14px} .layer.l5 .narrative p:last-child{margin-bottom:0}

.evt-list,.person-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.evt-item,.person-item{background:rgba(245,232,200,.4);border:1px solid rgba(160,100,30,.15);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s}
.evt-item:hover,.person-item:hover{border-color:var(--vermilion);background:rgba(245,232,200,.7);transform:translateX(-2px)}
.evt-item .ti,.person-item .ti{font-weight:700;color:var(--ink);font-size:13.5px;font-family:var(--serif);margin-bottom:4px}
.evt-item .meta,.person-item .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em}
.evt-item .body,.person-item .body{font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:6px}

.reveal-btn{margin-top:14px;width:100%;padding:12px 14px;border-radius:10px;border:1.5px dashed rgba(200,72,32,.4);background:transparent;cursor:pointer;color:var(--vermilion);font-family:var(--serif);font-size:13px;font-weight:600;transition:all .2s}
.reveal-btn:hover{background:rgba(200,72,32,.06);border-style:solid}

.flip-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:14px;background:rgba(15,15,22,.92);backdrop-filter:blur(20px);border:1px solid rgba(212,168,88,.3);border-radius:99px;padding:8px 14px;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.flip-bar button{min-width:44px;min-height:44px;border-radius:50%;border:none;background:transparent;color:var(--gold);font-size:18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.flip-bar button:hover:not(:disabled){background:rgba(212,168,88,.15);transform:scale(1.1)}
.flip-bar button:disabled{opacity:.3;cursor:not-allowed}
.flip-bar button.primary{background:var(--gold);color:#1a1410;padding:0 22px;border-radius:99px;font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.04em;min-width:auto;width:auto}
.flip-bar .ctx{color:rgba(212,168,88,.7);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;padding:0 8px}

.summary-page{display:flex;flex-direction:column;height:100%;background:#fdf8ed}
.summary-page .header{padding:40px 48px 20px;background:linear-gradient(135deg,#1a1410,#3a2a1a);color:white;text-align:center}
.summary-page .header h2{font-family:var(--serif);font-size:36px;font-weight:900;margin-bottom:6px}
.summary-page .header .sub{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:12px;opacity:.7}
.summary-body{flex:1;overflow-y:auto;padding:30px 48px 60px}
.gantt{display:grid;grid-template-columns:160px repeat(5,1fr) 1.8fr;gap:0;background:white;border-radius:14px;overflow:hidden;border:1px solid rgba(160,100,30,.2);margin-bottom:24px}
.gantt .gh{padding:10px 12px;background:rgba(212,168,88,.15);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--vermilion);letter-spacing:.08em;border-bottom:1px solid rgba(160,100,30,.2);text-align:center}
.gantt .gh:first-child{text-align:left}
.gantt .gh.legacy{background:rgba(200,72,32,.12);color:var(--vermilion)}
.gantt .gc{padding:12px;border-bottom:1px solid rgba(160,100,30,.1);min-height:50px;display:flex;align-items:center}
.gantt .gc.civ-name{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--ink);background:rgba(245,232,200,.3)}
.gantt .gc.block{position:relative;padding:0}
.gantt .gc .bar{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border-radius:4px}
.gantt .gc .bar.peak{opacity:1}
.gantt .gc .bar.rise,.gantt .gc .bar.fade{opacity:.5}
.gantt .gc .bar.collapse{opacity:.8;background-image:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(0,0,0,.3) 100%)}
.gantt .gc.legacy-cell{font-size:11.5px;color:var(--ink2);line-height:1.5;font-family:var(--sans);background:rgba(200,72,32,.04)}

.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:30px}
.legacy-card{background:white;border:1px solid rgba(160,100,30,.18);border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.legacy-card .what{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--vermilion);margin-bottom:4px}
.legacy-card .from{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:.08em;margin-bottom:8px}
.legacy-card .why{font-size:13px;line-height:1.65;color:var(--ink2)}
.legacy-h{font-family:var(--serif);font-size:24px;font-weight:900;color:var(--ink);margin:30px 0 8px;text-align:center}
.legacy-h-sub{text-align:center;color:var(--ink3);font-family:var(--mono);font-size:11px;letter-spacing:.18em;margin-bottom:20px;text-transform:uppercase}

@media (max-width:768px){
  .hero{padding:24px}.hero h2{font-size:32px}.hero .question{font-size:15px}
  .scroll-body{padding:20px}
  .summary-page .header{padding:24px}.summary-page .header h2{font-size:24px}
  .summary-body{padding:20px}
  .gantt{grid-template-columns:90px repeat(5,1fr) 1.5fr;font-size:11px}
  .gantt .gh,.gantt .gc{padding:6px}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="./civ-explorer-compare.html" class="home">← 对比页</a>
  <h1>早期文明 · 章节书 <em>FORM A</em></h1>
  <div class="chapter-dots" id="dots"></div>
</div>

<div class="stage" id="stage"></div>

<div class="flip-bar">
  <button id="prevBtn" onclick="prev()" title="上一章">◀</button>
  <div class="ctx" id="ctxLabel">CHAPTER 1 / 5</div>
  <button id="nextBtn" class="primary" onclick="next()">下一章 ▶</button>
</div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
let currentCh = 0;
const completed = new Set([0]);

function renderDots(){
  const el = document.getElementById('dots');
  el.innerHTML = CHAPTERS.map((c,i)=>{
    let cls = '';
    if (i===currentCh) cls='current';
    else if (completed.has(i)) cls='done';
    return `<button class="dot ${cls}" onclick="goTo(${i})" title="${c.title}">${c.no}</button>`;
  }).join('') + `<button class="dot ${currentCh===5?'current':(completed.size>=5?'done':'locked')}" onclick="if(completed.size>=5)goTo(5)" title="总汇">🏁</button>`;

  document.getElementById('prevBtn').disabled = currentCh===0;
  const next = document.getElementById('nextBtn');
  if (currentCh===5) { next.textContent='已是最后'; next.disabled=true; }
  else if (currentCh===4) { next.textContent='🏁 看总汇 ▶'; next.disabled=false; }
  else { next.textContent='下一章 ▶'; next.disabled=false; }
  document.getElementById('ctxLabel').textContent = currentCh===5 ? '🏁 全景总汇' : `CHAPTER ${currentCh+1} / 5`;
}

function getCivInfo(id){
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f;
  }
  // fallback
  const fallback = {egypt_predynastic:{name:'古埃及·前王朝',icon:'🌅',color:'#d4b870'},indus_early:{name:'印度河早期',icon:'🏘',color:'#a070d4'}};
  return fallback[id] || {name:id,icon:'🏛',color:'#888'};
}

function renderChapter(ch){
  return `<div class="page">
    <div class="hero">
      <div class="bg" style="background:${ch.mood_grad}"></div>
      <div class="star-layer"></div>
      <div class="icon">${ch.icon}</div>
      <div class="num">CHAPTER ${ch.no}</div>
      <div class="range">${ch.range} BCE</div>
      <h2>${ch.title}</h2>
      <div class="subtitle">${ch.subtitle}</div>
      <div class="question">💭 ${ch.hero_question}</div>
    </div>
    <div class="scroll-body">
      <div class="world-ctx">${ch.world_context}</div>
      <h3 class="section-title">🏛 本期活跃文明 <span class="count">${ch.active_civs.length} 个</span></h3>
      ${ch.active_civs.map((cv,idx)=>{
        const civInfo = getCivInfo(cv.id);
        return `<div class="civ-card" id="card-${idx}">
          <div class="civ-head" onclick="toggleCard(${idx})">
            <div class="dot-ic" style="background:${civInfo.color}">${civInfo.icon}</div>
            <div class="info">
              <div class="name">${civInfo.name}</div>
              <div class="l1">${cv.L1||''}</div>
            </div>
            <span class="state-chip" data-state="${cv.state}">${cv.state}</span>
            <div class="expand-ic">▼</div>
          </div>
          <div class="civ-body" id="body-${idx}">
            <div class="layer l2"><div class="l-label">L2 · 这一期在干什么</div><div class="l-text">${cv.L2||cv.in_period_summary||''}</div></div>
            ${cv.L3_events?.length ? `<button class="reveal-btn" onclick="revealLayer(${idx},'l3')" id="rev3-${idx}">▼ 继续了解 · 看 ${cv.L3_events.length} 个关键事件 (L3)</button><div class="layer l3" id="layer3-${idx}" style="display:none"><div class="l-label">L3 · 关键事件</div><div class="evt-list">${cv.L3_events.map(eid=>{const e=(typeof EVENT_DEEP!=='undefined')?EVENT_DEEP[eid]:null;if(!e)return `<div class="evt-item"><div class="ti">📅 ${eid}</div><div class="meta">深度内容待补</div></div>`;return `<div class="evt-item"><div class="ti">📅 ${e.full_title||eid}</div><div class="meta">${e.one_liner||''}</div><div class="body">${(e.narrative||'').slice(0,180).trim()}...</div></div>`;}).join('')}</div></div>` : ''}
            ${cv.L4_people?.length ? `<button class="reveal-btn" onclick="revealLayer(${idx},'l4')" id="rev4-${idx}">▼ 继续了解 · 看 ${cv.L4_people.length} 个关键人物 (L4)</button><div class="layer l4" id="layer4-${idx}" style="display:none"><div class="l-label">L4 · 关键人物</div><div class="person-list">${cv.L4_people.map(pid=>{const p=(typeof PERSON_DEEP!=='undefined')?PERSON_DEEP[pid]:null;if(!p)return `<div class="person-item"><div class="ti">${pid}</div><div class="meta">深度传记待补</div></div>`;return `<div class="person-item"><div class="ti">${p.full_name||pid}</div><div class="meta">${p.lifespan_real||p.lifespan_mythic||''}</div><div class="body">${(p.biography||'').slice(0,220).trim()}...</div></div>`;}).join('')}</div></div>` : ''}
            ${cv.L5_full ? `<button class="reveal-btn" onclick="revealLayer(${idx},'l5')" id="rev5-${idx}">▼ 继续了解 · 完整文明叙事 (L5)</button><div class="layer l5" id="layer5-${idx}" style="display:none"><div class="l-label">L5 · 完整文明叙事</div><div class="narrative">${((typeof CIV_DEEP!=='undefined'&&CIV_DEEP.sumer)?CIV_DEEP.sumer.opening_narrative:'').trim().split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('')}</div></div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderSummary(){
  return `<div class="summary-page">
    <div class="header">
      <h2>🏁 2500 年世界全景</h2>
      <div class="sub">前 3500 → 前 1000 BCE · 文明甘特图</div>
    </div>
    <div class="summary-body">
      <div class="gantt">
        <div class="gh">文明</div>
        <div class="gh">CH1<br>3500-3000</div>
        <div class="gh">CH2<br>3000-2500</div>
        <div class="gh">CH3<br>2500-2000</div>
        <div class="gh">CH4<br>2000-1500</div>
        <div class="gh">CH5<br>1500-1000</div>
        <div class="gh legacy">今天保留</div>
        ${FINAL_OVERVIEW.civs.map(cv=>{
          let row = `<div class="gc civ-name">${cv.name}</div>`;
          for (let ch=1; ch<=5; ch++){
            const span = cv.spans.find(s=>s[0]===ch);
            if (span) row += `<div class="gc block"><div class="bar ${span[1].split('_')[0]}" style="background:${cv.color}"></div></div>`;
            else row += `<div class="gc block"></div>`;
          }
          row += `<div class="gc legacy-cell">${cv.legacy}</div>`;
          return row;
        }).join('')}
      </div>
      <h3 class="legacy-h">🎁 今天我们保留了什么</h3>
      <div class="legacy-h-sub">things from 2500 years ago we still use today</div>
      <div class="legacy-grid">
        ${FINAL_OVERVIEW.today_legacy.map(l=>`<div class="legacy-card">
          <div class="what">${l.what}</div>
          <div class="from">来自 · ${l.from}</div>
          <div class="why">${l.why}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function render(){
  document.getElementById('stage').innerHTML = currentCh===5 ? renderSummary() : renderChapter(CHAPTERS[currentCh]);
  renderDots();
}
function toggleCard(idx){ document.getElementById('card-'+idx).classList.toggle('expanded'); }
function revealLayer(idx, layer){
  const num = layer.slice(1);
  document.getElementById(`layer${num}-${idx}`).style.display='block';
  document.getElementById(`rev${num}-${idx}`).style.display='none';
}
function next(){ completed.add(currentCh); if (currentCh<5) currentCh++; render(); document.querySelector('.scroll-body, .summary-body')?.scrollTo(0,0); }
function prev(){ if (currentCh>0) currentCh--; render(); }
function goTo(i){ if (i===5 && completed.size<5) return; currentCh=i; render(); }

render();
window.toggleCard=toggleCard; window.revealLayer=revealLayer; window.next=next; window.prev=prev; window.goTo=goTo;
</script>
</body>
</html>
