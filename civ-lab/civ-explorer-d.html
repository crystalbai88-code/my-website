<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>形态 D · 一张全图 · 早期文明</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#04050c; --paper:#fdf8ed;
  --ink:#f0e8d5; --ink2:#a8b0c8; --ink3:#5a6080;
  --gold:#d4a858; --warm:#e89870; --cyan:#7adcf0; --magenta:#e878d8;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink)}

/* 背景：深空 + 静态星点 + 大气透视层 */
body{
  background:
    radial-gradient(ellipse at 25% 10%, rgba(120,90,200,.18) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 90%, rgba(200,120,60,.12) 0%, transparent 50%),
    linear-gradient(180deg, #04050c 0%, #08091a 100%);
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:
    radial-gradient(1px 1px at 8% 15%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 22% 38%,#fff,transparent),
    radial-gradient(1px 1px at 38% 22%,#ffd47a,transparent),
    radial-gradient(1.4px 1.4px at 55% 55%,#fff,transparent),
    radial-gradient(1px 1px at 72% 28%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 88% 78%,#fff,transparent),
    radial-gradient(1px 1px at 12% 82%,#c8d4ff,transparent),
    radial-gradient(1.2px 1.2px at 92% 32%,#fff,transparent);
}

/* 顶栏 */
.topbar{position:sticky;top:0;height:54px;z-index:30;background:rgba(4,5,12,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,168,88,.18);display:flex;align-items:center;gap:14px;padding:0 22px}
.topbar .home{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.18em}
.topbar h1{font-family:var(--serif);font-size:14px;font-weight:700}
.topbar h1 em{color:var(--gold);font-style:normal;margin-left:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em}
.topbar .progress{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em;background:rgba(212,168,88,.1);padding:6px 12px;border-radius:99px;border:1px solid rgba(212,168,88,.2)}
.topbar .reset{background:transparent;border:1px solid rgba(212,168,88,.3);color:var(--gold);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em}
.topbar .reset:hover{background:var(--gold);color:#0a0a0e}

/* 主舞台 */
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:20px 16px 80px}
.intro{padding:24px 28px;background:linear-gradient(135deg,rgba(212,168,88,.08),rgba(120,90,200,.06));border:1px solid rgba(212,168,88,.22);border-radius:14px;margin-bottom:30px;box-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)}
.intro h2{font-family:var(--serif);font-size:22px;font-weight:900;margin-bottom:6px;color:var(--gold)}
.intro p{font-size:13.5px;line-height:1.75;color:var(--ink2);max-width:880px}

.map-svg{width:100%;height:auto;display:block;background:transparent}

/* ════ 节点状态：用 CSS class 控制，不重新渲染 SVG ════ */
.ring-group{transition:opacity .8s ease;}
.ring-group.locked{opacity:.12;pointer-events:none}

.civ-dot{cursor:pointer;transition:transform .25s ease}
.civ-dot:hover{transform:scale(1.10)}
.civ-circle{transition:filter .3s ease}
.civ-dot:hover .civ-circle{filter:brightness(1.18) drop-shadow(0 0 22px currentColor)}

.civ-dot .studied-mark{opacity:0;transition:opacity .4s ease}
.civ-dot.studied .studied-mark{opacity:1}
.civ-dot.studied .civ-circle{stroke:#7ad896 !important;stroke-width:3 !important;filter:drop-shadow(0 0 16px rgba(122,216,150,.6))}

.civ-label{font-family:var(--serif);font-weight:700;fill:white;text-anchor:middle;pointer-events:none}
.civ-state{font-family:var(--mono);text-anchor:middle;pointer-events:none;letter-spacing:.06em}

/* 传承连线：默认隐藏，CSS class 控制显示 */
.carryover-line{
  fill:none;stroke:rgba(212,168,88,.6);stroke-width:2.5;stroke-linecap:round;
  filter:drop-shadow(0 2px 6px rgba(212,168,88,.3));
  opacity:0;transition:opacity .8s ease;
}
.carryover-line.visible{opacity:1}

/* 按钮 */
.reveal-btn-group{cursor:pointer;transition:opacity .4s ease}
.reveal-btn-group.hidden{opacity:0;pointer-events:none}
.reveal-btn-bg{fill:rgba(212,168,88,.15);stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 3;transition:fill .25s ease}
.reveal-btn-group:hover .reveal-btn-bg{fill:var(--gold)}
.reveal-btn-text{font-family:var(--serif);font-weight:700;fill:var(--gold);text-anchor:middle;dominant-baseline:central;pointer-events:none;font-size:14px;transition:fill .25s ease}
.reveal-btn-group:hover .reveal-btn-text{fill:#1a1410}

.summary-btn{
  display:block;margin:40px auto 0;padding:18px 36px;border:none;
  background:linear-gradient(135deg,var(--gold),var(--warm));color:#1a1410;
  font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.04em;
  border-radius:99px;cursor:pointer;
  box-shadow:0 12px 32px rgba(212,168,88,.4),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .25s ease, box-shadow .25s ease;
}
.summary-btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(212,168,88,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.summary-btn:disabled{opacity:.4;cursor:not-allowed}

/* 详情侧栏 */
.detail{
  position:fixed;right:18px;top:74px;width:420px;max-width:calc(100vw - 36px);max-height:calc(100vh - 110px);z-index:28;
  background:rgba(15,15,28,.97);backdrop-filter:blur(24px);
  border:1px solid rgba(212,168,88,.35);border-radius:16px;
  display:none;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
}
.detail.open{display:flex}
.detail-head{padding:18px 20px 14px;border-bottom:1px solid rgba(212,168,88,.2);display:flex;align-items:center;gap:10px}
.detail-head .ic{font-size:30px;flex-shrink:0;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.detail-head .ti{flex:1;min-width:0}
.detail-head .ki{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--gold);font-weight:700;margin-bottom:3px}
.detail-head h3{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:700;line-height:1.2}
.detail-head .close{width:34px;height:34px;border-radius:50%;border:1px solid rgba(212,168,88,.3);background:transparent;color:var(--ink2);cursor:pointer;font-size:14px}
.detail-head .close:hover{background:rgba(212,168,88,.15);color:var(--gold)}
.detail-body{flex:1;overflow-y:auto;padding:16px 20px}
.detail-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.detail-meta span{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(212,168,88,.12);color:var(--gold);letter-spacing:.06em}
.detail-meta .state{background:rgba(122,216,150,.15);color:#7ad896}
.detail-q{font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--ink);background:rgba(212,168,88,.08);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:14px}
.detail-section{margin-bottom:14px}
.detail-section .h{font-family:var(--mono);font-size:9.5px;color:var(--warm);letter-spacing:.18em;font-weight:700;margin-bottom:8px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.detail-section .b{font-family:var(--serif);font-size:13.5px;line-height:1.85;color:var(--ink2)}
.detail-narrative{background:rgba(212,168,88,.05);border-radius:10px;padding:14px;border:1px solid rgba(212,168,88,.15)}
.detail-narrative p{font-family:var(--serif);font-size:13px;line-height:1.85;color:var(--ink);margin-bottom:10px}
.detail-narrative p:last-child{margin-bottom:0}

/* 子项：事件 / 人物 (可点击进入详情) */
.evt-mini, .person-mini{
  background:rgba(232,152,112,.08);border:1px solid rgba(232,152,112,.25);border-radius:10px;
  padding:11px 14px;margin-bottom:7px;font-size:12.5px;line-height:1.55;color:var(--ink);cursor:pointer;
  transition:all .2s ease;
}
.evt-mini:hover, .person-mini:hover{background:rgba(232,152,112,.15);border-color:var(--warm);transform:translateX(-3px)}
.evt-mini .t, .person-mini .t{font-family:var(--serif);font-weight:700;color:var(--warm);margin-bottom:3px;font-size:13.5px}
.person-mini{border-color:rgba(122,220,240,.25);background:rgba(122,220,240,.06)}
.person-mini:hover{background:rgba(122,220,240,.14);border-color:var(--cyan)}
.person-mini .t{color:var(--cyan)}

/* 事件链条可视化 */
.chain{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.chain-row{display:flex;align-items:stretch;gap:6px}
.chain-row .chain-label{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.1em;min-width:50px;display:flex;align-items:center;font-weight:700;text-transform:uppercase}
.chain-row .chain-items{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.chain-item{
  padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.4;
  background:rgba(212,168,88,.1);border:1px solid rgba(212,168,88,.25);
  cursor:pointer;transition:all .2s ease;
}
.chain-item:hover{background:rgba(212,168,88,.22);border-color:var(--gold);transform:translateY(-1px)}
.chain-item.cause{background:rgba(232,120,120,.08);border-color:rgba(232,120,120,.3);color:#ffb0b0}
.chain-item.cause:hover{background:rgba(232,120,120,.18);border-color:#ff7878}
.chain-item.effect{background:rgba(120,200,140,.08);border-color:rgba(120,200,140,.3);color:#a8e0bc}
.chain-item.effect:hover{background:rgba(120,200,140,.18);border-color:#7ad896}
.chain-item.center{background:linear-gradient(135deg,var(--gold),var(--warm));color:#1a1410;font-weight:700;border-color:var(--gold);cursor:default}

/* 朋友圈可视化 (mini SVG 关系图) */
.friend-circle{
  background:rgba(122,220,240,.04);border:1px solid rgba(122,220,240,.2);border-radius:12px;
  padding:14px;margin-top:8px;text-align:center;
}
.friend-circle-svg{display:block;margin:0 auto 8px;max-width:100%;height:auto}
.friend-circle .legend{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.06em}
.fc-link{stroke:rgba(122,220,240,.5);stroke-width:1.5;fill:none}
.fc-link.family{stroke:rgba(232,120,216,.6)}
.fc-link.enemy{stroke:rgba(232,120,120,.6);stroke-dasharray:4 2}
.fc-link.mentor{stroke:rgba(212,168,88,.6)}
.fc-center{fill:var(--gold);filter:drop-shadow(0 0 12px rgba(212,168,88,.6))}
.fc-node{cursor:pointer;transition:transform .2s ease}
.fc-node:hover{transform:scale(1.1)}
.fc-node-bg{fill:var(--cyan);filter:drop-shadow(0 0 8px rgba(122,220,240,.5))}
.fc-name{font-family:var(--serif);font-size:10px;fill:white;text-anchor:middle;pointer-events:none;font-weight:700}
.fc-rel-label{font-family:var(--mono);font-size:8px;fill:var(--cyan);text-anchor:middle;pointer-events:none;letter-spacing:.06em}

/* 总汇模态 */
.summary-modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.summary-modal.open{display:flex}
.summary-content{background:#fdf8ed;color:#1a1410;border-radius:18px;max-width:1100px;width:100%;padding:32px;margin:auto;position:relative}
.summary-content .sh{text-align:center;margin-bottom:24px}
.summary-content h2{font-family:var(--serif);font-size:32px;font-weight:900}
.summary-content .ss{font-family:'Cinzel',serif;letter-spacing:.3em;color:#8a7050;font-size:12px;margin-top:4px;text-transform:uppercase}
.summary-content .close-x{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;background:white;border:1px solid #ccc;cursor:pointer;font-size:16px}
.gantt{display:grid;grid-template-columns:140px repeat(5,1fr) 1.6fr;background:white;border-radius:12px;overflow:hidden;border:1px solid rgba(160,100,30,.2);margin-bottom:24px}
.gh{padding:10px;background:rgba(212,168,88,.2);font-family:var(--mono);font-size:10px;font-weight:700;color:#c84820;letter-spacing:.08em;text-align:center;border-bottom:1px solid rgba(160,100,30,.2)}
.gh:first-child{text-align:left}.gh.legacy{background:rgba(200,72,32,.15)}
.gc{padding:10px;border-bottom:1px solid rgba(160,100,30,.08);min-height:48px;display:flex;align-items:center}
.gc.civ-name{font-family:var(--serif);font-weight:700;font-size:12.5px;background:rgba(245,232,200,.4)}
.gc.block{position:relative;padding:0}
.gc .bar{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border-radius:4px}
.gc .bar.peak{opacity:1}.gc .bar.rise,.gc .bar.fade{opacity:.55}
.gc.legacy-cell{font-size:11px;color:#5c4530;line-height:1.5;background:rgba(200,72,32,.04)}
.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}
.legacy-card{background:white;border:1px solid rgba(160,100,30,.18);border-radius:12px;padding:14px 16px}
.legacy-card .what{font-family:var(--serif);font-size:17px;font-weight:700;color:#c84820;margin-bottom:3px}
.legacy-card .from{font-family:var(--mono);font-size:10px;color:#d4a858;letter-spacing:.08em;margin-bottom:6px}
.legacy-card .why{font-size:12.5px;line-height:1.6;color:#5c4530}
.legacy-h{font-family:var(--serif);font-size:22px;font-weight:900;margin:24px 0 12px;text-align:center}

@media (max-width:900px){
  .detail{right:8px;left:8px;width:auto;top:auto;bottom:8px;max-height:55vh}
  .wrap{padding:14px 8px}
  .intro{padding:18px}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="./civ-explorer-compare.html" class="home">← 对比页</a>
  <h1>早期文明 · 一张全图 <em>FORM D</em></h1>
  <div class="progress" id="progress">已学 0 个文明</div>
  <button class="reset" onclick="resetAll()">↻ 重置</button>
</div>

<div class="wrap">
  <div class="intro">
    <h2>🌌 从前 3500 到前 1000 · 一张连续的历史地图</h2>
    <p>每个椭圆 = 一个 500 年时期，里面是当时活跃的文明。
    点击任何 ◯ 文明 → 看它的故事 + 事件链 + 人物朋友圈。
    同一个文明跨越多个时期 → 自动用<strong style="color:var(--gold)">金色线</strong>连接上下。
    点击下方"<strong>展开下一段 500 年 ↓</strong>"按钮，地图慢慢长出来，最后看到完整 2500 年。</p>
  </div>

  <div id="mapContainer"></div>

  <button class="summary-btn" id="summaryBtn" disabled onclick="openSummary()">🏁 看 2500 年全景总汇</button>
</div>

<aside class="detail" id="detail">
  <div class="detail-head">
    <div class="ic" id="dIc" style="background:rgba(212,168,88,.15)"></div>
    <div class="ti">
      <div class="ki" id="dKi"></div>
      <h3 id="dTitle"></h3>
    </div>
    <button class="close" onclick="closeDetail()">✕</button>
  </div>
  <div class="detail-body" id="dBody"></div>
</aside>

<div class="summary-modal" id="summary"><div class="summary-content" id="summaryContent"></div></div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
// ════════════════════════════════════════════════
// 布局
// ════════════════════════════════════════════════
const SVG_W = 1400;
const RING_H = 220;
const RING_W = 1100;
const RING_GAP = 200;
const RING_X = SVG_W/2;
const TOP_PAD = 90;
function ringCenterY(i){ return TOP_PAD + RING_H/2 + i * (RING_H + RING_GAP); }
const SVG_H = TOP_PAD + 5 * RING_H + 4 * RING_GAP + 80;

const LANE_OF = {
  sumer: 1,
  egypt_predynastic: 2, egypt_old: 2, egypt_new: 2,
  indus_early: 3, indus: 3,
  akkad: 4, babylon: 4, hittite: 4,
  minoan: 5, mycenaean: 5,
  shang: 6,
  collapse: 7,
};
const MAX_LANES = 7;
function laneX(lane){
  const padL = 220;
  const usable = RING_W - 160;
  const startX = RING_X - usable/2 + 40;
  return startX + (lane - 1) * (usable / MAX_LANES);
}

// ════════════════════════════════════════════════
// 状态
// ════════════════════════════════════════════════
let revealedChapters = 1;
const studied = new Set();

function getCivInfo(id){
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f;
  }
  const fb = {egypt_predynastic:{name:'古埃及·前王朝',icon:'🌅',color:'#d4b870'},indus_early:{name:'印度河早期',icon:'🏘',color:'#a070d4'}};
  return fb[id] || {name:id,icon:'🏛',color:'#888'};
}

// ════════════════════════════════════════════════
// 一次性渲染整张图 (后续只改 class，不重新渲染)
// ════════════════════════════════════════════════
function buildSVG(){
  // 收集所有 civ 颜色，生成 sphere 渐变 + 阴影滤镜
  const civColors = new Set();
  CHAPTERS.forEach(ch=>ch.active_civs.forEach(c=>{
    const info = getCivInfo(c.id);
    civColors.add(info.color);
  }));

  let defs = `<defs>
    <!-- 椭圆 ring 的渐变 + 光晕 -->
    <radialGradient id="ringHalo" cx="50%" cy="50%">
      <stop offset="60%" stop-color="rgba(212,168,88,0)"/>
      <stop offset="100%" stop-color="rgba(212,168,88,.15)"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,212,160,.8)"/>
      <stop offset="50%" stop-color="rgba(212,168,88,.5)"/>
      <stop offset="100%" stop-color="rgba(120,90,40,.6)"/>
    </linearGradient>
    <!-- 3D 球体阴影滤镜 -->
    <filter id="sphereDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadow"/>
      <feFlood flood-color="#000" flood-opacity=".55"/>
      <feComposite in2="shadow" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <!-- 内发光 -->
    <filter id="innerLight"><feGaussianBlur stdDeviation="2" result="b"/><feBlend in="SourceGraphic" in2="b"/></filter>`;

  // 每个 civ 颜色一个 sphere 渐变 (3D 球感)
  [...civColors].forEach(color=>{
    const id = 'sphere_' + color.replace('#','');
    defs += `<radialGradient id="${id}" cx="32%" cy="28%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,.85)"/>
      <stop offset="18%" stop-color="rgba(255,255,255,.4)"/>
      <stop offset="55%" stop-color="${color}"/>
      <stop offset="100%" stop-color="${darken(color, 0.4)}"/>
    </radialGradient>`;
  });

  defs += `</defs>`;

  let html = `<svg class="map-svg" viewBox="0 0 ${SVG_W} ${SVG_H}" preserveAspectRatio="xMidYMid meet">${defs}`;

  // 1. 传承连线 (在所有节点之下)
  for (let i=0; i<4; i++){
    const upper = CHAPTERS[i];
    const lower = CHAPTERS[i+1];
    const upperLanes = {};
    upper.active_civs.forEach(c=>{ upperLanes[LANE_OF[c.id]] = c; });
    lower.active_civs.forEach(lc=>{
      const lane = LANE_OF[lc.id];
      if (upperLanes[lane]) {
        const y1 = ringCenterY(i) + RING_H/2 - 50;
        const y2 = ringCenterY(i+1) - RING_H/2 + 50;
        const x  = laneX(lane);
        const path = `M ${x} ${y1} C ${x} ${y1+50}, ${x} ${y2-50}, ${x} ${y2}`;
        html += `<path class="carryover-line" data-upper="${i}" data-lower="${i+1}" d="${path}"/>`;
      }
    });
  }

  // 2. 每个 ring + 节点
  CHAPTERS.forEach((ch, idx)=>{
    const cy = ringCenterY(idx);
    html += `<g class="ring-group ${idx>=revealedChapters?'locked':''}" data-idx="${idx}">`;
    // 椭圆光晕 (在下面，外发光)
    html += `<ellipse cx="${RING_X}" cy="${cy}" rx="${RING_W/2 + 40}" ry="${RING_H/2 + 30}" fill="url(#ringHalo)"/>`;
    // 椭圆主体
    html += `<ellipse cx="${RING_X}" cy="${cy}" rx="${RING_W/2}" ry="${RING_H/2}" fill="rgba(212,168,88,.04)" stroke="url(#ringStroke)" stroke-width="2.5"/>`;
    // 顶部高光弧
    html += `<path d="M ${RING_X-RING_W/2+50} ${cy-RING_H/2+5} Q ${RING_X} ${cy-RING_H/2-12} ${RING_X+RING_W/2-50} ${cy-RING_H/2+5}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>`;

    // 左侧标签 (3D 浮雕)
    const labelX = 30, labelY = cy - 20;
    html += `<g filter="url(#sphereDrop)"><rect x="${labelX}" y="${labelY-26}" width="170" height="68" rx="12" fill="rgba(15,15,28,.92)" stroke="rgba(212,168,88,.45)" stroke-width="1.5"/></g>`;
    html += `<text x="${labelX+14}" y="${labelY-6}" font-family="var(--mono)" font-size="10" fill="var(--ink2)" letter-spacing=".1em">CHAPTER ${ch.no}</text>`;
    html += `<text x="${labelX+14}" y="${labelY+13}" font-family="var(--serif)" font-size="15" font-weight="900" fill="var(--gold)">${ch.title}</text>`;
    html += `<text x="${labelX+14}" y="${labelY+30}" font-family="var(--mono)" font-size="10" fill="var(--ink2)" letter-spacing=".1em">${ch.range}</text>`;

    // civ 节点
    ch.active_civs.forEach(cv=>{
      const lane = LANE_OF[cv.id] || 1;
      const x = laneX(lane);
      const y = cy;
      const info = getCivInfo(cv.id);
      const sphereId = 'sphere_' + info.color.replace('#','');
      const stateCls = cv.state==='巅峰'?'peak': (cv.state==='崩溃'||cv.state==='集体崩溃'?'collapse': (cv.state==='衰落'?'fade':'rise'));
      const stateColor = cv.state==='巅峰'?'#7ad896': (cv.state.includes('崩溃')?'#ff7878': (cv.state==='衰落'?'#a8b0c8':'#d4a858'));

      html += `<g class="civ-dot" data-ch="${idx}" data-id="${cv.id}" transform="translate(${x},${y})" style="color:${info.color}">
        <!-- 外光晕 -->
        <circle r="46" fill="${info.color}" opacity=".10"/>
        <circle r="36" fill="${info.color}" opacity=".18"/>
        <!-- 3D 球体 -->
        <g filter="url(#sphereDrop)">
          <circle class="civ-circle" r="30" fill="url(#${sphereId})" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        </g>
        <!-- 顶部高光小椭圆 (玻璃质感) -->
        <ellipse cx="-7" cy="-12" rx="11" ry="5" fill="rgba(255,255,255,.55)" transform="rotate(-25 -7 -12)"/>
        <!-- 图标 -->
        <text text-anchor="middle" dominant-baseline="central" font-size="24" style="pointer-events:none">${info.icon}</text>
        <!-- 名字 -->
        <text class="civ-label" y="52" font-size="12">${info.name}</text>
        <text class="civ-state" y="68" font-size="9.5" fill="${stateColor}">${cv.state}</text>
        <!-- 学过标记 (默认 opacity 0) -->
        <g class="studied-mark" transform="translate(22,-22)">
          <circle r="10" fill="#7ad896" stroke="white" stroke-width="2" filter="url(#sphereDrop)"/>
          <text y="0" text-anchor="middle" dominant-baseline="central" font-family="var(--mono)" font-size="11" font-weight="700" fill="white">✓</text>
        </g>
      </g>`;
    });
    html += `</g>`;

    // 下一段按钮
    if (idx < CHAPTERS.length-1) {
      const btnY = cy + RING_H/2 + RING_GAP/2;
      const isActive = (idx + 1 === revealedChapters);
      html += `<g class="reveal-btn-group ${isActive?'':'hidden'}" data-idx="${idx+1}" onclick="revealNext()">
        <rect class="reveal-btn-bg" x="${RING_X-150}" y="${btnY-24}" width="300" height="48" rx="24" filter="url(#sphereDrop)"/>
        <text class="reveal-btn-text" x="${RING_X}" y="${btnY}">⤓ 展开下一段 500 年 ↓</text>
      </g>`;
    }
  });

  html += `</svg>`;
  document.getElementById('mapContainer').innerHTML = html;

  // 一次性绑定
  document.querySelectorAll('.civ-dot').forEach(el=>{
    el.addEventListener('click', ()=>{
      onCivClick(parseInt(el.dataset.ch), el.dataset.id);
    });
  });

  updateCarryoverVisibility();
  updateProgress();
}

// ════════════════════════════════════════════════
// 状态变更 (不重新渲染 SVG, 只改 class)
// ════════════════════════════════════════════════
function onCivClick(chIdx, civId){
  const nodeId = `${chIdx}:${civId}`;
  studied.add(nodeId);
  // 只更新一个节点
  const el = document.querySelector(`.civ-dot[data-ch="${chIdx}"][data-id="${civId}"]`);
  if (el) el.classList.add('studied');
  updateProgress();
  showDetail(chIdx, civId);
}

function updateCarryoverVisibility(){
  // 连线只在上下两个 ring 都展开时才显示
  document.querySelectorAll('.carryover-line').forEach(l=>{
    const lower = parseInt(l.dataset.lower);
    if (lower < revealedChapters) l.classList.add('visible');
    else l.classList.remove('visible');
  });
}

function revealNext(){
  if (revealedChapters >= 5) return;
  // 取消旧按钮高亮
  const oldBtn = document.querySelector(`.reveal-btn-group[data-idx="${revealedChapters}"]`);
  if (oldBtn) oldBtn.classList.add('hidden');
  // 解锁下一个 ring
  revealedChapters++;
  const ringEl = document.querySelector(`.ring-group[data-idx="${revealedChapters-1}"]`);
  if (ringEl) ringEl.classList.remove('locked');
  // 显示新按钮
  if (revealedChapters < 5) {
    const newBtn = document.querySelector(`.reveal-btn-group[data-idx="${revealedChapters}"]`);
    if (newBtn) newBtn.classList.remove('hidden');
  }
  updateCarryoverVisibility();
  updateProgress();
  // 平滑滚动到新 ring
  setTimeout(()=>{
    ringEl?.scrollIntoView({behavior:'smooth', block:'center'});
  }, 200);
}

function resetAll(){
  revealedChapters = 1;
  studied.clear();
  closeDetail();
  // 重置所有节点状态
  document.querySelectorAll('.civ-dot.studied').forEach(el=>el.classList.remove('studied'));
  document.querySelectorAll('.ring-group').forEach(el=>{
    const idx = parseInt(el.dataset.idx);
    el.classList.toggle('locked', idx >= 1);
  });
  document.querySelectorAll('.reveal-btn-group').forEach(el=>{
    el.classList.toggle('hidden', parseInt(el.dataset.idx) !== 1);
  });
  updateCarryoverVisibility();
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateProgress(){
  document.getElementById('progress').textContent = `已学 ${studied.size} 个 · ${revealedChapters}/5 段已展开`;
  document.getElementById('summaryBtn').disabled = (revealedChapters < 5);
}

// ════════════════════════════════════════════════
// 详情 · 文明
// ════════════════════════════════════════════════
function showDetail(chIdx, civId){
  const ch = CHAPTERS[chIdx];
  const cv = ch.active_civs.find(c=>c.id===civId);
  if (!cv) return;
  const info = getCivInfo(civId);

  document.getElementById('detail').classList.add('open');
  document.getElementById('dIc').textContent = info.icon;
  document.getElementById('dIc').style.background = info.color;
  document.getElementById('dKi').textContent = `第 ${ch.no} 章 · ${ch.range} BCE`;
  document.getElementById('dTitle').textContent = info.name;

  const events = (cv.L3_events||[]).map(eid => ({id:eid, deep:EVENT_DEEP?.[eid]}));
  const people = (cv.L4_people||[]).map(pid => ({id:pid, deep:PERSON_DEEP?.[pid]}));

  document.getElementById('dBody').innerHTML = `
    <div class="detail-meta">
      <span class="state">${cv.state}</span>
      <span>${ch.range}</span>
      <span>${info.region||''}</span>
    </div>
    <div class="detail-q">💡 ${cv.L1||''}</div>
    <div class="detail-section">
      <div class="h">📖 这一期在干什么</div>
      <div class="b">${cv.L2||cv.in_period_summary||''}</div>
    </div>
    ${events.length?`<div class="detail-section">
      <div class="h">📅 关键事件 · ${events.length} 个 · 点击看详情</div>
      ${events.map(e=>e.deep?`<div class="evt-mini" onclick="showEventDetail('${e.id}')"><div class="t">${e.deep.full_title}</div>${e.deep.one_liner||''}</div>`:`<div class="evt-mini" style="cursor:default;opacity:.6"><div class="t">${e.id}</div>深度叙事待补</div>`).join('')}
    </div>`:''}
    ${people.length?`<div class="detail-section">
      <div class="h">👤 关键人物 · ${people.length} 个 · 点击看朋友圈</div>
      ${people.map(p=>p.deep?`<div class="person-mini" onclick="showPersonDetail('${p.id}')"><div class="t">${p.deep.full_name}</div>${(p.deep.biography||'').slice(0,120).trim()}...</div>`:`<div class="person-mini" style="cursor:default;opacity:.6"><div class="t">${p.id}</div>传记待补</div>`).join('')}
    </div>`:''}
    ${cv.L5_full && civId==='sumer' && CIV_DEEP?.sumer ? `<div class="detail-section">
      <div class="h">📜 完整文明叙事</div>
      <div class="detail-narrative">${CIV_DEEP.sumer.opening_narrative.trim().split(/\n\s*\n/).slice(0,2).map(p=>'<p>'+p.trim()+'</p>').join('')}</div>
    </div>`:''}
  `;
}

// ════════════════════════════════════════════════
// 详情 · 事件 + 事件链
// ════════════════════════════════════════════════
function showEventDetail(eid){
  const e = EVENT_DEEP?.[eid];
  if (!e) return;
  document.getElementById('detail').classList.add('open');
  document.getElementById('dIc').textContent = '📅';
  document.getElementById('dIc').style.background = 'rgba(232,152,112,.25)';
  document.getElementById('dKi').textContent = '历史事件';
  document.getElementById('dTitle').textContent = e.full_title;

  // 事件链：起因 → 此事件 → 后果
  const causes = parseChainText(e.context_before);
  const effects = parseChainText(e.leads_to);

  document.getElementById('dBody').innerHTML = `
    <div class="detail-q">💡 ${e.one_liner||''}</div>
    <div class="detail-section">
      <div class="h">🔗 事件链条</div>
      <div class="chain">
        ${causes.length?`<div class="chain-row"><span class="chain-label">起因</span><div class="chain-items">${causes.map(c=>`<div class="chain-item cause">${c}</div>`).join('')}</div></div>`:''}
        <div class="chain-row"><span class="chain-label">此事件</span><div class="chain-items"><div class="chain-item center">${e.full_title}</div></div></div>
        ${effects.length?`<div class="chain-row"><span class="chain-label">导致</span><div class="chain-items">${effects.map(c=>`<div class="chain-item effect">${c}</div>`).join('')}</div></div>`:''}
      </div>
    </div>
    <div class="detail-section">
      <div class="h">📖 事件叙事</div>
      <div class="detail-narrative">${e.narrative.trim().split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('')}</div>
    </div>
    ${e.what_happened?`<div class="detail-section">
      <div class="h">📅 时间线</div>
      ${e.what_happened.map(t=>`<div class="evt-mini" style="cursor:default">${t}</div>`).join('')}
    </div>`:''}
    ${e.significance?`<div class="detail-section">
      <div class="h">🎯 历史意义</div>
      <div class="b">${e.significance}</div>
    </div>`:''}
    ${e.evidence?`<div class="detail-section">
      <div class="h">🏺 考古证据</div>
      ${e.evidence.map(ev=>`<div class="evt-mini" style="cursor:default;border-color:rgba(212,168,88,.3);background:rgba(212,168,88,.06)"><div class="t" style="color:var(--gold)">${ev.artifact}</div>${ev.what}<div style="margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--ink3)">📍 ${ev.held}</div></div>`).join('')}
    </div>`:''}
  `;
}

function parseChainText(text){
  if (!text) return [];
  // 把 "A → B → C" 或 "A; B; C" 或简单文字拆成短句
  return text.split(/→|;|；/).map(s=>s.trim()).filter(s=>s.length>0 && s.length<60).slice(0,4);
}

// ════════════════════════════════════════════════
// 详情 · 人物 + 朋友圈

function showPersonDetail(pid){
  const p = PERSON_DEEP?.[pid];

    </div>`:''}

      <div class="h">🌟 历史遗产</div>
      <div class="b">${p.legacy.trim().split(/\n\s*\n/)[0]}</div>
    </div>`:''}
  `;
}

function renderFriendCircle(pid, p){
  if (!p.related || p.related.length===0) return '';
  // 同时也找出所有指向这个人的人
  const incoming = [];
  Object.entries(PERSON_DEEP||{}).forEach(([otherId, other])=>{
    if (otherId === pid) return;
    (other.related||[]).forEach(r=>{
      if (r.id === pid && !p.related.find(x=>x.id===otherId)) {
        incoming.push({id: otherId, relation: r.relation, note: r.note});
      }
    });
  });
  const allRelations = [...p.related, ...incoming];
  if (allRelations.length === 0) return '';

  const W = 360, H = 220;
  const cx = W/2, cy = H/2;
  const r = 70;
  const n = allRelations.length;
  let svg = `<svg class="friend-circle-svg" viewBox="0 0 ${W} ${H}">`;
  // 关系连线先画
  allRelations.forEach((rel, i)=>{
    const angle = -Math.PI/2 + (i - (n-1)/2) * (Math.PI*1.2/Math.max(n,1));
    const x = cx + Math.cos(angle)*r;
    const y = cy + Math.sin(angle)*r;
    const relCls = rel.relation==='家人'||rel.relation==='妻子'||rel.relation==='丈夫'||rel.relation==='母亲'?'family':
                   rel.relation==='敌人'?'enemy':
                   rel.relation==='师承'||rel.relation==='宰相'||rel.relation==='主君'?'mentor':'';
    svg += `<line class="fc-link ${relCls}" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    svg += `<text class="fc-rel-label" x="${(cx+x)/2}" y="${(cy+y)/2 - 4}">${rel.relation}</text>`;
  });
  // 中心人物
  svg += `<g><circle class="fc-center" cx="${cx}" cy="${cy}" r="20"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1a1410" font-weight="900">👤</text></g>`;
  svg += `<text x="${cx}" y="${cy+34}" text-anchor="middle" font-family="var(--serif)" font-size="11" font-weight="700" fill="var(--gold)">${(p.full_name||pid).split(' ')[0]}</text>`;
  // 关系人节点
  allRelations.forEach((rel, i)=>{
    const angle = -Math.PI/2 + (i - (n-1)/2) * (Math.PI*1.2/Math.max(n,1));
    const x = cx + Math.cos(angle)*r;
    const y = cy + Math.sin(angle)*r;
    const otherP = PERSON_DEEP?.[rel.id];
    const otherName = (otherP?.full_name || rel.id).split(' ')[0];
    svg += `<g class="fc-node" onclick="showPersonDetail('${rel.id}')">`;
    svg += `<circle class="fc-node-bg" cx="${x}" cy="${y}" r="16"/>`;
    svg += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="12" style="pointer-events:none">👤</text>`;
    svg += `<text class="fc-name" x="${x}" y="${y+28}">${otherName}</text>`;
    svg += `</g>`;
  });
  svg += `</svg>`;
  return svg;
}

function closeDetail(){ document.getElementById('detail').classList.remove('open'); }

// 工具：颜色变暗
function darken(hex, amount){
  const c = hex.replace('#','');
  const r = Math.max(0, parseInt(c.slice(0,2),16) - Math.round(255*amount));
  const g = Math.max(0, parseInt(c.slice(2,4),16) - Math.round(255*amount));
  const b = Math.max(0, parseInt(c.slice(4,6),16) - Math.round(255*amount));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
