<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>历史宇宙 · 早期文明时间网络</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#02030a; --ink:#f0e8d5; --ink2:#a8b0c8; --ink3:#5a6080;
  --gold:#d4a858; --warm:#e89870; --vermilion:#c84820;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif;
  --mono:'JetBrains Mono',monospace; --latin:'Cinzel',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}

/* 宇宙背景 */
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 40% 50% at 12% 18%, rgba(120,90,200,.25) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 88% 82%, rgba(200,120,60,.2) 0%, transparent 60%),
    radial-gradient(ellipse 30% 30% at 72% 28%, rgba(80,140,200,.13) 0%, transparent 50%),
    radial-gradient(ellipse 30% 30% at 28% 72%, rgba(60,180,140,.1) 0%, transparent 50%),
    linear-gradient(180deg, #02030a 0%, #050818 50%, #02030a 100%);
}
.stars-back{position:absolute;inset:0;opacity:.35;
  background-image:
    radial-gradient(1px 1px at 5% 12%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 15% 25%,#fff,transparent),
    radial-gradient(.8px .8px at 28% 8%,#ffd47a,transparent),
    radial-gradient(1px 1px at 42% 18%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 55% 32%,#fff,transparent),
    radial-gradient(1px 1px at 68% 11%,#c8d4ff,transparent),
    radial-gradient(1.2px 1.2px at 82% 24%,#fff,transparent),
    radial-gradient(.9px .9px at 95% 16%,#ffd47a,transparent),
    radial-gradient(1px 1px at 8% 45%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 22% 58%,#fff,transparent),
    radial-gradient(1px 1px at 38% 65%,#c8d4ff,transparent),
    radial-gradient(1px 1px at 65% 48%,#ffd47a,transparent),
    radial-gradient(1.2px 1.2px at 78% 64%,#fff,transparent),
    radial-gradient(.8px .8px at 92% 52%,#fff,transparent),
    radial-gradient(1px 1px at 12% 88%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 28% 82%,#c8d4ff,transparent),
    radial-gradient(1px 1px at 45% 95%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 62% 88%,#ffd47a,transparent),
    radial-gradient(.9px .9px at 78% 92%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 91% 85%,#fff,transparent);
}
/* 闪烁层用透明度动画，且 will-change 避免重排 */
.stars-front{position:absolute;inset:0;opacity:.4;animation:twinkle 11s ease-in-out infinite;will-change:opacity;
  background-image:
    radial-gradient(2px 2px at 18% 18%,#fff,transparent 40%),
    radial-gradient(2.5px 2.5px at 42% 28%,#ffd47a,transparent 40%),
    radial-gradient(2px 2px at 72% 38%,#fff,transparent 40%),
    radial-gradient(2.2px 2.2px at 92% 12%,#c8d4ff,transparent 40%),
    radial-gradient(2px 2px at 22% 55%,#fff,transparent 40%),
    radial-gradient(2.4px 2.4px at 58% 68%,#ffd47a,transparent 40%),
    radial-gradient(2px 2px at 82% 78%,#fff,transparent 40%),
    radial-gradient(2.3px 2.3px at 15% 82%,#fff,transparent 40%);
}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:.25}}

/* 顶栏 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;padding:16px 26px;display:flex;align-items:center;gap:16px;pointer-events:none;flex-wrap:wrap}
.topbar > *{pointer-events:auto}
.topbar .home{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.18em;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);padding:8px 14px;border-radius:99px;border:1px solid rgba(212,168,88,.25);transition:all .2s}
.topbar .home:hover{background:var(--gold);color:#02030a}
.topbar h1{font-family:var(--serif);font-size:17px;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.topbar h1 em{color:var(--gold);font-style:normal;font-family:var(--latin);margin-right:10px;letter-spacing:.16em;font-size:13px}
.topbar .hint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.08em;text-align:right;line-height:1.5}
.topbar .hint strong{color:var(--gold)}

/* 图例 */
.legend{position:fixed;bottom:18px;left:24px;z-index:25;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);border:1px solid rgba(212,168,88,.22);border-radius:14px;padding:12px 16px}
.legend .ti{font-family:var(--mono);font-size:9.5px;color:var(--gold);letter-spacing:.16em;margin-bottom:7px;text-transform:uppercase;font-weight:700}
.legend .items{display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.04em;flex-wrap:wrap}
.legend .items span{display:flex;align-items:center;gap:6px}
.legend .items span::before{content:'';width:18px;height:8px;border-radius:2px;flex-shrink:0}
.legend .rise::before{background:linear-gradient(90deg,transparent,currentColor);color:#7a8aa8}
.legend .peak::before{background:#7ad896}
.legend .fall::before{background:linear-gradient(90deg,currentColor,transparent);color:#c87850}

/* 主画布 */
.canvas-svg{position:fixed;inset:0;width:100%;height:100%;z-index:10}

/* 时间网格 */
.grid-line{stroke:rgba(212,168,88,.1);stroke-width:1}
.grid-label{font-family:var(--mono);fill:rgba(240,210,150,.85);font-size:16px;text-anchor:middle;letter-spacing:.08em;font-weight:700}
.region-label{font-family:var(--mono);fill:rgba(240,200,130,.72);font-size:13.5px;text-anchor:start;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.region-divider{stroke:rgba(212,168,88,.05);stroke-width:1}

/* 文明行 (跨度条 + 球) */
.civ-row{cursor:pointer}
.civ-span{transition:opacity .25s ease, filter .25s ease;rx:7}
.civ-row:hover .civ-span{filter:brightness(1.25) drop-shadow(0 0 12px currentColor)}
/* 关键修复：缩放放在内层 g，绕中心(0,0)缩放，不覆盖外层 translate */
.orb-inner{transition:transform .3s cubic-bezier(.4,1,.6,1);transform-box:fill-box;transform-origin:center}
.civ-row:hover .orb-inner{transform:scale(1.15)}
.civ-orb-body{filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.civ-name{font-family:var(--serif);font-weight:700;fill:#fff;text-shadow:0 2px 8px rgba(0,0,0,.95);dominant-baseline:central}
.civ-state{font-family:var(--mono);fill:rgba(200,208,228,.9);letter-spacing:.04em;dominant-baseline:central}
.civ-years{font-family:var(--mono);fill:rgba(240,200,130,.8);font-size:11.5px;dominant-baseline:central}

/* 关系连线 */
.relation-path{fill:none;stroke-width:1.5;opacity:.0;transition:opacity .3s ease;pointer-events:none}
.relation-path.visible{opacity:.55}
.relation-path.war{stroke:#ff7878}
.relation-path.trade{stroke:#7ad896;stroke-dasharray:5 3}
.relation-path.influence{stroke:#a070ff;stroke-dasharray:7 3}
.relation-path.continuation{stroke:#d4a858}
.relation-path.destruction{stroke:#ff4040;stroke-dasharray:3 3}

/* 崩溃竖线 */
.collapse-line{stroke:#ff4040;stroke-width:2;stroke-dasharray:4 4;opacity:.5}
.collapse-label{font-family:var(--mono);fill:#ff9090;font-size:13px;text-anchor:middle;letter-spacing:.06em;font-weight:700}

/* tooltip */
.tooltip{position:fixed;z-index:50;background:rgba(15,15,28,.96);backdrop-filter:blur(20px);border:1px solid rgba(212,168,88,.35);border-radius:12px;padding:13px 16px;max-width:320px;display:none;pointer-events:none;box-shadow:0 12px 36px rgba(0,0,0,.7)}
.tooltip.show{display:block}
.tooltip .nm{font-family:var(--serif);font-size:15px;font-weight:900;color:var(--gold);margin-bottom:3px}
.tooltip .yr{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.06em;margin-bottom:7px}
.tooltip .desc{font-size:12px;line-height:1.6;color:var(--ink);margin-bottom:7px}
.tooltip .coexist{font-size:11px;line-height:1.6;color:var(--warm);margin-bottom:7px}
.tooltip .coexist b{color:var(--gold)}
.tooltip .cta{font-family:var(--mono);font-size:9.5px;color:var(--vermilion);letter-spacing:.12em;font-weight:700}

/* 总汇 */
.summary-btn{position:fixed;bottom:18px;right:24px;z-index:25;background:linear-gradient(135deg,var(--gold),var(--vermilion));color:white;border:none;padding:13px 22px;border-radius:99px;cursor:pointer;font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.04em;box-shadow:0 8px 24px rgba(212,168,88,.5);transition:transform .2s}
.summary-btn:hover{transform:translateY(-3px)}
.map-btn{position:fixed;bottom:18px;right:200px;z-index:25;background:linear-gradient(135deg,#3a8868,#2a6850);color:white;border:none;padding:13px 22px;border-radius:99px;cursor:pointer;font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.04em;box-shadow:0 8px 24px rgba(58,136,104,.5);transition:transform .2s}
.map-btn:hover{transform:translateY(-3px)}
.map-legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#5c4530;font-family:'Noto Sans SC',sans-serif;cursor:pointer;padding:3px 8px;border-radius:99px;border:1px solid rgba(184,136,48,.25)}
.map-legend-item:hover{background:rgba(184,136,48,.1)}
.map-legend-item .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;flex-shrink:0}
.world-tip{background:rgba(44,26,8,.88)!important;color:#fff!important;border:none!important;border-radius:4px!important;font-size:10px!important;padding:1px 6px!important;box-shadow:0 2px 5px rgba(0,0,0,.4)!important}
.world-tip::before{display:none!important}
.leaflet-popup-content{font-family:'Noto Sans SC',sans-serif;font-size:12.5px;line-height:1.6}
.leaflet-popup-content b{color:#c84820}
.leaflet-popup-content a{color:#2a6850;font-weight:700;text-decoration:none}
@media(max-width:768px){.map-btn{right:auto;left:14px;bottom:70px}}
.summary-modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.summary-modal.open{display:flex}
.summary-content{background:#fdf8ed;color:#1a1410;border-radius:18px;max-width:1100px;width:100%;padding:32px;margin:auto;position:relative}
.summary-content .sh{text-align:center;margin-bottom:24px}
.summary-content h2{font-family:var(--serif);font-size:30px;font-weight:900}
.summary-content .ss{font-family:var(--mono);letter-spacing:.3em;color:#d4a858;font-size:11px;margin-top:4px;text-transform:uppercase}
.summary-content .close-x{position:absolute;top:24px;right:24px;width:38px;height:38px;border-radius:50%;background:#fbf6e9;border:1px solid rgba(184,136,48,.3);cursor:pointer;font-size:14px}
.gantt{display:grid;grid-template-columns:140px repeat(5,1fr) 1.6fr;background:#fbf6e9;border-radius:12px;overflow:hidden;border:1px solid rgba(184,136,48,.25);margin-bottom:24px}
.gh{padding:10px;background:rgba(184,136,48,.2);font-family:var(--mono);font-size:10px;font-weight:700;color:#c84820;letter-spacing:.08em;text-align:center;border-bottom:1px solid rgba(184,136,48,.2)}
.gh:first-child{text-align:left}.gh.legacy{background:rgba(200,72,32,.15)}
.gc{padding:10px;border-bottom:1px solid rgba(184,136,48,.08);min-height:48px;display:flex;align-items:center;background:white}
.gc.civ-name{font-family:var(--serif);font-weight:700;font-size:12.5px;background:rgba(184,136,48,.05);cursor:pointer}
.gc.civ-name:hover{background:rgba(184,136,48,.15);color:#c84820}
.gc.block{position:relative;padding:0}
.gc .bar{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border-radius:4px}
.gc .bar.peak{opacity:1}.gc .bar.rise,.gc .bar.fade{opacity:.55}
.gc.legacy-cell{font-size:11px;color:#5c4530;line-height:1.5;background:rgba(200,72,32,.04)}
.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}
.legacy-card{background:#fbf6e9;border:1px solid rgba(184,136,48,.22);border-radius:12px;padding:14px 16px}
.legacy-card .what{font-family:var(--serif);font-size:17px;font-weight:700;color:#c84820;margin-bottom:3px}
.legacy-card .from{font-family:var(--mono);font-size:10px;color:#d4a858;letter-spacing:.08em;margin-bottom:6px}
.legacy-card .why{font-size:12.5px;line-height:1.6;color:#5c4530}
.legacy-h{font-family:var(--serif);font-size:22px;font-weight:900;margin:24px 0 12px;text-align:center}

@media (max-width:768px){.topbar h1{font-size:13px}.topbar .hint{display:none}.ai-panel{right:8px!important;left:8px!important;width:auto!important}}

/* AI 浮动按钮 + 面板 */
.ai-fab{position:fixed;right:24px;bottom:78px;z-index:45;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--vermilion));color:white;font-size:26px;box-shadow:0 8px 24px rgba(212,168,88,.5);transition:transform .2s}
.ai-fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;right:24px;bottom:148px;z-index:46;width:380px;max-width:calc(100vw - 48px);height:500px;max-height:calc(100vh - 200px);background:rgba(15,15,28,.97);backdrop-filter:blur(24px);border:1px solid rgba(212,168,88,.4);border-radius:16px;display:none;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.ai-panel.open{display:flex}
.ai-panel .pnl-head{padding:14px 16px;border-bottom:1px solid rgba(212,168,88,.25);display:flex;align-items:center;gap:8px}
.ai-panel .pnl-head h4{font-family:var(--serif);font-size:15px;color:var(--gold);flex:1;font-weight:700}
.ai-panel .pnl-head button{width:30px;height:30px;border-radius:7px;border:1px solid rgba(212,168,88,.3);background:transparent;cursor:pointer;color:var(--ink2);font-size:13px}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.7;max-width:90%}
.ai-msg.user{align-self:flex-end;background:var(--gold);color:#1a1410;border-bottom-right-radius:4px}
.ai-msg.bot{align-self:flex-start;background:rgba(212,168,88,.1);color:var(--ink);border:1px solid rgba(212,168,88,.2);border-bottom-left-radius:4px}
.ai-msg.bot .cursor{display:inline-block;width:6px;height:14px;background:var(--gold);margin-left:2px;animation:blink 1s steps(2) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.ai-form{padding:10px 12px;border-top:1px solid rgba(212,168,88,.25);display:flex;gap:8px}
.ai-form input{flex:1;min-height:42px;padding:0 12px;border-radius:8px;border:1px solid rgba(212,168,88,.3);background:rgba(0,0,0,.3);color:var(--ink);font-family:inherit;font-size:13px}
.ai-form input:focus{outline:none;border-color:var(--gold)}
.ai-form button{min-width:56px;border-radius:8px;border:none;background:var(--gold);color:#1a1410;font-weight:700;cursor:pointer}
.ai-form button:disabled{opacity:.5}
</style>
</head>
<body>

<div class="cosmos">
  <div class="nebula"></div>
  <div class="stars-back"></div>
  <div class="stars-front"></div>
</div>

<div class="topbar">
  <a href="./civ-explorer-compare.html" class="home">⌂ 首页</a>
  <h1><em>COSMIC TIMELINE</em>历史宇宙 · 文明时间网络</h1>
  <div class="hint"><strong>横轴 = 时间</strong>，光条 = 文明存续跨度<br/>悬浮看同期文明 · 点击进入它的小宇宙</div>
</div>

<svg class="canvas-svg" id="canvas" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>

<div class="legend">
  <div class="ti">光条读法 · HOW TO READ</div>
  <div class="items">
    <span class="rise">崛起期</span>
    <span class="peak">巅峰期</span>
    <span class="fall">衰落期</span>
    <span style="color:#ff7878">┊ 青铜崩溃</span>
  </div>
</div>

<button class="summary-btn" onclick="openSummary()">🏁 全景总汇表</button>
<button class="map-btn" onclick="openWorldMap()">🗺 文明总地图</button>

<div class="summary-modal" id="worldMapModal">
  <div class="summary-content" style="max-width:1200px;padding:24px">
    <button class="close-x" onclick="closeWorldMap()">✕</button>
    <div class="sh"><h2>🗺 早期文明总地图</h2><div class="ss">前 3500 – 前 1000 BCE · 所有遗址</div></div>
    <div id="worldMap" style="height:62vh;min-height:420px;border-radius:12px;overflow:hidden;border:1px solid rgba(184,136,48,.3);background:#dfe8ee"></div>
    <div id="worldMapLegend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px"></div>
  </div>
</div>

<button class="ai-fab" id="aiFab" title="AI 助手" onclick="toggleAI()">🤖</button>
<div class="ai-panel" id="aiPanel">
  <div class="pnl-head">
    <h4>🤖 文明实验室 AI</h4>
    <button onclick="toggleAI()">✕</button>
  </div>
  <div class="ai-msgs" id="aiMsgs">
    <div class="ai-msg bot">你好！我是文明实验室 AI。问我任何关于前 3500–1000 年早期文明的问题，比如「为什么文明先在两河流域出现？」</div>
  </div>
  <form class="ai-form" id="aiForm">
    <input type="text" id="aiInput" placeholder="问我任何问题..." autocomplete="off"/>
    <button type="submit" id="aiSend">发送</button>
  </form>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="summary-modal" id="summary"><div class="summary-content" id="summaryContent"></div></div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
const W = 1600, H = 900;
const PAD_L = 220, PAD_R = 280, PAD_TOP = 120, PAD_BOT = 90;
const Y0 = -3600, Y1 = -950; // 时间范围
function yearToX(y){ return PAD_L + ((y - Y0)/(Y1 - Y0)) * (W - PAD_L - PAD_R); }

// ── 真实时间数据 (start / peak / end) ──
const REGIONS = [
  {key:'mesopotamia', name:'MES 美索不达米亚', civs:[
    {id:'sumer',   name:'苏美尔',       start:-3500, peak:-2700, end:-2004, state:'文明开创者'},
    {id:'akkad',   name:'阿卡德帝国',   start:-2334, peak:-2300, end:-2154, state:'人类第一帝国'},
    {id:'babylon', name:'古巴比伦',     start:-1894, peak:-1750, end:-1595, state:'汉谟拉比法典'},
  ]},
  {key:'egypt', name:'NIL 尼罗河', civs:[
    {id:'egypt_predynastic', name:'埃及·前王朝', start:-3500, peak:-3200, end:-3100, state:'统一前夜'},
    {id:'egypt_old',         name:'埃及·古王国', start:-2686, peak:-2560, end:-2181, state:'金字塔时代'},
    {id:'egypt_new',         name:'埃及·新王国', start:-1550, peak:-1279, end:-1077, state:'帝国巅峰'},
  ]},
  {key:'indus', name:'IND 印度河', civs:[
    {id:'indus_early', name:'印度河·早期', start:-3300, peak:-2900, end:-2600, state:'城镇萌芽'},
    {id:'indus',       name:'印度河文明', start:-2600, peak:-2500, end:-1900, state:'城市规划巅峰'},
  ]},
  {key:'aegean', name:'EGE 爱琴海', civs:[
    {id:'minoan',    name:'米诺斯',  start:-2700, peak:-1700, end:-1450, state:'欧洲第一文明'},
    {id:'mycenaean', name:'迈锡尼',  start:-1750, peak:-1300, end:-1050, state:'荷马史诗背景'},
  ]},
  {key:'anatolia', name:'ANA 安纳托利亚', civs:[
    {id:'hittite', name:'赫梯帝国', start:-1650, peak:-1274, end:-1180, state:'铁器+战车'},
  ]},
  {key:'china', name:'YEL 黄河·中国', civs:[
    {id:'shang', name:'商朝', start:-1600, peak:-1250, end:-1046, state:'甲骨文+青铜'},
  ]},
];

const ALL_CIVS = REGIONS.flatMap(r=>r.civs.map(c=>({...c, region:r.key})));

// 关系连线
const RELATIONS = [
  {from:'akkad', to:'sumer', type:'war'},
  {from:'babylon', to:'akkad', type:'continuation'},
  {from:'babylon', to:'sumer', type:'influence'},
  {from:'sumer', to:'indus', type:'trade'},
  {from:'egypt_predynastic', to:'egypt_old', type:'continuation'},
  {from:'egypt_old', to:'egypt_new', type:'continuation'},
  {from:'indus_early', to:'indus', type:'continuation'},
  {from:'hittite', to:'egypt_new', type:'war'},
  {from:'mycenaean', to:'minoan', type:'war'},
  {from:'mycenaean', to:'hittite', type:'trade'},
];

function getCivColor(id){
  const fb = {egypt_predynastic:'#d4b870', indus_early:'#a070d4'};
  if (fb[id]) return fb[id];
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f.color;
  }
  return '#888';
}
function getCivIcon(id){
  const fb = {egypt_predynastic:'🌅', indus_early:'🏘'};
  if (fb[id]) return fb[id];
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f.icon;
  }
  return '🏛';
}
function darken(hex, amt){
  if (!hex||!hex.startsWith('#')) return '#444';
  const c=hex.replace('#','');
  const r=Math.max(0,parseInt(c.slice(0,2),16)-Math.round(255*amt));
  const g=Math.max(0,parseInt(c.slice(2,4),16)-Math.round(255*amt));
  const b=Math.max(0,parseInt(c.slice(4,6),16)-Math.round(255*amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// 计算每行 y
const ROW_H = 54, REGION_GAP = 16;
const totalRows = ALL_CIVS.length;
const totalRegionGaps = REGIONS.length - 1;
const blockH = totalRows*ROW_H + totalRegionGaps*REGION_GAP;
const startY = PAD_TOP + (H - PAD_TOP - PAD_BOT - blockH)/2 + ROW_H/2;
let yCursor = startY;
const ROW_Y = {};
REGIONS.forEach((reg, ri)=>{
  reg._labelY = yCursor - ROW_H/2 + 4;
  reg.civs.forEach(c=>{ ROW_Y[c.id] = yCursor; yCursor += ROW_H; });
  yCursor += REGION_GAP;
});

function render(){
  let svg = `<defs>
    ${ALL_CIVS.map(c=>{
      const color = getCivColor(c.id);
      return `<radialGradient id="orb_${c.id}" cx="35%" cy="30%">
        <stop offset="0%" stop-color="rgba(255,255,255,.92)"/>
        <stop offset="30%" stop-color="${color}"/>
        <stop offset="100%" stop-color="${darken(color,0.5)}"/>
      </radialGradient>
      <linearGradient id="span_${c.id}" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.15"/>
        <stop offset="${spanPct(c,'peak')}%" stop-color="${color}" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.1"/>
      </linearGradient>`;
    }).join('')}
    <filter id="orbShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>`;

  // 时间网格竖线
  for (let y=-3500; y>=-1000; y+=500){
    const x = yearToX(y);
    svg += `<line class="grid-line" x1="${x}" y1="${PAD_TOP-10}" x2="${x}" y2="${H-PAD_BOT+10}"/>`;
    svg += `<text class="grid-label" x="${x}" y="${PAD_TOP-22}">前 ${Math.abs(y)}</text>`;
  }

  // 区域标签 + 分隔
  REGIONS.forEach((reg,ri)=>{
    svg += `<text class="region-label" x="26" y="${reg._labelY}">${reg.name}</text>`;
    if (ri>0){
      const dividerY = ROW_Y[reg.civs[0].id] - ROW_H/2 - REGION_GAP/2;
      svg += `<line class="region-divider" x1="200" y1="${dividerY}" x2="${W-40}" y2="${dividerY}"/>`;
    }
  });

  // 关系连线 (默认隐藏)
  RELATIONS.forEach(r=>{
    const a = ALL_CIVS.find(c=>c.id===r.from), b = ALL_CIVS.find(c=>c.id===r.to);
    if (!a||!b) return;
    const ax = yearToX(a.peak), ay = ROW_Y[a.id];
    const bx = yearToX(b.peak), by = ROW_Y[b.id];
    const mx=(ax+bx)/2, my=(ay+by)/2;
    svg += `<path class="relation-path ${r.type}" data-from="${r.from}" data-to="${r.to}" d="M ${ax} ${ay} Q ${mx} ${my-40} ${bx} ${by}"/>`;
  });

  // 青铜崩溃竖线
  const collapseX = yearToX(-1177);
  svg += `<line class="collapse-line" x1="${collapseX}" y1="${PAD_TOP-5}" x2="${collapseX}" y2="${H-PAD_BOT+5}"/>`;
  svg += `<text class="collapse-label" x="${collapseX}" y="${H-PAD_BOT+28}">💀 前1177 青铜崩溃</text>`;

  // 文明行
  ALL_CIVS.forEach(c=>{
    const y = ROW_Y[c.id];
    const x1 = yearToX(c.start), x2 = yearToX(c.end), xp = yearToX(c.peak);
    const color = getCivColor(c.id);
    const icon = getCivIcon(c.id);
    const r = 25;
    // 名字默认放球右侧；靠右的文明 (x 超过 65% 宽度) 放球左侧, 防止跑出画面
    const rightSide = xp > W*0.62;
    const nameX = rightSide ? xp - r - 12 : xp + r + 12;
    const nameAnchor = rightSide ? 'end' : 'start';
    svg += `<g class="civ-row" data-id="${c.id}" data-region="${c.region}">
      <!-- 时间跨度光条 -->
      <rect class="civ-span" x="${x1}" y="${y-8}" width="${x2-x1}" height="16" rx="8" fill="url(#span_${c.id})" stroke="${color}" stroke-opacity="0.35" stroke-width="1" style="color:${color}"/>
      <!-- 起止年标 -->
      <text class="civ-years" x="${x1-8}" y="${y}" text-anchor="end">前${Math.abs(c.start)}</text>
      <text class="civ-years" x="${x2+8}" y="${y}" text-anchor="start">前${Math.abs(c.end)}</text>
      <!-- 巅峰球 (内层缩放修复浮动 bug：fill-box 绕自身中心) -->
      <g class="orb-inner">
        <g class="civ-orb-body">
          <circle cx="${xp}" cy="${y}" r="${r*1.5}" fill="${color}" opacity="0.14"/>
          <circle cx="${xp}" cy="${y}" r="${r}" fill="url(#orb_${c.id})" stroke="rgba(255,255,255,.35)" stroke-width="1.5" filter="url(#orbShadow)"/>
          <ellipse cx="${xp-r*0.18}" cy="${y-r*0.32}" rx="${r*0.4}" ry="${r*0.17}" fill="rgba(255,255,255,.5)"/>
          <text x="${xp}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${r*0.95}" style="pointer-events:none">${icon}</text>
        </g>
      </g>
      <!-- 名字 -->
      <text class="civ-name" x="${nameX}" y="${y-7}" font-size="18" text-anchor="${nameAnchor}">${c.name}</text>
      <text class="civ-state" x="${nameX}" y="${y+13}" font-size="12.5" text-anchor="${nameAnchor}">${c.state}</text>
    </g>`;
  });

  document.getElementById('canvas').innerHTML = svg;

  document.querySelectorAll('.civ-row').forEach(el=>{
    const id = el.dataset.id;
    el.addEventListener('click', ()=>{ location.href = `./civ-deep.html#/civ/${id}`; });
    el.addEventListener('mouseenter', e=>{ showTooltip(e, id); highlightRelations(id, true); });
    el.addEventListener('mousemove', moveTooltip);
    el.addEventListener('mouseleave', ()=>{ hideTooltip(); highlightRelations(id, false); });
  });
}

function spanPct(c, which){
  const total = c.end - c.start;
  if (total === 0) return 50;
  return Math.round(((c[which]-c.start)/total)*100);
}

function highlightRelations(id, on){
  document.querySelectorAll('.relation-path').forEach(p=>{
    if (p.dataset.from===id || p.dataset.to===id) p.classList.toggle('visible', on);
  });
}

// 同期文明计算
function coexisting(civ){
  return ALL_CIVS.filter(c=> c.id!==civ.id && c.start < civ.end && c.end > civ.start)
    .map(c=>c.name);
}

function showTooltip(e, id){
  const civ = ALL_CIVS.find(c=>c.id===id);
  if (!civ) return;
  const deep = CIV_DEEP?.[id];
  const summary = deep?.opening_narrative?.split(/\n\s*\n/)[0].trim().slice(0,80)+'...'
    || CHAPTERS.find(ch=>ch.active_civs.some(cv=>cv.id===id))?.active_civs.find(cv=>cv.id===id)?.L1
    || civ.state;
  const co = coexisting(civ);
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `
    <div class="nm">${getCivIcon(id)} ${civ.name}</div>
    <div class="yr">前 ${Math.abs(civ.start)} – 前 ${Math.abs(civ.end)} BCE · 巅峰 前${Math.abs(civ.peak)}</div>
    <div class="desc">${summary}</div>
    <div class="coexist">🌍 <b>同期共存</b>：${co.length?co.join('、'):'无'}</div>
    <div class="cta">点击 → 进入它的小宇宙</div>
  `;
  tip.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e){
  const tip = document.getElementById('tooltip');
  const x = Math.min(e.clientX + 16, window.innerWidth - 340);
  const y = Math.min(e.clientY + 16, window.innerHeight - 220);
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function hideTooltip(){ document.getElementById('tooltip').classList.remove('show'); }

function openSummary(){
  document.getElementById('summaryContent').innerHTML = `
    <button class="close-x" onclick="closeSummary()">✕</button>
    <div class="sh"><h2>🏁 2500 年世界全景</h2><div class="ss">From 3500 BCE to 1000 BCE</div></div>
    <div class="gantt">
      <div class="gh">文明</div>
      <div class="gh">CH1<br>3500-3000</div><div class="gh">CH2<br>3000-2500</div><div class="gh">CH3<br>2500-2000</div><div class="gh">CH4<br>2000-1500</div><div class="gh">CH5<br>1500-1000</div>
      <div class="gh legacy">今天保留</div>
      ${FINAL_OVERVIEW.civs.map(cv=>{
        let row = `<div class="gc civ-name" onclick="location.href='./civ-deep.html#/civ/${cv.id}'">${cv.name}</div>`;
        for (let ch=1; ch<=5; ch++){
          const s = cv.spans.find(x=>x[0]===ch);
          if (s) row += `<div class="gc block"><div class="bar ${s[1].split('_')[0]}" style="background:${cv.color}"></div></div>`;
          else row += `<div class="gc block"></div>`;
        }
        row += `<div class="gc legacy-cell">${cv.legacy}</div>`;
        return row;
      }).join('')}
    </div>
    <h3 class="legacy-h">🎁 今天我们保留了什么</h3>
    <div class="legacy-grid">
      ${FINAL_OVERVIEW.today_legacy.map(l=>`<div class="legacy-card"><div class="what">${l.what}</div><div class="from">来自 · ${l.from}</div><div class="why">${l.why}</div></div>`).join('')}
    </div>
  `;
  document.getElementById('summary').classList.add('open');
}
function closeSummary(){ document.getElementById('summary').classList.remove('open'); }

// ── 文明总地图 (Leaflet + OSM, 所有遗址) ──
let _worldMap = null;
function civNameOf(id){
  const c = ALL_CIVS.find(x=>x.id===id);
  if (c) return c.name;
  const fb = {egypt_predynastic:'古埃及·前王朝', indus_early:'印度河·早期', collapse:'青铜崩溃'};
  return fb[id] || id;
}
function openWorldMap(){
  document.getElementById('worldMapModal').classList.add('open');
  setTimeout(initWorldMap, 80);
}
function closeWorldMap(){ document.getElementById('worldMapModal').classList.remove('open'); if(_worldMap){_worldMap.remove();_worldMap=null;} }
function initWorldMap(){
  if (typeof L==='undefined' || typeof CIV_MAP==='undefined') return;
  if (_worldMap){ _worldMap.remove(); _worldMap=null; }
  const el = document.getElementById('worldMap');
  _worldMap = L.map(el, { scrollWheelZoom:true, worldCopyJump:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:13, minZoom:2, attribution:'© OpenStreetMap' }).addTo(_worldMap);
  const allCoords = [];
  const legend = [];
  Object.keys(CIV_MAP).forEach(civId=>{
    const color = getCivColor(civId);
    const name = civNameOf(civId);
    legend.push({civId, color, name});
    CIV_MAP[civId].forEach(p=>{
      allCoords.push(p.coords);
      L.circleMarker(p.coords, { radius:7, color:'#2a1808', weight:1.5, fillColor:color, fillOpacity:.92 })
        .addTo(_worldMap)
        .bindPopup(`<b>${p.name}</b><br><span style="color:${color}">●</span> ${name}<br>${p.note||''}<br><a href="./civ-deep.html#/civ/${civId}">进入该文明 →</a>`)
        .bindTooltip(p.name, { direction:'top', className:'world-tip' });
    });
  });
  if (allCoords.length) _worldMap.fitBounds(allCoords, { padding:[30,30], maxZoom:5 });
  else _worldMap.setView([30,40], 3);
  setTimeout(()=>_worldMap && _worldMap.invalidateSize(), 120);
  setTimeout(()=>{ if(_worldMap){ _worldMap.invalidateSize(); if(allCoords.length)_worldMap.fitBounds(allCoords,{padding:[30,30],maxZoom:5}); } }, 480);
  // 图例
  document.getElementById('worldMapLegend').innerHTML = legend.map(l=>
    `<span class="map-legend-item" onclick="location.href='./civ-deep.html#/civ/${l.civId}'"><span class="dot" style="background:${l.color}"></span>${l.name}</span>`
  ).join('');
}
window.openWorldMap = openWorldMap;
window.closeWorldMap = closeWorldMap;

render();
// ── AI 问答 (千问 SSE) ──
const AI_KEY='civ_qwen_key';
function toggleAI(){ document.getElementById('aiPanel').classList.toggle('open'); document.getElementById('aiInput')?.focus(); }
function aiAppend(role, html, cursor){
  const box=document.getElementById('aiMsgs'); const d=document.createElement('div');
  d.className='ai-msg '+role; d.innerHTML=html+(cursor?'<span class="cursor"></span>':'');
  box.appendChild(d); box.scrollTop=box.scrollHeight; return d;
}
async function sendAI(){
  const input=document.getElementById('aiInput'); const q=input.value.trim(); if(!q)return;
  const btn=document.getElementById('aiSend'); input.value=''; btn.disabled=true;
  aiAppend('user', q.replace(/</g,'&lt;'));
  let key=localStorage.getItem(AI_KEY);
  if(!key){ key=prompt('输入千问 API Key (一次性, 存本地)： https://dashscope.console.aliyun.com/'); if(!key){btn.disabled=false;return;} localStorage.setItem(AI_KEY,key); }
  const bot=aiAppend('bot','',true); let acc='';
  const sys='你是 AI 世界文明实验室助手，面向 10-15 岁中学生，用生动语言。覆盖前 3500–1000 年早期文明（苏美尔/埃及/印度河/阿卡德/巴比伦/米诺斯/迈锡尼/赫梯/商朝/青铜崩溃）。只用学界共识事实，不编造，不知道就说不知道，200 字内。';
  try{
    const resp=await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'qwen-turbo',messages:[{role:'system',content:sys},{role:'user',content:q}],stream:true,max_tokens:500})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){const {done,value}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){ if(!line.startsWith('data: '))continue; const data=line.slice(6).trim(); if(data==='[DONE]')continue;
        try{const j=JSON.parse(data); const ch=j.choices?.[0]?.delta?.content||''; if(ch){acc+=ch; bot.innerHTML=acc.replace(/\n/g,'<br>')+'<span class="cursor"></span>'; document.getElementById('aiMsgs').scrollTop=99999;}}catch(_){}
      }}
    bot.innerHTML=acc.replace(/\n/g,'<br>');
  }catch(err){ bot.innerHTML='⚠️ 出错：'+err.message; }finally{ btn.disabled=false; input.focus(); }
}
document.getElementById('aiForm').addEventListener('submit', e=>{ e.preventDefault(); sendAI(); });
window.toggleAI = toggleAI;
window.openSummary = openSummary;
window.closeSummary = closeSummary;
</script>
