<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>形态 D · 时间入口 · 早期文明</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#fbf6e9; --paper2:#f5e8c8;
  --ink:#2c1a08; --ink2:#5c4530; --ink3:#8a7050;
  --gold:#b88830; --gold-deep:#8a6028; --vermilion:#c84820;
  --line:#c8b08a;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--sans);background:var(--paper);color:var(--ink);scroll-behavior:smooth}

.topbar{position:sticky;top:0;height:54px;z-index:30;background:rgba(251,246,233,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(184,136,48,.18);display:flex;align-items:center;gap:14px;padding:0 22px}
.topbar .home{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.18em}
.topbar h1{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink)}
.topbar h1 em{color:var(--gold);font-style:normal;margin-left:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em}
.topbar .progress{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em;background:rgba(184,136,48,.1);padding:6px 12px;border-radius:99px;border:1px solid rgba(184,136,48,.2)}
.topbar .reset{background:transparent;border:1px solid rgba(184,136,48,.3);color:var(--gold);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em}
.topbar .reset:hover{background:var(--gold);color:white}

/* 入口介绍 */
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 100px}
.intro{margin-bottom:30px}
.intro .hint{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.2em;margin-bottom:8px;text-transform:uppercase}
.intro h2{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--ink);margin-bottom:8px}
.intro p{font-size:14px;line-height:1.75;color:var(--ink2);max-width:780px}
.intro p strong{color:var(--vermilion)}

/* 章节段落 (5 段) */
.chapters{display:flex;flex-direction:column;gap:18px}
.chapter{
  background:white;border:1px solid rgba(184,136,48,.22);border-radius:16px;
  padding:24px 26px;
  transition:opacity .6s ease, transform .6s ease, border-color .6s ease;
}
.chapter.locked{opacity:.18;pointer-events:none}

.ch-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.ch-head .num{
  width:54px;height:54px;border-radius:14px;background:var(--gold);color:white;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;font-weight:900;
  box-shadow:0 4px 12px rgba(184,136,48,.3);flex-shrink:0;
}
.ch-head .info{flex:1;min-width:0}
.ch-head .range{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;margin-bottom:2px}
.ch-head h3{font-family:var(--serif);font-size:22px;font-weight:900;color:var(--ink)}
.ch-head .ic{font-size:36px;flex-shrink:0;opacity:.85}

.ch-summary{font-family:var(--serif);font-size:14px;line-height:1.75;color:var(--ink2);padding:12px 16px;background:rgba(184,136,48,.06);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;margin-bottom:18px}

/* 文明卡片网格 */
.civs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.civ-card{
  background:rgba(251,246,233,.7);border:1.5px solid rgba(184,136,48,.25);border-radius:14px;
  padding:16px 18px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;
  transition:all .2s ease;
  position:relative;
}
.civ-card:hover{border-color:var(--vermilion);background:white;transform:translateY(-3px);box-shadow:0 8px 24px rgba(184,136,48,.15)}
.civ-card .top{display:flex;align-items:center;gap:10px}
.civ-card .ic{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:white;font-size:20px;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
}
.civ-card .nm{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;flex:1;min-width:0}
.civ-card .state{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:99px;letter-spacing:.06em;font-weight:700;background:rgba(184,136,48,.15);color:#8a6028;flex-shrink:0}
.civ-card .state[data-state="巅峰"]{background:rgba(60,160,80,.15);color:#2a6038}
.civ-card .state[data-state*="崩溃"]{background:rgba(200,72,32,.15);color:var(--vermilion)}
.civ-card .l1{font-size:12.5px;color:var(--ink2);line-height:1.55}
.civ-card .enter-btn{
  margin-top:auto;padding:8px 12px;border-radius:8px;
  background:var(--gold);color:white;font-family:var(--serif);font-size:12px;font-weight:700;
  text-align:center;letter-spacing:.04em;
  transition:background .15s;
}
.civ-card:hover .enter-btn{background:var(--vermilion)}

/* 章节下方"继承自上一章"提示 */
.bridge{
  margin-top:14px;padding:10px 14px;
  background:rgba(184,136,48,.08);border:1px dashed rgba(184,136,48,.3);border-radius:10px;
  font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.04em;
}
.bridge::before{content:'⤴ ';color:var(--gold);font-weight:700}

/* 下一步按钮 */
.next-btn{
  display:block;margin:24px auto 0;padding:14px 32px;
  background:white;color:var(--gold);border:2px dashed var(--gold);
  font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.04em;
  border-radius:99px;cursor:pointer;
  transition:all .2s ease;
}
.next-btn:hover{background:var(--gold);color:white;border-style:solid}
.next-btn:disabled{opacity:.3;cursor:not-allowed}

/* 总汇按钮 */
.summary-btn{
  display:block;margin:40px auto 0;padding:18px 36px;
  background:linear-gradient(135deg,var(--gold),var(--vermilion));color:white;border:none;
  font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.04em;
  border-radius:99px;cursor:pointer;
  box-shadow:0 8px 24px rgba(184,136,48,.4);
  transition:transform .2s ease;
}
.summary-btn:hover{transform:translateY(-2px)}
.summary-btn:disabled{opacity:.4;cursor:not-allowed}

/* 总汇模态 */
.summary-modal{position:fixed;inset:0;z-index:40;background:rgba(44,26,8,.7);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.summary-modal.open{display:flex}
.summary-content{background:white;color:var(--ink);border-radius:18px;max-width:1100px;width:100%;padding:32px;margin:auto;position:relative}
.summary-content .sh{text-align:center;margin-bottom:24px}
.summary-content h2{font-family:var(--serif);font-size:30px;font-weight:900}
.summary-content .ss{font-family:var(--mono);letter-spacing:.3em;color:var(--gold);font-size:11px;margin-top:4px;text-transform:uppercase}
.summary-content .close-x{position:absolute;top:24px;right:24px;width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid rgba(184,136,48,.3);cursor:pointer;font-size:14px}
.gantt{display:grid;grid-template-columns:140px repeat(5,1fr) 1.6fr;background:var(--paper);border-radius:12px;overflow:hidden;border:1px solid rgba(184,136,48,.25);margin-bottom:24px}
.gh{padding:10px;background:rgba(184,136,48,.2);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--vermilion);letter-spacing:.08em;text-align:center;border-bottom:1px solid rgba(184,136,48,.2)}
.gh:first-child{text-align:left}.gh.legacy{background:rgba(200,72,32,.15)}
.gc{padding:10px;border-bottom:1px solid rgba(184,136,48,.08);min-height:48px;display:flex;align-items:center;background:white}
.gc.civ-name{font-family:var(--serif);font-weight:700;font-size:12.5px;background:rgba(184,136,48,.05)}
.gc.block{position:relative;padding:0}
.gc .bar{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border-radius:4px}
.gc .bar.peak{opacity:1}.gc .bar.rise,.gc .bar.fade{opacity:.55}
.gc.legacy-cell{font-size:11px;color:var(--ink2);line-height:1.5;background:rgba(200,72,32,.04)}
.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}
.legacy-card{background:var(--paper);border:1px solid rgba(184,136,48,.22);border-radius:12px;padding:14px 16px}
.legacy-card .what{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--vermilion);margin-bottom:3px}
.legacy-card .from{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.08em;margin-bottom:6px}
.legacy-card .why{font-size:12.5px;line-height:1.6;color:var(--ink2)}
.legacy-h{font-family:var(--serif);font-size:22px;font-weight:900;margin:24px 0 12px;text-align:center}

@media (max-width:768px){
  .wrap{padding:18px 14px 80px}
  .chapter{padding:18px}
  .ch-head h3{font-size:18px}
  .ch-head .num{width:44px;height:44px;font-size:18px}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="./civ-explorer-compare.html" class="home">← 对比页</a>
  <h1>早期文明 · 时间入口 <em>FORM D</em></h1>
  <div class="progress" id="progress">1 / 5 段已展开</div>
  <button class="reset" onclick="resetAll()">↻ 重置</button>
</div>

<div class="wrap">
  <div class="intro">
    <div class="hint">STEP 1 · 时间入口（D）  →  STEP 2 · 实体钻深（E）</div>
    <h2>📜 一步一步看 2500 年的文明</h2>
    <p>每个 500 年是一段，点击"<strong>展开下一段</strong>"按钮 → 下一段的文明出现。看到任何感兴趣的文明，点击它的<strong>「进入深度 →」</strong>按钮，会跳到形态 E，可以一直钻 5-6 层（人物 → 朋友 → 事件 → 因果链 → 概念...）。</p>
  </div>

  <div class="chapters" id="chapters"></div>

  <button class="next-btn" id="nextBtn" onclick="revealNext()">⤓ 展开下一段 500 年 ↓</button>

  <button class="summary-btn" id="summaryBtn" disabled onclick="openSummary()">🏁 看 2500 年全景总汇</button>
</div>

<div class="summary-modal" id="summary"><div class="summary-content" id="summaryContent"></div></div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
let revealedCount = 1;

function getCivInfo(id){
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f;
  }
  const fb = {egypt_predynastic:{name:'古埃及·前王朝',icon:'🌅',color:'#d4b870'},indus_early:{name:'印度河早期',icon:'🏘',color:'#a070d4'}};
  return fb[id] || {name:id,icon:'🏛',color:'#888'};
}

function renderChapters(){
  const html = CHAPTERS.map((ch, idx)=>{
    const lockedCls = (idx >= revealedCount) ? 'locked' : '';

    // 找上一章和本章重合的文明 (继承提示)
    let bridge = '';
    if (idx > 0) {
      const prev = CHAPTERS[idx-1];
      const carriedOver = ch.active_civs.filter(cv => prev.active_civs.some(pcv=>pcv.id===cv.id));
      if (carriedOver.length) {
        bridge = `<div class="bridge">上一章的 ${carriedOver.map(c=>getCivInfo(c.id).icon+' '+getCivInfo(c.id).name).join(' · ')} 继续</div>`;
      }
    }

    return `<div class="chapter ${lockedCls}" id="ch-${idx}">
      <div class="ch-head">
        <div class="num">${ch.no}</div>
        <div class="info">
          <div class="range">${ch.range} BCE</div>
          <h3>${ch.title}</h3>
        </div>
        <div class="ic">${ch.icon}</div>
      </div>
      <div class="ch-summary">${ch.one_line}</div>
      <div class="civs-grid">
        ${ch.active_civs.map(cv=>{
          const info = getCivInfo(cv.id);
          return `<div class="civ-card" onclick="enterDeep('${cv.id}')">
            <div class="top">
              <div class="ic" style="background:${info.color}">${info.icon}</div>
              <div class="nm">${info.name}</div>
              <div class="state" data-state="${cv.state}">${cv.state}</div>
            </div>
            <div class="l1">${cv.L1||cv.in_period_summary||''}</div>
            <div class="enter-btn">深入了解 →</div>
          </div>`;
        }).join('')}
      </div>
      ${bridge}
    </div>`;
  }).join('');
  document.getElementById('chapters').innerHTML = html;
  updateBtns();
}

function updateBtns(){
  document.getElementById('progress').textContent = `${revealedCount} / 5 段已展开`;
  document.getElementById('summaryBtn').disabled = revealedCount < 5;
  const nextBtn = document.getElementById('nextBtn');
  if (revealedCount >= 5) { nextBtn.style.display = 'none'; }
  else { nextBtn.style.display = 'block'; nextBtn.textContent = `⤓ 展开下一段 (CH${revealedCount+1}: ${CHAPTERS[revealedCount].title}) ↓`; }
}

function revealNext(){
  if (revealedCount >= 5) return;
  revealedCount++;
  document.getElementById('ch-'+(revealedCount-1)).classList.remove('locked');
  updateBtns();
  setTimeout(()=>{
    document.getElementById('ch-'+(revealedCount-1)).scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
}

function resetAll(){
  revealedCount = 1;
  document.querySelectorAll('.chapter').forEach((el, idx)=>{
    el.classList.toggle('locked', idx >= 1);
  });
  updateBtns();
  window.scrollTo({top:0, behavior:'smooth'});
}

// 进入文明完整深度页
function enterDeep(civId){
  location.href = `./civ-deep.html#/civ/${civId}`;
}

function openSummary(){
  document.getElementById('summaryContent').innerHTML = `
    <button class="close-x" onclick="closeSummary()">✕</button>
    <div class="sh"><h2>🏁 2500 年世界全景</h2><div class="ss">From 3500 BCE to 1000 BCE</div></div>
    <div class="gantt">
      <div class="gh">文明</div>
      <div class="gh">CH1<br>3500-3000</div><div class="gh">CH2<br>3000-2500</div><div class="gh">CH3<br>2500-2000</div><div class="gh">CH4<br>2000-1500</div><div class="gh">CH5<br>1500-1000</div>
      <div class="gh legacy">今天保留</div>
      ${FINAL_OVERVIEW.civs.map(cv=>{
        let row = `<div class="gc civ-name">${cv.name}</div>`;
        for (let ch=1; ch<=5; ch++){
          const s = cv.spans.find(x=>x[0]===ch);
          if (s) row += `<div class="gc block"><div class="bar ${s[1].split('_')[0]}" style="background:${cv.color}"></div></div>`;
          else row += `<div class="gc block"></div>`;
        }
        row += `<div class="gc legacy-cell">${cv.legacy}</div>`;
        return row;
      }).join('')}
    </div>
    <h3 class="legacy-h">🎁 今天我们保留了什么</h3>
    <div class="legacy-grid">
      ${FINAL_OVERVIEW.today_legacy.map(l=>`<div class="legacy-card"><div class="what">${l.what}</div><div class="from">来自 · ${l.from}</div><div class="why">${l.why}</div></div>`).join('')}
    </div>
  `;
  document.getElementById('summary').classList.add('open');
}
function closeSummary(){ document.getElementById('summary').classList.remove('open'); }

renderChapters();
window.revealNext = revealNext;
window.resetAll = resetAll;
window.enterDeep = enterDeep;
window.openSummary = openSummary;
window.closeSummary = closeSummary;
</script>
</body>
</html>
