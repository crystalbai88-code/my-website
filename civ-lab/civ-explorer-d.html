<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>形态 D · 动态思维导图 · 早期文明</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#04050c; --bg2:#0a0f1c;
  --ink:#f0e8d5; --ink2:#a8b0c8; --ink3:#5a6080;
  --gold:#d4a858; --warm:#e89870; --cyan:#7adcf0; --magenta:#e878d8;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}

/* 背景：深空 + 星点 */
.cosmos{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(120,90,200,.2) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(200,120,60,.12) 0%, transparent 50%),
    radial-gradient(ellipse at center, #0a0f1c 0%, #04050c 100%);
}
.cosmos::after{
  content:'';position:absolute;inset:0;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 8% 15%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 22% 38%, #fff, transparent),
    radial-gradient(1px 1px at 38% 22%, #ffd47a, transparent),
    radial-gradient(1.2px 1.2px at 55% 12%, #fff, transparent),
    radial-gradient(1px 1px at 72% 28%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 88% 18%, #fff, transparent),
    radial-gradient(1px 1px at 12% 62%, #c8d4ff, transparent),
    radial-gradient(1.2px 1.2px at 32% 78%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 58% 65%, #ffd47a, transparent),
    radial-gradient(1px 1px at 78% 82%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 92% 72%, #fff, transparent);
}

/* 顶栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:30;background:rgba(4,5,12,.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,168,88,.18);display:flex;align-items:center;gap:14px;padding:0 22px}
.topbar .home{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.18em}
.topbar h1{font-family:var(--serif);font-size:14px;color:var(--ink);font-weight:700}
.topbar h1 em{color:var(--gold);font-style:normal;margin-left:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em}
.topbar .reset{margin-left:auto;background:rgba(212,168,88,.1);border:1px solid rgba(212,168,88,.3);color:var(--gold);padding:7px 14px;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;font-weight:600}
.topbar .reset:hover{background:var(--gold);color:#0a0a0e}

/* 章节切换器 (底部) */
.chapter-bar{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:25;
  display:flex;gap:8px;background:rgba(4,5,12,.85);backdrop-filter:blur(20px);
  border:1px solid rgba(212,168,88,.25);border-radius:99px;padding:6px;
  box-shadow:0 12px 36px rgba(0,0,0,.5);
}
.ch-btn{
  min-width:54px;height:42px;border-radius:99px;border:none;background:transparent;cursor:pointer;
  color:rgba(212,168,88,.6);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  transition:all .2s;padding:0 8px;
}
.ch-btn:hover{background:rgba(212,168,88,.15);color:var(--gold)}
.ch-btn.active{background:var(--gold);color:#1a1410}
.ch-btn .ic{font-size:16px;margin-bottom:1px}
.ch-btn .end{font-size:18px}

/* 主画布 */
svg.canvas{position:fixed;inset:0;z-index:10;cursor:grab}
svg.canvas:active{cursor:grabbing}

/* 节点样式 */
.node{cursor:pointer;transition:transform .3s}
.node:hover{transform:scale(1.06)}
.node-center .ring1{fill:none;stroke:rgba(212,168,88,.4);stroke-width:1;animation:ringPulse 3s ease-in-out infinite}
.node-center .ring2{fill:none;stroke:rgba(212,168,88,.25);stroke-width:1;animation:ringPulse 3s ease-in-out infinite .8s}
@keyframes ringPulse{0%,100%{opacity:.4}50%{opacity:1}}
.node-center .core{fill:var(--gold);filter:drop-shadow(0 0 24px rgba(212,168,88,.7))}
.node-center .ic{font-size:32px;text-anchor:middle;dominant-baseline:central}
.node-center .title{font-family:var(--serif);font-size:18px;font-weight:900;fill:white;text-anchor:middle}
.node-center .sub{font-family:var(--mono);font-size:10px;fill:rgba(255,255,255,.7);text-anchor:middle;letter-spacing:.18em}

.node-civ .glow{filter:drop-shadow(0 0 16px currentColor)}
.node-civ .core{stroke:rgba(255,255,255,.4);stroke-width:1.5}
.node-civ .ic{font-size:22px;text-anchor:middle;dominant-baseline:central}
.node-civ .label{font-family:var(--serif);font-size:13px;font-weight:700;fill:white;text-anchor:middle}
.node-civ .meta{font-family:var(--mono);font-size:9px;fill:rgba(255,255,255,.6);text-anchor:middle;letter-spacing:.1em}

.node-event .core{fill:rgba(232,152,112,.2);stroke:var(--warm);stroke-width:1.5;filter:drop-shadow(0 0 10px rgba(232,152,112,.6))}
.node-event .ic{font-size:16px;text-anchor:middle;dominant-baseline:central}
.node-event .label{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--warm);text-anchor:middle}

.node-person .core{fill:rgba(122,220,240,.2);stroke:var(--cyan);stroke-width:1.5;filter:drop-shadow(0 0 10px rgba(122,220,240,.5))}
.node-person .ic{font-size:16px;text-anchor:middle;dominant-baseline:central}
.node-person .label{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--cyan);text-anchor:middle}

.node.activated .core{stroke-width:3;animation:nodePulse 1.5s ease-in-out infinite}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 14px currentColor)}50%{filter:drop-shadow(0 0 24px currentColor)}}
.node.studied .badge{fill:#7ad896;stroke:white;stroke-width:1.5}
.node.studied .badge-text{fill:white;font-family:var(--mono);font-size:8px;font-weight:700;text-anchor:middle;dominant-baseline:central}

/* 连接线 */
.link{fill:none;stroke-width:1.5;opacity:.5;transition:all .3s}
.link-civ{stroke:rgba(212,168,88,.5)}
.link-event{stroke:rgba(232,152,112,.4);stroke-dasharray:3 4}
.link-person{stroke:rgba(122,220,240,.4);stroke-dasharray:3 4}
.link-relation{stroke:rgba(232,120,216,.5);stroke-width:1.5;stroke-dasharray:6 3;animation:flowDash 12s linear infinite}
@keyframes flowDash{to{stroke-dashoffset:-120}}
.link.highlight{opacity:1;stroke-width:2.5}

/* 详细卡片 (右下浮窗) */
.detail{
  position:fixed;right:18px;top:74px;bottom:80px;width:380px;max-width:calc(100vw - 36px);z-index:28;
  background:rgba(15,15,28,.95);backdrop-filter:blur(20px);
  border:1px solid rgba(212,168,88,.3);border-radius:16px;
  display:none;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.detail.open{display:flex;animation:slideIn .35s}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.detail-head{padding:18px 20px 14px;border-bottom:1px solid rgba(212,168,88,.2);display:flex;align-items:center;gap:10px}
.detail-head .ic{font-size:28px;flex-shrink:0}
.detail-head .ti{flex:1;min-width:0}
.detail-head .ki{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--gold);font-weight:700;margin-bottom:3px}
.detail-head h3{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:700;line-height:1.2}
.detail-head .close{width:34px;height:34px;border-radius:50%;border:1px solid rgba(212,168,88,.3);background:transparent;color:var(--ink2);cursor:pointer;font-size:14px}
.detail-head .close:hover{background:rgba(212,168,88,.15);color:var(--gold)}
.detail-body{flex:1;overflow-y:auto;padding:16px 20px}
.detail-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.detail-meta span{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(212,168,88,.12);color:var(--gold);letter-spacing:.06em}
.detail-meta .state{background:rgba(122,216,150,.15);color:#7ad896}
.detail-q{font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--ink);background:rgba(212,168,88,.08);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:14px}
.detail-section{margin-bottom:14px}
.detail-section .h{font-family:var(--mono);font-size:9.5px;color:var(--warm);letter-spacing:.18em;font-weight:700;margin-bottom:8px;text-transform:uppercase}
.detail-section .b{font-family:var(--serif);font-size:13.5px;line-height:1.8;color:var(--ink2)}
.detail-narrative{background:rgba(212,168,88,.05);border-radius:10px;padding:14px;border:1px solid rgba(212,168,88,.15)}
.detail-narrative p{font-family:var(--serif);font-size:13px;line-height:1.85;color:var(--ink);margin-bottom:12px}
.detail-narrative p:last-child{margin-bottom:0}

.detail-foot{padding:12px 20px;border-top:1px solid rgba(212,168,88,.2);background:rgba(0,0,0,.3)}
.next-hint{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.1em;text-align:center}
.next-hint::before{content:'▼ ';animation:bounce 1.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* 总汇模态 */
.summary-modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px}
.summary-modal.open{display:flex}
.summary-content{background:#fdf8ed;color:#1a1410;border-radius:18px;max-width:1100px;width:100%;max-height:90vh;overflow-y:auto;padding:32px}
.summary-content .sh{text-align:center;margin-bottom:24px}
.summary-content h2{font-family:var(--serif);font-size:32px;font-weight:900;color:#1a1410}
.summary-content .ss{font-family:'Cinzel',serif;letter-spacing:.3em;color:#8a7050;font-size:12px;margin-top:4px;text-transform:uppercase}
.summary-content .close-x{position:absolute;top:32px;right:32px;width:40px;height:40px;border-radius:50%;background:white;border:1px solid #ccc;cursor:pointer;font-size:16px}
.gantt{display:grid;grid-template-columns:140px repeat(5,1fr) 1.6fr;background:white;border-radius:12px;overflow:hidden;border:1px solid rgba(160,100,30,.2);margin-bottom:24px}
.gh{padding:10px;background:rgba(212,168,88,.2);font-family:var(--mono);font-size:10px;font-weight:700;color:#c84820;letter-spacing:.08em;text-align:center;border-bottom:1px solid rgba(160,100,30,.2)}
.gh:first-child{text-align:left}.gh.legacy{background:rgba(200,72,32,.15)}
.gc{padding:10px;border-bottom:1px solid rgba(160,100,30,.08);min-height:48px;display:flex;align-items:center}
.gc.civ-name{font-family:var(--serif);font-weight:700;font-size:12.5px;background:rgba(245,232,200,.4)}
.gc.block{position:relative;padding:0}
.gc .bar{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border-radius:4px}
.gc .bar.peak{opacity:1}.gc .bar.rise,.gc .bar.fade{opacity:.55}
.gc.legacy-cell{font-size:11px;color:#5c4530;line-height:1.5;background:rgba(200,72,32,.04)}
.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}
.legacy-card{background:white;border:1px solid rgba(160,100,30,.18);border-radius:12px;padding:14px 16px}
.legacy-card .what{font-family:var(--serif);font-size:17px;font-weight:700;color:#c84820;margin-bottom:3px}
.legacy-card .from{font-family:var(--mono);font-size:10px;color:#d4a858;letter-spacing:.08em;margin-bottom:6px}
.legacy-card .why{font-size:12.5px;line-height:1.6;color:#5c4530}
.legacy-h{font-family:var(--serif);font-size:22px;font-weight:900;margin:24px 0 12px;text-align:center;color:#1a1410}

/* 进度提示 (顶栏右) */
.progress-pill{position:fixed;top:14px;right:130px;z-index:31;background:rgba(212,168,88,.12);border:1px solid rgba(212,168,88,.3);border-radius:99px;padding:5px 12px;font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.1em}

@media (max-width:768px){
  .detail{right:8px;left:8px;width:auto;top:auto;bottom:78px;max-height:60vh}
  .progress-pill{display:none}
}
</style>
</head>
<body>

<div class="cosmos"></div>

<div class="topbar">
  <a href="./civ-explorer-compare.html" class="home">← 对比页</a>
  <h1>早期文明 · 动态思维导图 <em>FORM D</em></h1>
  <button class="reset" onclick="resetMap()">↻ 重置</button>
</div>

<div class="progress-pill" id="progress">已学 0 个</div>

<svg class="canvas" id="canvas" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>

<div class="detail" id="detail">
  <div class="detail-head">
    <div class="ic" id="dIc"></div>
    <div class="ti">
      <div class="ki" id="dKi"></div>
      <h3 id="dTitle"></h3>
    </div>
    <button class="close" onclick="closeDetail()">✕</button>
  </div>
  <div class="detail-body" id="dBody"></div>
  <div class="detail-foot" id="dFoot"><div class="next-hint" id="dHint"></div></div>
</div>

<div class="chapter-bar" id="chBar"></div>

<div class="summary-modal" id="summary">
  <div class="summary-content" id="summaryContent"></div>
</div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
const W = 1600, H = 900;
const cx = W/2, cy = H/2;

// 状态
let curCh = 0;
let revealed = new Set();    // 已展开的节点 id (revealed = 子节点可见)
let studied  = new Set();    // 已"学过"的节点 id (打绿勾)
let selected = null;          // 当前选中节点 (显示详情)

const canvas = document.getElementById('canvas');
const detail = document.getElementById('detail');

function getCivInfo(id){
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f;
  }
  const fb = {egypt_predynastic:{name:'古埃及·前王朝',icon:'🌅',color:'#d4b870'},indus_early:{name:'印度河早期',icon:'🏘',color:'#a070d4'}};
  return fb[id] || {name:id,icon:'🏛',color:'#888'};
}

// ════════════════════════════════════════════════
// 布局计算 — 父子节点的同心圆位置
// ════════════════════════════════════════════════
function computeLayout(){
  const ch = CHAPTERS[curCh];
  const nodes = [];
  const links = [];

  // 中心：章节
  nodes.push({id:'ch',type:'center',x:cx,y:cy,data:ch});

  // 文明节点 (第一圈, r=240) — 始终显示
  const civCount = ch.active_civs.length;
  ch.active_civs.forEach((cv,i)=>{
    const angle = -Math.PI/2 + (i - (civCount-1)/2) * (Math.PI*2/Math.max(civCount,3));
    const r = 240;
    const x = cx + Math.cos(angle)*r, y = cy + Math.sin(angle)*r;
    const civInfo = getCivInfo(cv.id);
    const nodeId = 'civ:'+cv.id;
    nodes.push({id:nodeId, type:'civ', x, y, parent:'ch', angle, data:cv, info:civInfo});
    links.push({from:'ch', to:nodeId, type:'civ'});

    // 文明展开后 → 事件 + 人物在文明外侧扇形排列
    if (revealed.has(nodeId)) {
      const events = (cv.L3_events||[]).map(eid=>({id:eid, type:'event'}));
      const people = (cv.L4_people||[]).map(pid=>({id:pid, type:'person'}));
      const children = [...events, ...people];
      const total = children.length;
      const spread = Math.PI * 0.55; // 110度扇形
      children.forEach((c,ci)=>{
        const childAngle = angle + (ci - (total-1)/2) * (spread/Math.max(total,2));
        const cr = 130;
        const x2 = x + Math.cos(childAngle)*cr;
        const y2 = y + Math.sin(childAngle)*cr;
        const cid = c.type+':'+c.id;
        const deepData = c.type==='event' ? (EVENT_DEEP?.[c.id]) : (PERSON_DEEP?.[c.id]);
        nodes.push({id:cid, type:c.type, x:x2, y:y2, parent:nodeId, angle:childAngle, data:{id:c.id, deep:deepData}});
        links.push({from:nodeId, to:cid, type:c.type});
      });
    }
  });

  // 关系连线 — 人物之间的朋友/敌人关系 (当两个节点都可见)
  const visiblePeople = nodes.filter(n=>n.type==='person');
  visiblePeople.forEach(pn=>{
    const pdata = pn.data.deep;
    if (pdata?.related) {
      pdata.related.forEach(r=>{
        const target = visiblePeople.find(x=>x.data.id===r.id);
        if (target) {
          links.push({from:pn.id, to:target.id, type:'relation', label:r.relation});
        }
      });
    }
  });

  return {nodes, links};
}

// ════════════════════════════════════════════════
// 渲染
// ════════════════════════════════════════════════
function render(){
  const {nodes, links} = computeLayout();
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));

  let svgHtml = '';

  // 连线 (在节点之下)
  links.forEach(l=>{
    const a = byId[l.from], b = byId[l.to];
    if (!a || !b) return;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const dx = b.x-a.x, dy = b.y-a.y;
    const ox = -dy*0.15, oy = dx*0.15;
    const path = `M ${a.x} ${a.y} Q ${mx+ox} ${my+oy} ${b.x} ${b.y}`;
    svgHtml += `<path class="link link-${l.type}" d="${path}"/>`;
    if (l.label) {
      svgHtml += `<text x="${mx+ox}" y="${my+oy-4}" font-family="var(--mono)" font-size="9" fill="rgba(232,120,216,.8)" text-anchor="middle" letter-spacing=".06em">${l.label}</text>`;
    }
  });

  // 节点
  nodes.forEach(n=>{
    if (n.type==='center') {
      const ch = n.data;
      svgHtml += `<g class="node node-center" data-id="${n.id}" data-type="center" transform="translate(${n.x},${n.y})">
        <circle class="ring1" r="68"/>
        <circle class="ring2" r="86"/>
        <circle class="core" r="50"/>
        <text class="ic" y="-12">${ch.icon}</text>
        <text class="title" y="14">${ch.title}</text>
        <text class="sub" y="32">${ch.range}</text>
      </g>`;
    } else if (n.type==='civ') {
      const studiedCls = studied.has(n.id) ? 'studied' : '';
      const activatedCls = (revealed.has(n.id)) ? 'activated' : '';
      const stateColor = n.data.state==='巅峰'?'#7ad896':n.data.state==='崩溃'||n.data.state==='集体崩溃'?'#ff7878':n.info.color;
      svgHtml += `<g class="node node-civ ${activatedCls} ${studiedCls}" data-id="${n.id}" data-type="civ" transform="translate(${n.x},${n.y})" style="color:${n.info.color}">
        <g class="glow">
          <circle class="core" r="32" fill="${n.info.color}"/>
        </g>
        <text class="ic" y="0">${n.info.icon}</text>
        <text class="label" y="48">${n.info.name}</text>
        <text class="meta" y="62">${n.data.state}</text>
        ${studied.has(n.id) ? `<g transform="translate(24,-24)"><circle class="badge" r="9"/><text class="badge-text" y="0">✓</text></g>` : ''}
      </g>`;
    } else if (n.type==='event') {
      const e = n.data.deep;
      const label = e?.full_title || n.data.id;
      const labelShort = label.length>8 ? label.slice(0,8)+'…' : label;
      const studiedCls = studied.has(n.id) ? 'studied' : '';
      svgHtml += `<g class="node node-event ${studiedCls}" data-id="${n.id}" data-type="event" transform="translate(${n.x},${n.y})">
        <circle class="core" r="18"/>
        <text class="ic" y="0">📅</text>
        <text class="label" y="32">${labelShort}</text>
        ${studied.has(n.id) ? `<g transform="translate(14,-14)"><circle class="badge" r="7"/><text class="badge-text" y="0" font-size="7">✓</text></g>` : ''}
      </g>`;
    } else if (n.type==='person') {
      const p = n.data.deep;
      const name = p?.full_name?.split(' ')[0] || p?.full_name || n.data.id;
      const shortName = name.length>6 ? name.slice(0,6)+'…' : name;
      const studiedCls = studied.has(n.id) ? 'studied' : '';
      svgHtml += `<g class="node node-person ${studiedCls}" data-id="${n.id}" data-type="person" transform="translate(${n.x},${n.y})">
        <circle class="core" r="20"/>
        <text class="ic" y="0">👤</text>
        <text class="label" y="34">${shortName}</text>
        ${studied.has(n.id) ? `<g transform="translate(15,-15)"><circle class="badge" r="7"/><text class="badge-text" y="0" font-size="7">✓</text></g>` : ''}
      </g>`;
    }
  });

  canvas.innerHTML = svgHtml;
  bindNodes();
  updateProgress();
}

function bindNodes(){
  canvas.querySelectorAll('.node').forEach(g=>{
    g.addEventListener('click', e=>{
      e.stopPropagation();
      const id = g.dataset.id, type = g.dataset.type;
      onNodeClick(id, type);
    });
  });
}

function onNodeClick(id, type){
  studied.add(id);
  selected = id;
  if (type==='civ') {
    revealed.add(id); // 展开它的事件 + 人物
  }
  render();
  showDetail(id, type);
}

// ════════════════════════════════════════════════
// 详情卡片
// ════════════════════════════════════════════════
function showDetail(id, type){
  if (type==='center') return;
  detail.classList.add('open');
  const ch = CHAPTERS[curCh];

  if (type==='civ') {
    const cv = ch.active_civs.find(c=>'civ:'+c.id===id);
    if (!cv) return;
    const info = getCivInfo(cv.id);
    document.getElementById('dIc').textContent = info.icon;
    document.getElementById('dKi').textContent = `L1 + L2 · 文明`;
    document.getElementById('dTitle').textContent = info.name;
    const eventCount = cv.L3_events?.length||0, personCount = cv.L4_people?.length||0;
    const hasMore = eventCount+personCount > 0;
    document.getElementById('dBody').innerHTML = `
      <div class="detail-meta">
        <span class="state">${cv.state}</span>
        <span>${ch.range} BCE</span>
        <span>${info.region||''}</span>
      </div>
      <div class="detail-q">💡 ${cv.L1||''}</div>
      <div class="detail-section"><div class="h">L2 · 此期状态</div><div class="b">${cv.L2||cv.in_period_summary||''}</div></div>
      ${cv.L5_full && CIV_DEEP?.sumer && cv.id==='sumer' ? `<div class="detail-section"><div class="h">L5 · 完整叙事</div><div class="detail-narrative">${CIV_DEEP.sumer.opening_narrative.trim().split(/\n\s*\n/).slice(0,2).map(p=>'<p>'+p.trim()+'</p>').join('')}</div></div>` : ''}
    `;
    document.getElementById('dHint').textContent = hasMore ? `画布上已展开 ${eventCount} 个📅事件 + ${personCount} 个👤人物 · 点击它们继续学` : '此文明在此期还没有具体事件/人物';
  }
  else if (type==='event') {
    const eid = id.replace('event:','');
    const e = EVENT_DEEP?.[eid];
    if (!e) {
      document.getElementById('dIc').textContent = '📅';
      document.getElementById('dKi').textContent = 'L3 · 事件';
      document.getElementById('dTitle').textContent = eid;
      document.getElementById('dBody').innerHTML = `<div class="detail-section"><div class="b" style="color:#cc6020">深度内容待补</div></div>`;
      document.getElementById('dHint').textContent = '此事件的深度内容还在写';
      return;
    }
    document.getElementById('dIc').textContent = '📅';
    document.getElementById('dKi').textContent = 'L3 · 历史事件';
    document.getElementById('dTitle').textContent = e.full_title || eid;
    document.getElementById('dBody').innerHTML = `
      <div class="detail-q">💡 ${e.one_liner||''}</div>
      <div class="detail-section"><div class="h">L3 · 事件叙事</div><div class="detail-narrative">${(e.narrative||'').trim().split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('')}</div></div>
      ${e.significance?`<div class="detail-section"><div class="h">历史意义</div><div class="b">${e.significance}</div></div>`:''}
    `;
    document.getElementById('dHint').textContent = '点击其它📅或👤继续探索';
  }
  else if (type==='person') {
    const pid = id.replace('person:','');
    const p = PERSON_DEEP?.[pid];
    if (!p) {
      document.getElementById('dIc').textContent = '👤';
      document.getElementById('dKi').textContent = 'L4 · 人物';
      document.getElementById('dTitle').textContent = pid;
      document.getElementById('dBody').innerHTML = `<div class="detail-section"><div class="b" style="color:#cc6020">深度传记待补</div></div>`;
      document.getElementById('dHint').textContent = '此人物的深度传记还在写';
      return;
    }
    document.getElementById('dIc').textContent = '👤';
    document.getElementById('dKi').textContent = 'L4 · 历史人物';
    document.getElementById('dTitle').textContent = p.full_name || pid;
    document.getElementById('dBody').innerHTML = `
      <div class="detail-meta">
        ${p.pronunciation?`<span>🔉 ${p.pronunciation}</span>`:''}
        ${p.lifespan_real?`<span>📅 ${p.lifespan_real}</span>`:''}
      </div>
      ${p.historical_or_mythic?`<div class="detail-q">${p.historical_or_mythic}</div>`:''}
      <div class="detail-section"><div class="h">L4 · 完整传记</div><div class="detail-narrative">${(p.biography||'').trim().split(/\n\s*\n/).map(par=>'<p>'+par.trim()+'</p>').join('')}</div></div>
      ${p.legacy?`<div class="detail-section"><div class="h">遗产</div><div class="b">${p.legacy.trim().split(/\n\s*\n/)[0]}</div></div>`:''}
    `;
    document.getElementById('dHint').textContent = '紫色虚线 = 他与其他人物的关系';
  }
}

function closeDetail(){ detail.classList.remove('open'); selected=null; }

// ════════════════════════════════════════════════
// 章节切换
// ════════════════════════════════════════════════
function renderChapterBar(){
  const bar = document.getElementById('chBar');
  bar.innerHTML = CHAPTERS.map((c,i)=>`<button class="ch-btn ${i===curCh?'active':''}" onclick="switchChapter(${i})" title="${c.title}"><span class="ic">${c.icon}</span><span>${c.no}</span></button>`).join('')
    + `<button class="ch-btn ${studied.size===0?'':''}" onclick="openSummary()" title="全景总汇"><span class="end">🏁</span><span>END</span></button>`;
}
function switchChapter(i){
  curCh = i;
  revealed.clear();
  selected = null;
  closeDetail();
  render(); renderChapterBar();
}
function resetMap(){
  revealed.clear(); studied.clear(); selected=null;
  closeDetail(); render(); renderChapterBar();
}
function updateProgress(){
  document.getElementById('progress').textContent = `已学 ${studied.size} 个节点`;
}

// ════════════════════════════════════════════════
// 总汇模态
// ════════════════════════════════════════════════
function openSummary(){
  const m = document.getElementById('summary');
  document.getElementById('summaryContent').innerHTML = `
    <button class="close-x" onclick="closeSummary()">✕</button>
    <div class="sh"><h2>🏁 2500 年世界全景</h2><div class="ss">From 3500 BCE to 1000 BCE</div></div>
    <div class="gantt">
      <div class="gh">文明</div>
      <div class="gh">CH1<br>3500-3000</div><div class="gh">CH2<br>3000-2500</div><div class="gh">CH3<br>2500-2000</div><div class="gh">CH4<br>2000-1500</div><div class="gh">CH5<br>1500-1000</div>
      <div class="gh legacy">今天保留</div>
      ${FINAL_OVERVIEW.civs.map(cv=>{
        let row = `<div class="gc civ-name">${cv.name}</div>`;
        for (let ch=1; ch<=5; ch++){
          const s = cv.spans.find(x=>x[0]===ch);
          if (s) row += `<div class="gc block"><div class="bar ${s[1].split('_')[0]}" style="background:${cv.color}"></div></div>`;
          else row += `<div class="gc block"></div>`;
        }
        row += `<div class="gc legacy-cell">${cv.legacy}</div>`;
        return row;
      }).join('')}
    </div>
    <h3 class="legacy-h">🎁 今天我们保留了什么</h3>
    <div class="legacy-grid">
      ${FINAL_OVERVIEW.today_legacy.map(l=>`<div class="legacy-card"><div class="what">${l.what}</div><div class="from">来自 · ${l.from}</div><div class="why">${l.why}</div></div>`).join('')}
    </div>
  `;
  m.classList.add('open');
}
function closeSummary(){ document.getElementById('summary').classList.remove('open'); }

// 初始化
render();
renderChapterBar();

window.switchChapter = switchChapter;
window.resetMap = resetMap;
window.closeDetail = closeDetail;
window.openSummary = openSummary;
window.closeSummary = closeSummary;
</script>
</body>
</html>
