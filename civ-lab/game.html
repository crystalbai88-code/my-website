<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>历史贪吃蛇 · 连一连 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<style>
  html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  #app{position:relative;z-index:10;min-height:100dvh;padding-bottom:24px}
  .nav{display:flex;align-items:center;gap:9px;padding:12px 16px 2px;flex-wrap:wrap}
  .nav a.pill{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.08em;
    background:var(--topbar-bg);border:1px solid var(--panel-line);border-radius:999px;padding:7px 13px;backdrop-filter:blur(8px)}
  .wrap{width:min(420px,94%);margin:0 auto;text-align:center}
  h1{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--ink);margin:8px 0 2px;text-shadow:var(--label-shadow)}
  /* 难题横幅 */
  .quest{font-family:var(--serif);font-size:14.5px;color:var(--ink);line-height:1.55;background:var(--panel-bg);
    border:1px solid var(--panel-line);border-left:4px solid var(--gold);border-radius:12px;padding:11px 14px;margin:10px 0 8px;text-align:left;min-height:20px}
  .quest .qk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:3px}
  .quest b{color:var(--gold)}
  .hud{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--ink2);margin:2px 2px 8px}
  .hud b{color:var(--gold)}
  .lives{letter-spacing:2px;font-size:15px}
  /* 画布 */
  .boardwrap{position:relative;width:100%;aspect-ratio:1/1;margin:0 auto}
  canvas{width:100%;height:100%;display:block;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--panel-line)}
  .over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);border-radius:16px;backdrop-filter:blur(3px);padding:20px;box-sizing:border-box}
  .over.show{display:flex;animation:fin .3s}
  @keyframes fin{from{opacity:0}to{opacity:1}}
  .over .oe{font-size:42px}
  .over h2{font-family:var(--serif);font-weight:900;font-size:22px;color:#fff;margin:6px 0 2px}
  .over p{font-family:var(--sans);font-size:13.5px;color:#eee;line-height:1.6;margin:2px 0}
  .over p b{color:var(--gold)}
  .over .ob{margin-top:14px;font-family:var(--sans);font-weight:800;font-size:15px;color:#fff;border:none;border-radius:999px;
    padding:12px 28px;cursor:pointer;background:linear-gradient(90deg,var(--gold),var(--vermilion))}
  /* 方向键 */
  .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:8px;justify-content:center;margin:16px auto 0}
  .pad button{font-size:22px;border:1px solid var(--panel-line);background:var(--panel-bg);color:var(--gold);border-radius:14px;cursor:pointer}
  .pad button:active{background:rgba(224,138,44,.18)}
  .pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}
  .pad .mid{grid-column:2;grid-row:2;border:none;background:none;color:var(--ink3);font-size:11px;font-family:var(--sans)}
  .tip{font-family:var(--sans);font-size:11.5px;color:var(--ink3);margin-top:12px;line-height:1.6}
</style>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="nav"><a class="pill" href="./index.html">⌂ 首页</a><a class="pill" href="./fly.html">🚀 飞机大战</a><a class="pill" href="./quiz.html">🕵️ 猜猜</a><a class="pill" href="./passport.html">🎒 足迹</a></div>
  <div class="wrap">
    <h1>🐍 历史贪吃蛇 · 连一连</h1>
    <div class="quest" id="quest"><span class="qk">这道难题,是谁面对的?</span><span id="qtip">…</span></div>
    <div class="hud"><span>连对 <b id="score">0</b></span><span class="lives" id="lives">❤️❤️❤️</span></div>
    <div class="boardwrap">
      <canvas id="cv"></canvas>
      <div class="over" id="over"></div>
    </div>
    <div class="pad">
      <button class="up" onclick="setDir(0,-1)">▲</button>
      <button class="left" onclick="setDir(-1,0)">◀</button>
      <button class="mid">滑动<br>或按键</button>
      <button class="right" onclick="setDir(1,0)">▶</button>
      <button class="down" onclick="setDir(0,1)">▼</button>
    </div>
    <div class="tip" id="srctip"></div>
  </div>
</div>
<script src="./decisions.js?v=6"></script>
<script>
function addTrail(t,id,l){try{var K='civlab_trail_v1',a=JSON.parse(localStorage.getItem(K)||'[]'),k=t+':'+id;if(a.some(x=>x.t+':'+x.id===k))return;a.push({t:t,id:id,l:l,ts:Date.now()});if(a.length>120)a=a.slice(-120);localStorage.setItem(K,JSON.stringify(a));}catch(e){}}
function readTrail(){try{return JSON.parse(localStorage.getItem('civlab_trail_v1'))||[];}catch(e){return[];}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shortName(person){let p=person.split('·')[0].trim();p=p.replace(/(过卢比孔|破釜沉舟|求仙|的复仇|的宽容|的宽待|学中国|的宗教革命|与那只麻雀|的两难|迎客|立法|变法|大义灭亲|放过扫罗|闯冥界|刺秦|之后.*)/,'');return (p||person).slice(0,5);}

const ALL=(window.DECISIONS||[]).filter(d=>d.person&&d.tip);
const N=13;                       // 棋盘格数
const cv=document.getElementById('cv'); const ctx=cv.getContext('2d');
let cell=0, snake=[], dir={x:1,y:0}, nextDir={x:1,y:0}, foods=[], target=null, score=0, lives=3, alive=true, acc=0, last=0, speed=220, best=+(localStorage.getItem('civlab_snake_best')||0);

function pool(){
  const done=new Set(readTrail().filter(x=>x.t==='decision').map(x=>x.id));
  const mine=ALL.filter(d=>done.has(d.id));
  document.getElementById('srctip').innerHTML = mine.length>=4
    ? '出的都是你<b>走过的人物</b>。撞墙会穿到对面,放心冲!'
    : '先随便玩玩——走过更多抉择,蛇身上就全是你认识的人。撞墙会穿到对面。';
  return mine.length>=4?mine:ALL;
}
const POOL=()=>pool();

function resize(){
  const w=cv.clientWidth, dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  cell=w/N; draw();
}
function freeCell(occupied){
  let x,y,tries=0;
  do{ x=Math.floor(Math.random()*N); y=Math.floor(Math.random()*N); tries++; }
  while(tries<200 && occupied.some(o=>o.x===x&&o.y===y));
  return {x,y};
}
function newRound(){
  const P=POOL();
  target=P[Math.floor(Math.random()*P.length)];
  const distract=shuffle(ALL.filter(d=>d.id!==target.id && shortName(d.person)!==shortName(target.person))).slice(0,3);
  const items=shuffle([target,...distract]);
  document.getElementById('qtip').innerHTML='「'+target.tip+'」';
  const occ=snake.slice();
  foods=items.map(d=>{ const c=freeCell(occ); occ.push(c); return {x:c.x,y:c.y,id:d.id,label:shortName(d.person),correct:d.id===target.id}; });
}
function resetSnake(){ const m=Math.floor(N/2); snake=[{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}]; dir={x:1,y:0}; nextDir={x:1,y:0}; }
function start(){ score=0; lives=3; alive=true; speed=220; acc=0; resetSnake(); newRound(); updateHUD(); document.getElementById('over').classList.remove('show'); last=performance.now(); requestAnimationFrame(loop); }

function updateHUD(){ document.getElementById('score').textContent=score; document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives); }
function setDir(x,y){ if(x===-dir.x&&y===-dir.y) return; nextDir={x,y}; }

function tick(){
  dir=nextDir;
  let head={x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};   // 穿墙
  // 撞到自己
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){ loseLife(); return; }
  snake.unshift(head);
  const f=foods.find(o=>o.x===head.x&&o.y===head.y);
  if(f){
    if(f.correct){ score++; if(score>best){best=score;localStorage.setItem('civlab_snake_best',best);} if(score===5||score===10||score===20) addTrail('game','snake','历史贪吃蛇·连对'+score); speed=Math.max(110,speed-6); newRound(); updateHUD(); }
    else { foods=foods.filter(o=>o!==f); snake.pop(); loseLife(true); }
  } else { snake.pop(); }
}
function loseLife(keepRound){
  lives--; updateHUD();
  if(lives<=0){ gameOver(); return; }
  flash();
  resetSnake();
  if(!keepRound) newRound(); else newRound();
}
let flashT=0; function flash(){ flashT=performance.now(); }

function loop(t){
  if(!alive) return;
  acc += t-last; last=t;
  while(acc>=speed){ acc-=speed; tick(); if(!alive) break; }
  draw();
  if(alive) requestAnimationFrame(loop);
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function draw(){
  const w=cv.clientWidth; ctx.clearRect(0,0,w,w);
  // 棋盘点阵
  ctx.fillStyle='rgba(150,120,80,.10)';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){ ctx.beginPath(); ctx.arc((i+.5)*cell,(j+.5)*cell,1.1,0,7); ctx.fill(); }
  // 食物(人物短名,样式一致,不暴露正确项)
  ctx.font='600 '+Math.max(11,cell*0.32)+'px "Noto Sans SC",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  foods.forEach(f=>{
    const cx=(f.x+.5)*cell, cy=(f.y+.5)*cell;
    const tw=ctx.measureText(f.label).width, pw=tw+14, ph=cell*0.74;
    ctx.fillStyle='rgba(255,247,232,.96)'; ctx.strokeStyle='#d4a858'; ctx.lineWidth=1.5;
    rr(cx-pw/2,cy-ph/2,pw,ph,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5a4632'; ctx.fillText(f.label,cx,cy+0.5);
  });
  // 蛇
  const flashing = performance.now()-flashT<260;
  snake.forEach((s,i)=>{
    const pad=cell*0.10, x=s.x*cell+pad, y=s.y*cell+pad, sz=cell-pad*2;
    ctx.fillStyle = i===0 ? (flashing?'#e2603f':'#c86820') : (flashing?'rgba(226,96,63,.6)':'#d4a858');
    rr(x,y,sz,sz,cell*0.28); ctx.fill();
    if(i===0){ ctx.fillStyle='#fff'; const e=cell*0.07; ctx.beginPath(); ctx.arc(x+sz*0.32,y+sz*0.36,e,0,7); ctx.arc(x+sz*0.68,y+sz*0.36,e,0,7); ctx.fill(); }
  });
}
function gameOver(){
  alive=false;
  const reached = score>=5;
  if(reached) addTrail('game','snake','历史贪吃蛇·连对'+score);
  const o=document.getElementById('over');
  o.innerHTML=`<div class="oe">${score>=10?'🏆':(score>=5?'🎉':'🐍')}</div>
    <h2>${score>=10?'蛇王!':(score>=5?'不错哦!':'再来一条!')}</h2>
    <p>这局连对 <b>${score}</b> 组 · 最高 <b>${best}</b></p>
    ${reached?'<p>已在「我的足迹」盖下 🔗 游戏章</p>':'<p style="color:#ccc">连对 5 组就能盖一枚游戏章~</p>'}
    <button class="ob" onclick="start()">↺ 再来一局</button>`;
  o.classList.add('show');
}

// 输入
window.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'||k==='w')setDir(0,-1);else if(k==='ArrowDown'||k==='s')setDir(0,1);else if(k==='ArrowLeft'||k==='a')setDir(-1,0);else if(k==='ArrowRight'||k==='d')setDir(1,0);else return;e.preventDefault();},{passive:false});
let tsx=0,tsy=0;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tsx,dy=t.clientY-tsy;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);},{passive:true});
window.addEventListener('resize',resize);
window.__snake={tick:()=>tick(),state:()=>({score,lives,alive,foods,snake,target})};

if(ALL.length>=4){ resize(); start(); }
else document.getElementById('quest').textContent='题库没加载,请刷新。';
</script>
</body>
</html>
