<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 阿肯那顿的宗教革命 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「天地间,只有一个神——阿顿,光的源头。」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 阿肯那顿(其改革的核心)</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·阿肯那顿的宗教革命"(母题:改革的代价/硬碰既得利益)。史实:古埃及法老阿蒙霍特普四世(Amenhotep IV,约公元前1353—1336在位)在位第5年左右,发动了一场惊人的宗教革命:他废弃埃及传承上千年的众神信仰,只崇拜唯一的太阳神阿顿(Aten,即太阳圆盘),并把自己的名字改为"阿肯那顿"(意为"对阿顿有益者")。他关闭/削弱传统众神(尤其势力最大的阿蒙神)的神庙,削夺了权倾朝野的阿蒙祭司集团的财富与权力,还把都城从底比斯迁到新建的城市阿玛尔纳(古称 Akhetaten,意为"阿顿的地平线")。这被许多学者称为人类历史上第一次已知的"一神教"国家宗教尝试。但是:他死后(约公元前1336年),改革迅速崩溃——新都被废弃,传统众神信仰被全面恢复,他的继承人图坦卡蒙(原名图坦卡顿)改回名字、重立阿蒙;后来的法老更系统地拆毁阿肯那顿的纪念碑、把他的名字从王表中抹去,称他那段时期为"敌人的时代"。教学要点:这是一场"硬碰强大既得利益(祭司集团与千年传统)"的激进改革,生前轰轰烈烈、身后被彻底反扑清算——和中国的吴起、商鞅、王安石变法是同一个母题(改革的代价)。讲述宗教时保持客观中立,只讲史实,不评判信仰。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论。';
const DOSSIER=[
  {i:'☀️',t:'你是谁',b:'你是古埃及法老<b>阿蒙霍特普四世</b>。你统治着当时世界上最富庶、最古老的文明之一。可你心里,藏着一个会震动整个埃及的念头。'},
  {i:'🛕',t:'千年的众神',b:'埃及人<b>上千年</b>来供奉着许许多多的神。其中最有权势的是<b>阿蒙神</b>,他的祭司集团掌握着大量土地、财富和影响力,势力大到<b>连法老都要让三分</b>。'},
  {i:'🌅',t:'你的信仰',b:'可你深信:天地之间,真正的神<b>只有一个</b>——太阳神<b>阿顿</b>,那照亮万物的光之圆盘。你甚至想把自己的名字,改成"<b>阿肯那顿</b>"(意思是"对阿顿有益的人")。'},
  {i:'⚔️',t:'挡在前面的人',b:'要只拜阿顿,就得<b>关掉别的神庙、夺走阿蒙祭司的财富和权力</b>。这等于直接动了埃及最庞大的既得利益集团——他们盘踞已久,绝不会善罢甘休。'},
  {i:'🏗️',t:'一个大胆的计划',b:'你打算干脆<b>迁都</b>:离开旧神盘踞的底比斯,在一片荒地上<b>新建一座只属于阿顿的城市</b>(阿玛尔纳),把整个国家的信仰和中心,推倒重来。'},
  {i:'⏳',t:'眼前的难题',b:'<b>强推这场革命</b>——你或许能创造一个全新的埃及,也可能在身后被疯狂反扑;<b>维持传统</b>——你能换来安稳,却要永远向你不信的众神和祭司低头。'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">约公元前 1350 年 · 古埃及</div>
  <div class="htitle">推翻千年的众神,只拜一个太阳神?</div>
  <div class="hsub">即将由你 —— 阿肯那顿 —— 决定</div>
  <div class="scene">约公元前1350年,你是古埃及法老。埃及人供奉众神已上千年,阿蒙神的祭司集团权势滔天、连法老都要让三分。<br><br>可你深信:真正的神只有一个——太阳神<b>阿顿</b>。你想废掉众神、只拜阿顿,甚至迁都重来。<br><br><b>推,还是不推?</b> 先别急,先把这场惊天革命看清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先弄懂这场革命 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">看清这场惊天革命</div>
  <div class="dossier-intro">点开每一张情报卡,弄懂千年的众神、你的信仰、和挡在前面的人。<br>全部看完,你才有资格替阿肯那顿做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张情报卡后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是阿肯那顿</div>
  <div class="ask">推翻众神,还是维持传统?</div>
  <div class="asksub">改,要硬碰盘踞千年的祭司集团;不改,要永远向你不信的神低头。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>强推革命——废众神、只拜阿顿,夺祭司的权,迁都重建一个全新的埃及。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>维持传统——继续供奉众神、善待祭司,换一个安稳的统治。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>温和并行——既抬高阿顿,也保留旧神,慢慢来、不撕破脸。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">阿肯那顿,选了 A</div>
  <div class="scene">他把名字改成<b>阿肯那顿</b>,雷厉风行地推开了这场革命:抬高阿顿、<b>压制众神</b>,削夺阿蒙祭司的财富与权力,还<b>迁都</b>到一片荒地上新建的城市,把整个埃及的信仰中心连根拔起、推倒重来。<br><br>在那里,艺术、宗教、生活全都焕然一新。这,被许多人称为人类历史上<b>第一次"只拜一个神"的国家尝试</b>。<br><br>可这一切,都系在他一个人身上。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……他死之后呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 一场革命,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 生前</div><div class="lt">举国信仰被强行扭转,新都拔地而起,艺术与宗教大变样。可这场革命<b>几乎只靠他一个人的意志</b>在撑着。</div></div>
    <div class="line"><div class="lh">🥀 身后</div><div class="lt">他一死,革命<b>迅速崩塌</b>:新都被废弃,众神信仰全面恢复;继承人<b>图坦卡蒙</b>(原名图坦卡顿)改回名字、重立阿蒙。</div></div>
    <div class="line"><div class="lh">🗿 被抹去的名字</div><div class="lt">后来的法老更<b>系统地拆毁他的碑刻、抹掉他的名字</b>,把他那段时期称作"敌人的时代"。一场惊天革命,几乎被从历史上<b>擦掉</b>。</div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看这场革命? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一场革命,不同的声音</div>
  <div class="voice"><div class="vw">☀️ 阿肯那顿</div><div class="va">"我看见了真理:神只有一个。哪怕与整个埃及为敌,我也要让世人只朝拜阿顿。"</div></div>
  <div class="voice"><div class="vw">🛕 阿蒙的祭司</div><div class="va">"他夺走我们千年的神、千年的财富与地位!等他一死,我们必让一切回到原样。"</div></div>
  <div class="voice"><div class="vw">👤 一个普通埃及人</div><div class="va">"祖祖辈辈拜的神,说没就没了?新城再美,我心里还是慌的。"</div></div>
  <div class="voice"><div class="vw">📜 后世史家</div><div class="va">"超前一千年的理想,却没有根基。他一个人推得动,却没让它活过他自己。"</div></div>
  <div class="note">同一个抉择,没有标准答案。 · 史料:据阿玛尔纳遗址与碑刻、后世王表</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">它藏着什么规律? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 改革者的宿命</div>
  <div class="scene">阿肯那顿硬碰盘踞千年的既得利益,生前轰轰烈烈,身后却被连根反扑、连名字都被抹去。<br><br>把他和遥远东方的<b>吴起、商鞅、王安石</b>摆在一起,你会看到一条惊人相似的线:<b>触动了太多人利益的激进改革,常常在改革者死后遭到疯狂反扑。</b><br><br>埃及与中国,隔着几千公里、上千年,却讲着同一个故事——这,就是"<b>改革的代价</b>"。它不是说改革错了,而是提醒:改革,光有勇气还不够,还得想办法让它<b>扎下根、活过自己</b>。</div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=egypt_new">🗺 去地图看 古埃及·新王国</a>
    <a class="ghost" href="./decision-shangyang.html">⚖️ 看商鞅变法的同款代价 →</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">当你坚信自己看到了"对的方向",却要硬碰所有人的习惯和利益——你会像阿肯那顿那样<b>一往无前</b>,还是先想办法争取人心?</div>
  <div class="q">他的理想也许超前了一千年,却在身后被抹得干干净净。你觉得,一场改革要想<b>活过改革者自己</b>,最缺的是什么?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和阿肯那顿(A)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你从这场革命看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:只靠一个人意志推动的改变,很难活过那个人——要让它扎根,得先赢得人心……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到抉择,顺着母题线找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'akhenaten',DOSSIER:DOSSIER,beats:beats,reactions:{A:'雷霆万钧的理想主义!可你几乎是独自对抗整个埃及——一旦你不在了,谁来守住这场革命?',
    B:'安稳,但你要一辈子向你并不相信的神低头。心里的那个信念,你压得住吗?',
    C:'温和并行,阻力最小。可旧势力还在,新信仰永远长不大——"慢慢来",有时等于"做不成"。'},confirmLabel:'👉 看真实的阿肯那顿怎么选'};
</script>
<script src="./decision-engine.js?v=1"></script>
<script src="./ai_float.js?v=3"></script>
</body>
</html>
