<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 圣德太子学中国 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「日出之处天子,致书日没之处天子。」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 圣德太子致隋朝国书</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·圣德太子学中国"(母题:面对外面的世界,开门还是关门)。史实:公元7世纪初(约593—622),日本由推古天皇在位、圣德太子摄政。当时隔海相望的中国(隋朝)无比强大先进:有成熟的文字(汉字)、律令制度、佛教、城市与官僚体系。日本相对落后。圣德太子选择主动、大规模地向中国学习:他推行"冠位十二阶"(按才能而非门第授官)、颁布"十七条宪法"(以儒家、佛教思想训诫官员,强调以和为贵、敬重君主),大力推广佛教(他本人是虔诚的佛教徒);并于607年派遣"遣隋使"(由小野妹子率领)出使隋朝。那封著名的国书写道:"日出处天子致书日没处天子,无恙乎"——一方面虚心学习中国,一方面又以"天子"自居、暗示与隋朝皇帝平等(隋炀帝读后不悦,因为这暗示两国君主对等)。结果:日本由此开启了持续学习中国的传统,后来的"大化改新"(645)、派遣"遣唐使",乃至一千多年后的"明治维新"学习西方,都是这种"主动向强者学习"精神的延续。教学要点:这是"面对一个比自己强大先进的外部世界,要开门学习还是关门自守"的抉择;它和明朝郑和下西洋后选择"关门内向"形成鲜明对照(同一母题的两个相反答案)。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论。';
const DOSSIER=[
  {i:'🎌',t:'你是谁',b:'你是<b>圣德太子</b>,日本的摄政(替天皇主持朝政)。这时的日本,还相对年轻、质朴,制度和文字都不算成熟。'},
  {i:'🌊',t:'海那边的巨人',b:'隔着大海,是当时世界上最强大先进的国家之一——中国(<b>隋朝</b>)。那里有成熟的<b>文字、律法、佛教、城市和官僚制度</b>,样样都让你羡慕。'},
  {i:'📚',t:'诱人,也扎心',b:'去学中国,意味着<b>承认自己不如人</b>、放下身段去当学生。骄傲的人会说:"我们有自己的传统,何必去学外国那一套?"可不学,差距只会越拉越大。'},
  {i:'⚖️',t:'又想学、又不想低头',b:'还有个难处:你既想学中国的本事,又<b>不愿被当成中国的属国</b>、向它称臣。学,怎么学得有骨气、有分寸?'},
  {i:'🛳️',t:'一个大胆的计划',b:'你打算派一支正式的<b>使团渡海</b>去隋朝(遣隋使),带去国书、带回知识;同时在国内推行<b>按才能授官、颁布治国的训条、推广佛教</b>,把中国的长处搬回来改造日本。'},
  {i:'✉️',t:'眼前的难题',b:'你甚至想在国书里写上"<b>日出处天子致书日没处天子</b>"——既虚心求学,又把日本和中国摆在<b>平等</b>的位置。<b>开门去学,还是守着自己的传统?</b>'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">约公元 607 年 · 日本 · 飞鸟</div>
  <div class="htitle">放下身段,去学海那边的强国吗?</div>
  <div class="hsub">即将由你 —— 圣德太子 —— 决定</div>
  <div class="scene">约公元607年,你是日本的摄政<b>圣德太子</b>。隔海的中国(隋朝)无比强大先进:有文字、律法、佛教、成熟的制度。<br><br>去学,要承认不如人、放下身段当学生;不学,差距只会越拉越大。可你又不愿向中国<b>称臣</b>。<br><br><b>开门学习,还是守住传统?</b> 先别急,先把这道难题看清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先弄懂这道难题 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">看清这道难题</div>
  <div class="dossier-intro">点开每一张情报卡,弄懂海那边的强国、学习的纠结、和你的分寸。<br>全部看完,你才有资格替圣德太子做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张情报卡后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是圣德太子</div>
  <div class="ask">开门学习,还是守住传统?</div>
  <div class="asksub">学,要放下骄傲当学生;不学,差距越拉越大。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>开门学习——派使团去中国,引入文字、佛教、制度;但以平等自居,绝不称臣。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>关门自守——保住自己的传统,不去学外国那一套,免得被看轻。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>全盘照搬并称臣——承认是中国属国,换取庇护和好处。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">圣德太子,选了 A</div>
  <div class="scene">他选择<b>开门学习,但绝不低头</b>。607年,他派出正式使团(遣隋使)渡海赴隋,还在国书里写下那句惊人的话:"<b>日出处天子致书日没处天子</b>"——一边虚心求学,一边把日本和中国摆在<b>平等</b>的位置(隋炀帝读了,很不高兴)。<br><br>在国内,他推行<b>按才能授官</b>、颁布治国的<b>十七条训诫</b>、大力<b>推广佛教</b>,把中国的长处一样样搬回来,用来改造日本。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……它带来了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 开门这一步,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 短期</div><div class="lt">一批批<b>留学生、学问僧</b>渡海去中国,把文字、佛教、典章制度带回日本,国家面貌焕然一新。</div></div>
    <div class="line"><div class="lh">🌅 长远</div><div class="lt">它开启了日本<b>"善于向强者学习"</b>的千年传统:后来的"大化改新"、派遣唐使,甚至一千多年后<b>明治维新学习西方</b>,都是这种精神的延续。</div></div>
    <div class="line"><div class="lh">⚖️ 分寸</div><div class="lt">最难得的是那份<b>分寸</b>:学它的本事,却不卑躬屈膝。"日出处天子"五个字,说的正是——<b>我可以学你,但我和你平等。</b></div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看这件事? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一个选择,不同的声音</div>
  <div class="voice"><div class="vw">🎌 圣德太子</div><div class="va">"学习强者,不是丢人;固步自封,才会真的落后。但我们,要平起平坐地学。"</div></div>
  <div class="voice"><div class="vw">🧓 一个守旧的贵族</div><div class="va">"放着祖宗的规矩不要,去学外国那一套?我们的传统,难道不够好吗?"</div></div>
  <div class="voice"><div class="vw">👑 隋炀帝</div><div class="va">"'日出处天子致日没处天子'?竟敢与我平起平坐!这个海东小国,好大的口气。"</div></div>
  <div class="voice"><div class="vw">📜 后世史家</div><div class="va">"敢于向更强者学习、又不失自己的骨气——这成了日本此后一千多年最重要的本事之一。"</div></div>
  <div class="note">同一个抉择,没有标准答案。 · 史料:据《日本书纪》《隋书》</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">它藏着什么规律? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 面对外面的世界:开门,还是关门</div>
  <div class="scene">面对一个比自己强大先进的邻居,圣德太子没有自卑、也没有自大,而是<b>大大方方地开门去学</b>——学它的长处,又守住自己的骨气。日本,从此踏上了不断向强者学习、自我更新的路。<br><br>可历史也有另一面:八百多年后,中国的<b>明朝</b>,本是世界领先的航海强国,郑和的大船队远达非洲——却在最强盛时<b>收起船队、关上大门、转向内向</b>,恰逢欧洲扬帆出海。<br><br>同样面对"外面的世界",一个<b>开门</b>,一个<b>关门</b>。几百年后,两国的命运,因此走向了截然不同的方向。</div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=heian">🗺 去地图看 日本</a>
    <a class="ghost" href="./decision-zhenghe.html">⛵ 看明朝"关门"的相反选择 →</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">当别人比你强,你会<b>放下面子去学</b>,还是嘴硬说"我有自己的一套"?哪一种,更需要勇气和自信?</div>
  <div class="q">圣德太子学中国,却坚持"我们平等"。你觉得,<b>一边学习别人、一边不丢掉自己</b>,难在哪里?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和圣德太子(A)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:向比自己强的人学习不丢人,固步自封才会真的落后——但要学得有骨气……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到抉择,顺着母题线找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'shotoku',DOSSIER:DOSSIER,beats:beats,reactions:{A:'虚心又有骨气,了不起!可放下身段去学、还要顶住"崇洋"的非议——你扛得住吗?',
    B:'守住传统,听着有志气。可邻居一日千里,你原地踏步,差距只会越来越大——真的好吗?',
    C:'全盘照搬还称臣?学是学到了,骨气却丢了。换来的庇护,值得用尊严去换吗?'},confirmLabel:'👉 看真实的圣德太子怎么选'};
</script>
<script src="./decision-engine.js?v=1"></script>
<script src="./ai_float.js?v=3"></script>
</body>
</html>
