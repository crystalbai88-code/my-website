<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>形态 B · 时间列车 · 早期文明</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080810; --paper:#fdf8ed; --ink:#1a1410; --ink2:#5c4530; --ink3:#8a7050;
  --gold:#d4a858; --vermilion:#c84820;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:white;overflow:hidden}

.topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:30;background:rgba(8,8,16,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,168,88,.2);display:flex;align-items:center;gap:14px;padding:0 22px}
.topbar .home{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.18em}
.topbar h1{font-family:var(--serif);font-size:14px;color:#f5e8c8;font-weight:700}
.topbar h1 em{color:var(--gold);font-style:normal;margin-left:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em}

/* 列车轨道 (顶部进度) */
.rail{position:fixed;top:54px;left:0;right:0;height:80px;z-index:20;background:linear-gradient(180deg,rgba(8,8,16,.95),rgba(8,8,16,.7));backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,168,88,.15)}
.rail-track{position:absolute;top:50%;left:5%;right:5%;height:2px;background:linear-gradient(90deg,rgba(212,168,88,.6),rgba(212,168,88,.2));transform:translateY(-50%)}
.rail-cars{position:absolute;top:50%;left:5%;right:5%;height:60px;transform:translateY(-50%);display:flex;justify-content:space-between;align-items:center}
.car-dot{
  width:60px;height:60px;border-radius:14px;cursor:pointer;
  background:rgba(212,168,88,.08);border:1.5px solid rgba(212,168,88,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:rgba(212,168,88,.6);
  transition:all .25s;font-weight:700;letter-spacing:.06em;
}
.car-dot:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px)}
.car-dot .ic{font-size:22px;margin-bottom:1px}
.car-dot.done{background:rgba(212,168,88,.15);border-color:var(--gold);color:var(--gold)}
.car-dot.current{background:var(--gold);border-color:var(--gold);color:#1a1410;transform:translateY(-5px) scale(1.08);box-shadow:0 8px 20px rgba(212,168,88,.5)}
.car-dot.locked{opacity:.3;cursor:not-allowed}

/* 主车厢窗口 */
.cabin{position:fixed;top:134px;left:0;right:0;bottom:0;overflow:hidden}
.car-page{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.4,1,.6,1),opacity .4s}
.car-page.exiting{transform:translateX(-100%);opacity:0}
.car-page.entering{transform:translateX(100%);opacity:0}

/* 窗外风景 (上半) */
.window{height:38%;min-height:240px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 40px;color:white}
.window .scene{position:absolute;inset:0;z-index:0}
.window .scene::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.6) 100%)}
.window .clouds{position:absolute;inset:0;opacity:.3;background:radial-gradient(2px 1px at 10% 30%,#fff,transparent),radial-gradient(3px 1.5px at 60% 20%,#fff,transparent),radial-gradient(2px 1px at 85% 40%,#fff,transparent)}
.window .icon{font-size:48px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4));position:relative;z-index:1;margin-bottom:8px}
.window h2{font-family:var(--serif);font-size:44px;font-weight:900;position:relative;z-index:1;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.window .range{font-family:var(--mono);font-size:13px;letter-spacing:.2em;opacity:.85;margin-bottom:4px;position:relative;z-index:1}
.window .question{font-family:var(--serif);font-size:15px;line-height:1.6;margin-top:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;max-width:620px;position:relative;z-index:1}

/* 车厢内部 (下半，米黄底) */
.interior{flex:1;background:var(--paper);color:var(--ink);overflow-y:auto;padding:24px 40px 100px}
.section-title{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--vermilion);margin:0 0 14px;padding-bottom:6px;border-bottom:2px solid rgba(200,72,32,.2);display:flex;align-items:center;gap:8px}
.world-ctx{font-family:var(--serif);font-size:13.5px;line-height:1.7;color:var(--ink2);background:linear-gradient(135deg,rgba(212,168,88,.12),rgba(200,72,32,.06));border:1px solid rgba(212,168,88,.25);border-radius:12px;padding:12px 16px;margin-bottom:20px}
.world-ctx::before{content:'🌐 ';color:var(--vermilion)}

/* 文明卡 */
.civ-card{background:white;border-radius:12px;margin-bottom:12px;border:1px solid rgba(160,100,30,.18);overflow:hidden;transition:all .25s}
.civ-card.expanded{box-shadow:0 6px 20px rgba(160,100,30,.15);border-color:var(--gold)}
.civ-head{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:56px}
.civ-head:hover{background:rgba(212,168,88,.05)}
.dot-ic{width:44px;height:44px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.civ-head .info{flex:1;min-width:0}
.civ-head .name{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
.civ-head .l1{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5}
.state-chip{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:99px;letter-spacing:.08em;font-weight:700;flex-shrink:0;background:rgba(212,168,88,.15);color:#8a6028}
.state-chip[data-state="巅峰"]{background:rgba(60,160,80,.15);color:#2a6038}
.state-chip[data-state="崩溃"],.state-chip[data-state="集体崩溃"]{background:rgba(200,72,32,.15);color:var(--vermilion)}
.expand-ic{width:30px;height:30px;border-radius:50%;background:rgba(212,168,88,.1);color:var(--vermilion);display:flex;align-items:center;justify-content:center;font-size:12px;transition:transform .25s;flex-shrink:0}
.civ-card.expanded .expand-ic{transform:rotate(180deg)}
.civ-body{display:none;padding:4px 18px 18px;border-top:1px dashed rgba(160,100,30,.2)}
.civ-card.expanded .civ-body{display:block}
.layer{margin-top:14px;animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.l-label{font-family:var(--mono);font-size:9px;color:var(--vermilion);letter-spacing:.18em;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.l-text{font-family:var(--serif);font-size:14px;line-height:1.8;color:var(--ink)}
.narrative{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(245,232,200,.5));border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 10px 10px 0;font-family:var(--serif);font-size:13.5px;line-height:1.9;color:var(--ink)}
.narrative p{margin-bottom:12px}.narrative p:last-child{margin-bottom:0}
.evt-list,.person-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.evt-item,.person-item{background:rgba(245,232,200,.4);border:1px solid rgba(160,100,30,.15);border-radius:10px;padding:11px 14px}
.evt-item .ti,.person-item .ti{font-weight:700;color:var(--ink);font-size:13px;font-family:var(--serif);margin-bottom:3px}
.evt-item .meta,.person-item .meta{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em}
.evt-item .body,.person-item .body{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:5px}
.reveal-btn{margin-top:12px;width:100%;padding:10px 14px;border-radius:10px;border:1.5px dashed rgba(200,72,32,.4);background:transparent;cursor:pointer;color:var(--vermilion);font-family:var(--serif);font-size:12.5px;font-weight:600}
.reveal-btn:hover{background:rgba(200,72,32,.06);border-style:solid}

/* 列车控制 (底部固定，像列车控制台) */
.controls{position:fixed;bottom:0;left:0;right:0;height:80px;z-index:25;background:linear-gradient(180deg,rgba(8,8,16,.5),rgba(8,8,16,.95) 30%);backdrop-filter:blur(16px);border-top:1px solid rgba(212,168,88,.2);display:flex;align-items:center;justify-content:center;gap:20px;padding:0 24px}
.controls button{min-height:44px;border-radius:12px;border:1px solid rgba(212,168,88,.3);background:rgba(212,168,88,.08);color:var(--gold);font-family:var(--serif);font-size:13px;font-weight:600;cursor:pointer;padding:0 18px;display:flex;align-items:center;gap:6px;transition:all .15s}
.controls button:hover:not(:disabled){background:var(--gold);color:#1a1410;border-color:var(--gold)}
.controls button:disabled{opacity:.35;cursor:not-allowed}
.controls .primary{background:var(--gold);color:#1a1410;border-color:var(--gold);padding:0 24px;font-size:14px;letter-spacing:.04em}
.controls .ctx{color:rgba(212,168,88,.7);font-family:var(--mono);font-size:11px;letter-spacing:.18em}

/* 总汇车厢 */
.terminal{background:#fdf8ed;color:var(--ink);height:100%;overflow-y:auto;padding:40px 48px 100px}
.terminal .th{text-align:center;margin-bottom:30px}
.terminal h2{font-family:var(--serif);font-size:34px;font-weight:900;color:var(--ink);margin-bottom:6px}
.terminal .sub{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:12px;color:var(--ink3);text-transform:uppercase}
.gantt{display:grid;grid-template-columns:140px repeat(5,1fr) 1.8fr;background:white;border-radius:14px;overflow:hidden;border:1px solid rgba(160,100,30,.2);margin-bottom:30px}
.gh{padding:10px;background:rgba(212,168,88,.15);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--vermilion);letter-spacing:.08em;border-bottom:1px solid rgba(160,100,30,.2);text-align:center}
.gh:first-child{text-align:left}.gh.legacy{background:rgba(200,72,32,.12)}
.gc{padding:10px;border-bottom:1px solid rgba(160,100,30,.1);min-height:48px;display:flex;align-items:center}
.gc.civ-name{font-family:var(--serif);font-weight:700;font-size:12.5px;background:rgba(245,232,200,.3)}
.gc.block{position:relative;padding:0}
.gc .bar{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border-radius:4px}
.gc .bar.peak{opacity:1}.gc .bar.rise,.gc .bar.fade{opacity:.5}
.gc.legacy-cell{font-size:11px;color:var(--ink2);line-height:1.5;background:rgba(200,72,32,.04)}
.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.legacy-card{background:white;border:1px solid rgba(160,100,30,.18);border-radius:12px;padding:14px 16px}
.legacy-card .what{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--vermilion);margin-bottom:3px}
.legacy-card .from{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.08em;margin-bottom:6px}
.legacy-card .why{font-size:12.5px;line-height:1.6;color:var(--ink2)}
.legacy-h{font-family:var(--serif);font-size:22px;font-weight:900;margin:24px 0 14px;text-align:center}

@media (max-width:768px){
  .window{padding:20px}.window h2{font-size:30px}
  .interior{padding:18px}
  .gantt{grid-template-columns:80px repeat(5,1fr) 1.4fr;font-size:10px}
  .gh,.gc{padding:5px}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="./civ-explorer-compare.html" class="home">← 对比页</a>
  <h1>早期文明 · 时间列车 <em>FORM B</em></h1>
</div>

<div class="rail">
  <div class="rail-track"></div>
  <div class="rail-cars" id="rail"></div>
</div>

<div class="cabin" id="cabin"></div>

<div class="controls">
  <button id="prev" onclick="prev()">◀ 上一节</button>
  <div class="ctx" id="ctx">CAR 1 / 5</div>
  <button id="next" class="primary" onclick="next()">下一节 ▶</button>
</div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
let cur = 0; const done = new Set([0]);

function renderRail(){
  const r = document.getElementById('rail');
  r.innerHTML = CHAPTERS.map((c,i)=>{
    let cls = '';
    if (i===cur) cls='current';
    else if (done.has(i)) cls='done';
    return `<button class="car-dot ${cls}" onclick="goTo(${i})" title="${c.title}"><span class="ic">${c.icon}</span><span>CAR ${c.no}</span></button>`;
  }).join('') + `<button class="car-dot ${cur===5?'current':(done.size>=5?'done':'locked')}" onclick="if(done.size>=5)goTo(5)" title="终点站"><span class="ic">🏁</span><span>END</span></button>`;
  document.getElementById('prev').disabled = cur===0;
  const n = document.getElementById('next');
  if (cur===5) { n.textContent='已到终点'; n.disabled=true; }
  else if (cur===4) { n.textContent='🏁 到终点站 ▶'; n.disabled=false; }
  else { n.textContent='下一节 ▶'; n.disabled=false; }
  document.getElementById('ctx').textContent = cur===5 ? '🏁 终点站 · 全景' : `CAR ${cur+1} / 5`;
}

function getCivInfo(id){
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f;
  }
  const fb = {egypt_predynastic:{name:'古埃及·前王朝',icon:'🌅',color:'#d4b870'},indus_early:{name:'印度河早期',icon:'🏘',color:'#a070d4'}};
  return fb[id] || {name:id,icon:'🏛',color:'#888'};
}

function renderCar(ch){
  return `<div class="car-page">
    <div class="window">
      <div class="scene" style="background:${ch.mood_grad}"></div>
      <div class="clouds"></div>
      <div class="icon">${ch.icon}</div>
      <div class="range">CAR ${ch.no} · ${ch.range} BCE</div>
      <h2>${ch.title}</h2>
      <div class="question">💭 ${ch.hero_question}</div>
    </div>
    <div class="interior">
      <div class="world-ctx">${ch.world_context}</div>
      <h3 class="section-title">🏛 本节车厢的文明 · ${ch.active_civs.length} 个</h3>
      ${ch.active_civs.map((cv,idx)=>{
        const info = getCivInfo(cv.id);
        return `<div class="civ-card" id="c-${idx}">
          <div class="civ-head" onclick="toggle(${idx})">
            <div class="dot-ic" style="background:${info.color}">${info.icon}</div>
            <div class="info"><div class="name">${info.name}</div><div class="l1">${cv.L1||''}</div></div>
            <span class="state-chip" data-state="${cv.state}">${cv.state}</span>
            <div class="expand-ic">▼</div>
          </div>
          <div class="civ-body">
            <div class="layer"><div class="l-label">L2 · 此期状态</div><div class="l-text">${cv.L2||cv.in_period_summary||''}</div></div>
            ${cv.L3_events?.length ? `<button class="reveal-btn" onclick="reveal(${idx},3)" id="r3-${idx}">▼ 继续 · ${cv.L3_events.length} 个关键事件 (L3)</button><div id="l3-${idx}" style="display:none" class="layer"><div class="l-label">L3 · 关键事件</div><div class="evt-list">${cv.L3_events.map(eid=>{const e=(typeof EVENT_DEEP!=='undefined')?EVENT_DEEP[eid]:null;if(!e)return `<div class="evt-item"><div class="ti">📅 ${eid}</div><div class="meta">深度待补</div></div>`;return `<div class="evt-item"><div class="ti">📅 ${e.full_title}</div><div class="meta">${e.one_liner||''}</div><div class="body">${(e.narrative||'').slice(0,200).trim()}...</div></div>`;}).join('')}</div></div>` : ''}
            ${cv.L4_people?.length ? `<button class="reveal-btn" onclick="reveal(${idx},4)" id="r4-${idx}">▼ 继续 · ${cv.L4_people.length} 个关键人物 (L4)</button><div id="l4-${idx}" style="display:none" class="layer"><div class="l-label">L4 · 关键人物</div><div class="person-list">${cv.L4_people.map(pid=>{const p=(typeof PERSON_DEEP!=='undefined')?PERSON_DEEP[pid]:null;if(!p)return `<div class="person-item"><div class="ti">${pid}</div><div class="meta">深度待补</div></div>`;return `<div class="person-item"><div class="ti">${p.full_name}</div><div class="meta">${p.lifespan_real||p.lifespan_mythic||''}</div><div class="body">${(p.biography||'').slice(0,220).trim()}...</div></div>`;}).join('')}</div></div>` : ''}
            ${cv.L5_full ? `<button class="reveal-btn" onclick="reveal(${idx},5)" id="r5-${idx}">▼ 继续 · 完整文明叙事 (L5)</button><div id="l5-${idx}" style="display:none" class="layer"><div class="l-label">L5 · 完整叙事</div><div class="narrative">${((typeof CIV_DEEP!=='undefined'&&CIV_DEEP.sumer)?CIV_DEEP.sumer.opening_narrative:'').trim().split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('')}</div></div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderTerminal(){
  return `<div class="terminal">
    <div class="th"><h2>🏁 终点站 · 2500 年世界全景</h2><div class="sub">FROM 3500 BCE TO 1000 BCE</div></div>
    <div class="gantt">
      <div class="gh">文明</div>
      <div class="gh">CAR1<br>3500-3000</div><div class="gh">CAR2<br>3000-2500</div><div class="gh">CAR3<br>2500-2000</div><div class="gh">CAR4<br>2000-1500</div><div class="gh">CAR5<br>1500-1000</div>
      <div class="gh legacy">今天保留</div>
      ${FINAL_OVERVIEW.civs.map(cv=>{
        let row = `<div class="gc civ-name">${cv.name}</div>`;
        for (let ch=1; ch<=5; ch++){
          const s = cv.spans.find(x=>x[0]===ch);
          if (s) row += `<div class="gc block"><div class="bar ${s[1].split('_')[0]}" style="background:${cv.color}"></div></div>`;
          else row += `<div class="gc block"></div>`;
        }
        row += `<div class="gc legacy-cell">${cv.legacy}</div>`;
        return row;
      }).join('')}
    </div>
    <h3 class="legacy-h">🎁 今天我们保留了什么</h3>
    <div class="legacy-grid">
      ${FINAL_OVERVIEW.today_legacy.map(l=>`<div class="legacy-card"><div class="what">${l.what}</div><div class="from">来自 · ${l.from}</div><div class="why">${l.why}</div></div>`).join('')}
    </div>
  </div>`;
}

function render(){
  document.getElementById('cabin').innerHTML = cur===5 ? renderTerminal() : renderCar(CHAPTERS[cur]);
  renderRail();
}
function toggle(i){ document.getElementById('c-'+i).classList.toggle('expanded'); }
function reveal(i,n){ document.getElementById(`l${n}-${i}`).style.display='block'; document.getElementById(`r${n}-${i}`).style.display='none'; }
function next(){ done.add(cur); if (cur<5) cur++; render(); }
function prev(){ if (cur>0) cur--; render(); }
function goTo(i){ if (i===5 && done.size<5) return; cur=i; render(); }

render();
window.toggle=toggle; window.reveal=reveal; window.next=next; window.prev=prev; window.goTo=goTo;
</script>
</body>
</html>
