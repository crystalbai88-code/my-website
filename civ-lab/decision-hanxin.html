<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 韩信三分天下 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「狡兔死,走狗烹;飞鸟尽,良弓藏。」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 韩信 · 《史记·淮阴侯列传》</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·韩信三分天下"(母题:功高震主,与商鞅同一条找规律线)。背景据《史记·淮阴侯列传》:公元前203年,韩信已平定齐地、受封齐王,手握当时最强军队,刘邦与项羽在荥阳—成皋一线相持不下,韩信站哪边哪边赢。谋士蒯通劝他趁势自立、"参分天下,鼎足而立",项羽也派武涉来劝他中立;但韩信感念刘邦"解衣推食"之恩(载我以其车、衣我以其衣、食我以其食),不忍背叛,拒绝了。结果助刘邦在垓下灭项羽、天下归汉。然而功高震主:刘邦此后夺其兵权,由齐王改楚王、再贬为淮阴侯;公元前196年刘邦外出征陈豨,吕后与萧何合谋骗韩信入长乐宫,斩于钟室、夷三族。韩信临终叹"悔不用蒯通之计,乃为儿女子所诈"。"成也萧何,败也萧何""狡兔死、走狗烹"皆出于此。这是一个没有标准答案的抉择:报恩本身没错,却换来杀身之祸。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论。';
const DOSSIER=[
  {i:'🙇',t:'你是谁',b:'你是<b>韩信</b>。年轻时穷困潦倒,受过<b>胯下之辱</b>(从恶少胯下钻过),靠漂洗衣服的老妇人施饭活命。<br>你投奔项羽不被重用,转投刘邦——若不是丞相<b>萧何月下把你追回来</b>、力荐为大将,你早已默默无闻。'},
  {i:'⚔️',t:'你的战功',b:'拜将之后,你打的仗几乎没输过:<b>暗度陈仓</b>夺三秦、<b>背水一战</b>大破赵军、收燕定齐……<br>"战必胜、攻必取",后人尊你为"<b>兵仙</b>"。如今你刚刚平定齐地,受封<b>齐王</b>。'},
  {i:'🌏',t:'此刻的天下',b:'刘邦(汉)和项羽(楚)在荥阳—成皋一线<b>死死相持、谁也吃不掉谁</b>。<br>而你,手握当时<b>最强的一支军队</b>,又据有富庶的齐地。<b>你帮谁,谁就赢</b>——这天下的天平,正握在你一个人手里。'},
  {i:'🗣️',t:'来劝你的人',b:'两路人马同时来找你:<ul><li><b>武涉</b>(项羽的使者):别再帮刘邦了,保持中立吧。</li><li><b>蒯通</b>(你的谋士):时机就在眼前!不如<b>自立为王,三分天下、鼎足而立</b>。他还给你看相:"相你的脸,不过封侯;相你的背,贵不可言。"</li></ul>'},
  {i:'🤝',t:'刘邦待你',b:'可你忘不了刘邦对你的好:把自己的车给你坐、自己的衣给你穿、自己的饭给你吃(<b>解衣推食</b>)。<br>前不久你开口要个"代理齐王",他虽然恼火,最后还是<b>封了你真齐王</b>。你心想:乘人之车要分人之忧,吃人之饭要为人卖命——我怎能为了好处背弃恩义?'},
  {i:'⚡',t:'眼前的难题',b:'天平在你手里,而你只有一次出手的机会:<br>是听蒯通的<b>自立、三分天下</b>?是念着旧恩<b>继续忠于刘邦</b>?还是谁也不帮、<b>坐山观虎斗</b>?<br>这一步,既决定天下归谁,也决定你自己的生死。'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">公元前 203 年 · 齐</div>
  <div class="htitle">天下的天平,握在你一个人手里</div>
  <div class="hsub">即将由你 —— 韩信 —— 决定</div>
  <div class="scene">公元前203年,你是刚刚封王的<b>齐王韩信</b>。从胯下之辱,到手握天下最强的军队,你只用了几年。<br><br>此刻,刘邦和项羽僵持不下,而你帮谁谁就赢。你即将做一个决定——它决定天下归谁,也决定<b>你自己将来的下场</b>。<br><br>但是——<b>在你决定之前,先别急。</b> 先把这盘棋,看清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先弄懂这盘棋 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">看清这盘棋</div>
  <div class="dossier-intro">点开下面每一张情报卡,弄懂你的来历、你的力量、和劝你的人。<br>全部看完,你才有资格替韩信做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张情报卡后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是韩信</div>
  <div class="ask">自立,还是报恩?</div>
  <div class="asksub">你已经看清了整盘棋——天下的天平在你手里,蒯通劝你自立,刘邦对你恩重如山。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>自立为王——听蒯通的,三分天下、鼎足而立,自己当老大。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>继续忠于刘邦——他待我恩重如山,我不能背弃恩义。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>按兵不动、保持中立——谁也不帮,坐观成败。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">韩信,选了 B</div>
  <div class="scene">他拒绝了蒯通,说出了那句话:"汉王对我恩重如山——<b>乘人之车,要分担人的忧患;穿人之衣,要挂念人的心事;吃人之饭,要为人去拼命。</b>我怎么能贪图好处、背弃恩义呢?"<br><br>于是他全力帮刘邦,在<b>垓下</b>用十面埋伏围死项羽,逼得西楚霸王乌江自刎。<b>天下,归了汉。</b><br><br>韩信选择了报恩。可他没有想到:他立下的功劳越大,等着他的命运,就越凶险。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……后来呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 一个决定,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 短期</div><div class="lt">垓下一战灭项羽,天下归汉。韩信功盖天下,改封楚王,衣锦还乡——还重赏了当年施饭给他的漂母。</div></div>
    <div class="line"><div class="lh">🌅 长远(他的功业)</div><div class="lt">他的兵法和战例(背水一战、十面埋伏…)流传千古,被尊为"<b>兵仙</b>",是后世兵家必学的教科书。</div></div>
    <div class="line"><div class="lh">🥀 他自己</div><div class="lt">刘邦忌惮他兵权太重:<b>楚王 → 贬为淮阴侯</b>。前196年刘邦外出平叛,<b>吕后与萧何骗他入长乐宫,斩于钟室,夷灭三族</b>。临终他才悔叹:"悔不听蒯通的话啊!"——"<b>成也萧何,败也萧何</b>"。</div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看他的结局? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一个韩信,不同的声音</div>
  <div class="voice"><div class="vw">🗣️ 蒯通(他的谋士)</div><div class="va">"我早就提醒过你——'<b>功劳盖过天下的人,是赏无可赏的;威望震动君主的人,处境最危险</b>'。你偏不听啊。"</div></div>
  <div class="voice"><div class="vw">👑 刘邦 / 吕后</div><div class="va">"他用兵天下无双、威望太高。当年靠他打天下,如今天下定了——这样的人留着,我睡不安稳。"</div></div>
  <div class="voice"><div class="vw">📜 司马迁</div><div class="va">"假如韩信懂得谦让、不夸耀自己的功劳,他对汉朝的功勋,几乎可比周公。可惜他功成之后,<b>不知道收</b>。"</div></div>
  <div class="voice"><div class="vw">🍚 一个百姓</div><div class="va">"他从胯下之辱一路走到封王,最后却落得夷灭三族。世事啊,真是说不清。"</div></div>
  <div class="note">同一个结局,没有标准答案。 · 史料:《史记·淮阴侯列传》</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">他的死,改变了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 一句话,成了悬在功臣头上的刀</div>
  <div class="scene">被擒的那一刻,韩信说了一句流传千古的话:<br>"果然像人们说的——'<b>狡兔死,走狗烹;飞鸟尽,良弓藏;敌国破,谋臣亡</b>'。天下已经平定,我本来就该被煮掉了!"<br><br>他的死,是汉初诛杀功臣的开始:彭越、英布……一个接一个被除掉。<br><br>从此,"<b>兔死狗烹</b>"成了悬在每一个功臣良将头上的一把刀,也给后世留下一个永远的难题:<b>立了天大的功劳之后,人,到底该怎么办?</b></div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=xihan">🗺 去地图看 西汉</a>
    <a class="ghost" href="./classical-network.html?all=1">🕸 看这个时代的人物关系网</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">报恩,明明没有错。可韩信的报恩,为什么换来了<b>杀身之祸</b>?问题出在他,还是出在这个<b>局</b>?</div>
  <div class="q">商鞅(变法功臣)和韩信(开国功臣),都立下不世之功,都被自己<b>效力的国家</b>杀掉。这是巧合,还是藏着同一条<b>规律</b>?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和韩信(B)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你从韩信的抉择里,看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:功劳太大、又不知道收,本身就会变成危险……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到「功高震主」这条线:和商鞅放一起找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'hanxin',DOSSIER:DOSSIER,beats:beats,reactions:{A:'你敢赌!可三分天下胜负难料,而且背恩自立,天下人会怎么看你?',
    B:'重情重义。可历史会问你一句:对一个开始猜忌你的君主,光讲恩义,够保命吗?',
    C:'想两头不得罪。但你手握决定胜负的力量却按兵不动——两边都会记恨这样的你。'},confirmLabel:'👉 看真实的韩信怎么选'};
</script>
<script src="./decision-engine.js?v=1"></script>
<script src="./ai_float.js?v=2"></script>
</body>
</html>
