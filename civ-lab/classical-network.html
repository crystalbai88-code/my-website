<style>
  html,body{height:100%;overflow:hidden}
  #app{position:relative;z-index:10;display:flex;flex-direction:column;height:100vh}
  .nav{display:flex;align-items:center;gap:10px;padding:12px 18px 4px;flex-wrap:wrap}
  .nav .title{font-family:var(--serif);font-weight:900;font-size:16px;color:var(--ink);text-shadow:var(--label-shadow)}
  .nav .sub{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.1em}
  .civ-row{display:flex;gap:8px;padding:8px 18px 10px;flex-wrap:wrap;align-items:center}
  .civ-pill{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:var(--r-pill);padding:6px 15px;cursor:pointer;transition:all .15s;backdrop-filter:blur(10px)}

  #canvas-wrap{flex:1;position:relative;overflow:hidden}
  canvas{position:absolute;inset:0;cursor:grab}

  #panel{position:absolute;right:14px;top:14px;width:250px;max-height:calc(100vh - 130px);overflow-y:auto;display:none;padding:0}
  #panel.show{display:block}
  #panel .p-pad{padding:15px 17px}
  .p-civ{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .p-name{font-family:var(--serif);font-size:20px;font-weight:900;color:var(--ink);line-height:1.2;margin-top:3px}
  .p-eng{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}

  .p-rels h4{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.1em;margin-bottom:7px;text-transform:uppercase}
  .rel-item{font-size:12px;color:var(--ink);padding:4px 0;display:flex;gap:6px;cursor:pointer;align-items:flex-start;transition:color .12s}
  .rel-item:hover{color:var(--gold)}
  .rel-type{color:var(--ink2);font-size:10px;flex-shrink:0;margin-top:1px;background:rgba(128,128,128,.16);padding:1px 6px;border-radius:6px}
  .legend{position:absolute;left:14px;bottom:14px;font-size:11px}
  .leg-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;color:var(--ink2)}
  .leg-row:last-child{margin-bottom:0}
  .leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#888}
  .stats{position:absolute;left:14px;top:14px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
  .hint{position:absolute;bottom:14px;right:14px;font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:right;max-width:46%}
  @media(max-width:768px){ #panel{width:calc(100vw - 28px)} .legend{display:none} }
</style>

<script>
const CIV_NAMES={china:"中国",greece:"希腊",rome:"罗马",persia:"波斯",india:"印度/佛教",near_east:"西亚",levant:"黎凡特",cross:"跨文明"};
const ROLE_NAMES={ruler:"统治者",general:"将领",thinker:"思想家",religious:"宗教人物",other:"其他人物"};
// 节点按角色着色，色值映射到设计系统变量，主题切换时刷新
const ROLE_VAR={ruler:'--gold',general:'--vermilion',thinker:'--cyan',religious:'--purple',other:'--ink3'};
let TH={role:{}};
function refreshTheme(){
  const cs=getComputedStyle(document.body);
  TH.ink=cs.getPropertyValue('--ink').trim()||'#e8e4d8';
  TH.edge=cs.getPropertyValue('--grid-ink').trim()||'rgba(200,200,200,.6)';
  TH.chip=cs.getPropertyValue('--panel-bg').trim()||'rgba(0,0,0,.6)';
  TH.chipInk=cs.getPropertyValue('--ink').trim()||'#fff';
  TH.role={}; for(const k in ROLE_VAR) TH.role[k]=cs.getPropertyValue(ROLE_VAR[k]).trim()||'#888';
  // 同步图例圆点颜色
  document.querySelectorAll('.leg-dot[data-role]').forEach(d=>d.style.background=TH.role[d.dataset.role]);
}
function roleColor(r){return (TH.role&&TH.role[r])||'#888';}

const P=CLASSICAL_PEOPLE;

// ── 关系分层:从关系文字自动归类 ──
let relFilter='all';
const REL_CATS=[['all','全部'],['family','家族'],['thought','师承·思想'],['power','君臣·权力'],['ally','盟友'],['war','敌对·战争']];
const REL_CAT_COLOR={family:'#d4708a',thought:'#5aa0c8',power:'#d4a858',ally:'#5ab87a',war:'#c84830',other:'#888'};
function catOf(t){
  t=t||'';
  if(/父|子|母|女|妻|夫|兄|弟|祖|孙|家族|联姻|外孙|岳|嫁|后裔|世袭|血脉/.test(t))return'family';
  if(/师|徒|弟子|学生|门生|思想|译|启发|衣钵|理学|传法|授业/.test(t)||/继承.*(学|思想|衣钵)/.test(t))return'thought';
  if(/敌|战|征|攻|杀|刺|灭|对抗|宿敌|叛|起义|入侵|镇压|歼/.test(t))return'war';
  if(/臣|效力|奉命|重用|辅|继位|册封|提拔|放逐|篡|拥立|摄政|侍奉|归顺|进谏|部下|麾下|赐死|宫刑/.test(t))return'power';
  if(/盟|友|挚友|结盟|支持|同盟|共事|同朝|同时代|同乡|同属|论敌/.test(t))return'ally';
  return'other';
}

// Build lookup
const BY_ID={};
P.forEach(p=>{BY_ID[p.id]=p});

// ── 真实画像 (维基百科 pageimages；多为公有领域：半身像/古画/钱币像) ──
const PORTRAIT={}; // id -> Image(已加载) | false(无) | null(加载中)
// 部分人物维基条目标题与中文名不同，做映射以提高命中率
const WIKI_TITLE={
  zhouwu:'周武王', zhougong:'周公旦', jiangziya:'姜子牙', ashurbanipal:'亞述巴尼拔',
  nebuchadnezzar2:'尼布甲尼撒二世', david:'大卫', solomon:'所罗门', isaiah:'以赛亚',
  homer:'荷马', romulus:'罗慕路斯',
  samudragupta:'沙摩陀罗·笈多', chandragupta2:'旃陀罗·笈多二世', aryabhata:'阿耶波多', kalidasa:'迦梨陀娑',
  zhang_daoling:'張道陵', titus:'提圖斯', josephus:'弗拉維奧·約瑟夫斯',
  buddha:'释迦牟尼', mahavira:'笩駄摩那', goujian:'勾践', liuche:'班超', lvhou:'吕雉',
  qin_shihuang:'秦始皇', wudi_han:'汉武帝', simarqian:'司马迁', helv:'阖闾', fucha:'夫差',
  cyrus:'居鲁士二世', darius1:'大流士一世', darius3:'大流士三世', xerxes:'薛西斯一世',
  zoroaster:'琐罗亚斯德', cambyses:'冈比西斯二世', artaxerxes:'阿尔塔薛西斯一世',
  alexander:'亚历山大大帝', philip2:'腓力二世 (马其顿)', leonidas:'列奥尼达一世', darius3:'大流士三世',
  octavian:'奥古斯都', caesar:'尤利乌斯·恺撒', marcus_aurelius:'马尔库斯·奥列里乌斯',
  zeno_stoic:'季蒂昂的芝诺', jesus:'耶稣', peter_apos:'圣伯多禄', paul_apos:'大数的扫罗',
  ashoka:'阿育王', chandragupta:'旃陀罗笈多·孔雀', nagarjuna:'龙树', mahakassapa:'摩诃迦叶',
  ajatasattu:'阿阇世王', bimbisara:'频婆娑罗', constantine:'君士坦丁大帝', cleopatra:'克利奥帕特拉七世',
};
function wikiTitle(p){ return WIKI_TITLE[p.id] || (p.n||'').replace(/[（(].*?[)）]/g,'').trim(); }
// 批量取画像：一次请求最多 ~45 个标题，避免并发限流
function loadPortraitsBatch(people){
  // 本地真实画像(已下载到 ./portraits,不再依赖被墙的维基)
  people.forEach(p=>{
    if(PORTRAIT[p.id]!==undefined) return;
    const f=(typeof PORTRAITS!=='undefined')?PORTRAITS[p.id]:null;
    if(!f){ PORTRAIT[p.id]=false; return; }
    PORTRAIT[p.id]=null;
    const img=new Image();
    img.onload=()=>PORTRAIT[p.id]=img;
    img.onerror=()=>PORTRAIT[p.id]=false;
    img.src='./portraits/'+f;
  });
}
function loadPortrait(p){ loadPortraitsBatch([p]); }

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0;
let cvOff={x:0,y:0}; // 画布相对视口的偏移(顶栏在上方，必须扣除否则点击命中错位)
let nodes=[],edges=[];
let selId=null,hovId=null;
let curCiv='china',curRole='all';
let drag=null,dragOffset={x:0,y:0};
let panX=0,panY=0,scale=1;
let lastPan={x:0,y:0},panStart=null;
let animFrame=0;

function resize(){
  const wrap=document.getElementById('canvas-wrap');
  W=wrap.clientWidth;H=wrap.clientHeight;
  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const _r=canvas.getBoundingClientRect(); cvOff={x:_r.left,y:_r.top};
}

function getVisible(){
  return P.filter(p=>{
    if(curCiv!=='all'&&p.c!==curCiv)return false;
    if(curRole!=='all'&&p.r!==curRole)return false;
    return true;
  });
}

function buildGraph(){
  const vis=getVisible();
  const visIds=new Set(vis.map(p=>p.id));
  // Reuse existing positions or init new
  const oldMap={};
  nodes.forEach(n=>oldMap[n.id]=n);
  nodes=vis.map(p=>{
    if(oldMap[p.id])return oldMap[p.id];
    const cx=W/2+(Math.random()-.5)*300;
    const cy=H/2+(Math.random()-.5)*250;
    return{id:p.id,x:cx,y:cy,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,data:p,pinned:false};
  });
  edges=[];
  const added=new Set();
  vis.forEach(p=>{
    p.rel.forEach(r=>{
      if(!visIds.has(r.i))return;
      const key=[p.id,r.i].sort().join('~');
      if(!added.has(key)){added.add(key);edges.push({a:p.id,b:r.i,t:r.t,cat:catOf(r.t)})}
    });
  });
  document.getElementById('stats').textContent=nodes.length+'位人物  '+edges.length+'条关系';
  loadPortraitsBatch(vis); // 批量拉取真实画像(1-2个请求)
  alpha=(nodes.length>40?0.5:0.9); // 大图低能量,避免狂晃
}

let alpha=1; // 模拟"能量"，随时间冷却；稳定后定格，点击更顺滑
function tick(){
  if(alpha<0.008) return;      // 已稳定 → 节点停止漂移，便于点击
  alpha*=(nodes.length>40?0.965:0.99);
  const rep=(nodes.length>40?3200:5200),k=124;        // 头像更大，间距相应加大
  const damp=0.78;
  nodes.forEach(n=>{if(!n.pinned){n.vx*=damp;n.vy*=damp;}});
  // Repulsion
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      const dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.max(15,Math.sqrt(dx*dx+dy*dy));
      const f=rep/(d*d)*(0.4+0.6*alpha);
      if(!a.pinned){a.vx-=dx/d*f;a.vy-=dy/d*f;}
      if(!b.pinned){b.vx+=dx/d*f;b.vy+=dy/d*f;}
    }
  }
  // Edges
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);
    if(!a||!b)return;
    const dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(15,Math.sqrt(dx*dx+dy*dy));
    const f=(d-k)*0.03;
    if(!a.pinned){a.vx+=dx/d*f;a.vy+=dy/d*f;}
    if(!b.pinned){b.vx-=dx/d*f;b.vy-=dy/d*f;}
  });
  // Center pull
  nodes.forEach(n=>{
    if(!n.pinned){
      n.vx+=(W/2-n.x)*0.005;
      n.vy+=(H/2-n.y)*0.005;
      n.vx=Math.max(-18,Math.min(18,n.vx));n.vy=Math.max(-18,Math.min(18,n.vy));n.x+=n.vx;n.y+=n.vy;
      n.x=Math.max(30,Math.min(W-30,n.x));
      n.y=Math.max(30,Math.min(H-30,n.y));
    }
  });
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(panX,panY);
  ctx.scale(scale,scale);
  // 选中某人:TA 与直接关联者加重,其余淡化(背景仍可见)
  const focusSet = selId ? (()=>{const s=new Set([selId]);edges.forEach(e=>{if(e.a===selId)s.add(e.b);if(e.b===selId)s.add(e.a);});return s;})() : null;
  const labelRects=[];
  // Edges
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);
    if(!a||!b)return;
    const inFilter = relFilter==='all' || e.cat===relFilter;
    const isHighlighted=(selId&&(a.id===selId||b.id===selId)) || (relFilter!=='all'&&inFilter);
    ctx.save();
    ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    var _ca=roleColor(a.data.r);
    if(relFilter!=='all' && !inFilter){ ctx.globalAlpha=0.04; ctx.strokeStyle=_ca; ctx.lineWidth=0.5; }
    else if(selId && !isHighlighted){ ctx.globalAlpha=0.05; ctx.strokeStyle=_ca; ctx.lineWidth=0.5; }
    else if(isHighlighted){ ctx.globalAlpha=0.85; ctx.strokeStyle=(REL_CAT_COLOR[e.cat]||_ca); ctx.lineWidth=1.8; }
    else { ctx.globalAlpha=0.1; ctx.strokeStyle=_ca; ctx.lineWidth=0.6; }
    { var _dx=b.x-a.x,_dy=b.y-a.y,_len=Math.hypot(_dx,_dy)||1,_bow=Math.min(_len*0.2,36);
      var _cx=(a.x+b.x)/2-_dy/_len*_bow,_cy=(a.y+b.y)/2+_dx/_len*_bow;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(_cx,_cy,b.x,b.y);ctx.stroke(); }
    ctx.restore();
    // 选中节点时，在连线中点标出"两人之间是什么关系"
    const showLabel = e.t && selId && (a.id===selId||b.id===selId);
    if(showLabel){
      const mx=(a.x+b.x)/2; let my=(a.y+b.y)/2;
      ctx.save();
      ctx.font='600 10px "Noto Sans SC",system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const w=ctx.measureText(e.t).width+10;
      { let _g=0; const _rc={x:mx-w/2,y:my-9,w:w,h:18}; while(_g++<10 && labelRects.some(R=>_rc.x<R.x+R.w&&_rc.x+_rc.w>R.x&&_rc.y<R.y+R.h&&_rc.y+_rc.h>R.y)){ my+=19; _rc.y=my-9; } labelRects.push(_rc); }
      ctx.globalAlpha=0.95; ctx.fillStyle=TH.chip||'rgba(0,0,0,.55)';
      const rr=7; const x=mx-w/2,y=my-9,h=18;
      ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();ctx.fill();
      ctx.fillStyle=TH.chipInk||'#fff'; ctx.fillText(e.t,mx,my);
      ctx.restore();
    }
  });
  // Nodes (头像图标节点)
  nodes.forEach(n=>{
    const p=n.data;
    if(selId && focusSet && !focusSet.has(n.id)){ ctx.save();ctx.globalAlpha=0.2;ctx.beginPath();ctx.arc(n.x,n.y,9,0,Math.PI*2);ctx.fillStyle=roleColor(p.r);ctx.fill();ctx.restore(); return; }
    const col=roleColor(p.r);
    const isSel=n.id===selId,isHov=n.id===hovId;
    let r=isSel?(21+Math.sin(Date.now()/280)*2.6):(isHov?18:15);
    const icon=(typeof personIconOf==='function')?personIconOf(p):'👤';
    ctx.save();
    // 强调外环(选中/悬浮)
    if(isSel||isHov){
      ctx.beginPath();ctx.arc(n.x,n.y,r+4,0,Math.PI*2);
      ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.globalAlpha=isSel?0.95:0.5;ctx.stroke();
    }
    // 星辰 bloom(叠加发光)
    ctx.save();ctx.globalCompositeOperation='lighter';
    var _bg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.7);
    _bg.addColorStop(0,col);_bg.addColorStop(0.4,col);_bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=isSel?0.92:isHov?0.64:0.44;ctx.fillStyle=_bg;
    ctx.beginPath();ctx.arc(n.x,n.y,r*2.7,0,Math.PI*2);ctx.fill();ctx.restore();
    // 角色色圆底(头像底座)
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=col;ctx.globalAlpha=isSel||isHov?1:0.9;ctx.fill();ctx.globalAlpha=1;
    const portrait=PORTRAIT[n.id];
    if(portrait && portrait.naturalWidth){
      // 真实画像(圆形裁剪, cover 填充)
      ctx.save();
      ctx.beginPath();ctx.arc(n.x,n.y,r-1,0,Math.PI*2);ctx.clip();
      const iw=portrait.naturalWidth,ih=portrait.naturalHeight,side=Math.min(iw,ih);
      ctx.globalAlpha=isSel||isHov?1:0.96;
      ctx.drawImage(portrait,(iw-side)/2,(ih-side)*0.32,side,side,n.x-r,n.y-r,2*r,2*r);
      ctx.restore();
    } else {
      // 严肃图标占位
      ctx.globalAlpha=isSel||isHov?1:0.95;
      ctx.font=Math.round(r*1.3)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(icon,n.x,n.y+1);
    }
    // 描边(角色色环)
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.strokeStyle=portrait&&portrait.naturalWidth?col:'rgba(255,255,255,.85)';
    ctx.lineWidth=portrait&&portrait.naturalWidth?2.5:1.5;ctx.stroke();
    ctx.restore();
    // 名字——选中时显示 TA 与关联者,智能避让不重叠
    const showLabel=isSel||isHov||(focusSet&&focusSet.has(n.id))||scale>1.05||nodes.length<28;
    if(showLabel){
      ctx.save();
      ctx.font=(isSel?'700 12.5px':'600 11px')+' "Noto Sans SC",system-ui,sans-serif';
      const _tw=ctx.measureText(p.n).width,_lh=14; let _ly=n.y+r+4;
      const _rc={x:n.x-_tw/2-2,y:_ly,w:_tw+4,h:_lh}; let _g=0;
      while(_g++<14 && labelRects.some(R=>_rc.x<R.x+R.w&&_rc.x+_rc.w>R.x&&_rc.y<R.y+R.h&&_rc.y+_rc.h>R.y)){ _ly+=_lh+1; _rc.y=_ly; }
      labelRects.push(_rc);
      ctx.fillStyle=TH.ink;ctx.textAlign='center';ctx.textBaseline='top';
      ctx.shadowColor=TH.chip||'rgba(0,0,0,.5)';ctx.shadowBlur=4;
      ctx.fillText(p.n,n.x,_ly);
      ctx.restore();
    }
  });
  ctx.restore();
  tick();
  requestAnimationFrame(draw);
}

function screenToWorld(sx,sy){
  return{x:(sx-cvOff.x-panX)/scale,y:(sy-cvOff.y-panY)/scale};
}

function nodeAt(sx,sy){
  const w=screenToWorld(sx,sy);
  return nodes.find(n=>{
    const dx=n.x-w.x,dy=n.y-w.y;
    return Math.sqrt(dx*dx+dy*dy)<20/scale;
  });
}

function showDetail(id){
  selId=id;
  const p=BY_ID[id];if(!p)return; window.__aiCtx="用户正在「人物关系网」查看人物:"+p.n+"("+(p.d||"")+")。"+(p.b||"");
  const col=roleColor(p.r);
  document.getElementById('p-civ').textContent=CIV_NAMES[p.c]||p.c;
  document.getElementById('p-name').textContent=p.n;
  document.getElementById('p-eng').textContent=p.e;
  document.getElementById('p-dates').textContent=p.d;
  const roleEl=document.getElementById('p-role');
  roleEl.textContent=ROLE_NAMES[p.r]||p.r;
  roleEl.style.background=col+'26';
  roleEl.style.color=col;
  document.getElementById('p-bio').textContent=p.b;
  // 只列「本国」关联人物（同一国度），跨文明关系不显示
  const rels=p.rel.map(r=>{
    const rp=BY_ID[r.i];
    if(!rp)return"";
    return`<div class="rel-item" onclick="showDetail('${r.i}')"><span class="rel-type">${r.t}</span><span>${rp.n}</span></div>`;
  }).filter(Boolean);
  const rh=document.querySelector('.p-rels h4');
  document.getElementById('p-rels').innerHTML=rels.length?rels.join(''):'<div style="font-size:11.5px;color:var(--ink3)">（暂无关联人物）</div>';
  document.getElementById('panel').classList.add('show');
}

// Mouse/touch events
let isDown=false,downPos={x:0,y:0},downTime=0;

canvas.addEventListener('mousedown',e=>{
  isDown=true;downPos={x:e.clientX,y:e.clientY};downTime=Date.now();
  const n=nodeAt(e.clientX,e.clientY);
  if(n){drag=n;drag._startX=n.x;drag._startY=n.y;drag._wasPinned=n.pinned;n.pinned=true;n.vx=0;n.vy=0;} // 按下即定住，避免点击期间漂移
  else{panStart={x:e.clientX-panX,y:e.clientY-panY};}
  canvas.classList.add('dragging');
});

canvas.addEventListener('mousemove',e=>{
  const n=nodeAt(e.clientX,e.clientY);
  hovId=n?n.id:null;
  canvas.style.cursor=n?'pointer':isDown&&!drag?'grabbing':'grab';
  if(!isDown)return;
  if(drag){
    const w=screenToWorld(e.clientX,e.clientY);
    drag.x=w.x;drag.y=w.y;drag.vx=0;drag.vy=0;drag.pinned=true;
    alpha=Math.max(alpha,0.5); // 拖动时让邻居重新调整
  }else if(panStart){
    panX=e.clientX-panStart.x;
    panY=e.clientY-panStart.y;
  }
});

canvas.addEventListener('mouseup',e=>{
  canvas.classList.remove('dragging');
  if(drag){
    // 用鼠标屏幕移动量判断点击/拖拽（不受力导向漂移影响）
    const movedPx=Math.abs(e.clientX-downPos.x)+Math.abs(e.clientY-downPos.y);
    if(movedPx<6){ showDetail(drag.id); drag.pinned=drag._wasPinned; } // 点击：弹详情并恢复原状态
    // 否则视为拖拽：保持 pinned（用户摆放的位置）
    drag=null;
  } else if(panStart){
    const movedPx=Math.abs(e.clientX-downPos.x)+Math.abs(e.clientY-downPos.y);
    if(movedPx<6&&Date.now()-downTime<400){ selId=null; document.getElementById('panel').classList.remove('show'); }
    panStart=null;
  }
  isDown=false;
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY<0?1.1:0.9;
  const wx=e.clientX-cvOff.x,wy=e.clientY-cvOff.y;
  panX=wx-(wx-panX)*factor;
  panY=wy-(wy-panY)*factor;
  scale*=factor;
  scale=Math.max(0.3,Math.min(4,scale));
},{passive:false});

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    const n=nodeAt(t.clientX,t.clientY);
    if(n){drag=n;drag._tapX=t.clientX;drag._tapY=t.clientY;drag._tapTime=Date.now();drag._wasPinned=n.pinned;n.pinned=true;n.vx=0;n.vy=0;}
    else panStart={x:t.clientX-panX,y:t.clientY-panY};
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    if(drag){const w=screenToWorld(t.clientX,t.clientY);drag.x=w.x;drag.y=w.y;drag.vx=0;drag.vy=0;drag.pinned=true;alpha=Math.max(alpha,0.5);}
    else if(panStart){panX=t.clientX-panStart.x;panY=t.clientY-panStart.y;}
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(drag){
    const t=(e.changedTouches&&e.changedTouches[0])||{clientX:drag._tapX,clientY:drag._tapY};
    const movedPx=Math.abs(t.clientX-(drag._tapX||0))+Math.abs(t.clientY-(drag._tapY||0));
    if(movedPx<10&&Date.now()-(drag._tapTime||0)<500){ showDetail(drag.id); drag.pinned=drag._wasPinned; }
    drag=null;
  }
  panStart=null;
},{passive:false});

// 国度切换：每个国度只显示自己内部的人物关系网
document.querySelectorAll('.civ-pill').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.civ-pill').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');curCiv=b.dataset.civ;
    selId=null;document.getElementById('panel').classList.remove('show');
    nodes=[];panX=0;panY=0;scale=1; // 换国重置布局
    buildGraph();
  });
});

// 主题切换 (4 套, 与项目共用 localStorage)
function applyTheme(t){
  if(t&&t!=='deepblue') document.body.setAttribute('data-theme',t);
  else document.body.removeAttribute('data-theme');
  localStorage.setItem('civ_theme',t||'deepblue');
  document.querySelectorAll('#themeSwitch button').forEach(x=>x.classList.toggle('active',x.dataset.t===(t||'deepblue')));
  refreshTheme();
}
document.getElementById('themeSwitch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)applyTheme(b.dataset.t);});

window.addEventListener('resize',()=>{resize();});

resize();
applyTheme('nebula');
buildGraph();
draw();
(function(){if(new URLSearchParams(location.search).get("all")){var b=document.querySelector(".civ-pill[data-civ='all']");if(b)b.click();}})();

// ── 自动导览适配器 ──
window.__net={
  nodes:()=>nodes, edges:()=>edges, byId:id=>BY_ID[id],
  viewport:()=>({W,H}),
  getCamera:()=>({panX,panY,scale}),
  setCamera:(px,py,s)=>{panX=px;panY=py;scale=s;},
  select:id=>showDetail(id),
  deselect:()=>{selId=null;document.getElementById('panel').classList.remove('show');},
  freeze:()=>{alpha=0;}
};
