<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>古典思想与帝国 · 人物关系网</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css"/>
<style>
  html,body{height:100%;overflow:hidden}
  #app{position:relative;z-index:10;display:flex;flex-direction:column;height:100vh}
  .nav{display:flex;align-items:center;gap:10px;padding:12px 18px 4px;flex-wrap:wrap}
  .nav .title{font-family:var(--serif);font-weight:900;font-size:16px;color:var(--ink);text-shadow:var(--label-shadow)}
  .nav .sub{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.1em}
  .civ-row{display:flex;gap:8px;padding:8px 18px 10px;flex-wrap:wrap;align-items:center}
  .civ-pill{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:var(--r-pill);padding:6px 15px;cursor:pointer;transition:all .15s;backdrop-filter:blur(10px)}
  .civ-pill:hover{color:var(--gold);border-color:var(--gold)}
  .civ-pill.on{color:#fff;background:var(--gold);border-color:var(--gold)}
  #canvas-wrap{flex:1;position:relative;overflow:hidden}
  canvas{position:absolute;inset:0;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #panel{position:absolute;right:14px;top:14px;width:250px;max-height:calc(100vh - 130px);overflow-y:auto;display:none;padding:0}
  #panel.show{display:block}
  #panel .p-pad{padding:15px 17px}
  .p-civ{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .p-name{font-family:var(--serif);font-size:20px;font-weight:900;color:var(--ink);line-height:1.2;margin-top:3px}
  .p-eng{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}
  .p-dates{font-family:var(--mono);font-size:11px;color:var(--ink2);margin:5px 0 8px}
  .p-role{display:inline-block;padding:2px 11px;border-radius:var(--r-pill);font-size:10px;font-weight:700;margin-bottom:6px}
  .p-bio{font-size:12.5px;color:var(--ink);line-height:1.72;padding-top:9px;border-top:1px solid var(--panel-line)}
  .p-rels{margin-top:11px;padding-top:9px;border-top:1px solid var(--panel-line)}
  .p-rels h4{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.1em;margin-bottom:7px;text-transform:uppercase}
  .rel-item{font-size:12px;color:var(--ink);padding:4px 0;display:flex;gap:6px;cursor:pointer;align-items:flex-start;transition:color .12s}
  .rel-item:hover{color:var(--gold)}
  .rel-type{color:var(--ink2);font-size:10px;flex-shrink:0;margin-top:1px;background:rgba(128,128,128,.16);padding:1px 6px;border-radius:6px}
  .legend{position:absolute;left:14px;bottom:14px;font-size:11px}
  .leg-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;color:var(--ink2)}
  .leg-row:last-child{margin-bottom:0}
  .leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#888}
  .stats{position:absolute;left:14px;top:14px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
  .hint{position:absolute;bottom:14px;right:14px;font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:right;max-width:46%}
  @media(max-width:768px){ #panel{width:calc(100vw - 28px)} .legend{display:none} }
</style>
</head>
<body data-theme="textbook">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="nav">
    <a href="./index.html" class="ds-pill">⌂ 返回</a>
    <span class="title">古典思想与帝国 · 人物关系网</span>
    <span class="sub">前 600 — 公元 400</span>
    <div class="ds-theme-switch" id="themeSwitch" style="margin-left:auto">
      <button data-t="deepblue" title="静夜深蓝"></button>
      <button data-t="museum" title="博物馆典藏"></button>
      <button data-t="textbook" title="现代教科书"></button>
      <button data-t="parchment" title="羊皮纸古卷"></button>
    </div>
  </div>
  <div class="civ-row">
    <span class="ds-kicker" style="margin-right:2px">选择国度</span>
    <button class="civ-pill on" data-civ="china">🐉 中国</button>
    <button class="civ-pill" data-civ="greece">🏛 希腊</button>
    <button class="civ-pill" data-civ="rome">🦅 罗马</button>
    <button class="civ-pill" data-civ="persia">🔥 波斯</button>
    <button class="civ-pill" data-civ="india">☸ 印度·佛教</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="panel" class="ds-panel"><div class="p-pad">
      <div class="p-civ" id="p-civ"></div>
      <div class="p-name" id="p-name"></div>
      <div class="p-eng" id="p-eng"></div>
      <div class="p-dates" id="p-dates"></div>
      <span class="p-role" id="p-role"></span>
      <div class="p-bio" id="p-bio"></div>
      <div class="p-rels"><h4>本国关联人物</h4><div id="p-rels"></div></div>
    </div></div>
    <div class="legend ds-panel" style="padding:10px 13px">
      <div class="leg-row"><div class="leg-dot" data-role="ruler"></div><span>统治者</span></div>
      <div class="leg-row"><div class="leg-dot" data-role="general"></div><span>将领</span></div>
      <div class="leg-row"><div class="leg-dot" data-role="thinker"></div><span>思想家</span></div>
      <div class="leg-row"><div class="leg-dot" data-role="religious"></div><span>宗教人物</span></div>
      <div class="leg-row"><div class="leg-dot" data-role="other"></div><span>其他</span></div>
    </div>
    <div class="stats ds-panel" id="stats" style="padding:7px 12px"></div>
    <div class="hint">拖拽节点 · 滚轮缩放 · 点击查看详情</div>
  </div>
</div>
<script src="./classical_people.js?v=4"></script>
<script>
const CIV_NAMES={china:"中国",greece:"希腊",rome:"罗马",persia:"波斯",india:"印度/佛教",cross:"跨文明"};
const ROLE_NAMES={ruler:"统治者",general:"将领",thinker:"思想家",religious:"宗教人物",other:"其他人物"};
// 节点按角色着色，色值映射到设计系统变量，主题切换时刷新
const ROLE_VAR={ruler:'--gold',general:'--vermilion',thinker:'--cyan',religious:'--purple',other:'--ink3'};
let TH={role:{}};
function refreshTheme(){
  const cs=getComputedStyle(document.body);
  TH.ink=cs.getPropertyValue('--ink').trim()||'#e8e4d8';
  TH.edge=cs.getPropertyValue('--grid-ink').trim()||'rgba(200,200,200,.6)';
  TH.chip=cs.getPropertyValue('--panel-bg').trim()||'rgba(0,0,0,.6)';
  TH.chipInk=cs.getPropertyValue('--ink').trim()||'#fff';
  TH.role={}; for(const k in ROLE_VAR) TH.role[k]=cs.getPropertyValue(ROLE_VAR[k]).trim()||'#888';
  // 同步图例圆点颜色
  document.querySelectorAll('.leg-dot[data-role]').forEach(d=>d.style.background=TH.role[d.dataset.role]);
}
function roleColor(r){return (TH.role&&TH.role[r])||'#888';}

const P=CLASSICAL_PEOPLE;

// Build lookup
const BY_ID={};
P.forEach(p=>{BY_ID[p.id]=p});

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0;
let nodes=[],edges=[];
let selId=null,hovId=null;
let curCiv='china',curRole='all';
let drag=null,dragOffset={x:0,y:0};
let panX=0,panY=0,scale=1;
let lastPan={x:0,y:0},panStart=null;
let animFrame=0;

function resize(){
  const wrap=document.getElementById('canvas-wrap');
  W=wrap.clientWidth;H=wrap.clientHeight;
  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);
}

function getVisible(){
  return P.filter(p=>{
    if(curCiv!=='all'&&p.c!==curCiv)return false;
    if(curRole!=='all'&&p.r!==curRole)return false;
    return true;
  });
}

function buildGraph(){
  const vis=getVisible();
  const visIds=new Set(vis.map(p=>p.id));
  // Reuse existing positions or init new
  const oldMap={};
  nodes.forEach(n=>oldMap[n.id]=n);
  nodes=vis.map(p=>{
    if(oldMap[p.id])return oldMap[p.id];
    const cx=W/2+(Math.random()-.5)*300;
    const cy=H/2+(Math.random()-.5)*250;
    return{id:p.id,x:cx,y:cy,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,data:p,pinned:false};
  });
  edges=[];
  const added=new Set();
  vis.forEach(p=>{
    p.rel.forEach(r=>{
      if(!visIds.has(r.i))return;
      const key=[p.id,r.i].sort().join('~');
      if(!added.has(key)){added.add(key);edges.push({a:p.id,b:r.i,t:r.t})}
    });
  });
  document.getElementById('stats').textContent=nodes.length+'位人物  '+edges.length+'条关系';
  alpha=1; // 重新布局时重新加热
}

let alpha=1; // 模拟"能量"，随时间冷却；稳定后定格，点击更顺滑
function tick(){
  if(alpha<0.008) return;      // 已稳定 → 节点停止漂移，便于点击
  alpha*=0.992;
  const rep=5600,k=124;        // 头像更大，间距相应加大
  const damp=0.82;
  nodes.forEach(n=>{if(!n.pinned){n.vx*=damp;n.vy*=damp;}});
  // Repulsion
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      const dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=rep/(d*d);
      if(!a.pinned){a.vx-=dx/d*f;a.vy-=dy/d*f;}
      if(!b.pinned){b.vx+=dx/d*f;b.vy+=dy/d*f;}
    }
  }
  // Edges
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);
    if(!a||!b)return;
    const dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-k)*0.03;
    if(!a.pinned){a.vx+=dx/d*f;a.vy+=dy/d*f;}
    if(!b.pinned){b.vx-=dx/d*f;b.vy-=dy/d*f;}
  });
  // Center pull
  nodes.forEach(n=>{
    if(!n.pinned){
      n.vx+=(W/2-n.x)*0.005;
      n.vy+=(H/2-n.y)*0.005;
      n.x+=n.vx;n.y+=n.vy;
      n.x=Math.max(30,Math.min(W-30,n.x));
      n.y=Math.max(30,Math.min(H-30,n.y));
    }
  });
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(panX,panY);
  ctx.scale(scale,scale);
  // Edges
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);
    if(!a||!b)return;
    const isHighlighted=selId&&(a.id===selId||b.id===selId);
    ctx.save();
    ctx.globalAlpha=isHighlighted?0.9:0.32;
    ctx.strokeStyle=isHighlighted?roleColor(a.data.r):TH.edge;
    ctx.lineWidth=isHighlighted?1.6:0.7;
    if(!isHighlighted)ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.restore();
    // 选中节点时，在连线中点标出"两人之间是什么关系"
    if(isHighlighted && e.t){
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      ctx.save();
      ctx.font='600 10px "Noto Sans SC",system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const w=ctx.measureText(e.t).width+10;
      ctx.globalAlpha=0.95; ctx.fillStyle=TH.chip||'rgba(0,0,0,.55)';
      const rr=7; const x=mx-w/2,y=my-9,h=18;
      ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();ctx.fill();
      ctx.fillStyle=TH.chipInk||'#fff'; ctx.fillText(e.t,mx,my);
      ctx.restore();
    }
  });
  // Nodes (头像图标节点)
  nodes.forEach(n=>{
    const p=n.data;
    const col=roleColor(p.r);
    const isSel=n.id===selId,isHov=n.id===hovId;
    const r=isSel?21:isHov?18:15;
    const icon=(typeof personIconOf==='function')?personIconOf(p):'👤';
    ctx.save();
    // 强调外环(选中/悬浮)
    if(isSel||isHov){
      ctx.beginPath();ctx.arc(n.x,n.y,r+4,0,Math.PI*2);
      ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.globalAlpha=isSel?0.95:0.5;ctx.stroke();
    }
    // 角色色圆底 + 白描边(头像底座)
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=col;ctx.globalAlpha=isSel||isHov?1:0.9;ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.stroke();
    // 头像图标
    ctx.globalAlpha=isSel||isHov?1:0.95;
    ctx.font=Math.round(r*1.35)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(icon,n.x,n.y+1);
    ctx.restore();
    // 名字(节点下方)
    const showLabel=isSel||isHov||scale>1.05||nodes.length<28;
    if(showLabel){
      ctx.save();
      ctx.font=(isSel?'700 12px':'500 11px')+' "Noto Sans SC",system-ui,sans-serif';
      ctx.fillStyle=TH.ink;ctx.textAlign='center';ctx.textBaseline='top';
      ctx.shadowColor=TH.chip||'rgba(0,0,0,.5)';ctx.shadowBlur=3;
      ctx.fillText(p.n,n.x,n.y+r+4);
      ctx.restore();
    }
  });
  ctx.restore();
  tick();
  requestAnimationFrame(draw);
}

function screenToWorld(sx,sy){
  return{x:(sx-panX)/scale,y:(sy-panY)/scale};
}

function nodeAt(sx,sy){
  const w=screenToWorld(sx,sy);
  return nodes.find(n=>{
    const dx=n.x-w.x,dy=n.y-w.y;
    return Math.sqrt(dx*dx+dy*dy)<20/scale;
  });
}

function showDetail(id){
  selId=id;
  const p=BY_ID[id];if(!p)return;
  const col=roleColor(p.r);
  document.getElementById('p-civ').textContent=CIV_NAMES[p.c]||p.c;
  document.getElementById('p-name').textContent=p.n;
  document.getElementById('p-eng').textContent=p.e;
  document.getElementById('p-dates').textContent=p.d;
  const roleEl=document.getElementById('p-role');
  roleEl.textContent=ROLE_NAMES[p.r]||p.r;
  roleEl.style.background=col+'26';
  roleEl.style.color=col;
  document.getElementById('p-bio').textContent=p.b;
  // 只列「本国」关联人物（同一国度），跨文明关系不显示
  const rels=p.rel.map(r=>{
    const rp=BY_ID[r.i];
    if(!rp||rp.c!==p.c)return'';
    return`<div class="rel-item" onclick="showDetail('${r.i}')"><span class="rel-type">${r.t}</span><span>${rp.n}</span></div>`;
  }).filter(Boolean);
  const rh=document.querySelector('.p-rels h4');
  document.getElementById('p-rels').innerHTML=rels.length?rels.join(''):'<div style="font-size:11.5px;color:var(--ink3)">（本国内无直接关联人物）</div>';
  document.getElementById('panel').classList.add('show');
}

// Mouse/touch events
let isDown=false,downPos={x:0,y:0},downTime=0;

canvas.addEventListener('mousedown',e=>{
  isDown=true;downPos={x:e.clientX,y:e.clientY};downTime=Date.now();
  const n=nodeAt(e.clientX,e.clientY);
  if(n){drag=n;drag._startX=n.x;drag._startY=n.y;}
  else{panStart={x:e.clientX-panX,y:e.clientY-panY};}
  canvas.classList.add('dragging');
});

canvas.addEventListener('mousemove',e=>{
  const n=nodeAt(e.clientX,e.clientY);
  hovId=n?n.id:null;
  canvas.style.cursor=n?'pointer':isDown&&!drag?'grabbing':'grab';
  if(!isDown)return;
  if(drag){
    const w=screenToWorld(e.clientX,e.clientY);
    drag.x=w.x;drag.y=w.y;drag.vx=0;drag.vy=0;drag.pinned=true;
    alpha=Math.max(alpha,0.5); // 拖动时让邻居重新调整
  }else if(panStart){
    panX=e.clientX-panStart.x;
    panY=e.clientY-panStart.y;
  }
});

canvas.addEventListener('mouseup',e=>{
  canvas.classList.remove('dragging');
  if(drag){
    const moved=Math.abs(drag.x-drag._startX)+Math.abs(drag.y-drag._startY);
    if(moved<5){showDetail(drag.id);}
    else{drag.pinned=false;}
    drag=null;
  } else if(panStart){
    const movedPx=Math.abs(e.clientX-downPos.x)+Math.abs(e.clientY-downPos.y);
    if(movedPx<5&&Date.now()-downTime<300){
      // Click on background
      selId=null;
      document.getElementById('panel').classList.remove('show');
    }
    panStart=null;
  }
  isDown=false;
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY<0?1.1:0.9;
  const wx=e.clientX,wy=e.clientY;
  panX=wx-(wx-panX)*factor;
  panY=wy-(wy-panY)*factor;
  scale*=factor;
  scale=Math.max(0.3,Math.min(4,scale));
},{passive:false});

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    const n=nodeAt(t.clientX,t.clientY);
    if(n){drag=n;drag._startX=n.x;drag._startY=n.y;drag._tapTime=Date.now();}
    else panStart={x:t.clientX-panX,y:t.clientY-panY};
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    if(drag){const w=screenToWorld(t.clientX,t.clientY);drag.x=w.x;drag.y=w.y;drag.vx=0;drag.vy=0;drag.pinned=true;alpha=Math.max(alpha,0.5);}
    else if(panStart){panX=t.clientX-panStart.x;panY=t.clientY-panStart.y;}
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(drag){
    const moved=Math.abs(drag.x-(drag._startX||0))+Math.abs(drag.y-(drag._startY||0));
    if(moved<8&&Date.now()-(drag._tapTime||0)<400){showDetail(drag.id);}
    else{drag.pinned=false;}
    drag=null;
  }
  panStart=null;
},{passive:false});

// 国度切换：每个国度只显示自己内部的人物关系网
document.querySelectorAll('.civ-pill').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.civ-pill').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');curCiv=b.dataset.civ;
    selId=null;document.getElementById('panel').classList.remove('show');
    nodes=[];panX=0;panY=0;scale=1; // 换国重置布局
    buildGraph();
  });
});

// 主题切换 (4 套, 与项目共用 localStorage)
function applyTheme(t){
  if(t&&t!=='deepblue') document.body.setAttribute('data-theme',t);
  else document.body.removeAttribute('data-theme');
  localStorage.setItem('civ_theme',t||'deepblue');
  document.querySelectorAll('#themeSwitch button').forEach(x=>x.classList.toggle('active',x.dataset.t===(t||'deepblue')));
  refreshTheme();
}
document.getElementById('themeSwitch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)applyTheme(b.dataset.t);});

window.addEventListener('resize',()=>{resize();});

resize();
applyTheme(localStorage.getItem('civ_theme')||'textbook');
buildGraph();
draw();
</script>
</body>
</html>
