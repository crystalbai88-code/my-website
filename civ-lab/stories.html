<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 顺着母题看历史 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<style>
  html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent}
  #app{position:relative;z-index:10;min-height:100dvh;padding-bottom:60px}
  .nav{display:flex;align-items:center;gap:9px;padding:13px 18px 2px;flex-wrap:wrap}
  .nav a.pill{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.08em;
    background:var(--topbar-bg);border:1px solid var(--panel-line);border-radius:999px;padding:7px 13px;backdrop-filter:blur(8px)}
  .nav .title{font-family:var(--serif);font-weight:900;font-size:17px;color:var(--ink);margin-left:4px;text-shadow:var(--label-shadow)}
  .wrap{width:min(680px,92%);margin:0 auto}
  .hero{text-align:center;margin:18px auto 6px}
  .hero .ic{font-size:42px;line-height:1}
  .hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,5.5vw,30px);color:var(--ink);margin:8px 0 6px}
  .hero p{font-family:var(--serif);font-size:14.5px;color:var(--ink2);line-height:1.75;margin:0 auto;max-width:25em}
  .hero p b{color:var(--gold)}
  /* 母题块 */
  .motif{margin-top:24px;background:var(--panel-bg);border:1.5px solid var(--panel-line);border-top:5px solid var(--ac,var(--gold));
    border-radius:18px;padding:18px 18px 20px;backdrop-filter:blur(10px)}
  .motif .mh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .motif .mtag{font-family:var(--sans);font-size:11px;font-weight:800;color:#fff;background:var(--ac,var(--gold));border-radius:999px;padding:3px 11px}
  .motif .mt{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--ink)}
  .motif .mcount{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-left:auto}
  .motif .ms{font-family:var(--serif);font-size:14px;color:var(--ink2);line-height:1.72;margin:9px 0 2px}
  /* 时间线动线 */
  .line{margin-top:14px;position:relative;padding-left:20px}
  .line:before{content:'';position:absolute;left:5px;top:6px;bottom:18px;width:2px;background:var(--panel-line)}
  .station{position:relative;margin-bottom:11px;display:block;text-decoration:none}
  .station:before{content:'';position:absolute;left:-19px;top:16px;width:11px;height:11px;border-radius:50%;
    background:var(--ac,var(--gold));border:2px solid var(--panel-bg);box-shadow:0 0 0 2px var(--ac,var(--gold))}
  .scard{background:var(--bg2,rgba(255,255,255,.04));border:1.5px solid var(--panel-line);border-radius:13px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;transition:transform .14s,border-color .14s,box-shadow .14s;cursor:pointer}
  .station:hover .scard{transform:translateX(3px);border-color:var(--ac,var(--gold));box-shadow:0 6px 16px rgba(0,0,0,.14)}
  .scard .sic{font-size:28px;line-height:1}
  .scard .sbody{flex:1;min-width:0}
  .scard .syr{font-family:var(--mono);font-size:10px;color:var(--ac,var(--gold));font-weight:700;letter-spacing:.04em}
  .scard .snm{font-family:var(--serif);font-weight:900;font-size:16px;color:var(--ink);margin:1px 0}
  .scard .sone{font-family:var(--sans);font-size:12.5px;color:var(--ink2);line-height:1.5}
  .scard .sgo{font-family:var(--sans);font-size:11px;font-weight:800;color:#fff;background:var(--ac,var(--gold));border-radius:999px;padding:6px 11px;white-space:nowrap}
  .seed{position:relative;margin-top:2px}
  .seed:before{content:'';position:absolute;left:-19px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--panel-line)}
  .seed .st{font-family:var(--sans);font-size:12px;color:var(--ink3);padding:5px 0 0}
  /* 找规律(动线终点) */
  .findbtn{display:block;width:100%;box-sizing:border-box;margin-top:8px;font-family:var(--sans);font-weight:800;font-size:14px;color:#fff;
    background:linear-gradient(90deg,var(--ac,var(--gold)),var(--vermilion));border:none;border-radius:12px;padding:13px;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.14)}
  .findbtn:active{transform:scale(.99)}
  .hidden{display:none}
  .find{margin-top:12px;animation:fin .45s cubic-bezier(.22,1,.36,1)}
  @keyframes fin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .find .fq{font-family:var(--serif);font-weight:800;font-size:15.5px;color:var(--ink);line-height:1.6;margin-bottom:10px}
  .opt{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-bg);
    border:1.5px solid var(--panel-line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:all .15s;text-align:left;line-height:1.55;margin-bottom:9px}
  .opt:hover{border-color:var(--gold)}
  .opt.picked{border-color:var(--gold);background:rgba(224,138,44,.1)}
  .opt b{color:var(--gold)}
  .fb{margin-top:4px;font-size:13.5px;color:var(--ink);line-height:1.7;background:rgba(224,138,44,.1);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;display:none}
  .fb.show{display:block;animation:fin .35s}
  .law{margin-top:12px;background:linear-gradient(135deg,rgba(255,248,232,.96),rgba(255,232,200,.96));border:1.5px solid var(--gold);border-radius:14px;padding:16px}
  .law .lk{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--vermilion);font-weight:700;text-transform:uppercase}
  .law .lt{font-family:var(--serif);font-weight:900;font-size:16.5px;color:var(--ink);line-height:1.55;margin:8px 0 0}
  .law .le{font-family:var(--serif);font-size:13.5px;color:var(--ink2);line-height:1.72;margin-top:9px}
  .law .le b{color:var(--vermilion)}
  .move{margin-top:12px}
  .move .mq{font-family:var(--serif);font-size:14.5px;color:var(--ink);line-height:1.7;padding-left:12px;border-left:3px solid var(--gold);margin-bottom:6px}
  .move .mq b{color:var(--gold)}
  textarea{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--panel-bg);
    border:1.5px solid var(--panel-line);border-radius:12px;padding:12px 14px;min-height:70px;outline:none;resize:vertical}
  .savebtn{margin-top:10px;font-family:var(--sans);font-weight:800;font-size:13.5px;color:#fff;background:linear-gradient(90deg,var(--gold),var(--vermilion));border:none;border-radius:999px;padding:10px 20px;cursor:pointer}
  .tip{font-family:var(--sans);font-size:12px;color:var(--ink3);text-align:center;margin:26px auto 0;max-width:30em;padding:0 20px;line-height:1.7}
  .tip a{color:var(--gold);font-weight:700;text-decoration:none}
</style>
</head>

  <div class="wrap">
    <div class="hero">
      <div class="ic">🎯</div>
      <h1>顺着一个「母题」,看历史</h1>
      <p>历史上有些处境,<b>隔着几百年反复出现</b>。顺着同一条线一站站走下去,你就会发现藏在背后的规律——这,才是真正"学到了"历史。</p>
    </div>
    <div id="motifs"></div>
    <div class="tip">💡 这些故事,也散落在 <a href="./map.html">世界地图</a> 上——时间轴走到那个年代,对应的地点就会浮起一枚 🎯 抉择钉子。</div>
  </div>
</div>

<script src="./track.js?v=1"></script>
<script>
// 抉择按"母题"组织成时间线动线;同一母题≥2站,走完即可"找规律"。
const MOTIFS=[
  {id:'gamble', tag:'举国的豪赌', title:'倾国之力,该不该?', ac:'#df8a2c',
   sub:'倾尽国力去办一件大事——可能名垂千古,也可能把国家拖垮。成败的分水岭,常常是:能不能在悬崖前<b>刹住车</b>。',
   stations:[
     {person:'汉武帝', icon:'👑', year:-133, era:'公元前133 · 西汉', one:'打不打匈奴?用整个国家去赌。', url:'./decision-hanwudi.html'},
     {person:'隋炀帝', icon:'👷', year:605, era:'公元605 · 隋', one:'要不要倾举国之力,开凿大运河?', url:'./decision-suiyangdi.html'},
   ],
   find:{
     q:'这两位皇帝,都倾尽国力去办一件大事。走完这两站,你觉得它们藏着什么<b>共同的规律</b>?',
     opts:[
       {t:'倾尽国力办大事,常能留下千秋功业;但<b>能不能及时"刹车"</b>,才决定了国家的生死。', ok:true, fb:'✅ 你抓住了!这正是两条线最深的共同点。往下看揭晓——'},
       {t:'凡是大兴土木、对外征战的皇帝,<b>最后都会亡国</b>。', ok:false, fb:'再想想:汉武帝可没亡国呀。"亡不亡"不是它们真正的共同点。'},
       {t:'只要国库够厚,皇帝<b>怎么折腾都不会出事</b>。', ok:false, fb:'隋炀帝接手的国库厚得流油,照样几年就垮了——可见"刹不刹车"比"家底厚不厚"更关键。'},
     ],
     law:{ lt:'同样是倾国豪赌,<br>生死之差,就在两个字:<b>刹车</b>。',
           le:'汉武帝晚年下「罪己诏」、<b>踩了刹车</b>,保住了汉朝;隋炀帝<b>不知收手</b>,把一个富庶王朝几年就葬送。功业可以相似,结局却天差地别——差别不在做不做,而在<b>知不知道停</b>。' },
     move:'这条"<b>能不能刹车</b>"的规律,你还能在别处见到吗?(历史里,或今天的生活里)',
     key:'find_gamble' },
  },
  {id:'merit', tag:'功高震主', title:'立了大功的人,为什么没好下场?', ac:'#8a6cd0',
   sub:'为君主立下盖世大功的人,功劳本身会变成<b>催命符</b>——他越强,君主越怕他。',
   stations:[
     {person:'商鞅', icon:'⚖️', year:-356, era:'公元前356 · 秦', one:'变法令秦强大,功成之后却被新王车裂。', url:'./decision-shangyang.html'},
     {person:'韩信', icon:'⚔️', year:-203, era:'公元前203 · 齐', one:'助刘邦定天下,却被吕后诱杀、夷三族。', url:'./decision-hanxin.html'},
   ],
   find:{
     q:'商鞅和韩信,一个变法功臣、一个开国功臣,都立下盖世之功,都被自己<b>效力的国家</b>杀掉。你觉得藏着什么共同的规律?',
     opts:[
       {t:'功劳太大、又握着力量的人,会让君主<b>害怕</b>——而这份恐惧,常常要了功臣的命。', ok:true, fb:'✅ 你抓住了!这正是《史记》里反复出现的规律。往下看揭晓——'},
       {t:'有本事的人,<b>最后都会被杀</b>。', ok:false, fb:'太绝对了:同时代的张良、萧何都善终了。关键不在"有没有本事"。'},
       {t:'只要对君主<b>足够忠诚</b>,就一定安全。', ok:false, fb:'韩信够忠诚了吧?照样被杀。光靠忠诚保不了命——问题出在君主的"怕"。'},
     ],
     law:{ lt:'功盖天下者,赏无可赏;<br>威震君主者,身处险地。',
           le:'商鞅的法让秦国强大,新王却<b>容不下他</b>;韩信的兵打下天下,刘邦却<b>睡不安稳</b>。功臣的功劳越大,君主的恐惧越深——这份恐惧,常常就成了催命符。司马迁叹他们都"<b>功成而不知止</b>"。' },
     move:'这条"<b>功高震主</b>"的规律,你还能在别处见到吗?(历史里,或你身边)',
     key:'find_merit' },
  },
  {id:'reform', tag:'改革的代价', title:'要不要硬碰既得利益?', ac:'#e2603f',
   sub:'想改变一个旧世界,就得硬碰<b>既得利益</b>——它从不会乖乖让步,还会在你失去靠山那天反扑。',
   stations:[
     {person:'吴起', icon:'🗡️', year:-381, era:'公元前381 · 楚', one:'楚王把改革的刀交给你,要不要硬削贵族特权?', url:'./decision-wuqi.html'},
     {person:'商鞅', icon:'⚖️', year:-356, era:'公元前356 · 秦', one:'太子犯了你亲手定的新法,罚,还是不罚?', url:'./decision-shangyang.html'},
   ],
   find:{
     q:'吴起在楚、商鞅在秦,隔了几十年,都靠变法让国家强大,又都在君主一死后被旧贵族清算杀掉。你觉得藏着什么共同的规律?',
     opts:[
       {t:'改变旧世界,就要夺<b>既得利益者</b>的好处;一旦失去君主庇护,他们就会反扑——<b>变法者常常等不到新世界</b>。', ok:true, fb:'✅ 你抓住了!这正是两场变法最深的共同点。往下看揭晓——'},
       {t:'变法<b>一定会失败</b>,所以根本不该变。', ok:false, fb:'可秦国靠商鞅之法最终统一天下——变法没失败,失败的是变法者本人的安危。'},
       {t:'他们都是因为<b>太残忍</b>才被杀的。', ok:false, fb:'手段是一方面,但真正要他们命的,是被夺了世袭特权、恨之入骨的旧贵族。'},
     ],
     law:{ lt:'强国可成,变法者难全;<br>动既得利益的人,常常<b>拿命去填</b>。',
           le:'吴起伏在楚王尸上被乱箭射死,商鞅被新王车裂——他们靠一位君主的支持推动变法,君主一死,失去特权的旧贵族立刻反扑。<b>改革成了,改革者却倒在了新世界的门口。</b>' },
     move:'这条"<b>变法者难有好下场</b>"的规律,你还能在别处见到吗?(比如后来的王安石、张居正)',
     key:'find_reform' },
  },
  {id:'conscience', tag:'良心与法律', title:'良心撞上法律,听谁的?', ac:'#b06aa0',
   sub:'当一个人的<b>良心</b>,撞上国家的<b>法律</b>,该听哪一个?',
   stations:[
     {person:'苏格拉底', icon:'🏛️', year:-399, era:'公元前399 · 雅典', one:'门开着,你逃走求生,还是留下赴死?', url:'./decision-socrates.html'},
     {person:'托马斯·莫尔', icon:'📜', year:1534, era:'公元1534 · 英国', one:'国王要你签字违背良心,签,还是不签?', url:'./decision-more.html'},
   ],
   find:{
     q:'苏格拉底在古希腊、莫尔在英国,隔了快两千年,都面对"良心撞上法律",都为自己的选择搭上了性命——可他们的选择正好<b>相反</b>。你觉得这藏着什么?',
     opts:[
       {t:'良心和法律冲突时<b>没有标准答案</b>——有人服从法律、有人服从良心,但都要为选择付出代价;这个两难,人类两千年都没解开。', ok:true, fb:'✅ 你看透了!这正是两个故事最深的共同点。往下看揭晓——'},
       {t:'<b>服从法律</b>的人才是对的,反抗的都是错的。', ok:false, fb:'太绝对了:那莫尔为良心而死,就白死了吗?后人却尊他为圣人。'},
       {t:'<b>反抗法律</b>的人才是英雄,服从的都是懦弱。', ok:false, fb:'也太绝对:苏格拉底明明能逃,却选择守法赴死——那是懦弱吗?那是另一种勇敢。'},
     ],
     law:{ lt:'良心,还是法律?<br>两千年了,人类<b>依然站在两难里</b>。',
           le:'苏格拉底"哪怕判错也要守法",平静赴死;莫尔"哪怕违法也要守心",为良心而死。两种<b>相反</b>的答案,都伟大、都悲壮。这道题没有标准答案,但它逼每个人想清楚:<b>你心里,什么才是最高的?</b>' },
     move:'如果有一天,规则要你做一件你觉得不对的事,你会怎么办?',
     key:'find_conscience' },
  },
  {id:'mercy', tag:'该不该痛下杀手', title:'能除掉对手时,该不该下手?', ac:'#c0563a',
   sub:'面对一个还没成气候、却<b>可能威胁你</b>的对手——是斩草除根,还是网开一面?一念之差,可能就是天壤之别。',
   stations:[
     {person:'项羽 · 鸿门宴', icon:'🍷', year:-206, era:'公元前206 · 鸿门', one:'席间杀机:杀掉刘邦,还是放他一马?', url:'./decision-hongmenyan.html'},
     {person:'李世民 · 玄武门', icon:'🏯', year:626, era:'公元626 · 长安', one:'兄弟要害你,先下手杀兄夺位,还是隐忍?', url:'./decision-lishimin.html'},
   ],
   find:{
     q:'项羽在鸿门宴能杀刘邦却"心软"放了、终致败亡;李世民在玄武门"狠心"杀掉兄弟、赢了天下却背了污名。你觉得藏着什么规律?',
     opts:[
       {t:'在你死我活的权力顶峰,"该狠时不狠"会要命;但"狠"也要背上良心与名声的代价——<b>常常没有两全</b>。', ok:true, fb:'✅ 你看透了!这正是两个故事最深的共同点。往下看揭晓——'},
       {t:'心狠的人<b>一定赢</b>,心软的人一定输。', ok:false, fb:'太绝对了:历史上心狠却败亡、心软却成事的也不少。关键不只是"狠不狠"。'},
       {t:'项羽放过刘邦才对,<b>杀人永远是错的</b>。', ok:false, fb:'可正是这次"不忍",让项羽丢了天下和性命——后果,也得算进去。'},
     ],
     law:{ lt:'该出手时的犹豫,可能要命;<br>痛下杀手的人,要背一辈子的良心。',
           le:'项羽不忍,葬送了自己;李世民敢狠,赢得了天下却背上"杀兄"的污名。一个输在"心软",一个赢了却付出良心的代价。<b>权力的顶峰,常常没有两全的选择。</b>' },
     move:'如果"心软"会害死自己、"狠心"会留下污点——换作是你,这一刀,下还是不下?',
     key:'find_mercy' },
  },
  {id:'sacrifice', tag:'向死的勇气', title:'明知必死,守还是退?', ac:'#3a8ec0',

const esc=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function stationHtml(s){
  return `<a class="station" href="${s.url}"><div class="scard">
    <div class="sic">${s.icon}</div>
    <div class="sbody"><div class="syr">${esc(s.era)}</div><div class="snm">${esc(s.person)}</div><div class="sone">${esc(s.one)}</div></div>
    <div class="sgo">▶ 进入</div></div></a>`;
}
document.getElementById('motifs').innerHTML=MOTIFS.map(m=>{
  const sts=m.stations.slice().sort((a,b)=>a.year-b.year);
  let inner=`<div class="motif" style="--ac:${m.ac}">
    <div class="mh"><span class="mtag">${esc(m.tag)}</span><span class="mt">${esc(m.title)}</span><span class="mcount">${sts.length} 站</span></div>
    <div class="ms">${m.sub}</div>
    <div class="line">${sts.map(stationHtml).join('')}`;
  if(m.seed){ inner+=`<div class="seed"><div class="st">⏳ ${esc(m.seed)}</div></div>`; }
  inner+=`</div>`;
  if(m.find && sts.length>=2){
    inner+=`<button class="findbtn" id="fb_${m.id}" onclick="openFind('${m.id}')">🧩 两站都走完了?来找它们的规律 →</button>
      <div class="find hidden" id="find_${m.id}"></div>`;
  }
  inner+=`</div>`;
  return inner;
}).join('');

const FINDMAP={}; MOTIFS.forEach(m=>{if(m.find)FINDMAP[m.id]=m.find;});
function openFind(id){
  const f=FINDMAP[id]; const box=document.getElementById('find_'+id);
  document.getElementById('fb_'+id).classList.add('hidden');
  box.classList.remove('hidden');
  box.innerHTML=`<div class="fq">${f.q}</div>`+
    f.opts.map((o,i)=>`<div class="opt" data-i="${i}" onclick="pickFind('${id}',${i})">${o.t}</div>`).join('')+
    `<div class="fb" id="ffb_${id}"></div>
     <div class="law hidden" id="law_${id}"><div class="lk">🔑 这条线的规律</div><div class="lt">${f.law.lt}</div><div class="le">${f.law.le}</div></div>
     <div class="move hidden" id="move_${id}"><div class="mq">${f.move}</div><textarea id="mv_${id}" placeholder="写下你发现的规律,或你想到的另一个例子……"></textarea><button class="savebtn" onclick="saveFind('${id}',event)">💾 记下我的发现</button></div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
  const mv=document.getElementById('mv_'+id); if(mv)mv.value=localStorage.getItem(f.key)||'';
  if(window.Track) Track.log('找规律');
}
const answered={};
function pickFind(id,i){
  const f=FINDMAP[id];
  document.querySelectorAll('#find_'+id+' .opt').forEach(el=>el.classList.toggle('picked',+el.dataset.i===i));
  const fb=document.getElementById('ffb_'+id); fb.innerHTML=f.opts[i].fb; fb.classList.add('show');
  const reveal=()=>{answered[id]=1;document.getElementById('law_'+id).classList.remove('hidden');document.getElementById('move_'+id).classList.remove('hidden');document.getElementById('law_'+id).scrollIntoView({behavior:'smooth',block:'center'});};
  if(f.opts[i].ok && !answered[id]){ setTimeout(reveal,650); }
  else if(!f.opts[i].ok && !document.getElementById('rev_'+id)){
    const b=document.createElement('button'); b.id='rev_'+id; b.className='savebtn'; b.style.marginTop='8px'; b.style.background='var(--panel-bg)'; b.style.color='var(--gold)'; b.style.border='1px solid var(--panel-line)';
    b.textContent='看看哪条才是最深的规律 →'; b.onclick=reveal; fb.after(b);
  }
}
function saveFind(id,e){ const f=FINDMAP[id]; const mv=document.getElementById('mv_'+id); if(mv){localStorage.setItem(f.key,mv.value); const b=e.target; b.textContent='✅ 已记下!'; setTimeout(()=>b.textContent='💾 记下我的发现',1500);} }
</script>
