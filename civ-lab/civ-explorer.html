<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>早期文明关系图谱 · AI 世界文明实验室</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f4efe3; --paper:#fdf5e0; --paper2:#f5e8c8;
  --ink:#2c1a08; --ink2:#5c3a14; --ink3:#9a6828;
  --warm:#c84820; --warm-deep:#a83a18; --gold:#d4a858;
  --line:rgba(160,100,30,.25); --line-soft:rgba(160,100,30,.12);
  --serif:'Noto Serif SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* TOP */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(253,245,228,.95);border-bottom:1px solid var(--line);flex-shrink:0;z-index:10}
.top .back{font-family:var(--mono);font-size:11px;color:var(--warm);text-decoration:none;letter-spacing:.18em}
.top h1{font-family:var(--serif);font-size:16px;font-weight:700}
.top h1 em{font-style:italic;color:var(--warm);margin-right:8px;font-family:Georgia,serif}
.top .subtitle{font-size:10px;color:var(--ink3);font-family:var(--mono);letter-spacing:.1em}

/* FILTERS */
.filters{display:flex;gap:6px;margin-left:auto;align-items:center}
.filters .label{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.15em;margin-right:4px}
.filter{padding:5px 11px;background:white;border:1.5px solid var(--line);border-radius:99px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .15s;font-family:var(--sans)}
.filter:hover{transform:translateY(-1px)}
.filter.on{background:var(--warm);color:white;border-color:var(--warm);box-shadow:0 2px 8px rgba(200,72,32,.3)}

/* MAIN */
.main{flex:1;display:flex;overflow:hidden;position:relative}

/* GRAPH */
.graph{flex:1;position:relative;background:radial-gradient(ellipse at center,#fffaf0 0%,#f4efe3 100%);cursor:grab;overflow:hidden}
.graph:active{cursor:grabbing}
.graph svg{width:100%;height:100%;display:block}

/* SIDE PANEL (滑入式) */
.side{
  width:380px;background:linear-gradient(135deg,var(--paper),var(--paper2));
  border-left:1.5px solid var(--line);overflow-y:auto;padding:22px;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.4,1,.6,1);
  position:absolute;top:0;right:0;bottom:0;z-index:5;
  box-shadow:-12px 0 36px rgba(60,30,5,.18);
}
.side.open{transform:translateX(0)}
.side .close{position:absolute;top:14px;right:14px;background:white;border:1px solid var(--line);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--ink2)}
.side .ps-label{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px;margin-top:8px}
.side h2{font-family:var(--serif);font-size:22px;color:var(--warm);font-weight:700;margin-bottom:8px}
.side h3{font-family:var(--serif);font-size:14px;color:var(--ink);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.side .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.side .meta span{padding:3px 9px;background:white;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.side p{font-size:13px;line-height:1.7;color:var(--ink2);margin-bottom:10px}
.side .conn{
  background:white;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;
  display:flex;align-items:center;gap:8px;margin-bottom:6px;transition:all .15s;
}
.side .conn:hover{border-color:var(--warm);transform:translateX(-2px);background:var(--paper)}
.side .conn .ico{font-size:18px}
.side .conn .info{flex:1;min-width:0}
.side .conn .name{font-size:12px;font-weight:600;color:var(--ink)}
.side .conn .note{font-size:10px;color:var(--ink3);margin-top:1px}
.side .conn .tag{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:3px;color:white;letter-spacing:.1em;text-transform:uppercase}
.tag-friend{background:#2a8038} .tag-family{background:#8a4090} .tag-enemy{background:#c84820}
.tag-mentor{background:#1a7890} .tag-cause{background:#2a8038} .tag-effect{background:#c84820}
.tag-member{background:var(--gold);color:#3a2410}

/* GRAPH ELEMENTS */
.node{cursor:pointer;transition:filter .15s}
.node:hover{filter:brightness(1.1)}
.node.focused{filter:drop-shadow(0 0 12px var(--warm))}
.node.dim{opacity:.2}
.node-civ circle{stroke:white;stroke-width:3}
.node-event circle{stroke:white;stroke-width:2}
.node-person circle{stroke:white;stroke-width:2}
.node text{pointer-events:none;font-family:var(--sans);text-anchor:middle;fill:var(--ink);font-weight:600}
.edge{stroke-opacity:.35;transition:all .15s;pointer-events:none}
.edge.relate{stroke:#8a4090;stroke-width:2;stroke-dasharray:none}
.edge.cause{stroke:#c84820;stroke-width:1.5;marker-end:url(#arrowhead)}
.edge.member{stroke:rgba(160,100,30,.2);stroke-width:1;stroke-dasharray:2,3}
.edge.contemporary{stroke:#9a6828;stroke-width:1;stroke-dasharray:1,3;opacity:.25}
.edge.highlight{stroke-opacity:.9;stroke-width:3}
.edge.dim{stroke-opacity:.05}

/* TOOLTIP */
.tip{
  position:absolute;background:rgba(40,20,8,.92);color:white;padding:6px 10px;border-radius:6px;
  font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20;
  font-family:var(--sans);max-width:200px;line-height:1.4;
}
.tip.show{opacity:1}

/* LEGEND */
.legend{
  position:absolute;bottom:18px;left:18px;background:rgba(255,255,255,.95);
  border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  font-family:var(--mono);font-size:10px;color:var(--ink2);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  box-shadow:var(--sh-1);
}
.legend .lit{display:flex;align-items:center;gap:5px}
.legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid white;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.legend .line{width:20px;height:2px;display:inline-block}

/* CONTROLS */
.controls{position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:4}
.ctrl{
  width:36px;height:36px;background:white;border:1px solid var(--line);border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;
  color:var(--ink2);box-shadow:var(--sh-1);transition:all .15s;
}
.ctrl:hover{background:var(--warm);color:white;border-color:var(--warm)}

/* HEADER HELP BANNER */
.helpbar{position:absolute;top:18px;left:18px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:11px;color:var(--ink2);max-width:280px;line-height:1.5;box-shadow:var(--sh-1)}
.helpbar strong{color:var(--warm);font-family:var(--serif)}
.helpbar .close-help{float:right;cursor:pointer;color:var(--ink3);font-size:14px;margin-left:8px;background:none;border:none}

@media(max-width:900px){
  .side{width:100%;left:0;right:0}
  .filters{margin-left:0;flex-wrap:wrap}
  .top h1{font-size:14px}
  .top .subtitle{display:none}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <a href="./" class="back">← 返回主站</a>
    <h1><em>Stage 1</em>早期文明关系图谱</h1>
    <span class="subtitle">前 3500 — 前 1000 BCE</span>
    <div class="filters">
      <span class="label">显示：</span>
      <button class="filter on" data-type="civ">📜 文明</button>
      <button class="filter on" data-type="event">📅 事件</button>
      <button class="filter on" data-type="person">👤 人物</button>
      <span class="label" style="margin-left:14px">连接：</span>
      <button class="filter on" data-edge="relate">人物关系</button>
      <button class="filter on" data-edge="cause">事件因果</button>
      <button class="filter" data-edge="member">文明归属</button>
      <button class="filter" data-edge="contemporary">同时代</button>
    </div>
  </header>

  <div class="main">
    <div class="graph" id="graph">
      <svg id="svg"></svg>

      <div class="helpbar" id="helpbar">
        <button class="close-help" onclick="document.getElementById('helpbar').style.display='none'">✕</button>
        <strong>🌐 关系图谱</strong><br/>
        所有文明、事件、人物都是节点。<br/>
        · 拖拽节点重新排列<br/>
        · 鼠标滚轮缩放<br/>
        · 单击查看详情<br/>
        · 双击聚焦该节点
      </div>

      <div class="legend">
        <div class="lit"><span class="dot" style="background:#c84820;width:18px;height:18px"></span>文明</div>
        <div class="lit"><span class="dot" style="background:white;border-color:#c84820"></span>事件</div>
        <div class="lit"><span class="dot" style="background:#fff5e0;border-color:#9a6828;width:9px;height:9px"></span>人物</div>
        <div class="lit"><span class="line" style="background:#8a4090"></span>人物关系</div>
        <div class="lit"><span class="line" style="background:#c84820"></span>事件因果</div>
      </div>

      <div class="controls">
        <button class="ctrl" onclick="zoom(1.2)" title="放大">+</button>
        <button class="ctrl" onclick="zoom(0.833)" title="缩小">−</button>
        <button class="ctrl" onclick="resetView()" title="重置">⟳</button>
        <button class="ctrl" onclick="restartSim()" title="重新布局">⚄</button>
      </div>

      <div class="tip" id="tip"></div>
    </div>

    <aside class="side" id="side">
      <button class="close" onclick="closeSide()">✕</button>
      <div id="sideContent"></div>
    </aside>
  </div>
</div>

<script src="./early_civ_kb.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script>
const D = EARLY_CIV_EXPLORER;

// ════════════════════════════════════════════════════════════════
// 构建节点 + 边
// ════════════════════════════════════════════════════════════════
const nodes = [];
const edges = [];

D.civilizations.filter(c => !c.isEvent).forEach(c => {
  nodes.push({id:'c_'+c.id, type:'civ', civ:c.id, label:c.name, icon:c.icon, color:c.color, r:24, data:c});
});
D.events.forEach(e => {
  const civ = D.civilizations.find(c => c.id === e.civ);
  nodes.push({id:'e_'+e.id, type:'event', civ:e.civ, label:e.title, color:civ?civ.color:'#7a2818', year:e.year, r:8, data:e});
});
D.people.filter(p => p.civ !== 'modern').forEach(p => {
  const civ = D.civilizations.find(c => c.id === p.civ);
  nodes.push({id:'p_'+p.id, type:'person', civ:p.civ, label:p.name.split(' ')[0], color:civ?civ.color:'#888', portrait:p.portrait, r:11, data:p});
});

// 边类型：
// 1. relate (人物关系)
D.people.forEach(p => {
  (p.relationships || []).forEach(r => {
    edges.push({source:'p_'+p.id, target:'p_'+r.to, type:'relate', subtype:r.type, note:r.note});
  });
});
// 2. cause (事件因果)
D.events.forEach(e => {
  (e.leads_to || []).forEach(toId => {
    edges.push({source:'e_'+e.id, target:'e_'+toId, type:'cause'});
  });
});
// 3. member (文明归属)
D.events.forEach(e => { if (e.civ) edges.push({source:'c_'+e.civ, target:'e_'+e.id, type:'member'}); });
D.people.forEach(p => { if (p.civ && p.civ !== 'modern') edges.push({source:'c_'+p.civ, target:'p_'+p.id, type:'member'}); });

// 4. contemporary (同时代人物，自动计算)
for (let i=0; i<D.people.length; i++) {
  for (let j=i+1; j<D.people.length; j++) {
    const a = D.people[i], b = D.people[j];
    if (a.civ === 'modern' || b.civ === 'modern') continue;
    if (a.civ === b.civ) continue;  // 同文明已通过 member 连
    // 生卒年重叠
    if (a.born < b.died && b.born < a.died) {
      edges.push({source:'p_'+a.id, target:'p_'+b.id, type:'contemporary'});
    }
  }
}

// ════════════════════════════════════════════════════════════════
// SVG 渲染 + 力导向布局
// ════════════════════════════════════════════════════════════════
const svg = document.getElementById('svg');
const graph = document.getElementById('graph');
const tip = document.getElementById('tip');
let W = graph.clientWidth, H = graph.clientHeight;
let viewBox = {x:0, y:0, w:W, h:H};
const idToNode = {};
nodes.forEach(n => idToNode[n.id] = n);

// 初始位置 (按 civ 聚类)
const civPositions = {
  sumer:     [W*0.20, H*0.30],
  akkad:     [W*0.28, H*0.30],
  babylon:   [W*0.36, H*0.30],
  egypt_old: [W*0.20, H*0.62],
  egypt_mid: [W*0.28, H*0.62],
  egypt_new: [W*0.36, H*0.62],
  indus:     [W*0.55, H*0.45],
  shang:     [W*0.78, H*0.50],
  minoan:    [W*0.55, H*0.20],
  mycenae:   [W*0.65, H*0.20],
  hittite:   [W*0.45, H*0.30],
};
nodes.forEach(n => {
  const cp = civPositions[n.civ] || [W/2, H/2];
  n.x = cp[0] + (Math.random()-.5)*120;
  n.y = cp[1] + (Math.random()-.5)*120;
  n.vx = 0; n.vy = 0;
  if (n.type === 'civ') { n.x = cp[0]; n.y = cp[1]; n.fx = cp[0]; n.fy = cp[1]; }
});

// 力导向模拟 (简化版)
let simRunning = true;
function simStep(){
  if (!simRunning) return;
  const K = 0.04, REP = 1800, LINK = 0.015;

  // 排斥力
  for (let i=0; i<nodes.length; i++) {
    const a = nodes[i];
    if (a.fx != null) continue;
    for (let j=i+1; j<nodes.length; j++) {
      const b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist2 = dx*dx + dy*dy + 1;
      const force = REP / dist2;
      const fx = (dx/Math.sqrt(dist2)) * force, fy = (dy/Math.sqrt(dist2)) * force;
      a.vx -= fx; a.vy -= fy;
      if (b.fx == null) { b.vx += fx; b.vy += fy; }
    }
  }
  // 连接吸引力
  edges.forEach(e => {
    if (filteredEdge(e)) return;
    const a = idToNode[e.source], b = idToNode[e.target];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx+dy*dy) + 1;
    const targetDist = e.type === 'member' ? 120 : (e.type === 'cause' ? 100 : 80);
    const force = (dist - targetDist) * LINK;
    const fx = (dx/dist)*force, fy = (dy/dist)*force;
    if (a.fx == null) { a.vx += fx; a.vy += fy; }
    if (b.fx == null) { b.vx -= fx; b.vy -= fy; }
  });
  // 居中力
  nodes.forEach(n => {
    if (n.fx != null) return;
    n.vx += (W/2 - n.x) * 0.002;
    n.vy += (H/2 - n.y) * 0.002;
  });
  // 更新位置 + 阻尼
  nodes.forEach(n => {
    if (n.fx != null) { n.x = n.fx; n.y = n.fy; return; }
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
  });
  draw();
  requestAnimationFrame(simStep);
}

function filteredEdge(e){
  const a = idToNode[e.source], b = idToNode[e.target];
  if (!a || !b) return true;
  if (!filterTypes.has(a.type) || !filterTypes.has(b.type)) return true;
  if (!filterEdges.has(e.type)) return true;
  return false;
}
function filteredNode(n){ return !filterTypes.has(n.type); }

const filterTypes = new Set(['civ','event','person']);
const filterEdges = new Set(['relate','cause']);

// 渲染
function draw(){
  let svgContent = `<defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#c84820"/>
    </marker>
  </defs>
  <g transform="translate(${-viewBox.x},${-viewBox.y}) scale(${W/viewBox.w})">`;

  // 边
  edges.forEach(e => {
    if (filteredEdge(e)) return;
    const a = idToNode[e.source], b = idToNode[e.target];
    const cls = `edge ${e.type}` + (focusedId && (e.source===focusedId||e.target===focusedId) ? ' highlight' : '') + (focusedId && e.source!==focusedId && e.target!==focusedId ? ' dim' : '');
    svgContent += `<line class="${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  });

  // 节点
  nodes.forEach(n => {
    if (filteredNode(n)) return;
    const cls = `node node-${n.type}` + (focusedId === n.id ? ' focused' : '') + (focusedId && !isConnectedTo(n.id) ? ' dim' : '');
    if (n.type === 'civ') {
      svgContent += `<g class="${cls}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
        <circle r="${n.r}" fill="${n.color}"/>
        <text y="6" font-size="18">${n.icon}</text>
        <text y="${n.r+16}" font-size="11" fill="${n.color}" font-weight="700">${n.label}</text>
      </g>`;
    } else if (n.type === 'event') {
      svgContent += `<g class="${cls}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
        <circle r="${n.r}" fill="white" stroke="${n.color}" stroke-width="2.5"/>
        ${focusedId === n.id || idToNode[focusedId]?.type==='event' ? `<text y="${n.r+12}" font-size="9" font-weight="600">${n.label.slice(0,12)}</text>` : ''}
      </g>`;
    } else if (n.type === 'person') {
      svgContent += `<g class="${cls}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
        <circle r="${n.r}" fill="#fff5e0" stroke="${n.color}" stroke-width="2"/>
        <text y="4" font-size="13">${n.portrait}</text>
        ${focusedId === n.id || idToNode[focusedId]?.type==='person' ? `<text y="${n.r+12}" font-size="9" font-weight="600">${n.label}</text>` : ''}
      </g>`;
    }
  });

  svgContent += `</g>`;
  svg.innerHTML = svgContent;

  // 绑定事件
  svg.querySelectorAll('.node').forEach(el => {
    const id = el.getAttribute('data-id');
    el.addEventListener('mouseenter', e => showTip(e, id));
    el.addEventListener('mouseleave', () => hideTip());
    el.addEventListener('click', () => focusNode(id));
    el.addEventListener('mousedown', e => startDrag(e, id));
  });
}

let focusedId = null;
function focusNode(id){
  focusedId = id;
  showSide(id);
  draw();
}

function isConnectedTo(nid){
  if (nid === focusedId) return true;
  return edges.some(e => (e.source === focusedId && e.target === nid) || (e.target === focusedId && e.source === nid));
}

// ════════════════════════════════════════════════════════════════
// 拖拽 + 缩放
// ════════════════════════════════════════════════════════════════
let dragNode = null, dragStart = null;
function startDrag(e, id){
  e.stopPropagation();
  const n = idToNode[id];
  if (!n || n.type === 'civ') return;  // civ 固定
  dragNode = n;
  const r = svg.getBoundingClientRect();
  dragStart = {x: e.clientX, y: e.clientY, nx: n.x, ny: n.y};
  n.fx = n.x; n.fy = n.y;
}
window.addEventListener('mousemove', e => {
  if (!dragNode) return;
  const scale = W / viewBox.w;
  const dx = (e.clientX - dragStart.x) / scale;
  const dy = (e.clientY - dragStart.y) / scale;
  dragNode.fx = dragStart.nx + dx;
  dragNode.fy = dragStart.ny + dy;
  dragNode.x = dragNode.fx; dragNode.y = dragNode.fy;
});
window.addEventListener('mouseup', () => {
  if (dragNode) { dragNode.fx = null; dragNode.fy = null; dragNode = null; }
});

// 滚轮缩放
graph.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 1.1 : 0.9;
  const rect = graph.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / W;
  const my = (e.clientY - rect.top) / H;
  const newW = viewBox.w * delta;
  const newH = viewBox.h * delta;
  viewBox.x += (viewBox.w - newW) * mx;
  viewBox.y += (viewBox.h - newH) * my;
  viewBox.w = newW; viewBox.h = newH;
  draw();
}, {passive:false});

// 画布平移
let panStart = null;
graph.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  panStart = {x: e.clientX, y: e.clientY, vx: viewBox.x, vy: viewBox.y};
});
window.addEventListener('mousemove', e => {
  if (!panStart || dragNode) return;
  const scale = W / viewBox.w;
  viewBox.x = panStart.vx - (e.clientX - panStart.x) / scale;
  viewBox.y = panStart.vy - (e.clientY - panStart.y) / scale;
  draw();
});
window.addEventListener('mouseup', () => panStart = null);

function zoom(factor){
  const cx = viewBox.x + viewBox.w/2, cy = viewBox.y + viewBox.h/2;
  viewBox.w /= factor; viewBox.h /= factor;
  viewBox.x = cx - viewBox.w/2; viewBox.y = cy - viewBox.h/2;
  draw();
}
function resetView(){ viewBox = {x:0,y:0,w:W,h:H}; focusedId = null; draw(); }
function restartSim(){
  nodes.forEach(n => { if (n.fx == null) { n.vx = (Math.random()-.5)*20; n.vy = (Math.random()-.5)*20; }});
}

// ════════════════════════════════════════════════════════════════
// Tooltip
// ════════════════════════════════════════════════════════════════
function showTip(e, id){
  const n = idToNode[id];
  if (!n) return;
  let t = '';
  if (n.type === 'civ') t = `<strong>${n.icon} ${n.data.name}</strong><br>${n.data.region}<br>前 ${Math.abs(n.data.start)} - 前 ${Math.abs(n.data.end)}`;
  else if (n.type === 'event') t = `<strong>📅 ${n.data.title}</strong><br>前 ${Math.abs(n.data.year)} BCE · ${n.data.type}`;
  else if (n.type === 'person') t = `<strong>${n.data.portrait} ${n.data.name}</strong><br>${n.data.role}<br>前 ${Math.abs(n.data.born)} - 前 ${Math.abs(n.data.died)}`;
  tip.innerHTML = t;
  tip.classList.add('show');
  const r = graph.getBoundingClientRect();
  tip.style.left = (e.clientX - r.left + 12) + 'px';
  tip.style.top = (e.clientY - r.top + 12) + 'px';
}
function hideTip(){ tip.classList.remove('show'); }

// ════════════════════════════════════════════════════════════════
// 详情侧栏
// ════════════════════════════════════════════════════════════════
function showSide(id){
  const n = idToNode[id];
  if (!n) return;
  const side = document.getElementById('side');
  const content = document.getElementById('sideContent');
  side.classList.add('open');

  if (n.type === 'civ') {
    const c = n.data;
    const ev = D.events.filter(e => e.civ === c.id);
    const pp = D.people.filter(p => p.civ === c.id);
    content.innerHTML = `
      <div class="ps-label">CIVILIZATION · 文明</div>
      <h2 style="color:${c.color}">${c.icon} ${c.name}</h2>
      <div class="meta">
        <span>${c.region}</span>
        <span>前 ${Math.abs(c.start)} - 前 ${Math.abs(c.end)}</span>
      </div>
      <h3>📅 事件 (${ev.length})</h3>
      ${ev.map(e => `<div class="conn" onclick="focusNode('e_${e.id}')"><span class="ico">📅</span><div class="info"><div class="name">${e.title}</div><div class="note">前 ${Math.abs(e.year)} · ${e.type}</div></div></div>`).join('')}
      <h3>👤 人物 (${pp.length})</h3>
      ${pp.map(p => `<div class="conn" onclick="focusNode('p_${p.id}')"><span class="ico">${p.portrait}</span><div class="info"><div class="name">${p.name}</div><div class="note">${p.role}</div></div></div>`).join('') || '<p style="color:var(--ink3);font-size:12px">无具名人物</p>'}
    `;
  } else if (n.type === 'event') {
    const e = n.data;
    const civ = e.civ ? D.civilizations.find(c => c.id === e.civ) : null;
    const causes = (e.caused_by||[]).map(id => D.events.find(x=>x.id===id)).filter(Boolean);
    const leads = (e.leads_to||[]).map(id => D.events.find(x=>x.id===id)).filter(Boolean);
    content.innerHTML = `
      <div class="ps-label">EVENT · 事件</div>
      <h2>📅 ${e.title}</h2>
      <div class="meta">
        <span>前 ${Math.abs(e.year)} BCE</span>
        <span>${e.type}</span>
        ${civ ? `<span style="background:${civ.color};color:white;border:none">${civ.icon} ${civ.name}</span>` : ''}
      </div>
      ${civ ? `<div class="conn" onclick="focusNode('c_${civ.id}')"><span class="ico">${civ.icon}</span><div class="info"><div class="name">所属文明: ${civ.name}</div></div><span class="tag tag-member">归属</span></div>` : ''}
      ${causes.length ? `<h3>⬅ 起因 (${causes.length})</h3>${causes.map(c=>`<div class="conn" onclick="focusNode('e_${c.id}')"><span class="ico">📅</span><div class="info"><div class="name">${c.title}</div><div class="note">前 ${Math.abs(c.year)} · ${c.type}</div></div><span class="tag tag-cause">起因</span></div>`).join('')}` : ''}
      ${leads.length ? `<h3>➡ 后果 (${leads.length})</h3>${leads.map(c=>`<div class="conn" onclick="focusNode('e_${c.id}')"><span class="ico">📅</span><div class="info"><div class="name">${c.title}</div><div class="note">前 ${Math.abs(c.year)} · ${c.type}</div></div><span class="tag tag-effect">后果</span></div>`).join('')}` : ''}
    `;
  } else if (n.type === 'person') {
    const p = n.data;
    const civ = D.civilizations.find(c => c.id === p.civ) || {color:'#888',name:p.civ,icon:'❓'};
    content.innerHTML = `
      <div class="ps-label">PERSON · 人物</div>
      <h2 style="color:${civ.color}">${p.portrait} ${p.name}</h2>
      <div class="meta">
        <span>${civ.icon} ${civ.name}</span>
        <span>${p.role}</span>
        <span>前 ${Math.abs(p.born)} - 前 ${Math.abs(p.died)}</span>
      </div>
      <p>${p.desc}</p>
      ${p.inventions?.length ? `<h3>🏆 贡献</h3>${p.inventions.map(i=>`<div style="font-size:12px;padding:6px 10px;background:white;border-radius:6px;margin-bottom:4px;border-left:3px solid ${civ.color}">${i}</div>`).join('')}` : ''}
      <div class="conn" onclick="focusNode('c_${p.civ}')"><span class="ico">${civ.icon}</span><div class="info"><div class="name">所属: ${civ.name}</div></div><span class="tag tag-member">归属</span></div>
      ${p.relationships?.length ? `<h3>🤝 朋友圈 (${p.relationships.length})</h3>${p.relationships.map(r=>{const o=D.people.find(x=>x.id===r.to);if(!o)return'';return `<div class="conn" onclick="focusNode('p_${o.id}')"><span class="ico">${o.portrait}</span><div class="info"><div class="name">${o.name}</div><div class="note">${r.note||o.role}</div></div><span class="tag tag-${r.type}">${r.type}</span></div>`;}).join('')}` : ''}
    `;
  }
}
function closeSide(){ document.getElementById('side').classList.remove('open'); focusedId = null; draw(); }

// 过滤器
document.querySelectorAll('.filter').forEach(btn => {
  btn.onclick = () => {
    btn.classList.toggle('on');
    const t = btn.dataset.type, e = btn.dataset.edge;
    if (t) {
      if (btn.classList.contains('on')) filterTypes.add(t); else filterTypes.delete(t);
    }
    if (e) {
      if (btn.classList.contains('on')) filterEdges.add(e); else filterEdges.delete(e);
    }
    draw();
  };
});

// resize
window.addEventListener('resize', () => {
  W = graph.clientWidth; H = graph.clientHeight;
  viewBox.w = W; viewBox.h = H;
  draw();
});

// 启动
draw();
simStep();

// 暴露
window.focusNode = focusNode;
window.closeSide = closeSide;
window.zoom = zoom;
window.resetView = resetView;
window.restartSim = restartSim;
</script>

</body>
</html>
