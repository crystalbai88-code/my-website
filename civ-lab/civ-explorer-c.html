<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>形态 C · 时间卷轴 · 早期文明</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#fdf8ed; --paper2:#f5e8c8;
  --ink:#1a1410; --ink2:#5c4530; --ink3:#8a7050;
  --gold:#d4a858; --vermilion:#c84820;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--sans);background:#f5e8c8;color:var(--ink);scroll-behavior:smooth}

/* 顶栏 sticky */
.topbar{position:sticky;top:0;height:50px;z-index:30;background:rgba(253,248,237,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(160,100,30,.15);display:flex;align-items:center;gap:14px;padding:0 22px}
.topbar .home{font-family:var(--mono);font-size:11px;color:var(--vermilion);text-decoration:none;letter-spacing:.18em}
.topbar h1{font-family:var(--serif);font-size:14px;font-weight:700}
.topbar h1 em{color:var(--vermilion);font-style:normal;margin-left:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em}

/* 侧边时间轴 (sticky 左侧) */
.timeline-rail{position:fixed;left:14px;top:80px;bottom:14px;width:60px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(253,248,237,.85);backdrop-filter:blur(12px);border:1px solid rgba(160,100,30,.18);border-radius:30px;padding:14px 0}
.timeline-rail .mark{
  width:40px;padding:6px 0;border-radius:99px;cursor:pointer;
  font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.04em;
  text-align:center;transition:all .2s;
}
.timeline-rail .mark:hover{background:rgba(212,168,88,.2);color:var(--vermilion)}
.timeline-rail .mark.active{background:var(--vermilion);color:white}
.timeline-rail .mark.done{background:rgba(212,168,88,.3);color:#7a5530}
.timeline-rail .end{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1a1410;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;margin-top:auto;opacity:.4}
.timeline-rail .end.unlocked{opacity:1;box-shadow:0 4px 14px rgba(212,168,88,.5)}

/* 卷轴主体 */
.scroll{margin-left:90px;padding:30px 24px 60px;max-width:880px}

/* 每段卷轴 */
.segment{
  background:white;border-radius:18px;margin-bottom:36px;
  border:1px solid rgba(160,100,30,.15);overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.04);
  scroll-margin-top:70px;
}
.seg-hero{padding:32px 32px 24px;position:relative;color:white;overflow:hidden}
.seg-hero .bg{position:absolute;inset:0;z-index:0}
.seg-hero .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.55) 100%)}
.seg-hero .icon{font-size:42px;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));position:relative;z-index:1}
.seg-hero .num{font-family:var(--mono);font-size:10px;letter-spacing:.3em;opacity:.85;margin-bottom:4px;position:relative;z-index:1}
.seg-hero .range{font-family:var(--mono);font-size:12px;letter-spacing:.18em;opacity:.85;margin-bottom:8px;position:relative;z-index:1}
.seg-hero h2{font-family:var(--serif);font-size:38px;font-weight:900;line-height:1.05;margin-bottom:6px;position:relative;z-index:1;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.seg-hero .subtitle{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.3em;opacity:.7;text-transform:uppercase;margin-bottom:14px;position:relative;z-index:1}
.seg-hero .question{font-family:var(--serif);font-size:15px;line-height:1.6;font-weight:500;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 10px 10px 0;position:relative;z-index:1}

.seg-body{padding:24px 32px 28px;background:var(--paper)}
.world-ctx{font-family:var(--serif);font-size:13.5px;line-height:1.7;color:var(--ink2);background:linear-gradient(135deg,rgba(212,168,88,.12),rgba(200,72,32,.06));border:1px solid rgba(212,168,88,.25);border-radius:12px;padding:12px 16px;margin-bottom:20px}
.world-ctx::before{content:'🌐 ';color:var(--vermilion);font-weight:700}

.section-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--vermilion);margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid rgba(200,72,32,.2);display:flex;gap:8px}
.section-title .count{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:auto;letter-spacing:.1em}

/* 文明卡 */
.civ-card{background:white;border-radius:12px;margin-bottom:10px;border:1px solid rgba(160,100,30,.18);overflow:hidden;transition:all .2s}
.civ-card.expanded{box-shadow:0 6px 18px rgba(160,100,30,.12);border-color:var(--gold)}
.civ-head{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:54px}
.civ-head:hover{background:rgba(212,168,88,.05)}
.dot-ic{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.civ-head .info{flex:1;min-width:0}
.civ-head .name{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
.civ-head .l1{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5}
.state-chip{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:99px;letter-spacing:.08em;font-weight:700;background:rgba(212,168,88,.15);color:#8a6028}
.state-chip[data-state="巅峰"]{background:rgba(60,160,80,.15);color:#2a6038}
.state-chip[data-state="崩溃"],.state-chip[data-state="集体崩溃"]{background:rgba(200,72,32,.15);color:var(--vermilion)}
.expand-ic{width:30px;height:30px;border-radius:50%;background:rgba(212,168,88,.1);color:var(--vermilion);display:flex;align-items:center;justify-content:center;font-size:12px;transition:transform .25s}
.civ-card.expanded .expand-ic{transform:rotate(180deg)}
.civ-body{display:none;padding:4px 16px 16px;border-top:1px dashed rgba(160,100,30,.2)}
.civ-card.expanded .civ-body{display:block}
.layer{margin-top:12px;animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.l-label{font-family:var(--mono);font-size:9px;color:var(--vermilion);letter-spacing:.18em;font-weight:700;margin-bottom:5px;text-transform:uppercase}
.l-text{font-family:var(--serif);font-size:14px;line-height:1.8;color:var(--ink)}
.narrative{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(245,232,200,.5));border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 10px 10px 0;font-family:var(--serif);font-size:13.5px;line-height:1.9;color:var(--ink)}
.narrative p{margin-bottom:12px}.narrative p:last-child{margin-bottom:0}
.evt-list,.person-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.evt-item,.person-item{background:rgba(245,232,200,.4);border:1px solid rgba(160,100,30,.15);border-radius:10px;padding:11px 14px}
.evt-item .ti,.person-item .ti{font-weight:700;color:var(--ink);font-size:13px;font-family:var(--serif);margin-bottom:3px}
.evt-item .meta,.person-item .meta{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.evt-item .body,.person-item .body{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:5px}
.reveal-btn{margin-top:12px;width:100%;padding:10px 14px;border-radius:10px;border:1.5px dashed rgba(200,72,32,.4);background:transparent;cursor:pointer;color:var(--vermilion);font-family:var(--serif);font-size:12.5px;font-weight:600}
.reveal-btn:hover{background:rgba(200,72,32,.06);border-style:solid}

/* 段间衔接条 (上一章文明在本章的延续) */
.bridge{
  display:flex;align-items:center;gap:8px;margin-bottom:18px;padding:8px 14px;
  background:rgba(212,168,88,.1);border:1px dashed rgba(212,168,88,.4);border-radius:10px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink2);letter-spacing:.04em;
}
.bridge::before{content:'⏪';margin-right:4px}

/* 总汇段 */
.terminal-seg{
  background:linear-gradient(135deg,#1a1410,#3a2a1a);color:white;
  border-radius:18px;padding:36px 32px;margin-top:40px;text-align:center;
  scroll-margin-top:70px;
}
.terminal-seg h2{font-family:var(--serif);font-size:32px;font-weight:900;margin-bottom:8px}
.terminal-seg .sub{font-family:'Cinzel',serif;letter-spacing:.3em;opacity:.7;font-size:12px;margin-bottom:24px;text-transform:uppercase}
.gantt{display:grid;grid-template-columns:130px repeat(5,1fr) 1.6fr;background:white;color:var(--ink);border-radius:12px;overflow:hidden;text-align:left}
.gh{padding:10px;background:rgba(212,168,88,.2);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--vermilion);letter-spacing:.08em;border-bottom:1px solid rgba(160,100,30,.2);text-align:center}
.gh:first-child{text-align:left}.gh.legacy{background:rgba(200,72,32,.15)}
.gc{padding:10px;border-bottom:1px solid rgba(160,100,30,.08);min-height:46px;display:flex;align-items:center}
.gc.civ-name{font-family:var(--serif);font-weight:700;font-size:12.5px;background:rgba(245,232,200,.4)}
.gc.block{position:relative;padding:0}
.gc .bar{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border-radius:4px}
.gc .bar.peak{opacity:1}.gc .bar.rise,.gc .bar.fade{opacity:.55}
.gc.legacy-cell{font-size:11px;color:var(--ink2);line-height:1.5;background:rgba(200,72,32,.04)}
.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:24px;text-align:left}
.legacy-card{background:white;color:var(--ink);border-radius:12px;padding:14px 16px}
.legacy-card .what{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--vermilion);margin-bottom:3px}
.legacy-card .from{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.08em;margin-bottom:6px}
.legacy-card .why{font-size:12.5px;line-height:1.6;color:var(--ink2)}
.legacy-h{font-family:var(--serif);font-size:22px;font-weight:900;margin:24px 0 12px;color:white}

@media (max-width:768px){
  .timeline-rail{display:none}
  .scroll{margin-left:0;padding:20px 16px}
  .seg-hero{padding:24px 20px 18px}.seg-hero h2{font-size:28px}
  .seg-body{padding:18px 20px}
  .gantt{grid-template-columns:80px repeat(5,1fr) 1.4fr;font-size:10px}
  .gh,.gc{padding:5px}
  .terminal-seg{padding:24px 18px}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="./civ-explorer-compare.html" class="home">← 对比页</a>
  <h1>早期文明 · 时间卷轴 <em>FORM C</em></h1>
  <div style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.16em">SCROLL ↓</div>
</div>

<div class="timeline-rail" id="rail"></div>
<div class="scroll" id="scroll"></div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
const done = new Set([0]);

function getCivInfo(id){
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f;
  }
  const fb = {egypt_predynastic:{name:'古埃及·前王朝',icon:'🌅',color:'#d4b870'},indus_early:{name:'印度河早期',icon:'🏘',color:'#a070d4'}};
  return fb[id] || {name:id,icon:'🏛',color:'#888'};
}

function renderRail(){
  const r = document.getElementById('rail');
  r.innerHTML = CHAPTERS.map((c,i)=>`<div class="mark ${done.has(i)?'done':''}" data-idx="${i}" onclick="jump(${i})" title="${c.title}">${c.no}</div>`).join('')
    + `<div class="end ${done.size>=5?'unlocked':''}" onclick="if(done.size>=5)jump('end')" title="终点 · 全景总汇">🏁</div>`;
}

function renderSegment(ch, i, prevCh){
  let bridge = '';
  if (prevCh) {
    const carryOver = prevCh.active_civs.filter(pc => ch.active_civs.some(cc => cc.id===pc.id));
    if (carryOver.length) {
      bridge = `<div class="bridge">上一章的 ${carryOver.map(c=>{const info=getCivInfo(c.id);return info.icon+' '+info.name;}).join(' / ')} 在本章继续</div>`;
    }
  }
  return `<div class="segment" id="seg-${i}" data-ch="${i}">
    <div class="seg-hero">
      <div class="bg" style="background:${ch.mood_grad}"></div>
      <div class="icon">${ch.icon}</div>
      <div class="num">CHAPTER ${ch.no}</div>
      <div class="range">${ch.range} BCE</div>
      <h2>${ch.title}</h2>
      <div class="subtitle">${ch.subtitle}</div>
      <div class="question">💭 ${ch.hero_question}</div>
    </div>
    <div class="seg-body">
      ${bridge}
      <div class="world-ctx">${ch.world_context}</div>
      <h3 class="section-title">🏛 本期活跃文明 <span class="count">${ch.active_civs.length} 个</span></h3>
      ${ch.active_civs.map((cv,idx)=>{
        const info = getCivInfo(cv.id);
        const cid = `${i}-${idx}`;
        return `<div class="civ-card" id="card-${cid}">
          <div class="civ-head" onclick="toggle('${cid}')">
            <div class="dot-ic" style="background:${info.color}">${info.icon}</div>
            <div class="info"><div class="name">${info.name}</div><div class="l1">${cv.L1||''}</div></div>
            <span class="state-chip" data-state="${cv.state}">${cv.state}</span>
            <div class="expand-ic">▼</div>
          </div>
          <div class="civ-body">
            <div class="layer"><div class="l-label">L2 · 此期状态</div><div class="l-text">${cv.L2||cv.in_period_summary||''}</div></div>
            ${cv.L3_events?.length ? `<button class="reveal-btn" onclick="reveal('${cid}',3)" id="r3-${cid}">▼ 继续 · ${cv.L3_events.length} 个关键事件 (L3)</button><div id="l3-${cid}" style="display:none" class="layer"><div class="l-label">L3 · 关键事件</div><div class="evt-list">${cv.L3_events.map(eid=>{const e=(typeof EVENT_DEEP!=='undefined')?EVENT_DEEP[eid]:null;if(!e)return `<div class="evt-item"><div class="ti">📅 ${eid}</div><div class="meta">深度待补</div></div>`;return `<div class="evt-item"><div class="ti">📅 ${e.full_title}</div><div class="meta">${e.one_liner||''}</div><div class="body">${(e.narrative||'').slice(0,200).trim()}...</div></div>`;}).join('')}</div></div>` : ''}
            ${cv.L4_people?.length ? `<button class="reveal-btn" onclick="reveal('${cid}',4)" id="r4-${cid}">▼ 继续 · ${cv.L4_people.length} 个关键人物 (L4)</button><div id="l4-${cid}" style="display:none" class="layer"><div class="l-label">L4 · 关键人物</div><div class="person-list">${cv.L4_people.map(pid=>{const p=(typeof PERSON_DEEP!=='undefined')?PERSON_DEEP[pid]:null;if(!p)return `<div class="person-item"><div class="ti">${pid}</div><div class="meta">深度待补</div></div>`;return `<div class="person-item"><div class="ti">${p.full_name}</div><div class="meta">${p.lifespan_real||p.lifespan_mythic||''}</div><div class="body">${(p.biography||'').slice(0,220).trim()}...</div></div>`;}).join('')}</div></div>` : ''}
            ${cv.L5_full ? `<button class="reveal-btn" onclick="reveal('${cid}',5)" id="r5-${cid}">▼ 继续 · 完整文明叙事 (L5)</button><div id="l5-${cid}" style="display:none" class="layer"><div class="l-label">L5 · 完整叙事</div><div class="narrative">${((typeof CIV_DEEP!=='undefined'&&CIV_DEEP.sumer)?CIV_DEEP.sumer.opening_narrative:'').trim().split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('')}</div></div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderTerminal(){
  return `<div class="terminal-seg" id="seg-end">
    <h2>🏁 2500 年世界全景</h2>
    <div class="sub">FROM 3500 BCE TO 1000 BCE</div>
    <div class="gantt">
      <div class="gh">文明</div>
      <div class="gh">CH1<br>3500-3000</div><div class="gh">CH2<br>3000-2500</div><div class="gh">CH3<br>2500-2000</div><div class="gh">CH4<br>2000-1500</div><div class="gh">CH5<br>1500-1000</div>
      <div class="gh legacy">今天保留</div>
      ${FINAL_OVERVIEW.civs.map(cv=>{
        let row = `<div class="gc civ-name">${cv.name}</div>`;
        for (let ch=1; ch<=5; ch++){
          const s = cv.spans.find(x=>x[0]===ch);
          if (s) row += `<div class="gc block"><div class="bar ${s[1].split('_')[0]}" style="background:${cv.color}"></div></div>`;
          else row += `<div class="gc block"></div>`;
        }
        row += `<div class="gc legacy-cell">${cv.legacy}</div>`;
        return row;
      }).join('')}
    </div>
    <h3 class="legacy-h">🎁 今天我们保留了什么</h3>
    <div class="legacy-grid">
      ${FINAL_OVERVIEW.today_legacy.map(l=>`<div class="legacy-card"><div class="what">${l.what}</div><div class="from">来自 · ${l.from}</div><div class="why">${l.why}</div></div>`).join('')}
    </div>
  </div>`;
}

function render(){
  document.getElementById('scroll').innerHTML =
    CHAPTERS.map((ch,i)=>renderSegment(ch, i, i>0?CHAPTERS[i-1]:null)).join('') + renderTerminal();
  renderRail();
}

function toggle(cid){ document.getElementById('card-'+cid).classList.toggle('expanded'); }
function reveal(cid,n){ document.getElementById(`l${n}-${cid}`).style.display='block'; document.getElementById(`r${n}-${cid}`).style.display='none'; }
function jump(target){
  const el = target==='end' ? document.getElementById('seg-end') : document.getElementById('seg-'+target);
  el?.scrollIntoView({behavior:'smooth'});
}

// 滚动监听 - 标记当前段为已学
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if (e.isIntersecting) {
      const idx = parseInt(e.target.dataset.ch);
      if (!isNaN(idx)) { done.add(idx); renderRail(); document.querySelectorAll('.timeline-rail .mark').forEach(m=>m.classList.toggle('active', parseInt(m.dataset.idx)===idx)); }
    }
  });
}, {threshold:.4});

render();
setTimeout(()=>{ document.querySelectorAll('.segment').forEach(s=>io.observe(s)); }, 100);

window.toggle=toggle; window.reveal=reveal; window.jump=jump;
</script>
</body>
</html>
