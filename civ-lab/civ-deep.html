<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>文明小宇宙 · 早期文明实验室</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#02030a; --bg2:#080a20; --paper:#fbf6e9;
  --ink:#f0e8d5; --ink2:#a8b0c8; --ink3:#5a6080;
  --paper-ink:#2c1a08; --paper-ink2:#5c4530; --paper-ink3:#8a7050;
  --gold:#d4a858; --warm:#e89870; --vermilion:#c84820;
  --cyan:#7adcf0; --purple:#a070ff;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif;
  --mono:'JetBrains Mono',monospace; --latin:'Cinzel',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}

/* 宇宙背景 (与首页一致) */
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 40% 50% at 15% 20%, rgba(120,90,200,.28) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 80%, rgba(200,120,60,.22) 0%, transparent 60%),
    radial-gradient(ellipse 30% 30% at 70% 30%, rgba(80,140,200,.15) 0%, transparent 50%),
    radial-gradient(ellipse 30% 30% at 30% 70%, rgba(60,180,140,.12) 0%, transparent 50%),
    radial-gradient(ellipse 80% 80% at 50% 50%, transparent 0%, rgba(0,0,0,.4) 100%),
    linear-gradient(180deg, #02030a 0%, #050818 50%, #02030a 100%);
}
.stars-back{position:absolute;inset:0;opacity:.4;
  background-image:
    radial-gradient(1px 1px at 5% 12%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 15% 25%,#fff,transparent),
    radial-gradient(.8px .8px at 28% 8%,#ffd47a,transparent),
    radial-gradient(1px 1px at 42% 18%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 55% 32%,#fff,transparent),
    radial-gradient(1px 1px at 68% 11%,#c8d4ff,transparent),
    radial-gradient(1.2px 1.2px at 82% 24%,#fff,transparent),
    radial-gradient(.9px .9px at 95% 16%,#ffd47a,transparent),
    radial-gradient(1px 1px at 8% 45%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 22% 58%,#fff,transparent),
    radial-gradient(1px 1px at 38% 65%,#c8d4ff,transparent),
    radial-gradient(1.5px 1.5px at 52% 72%,#fff,transparent),
    radial-gradient(1px 1px at 65% 48%,#ffd47a,transparent),
    radial-gradient(1.2px 1.2px at 78% 64%,#fff,transparent),
    radial-gradient(.8px .8px at 92% 52%,#fff,transparent),
    radial-gradient(1px 1px at 12% 88%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 28% 82%,#c8d4ff,transparent),
    radial-gradient(1px 1px at 45% 95%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 62% 88%,#ffd47a,transparent),
    radial-gradient(.9px .9px at 78% 92%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 91% 85%,#fff,transparent);
}
.stars-front{position:absolute;inset:0;opacity:.7;animation:twinkle 8s ease-in-out infinite;
  background-image:
    radial-gradient(2px 2px at 18% 18%,#fff,transparent 40%),
    radial-gradient(2.5px 2.5px at 42% 28%,#ffd47a,transparent 40%),
    radial-gradient(2px 2px at 72% 38%,#fff,transparent 40%),
    radial-gradient(2.2px 2.2px at 92% 12%,#c8d4ff,transparent 40%),
    radial-gradient(2px 2px at 22% 55%,#fff,transparent 40%),
    radial-gradient(2.4px 2.4px at 58% 68%,#ffd47a,transparent 40%),
    radial-gradient(2px 2px at 82% 78%,#fff,transparent 40%),
    radial-gradient(2.3px 2.3px at 15% 82%,#fff,transparent 40%),
    radial-gradient(2.1px 2.1px at 65% 92%,#c8d4ff,transparent 40%);
}
@keyframes twinkle{0%,100%{opacity:.7}50%{opacity:.4}}

/* 顶部覆盖层 */
.topbar-cosmos{position:fixed;top:0;left:0;right:0;z-index:30;padding:14px 24px;display:flex;align-items:center;gap:14px;pointer-events:none;flex-wrap:wrap}
.topbar-cosmos > *{pointer-events:auto}
.topbar-cosmos a, .topbar-cosmos button{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.16em;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);padding:8px 14px;border-radius:99px;border:1px solid rgba(212,168,88,.3);transition:all .2s;cursor:pointer}
.topbar-cosmos a:hover, .topbar-cosmos button:hover{background:var(--gold);color:#02030a;border-color:var(--gold)}
.crumb-cosmos{display:flex;align-items:center;gap:6px;color:var(--ink2);font-family:var(--mono);font-size:11px;letter-spacing:.08em;flex-wrap:wrap;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);padding:7px 14px;border-radius:99px;border:1px solid rgba(212,168,88,.2)}
.crumb-cosmos a{background:none;border:none;padding:0;color:var(--ink2)}
.crumb-cosmos a:hover{color:var(--gold);background:none}
.crumb-cosmos .cur{color:var(--gold);font-weight:700}
.crumb-cosmos .sep{color:var(--ink3)}

/* 主画布 (cosmic hub) */
.universe-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:10}
.universe-canvas.hidden{display:none}

/* 中心+悬浮节点 */
.center-orb{cursor:default}
.center-orb .ring1{fill:none;stroke:rgba(212,168,88,.3);stroke-width:1.5;animation:orbitRing 30s linear infinite}
.center-orb .ring2{fill:none;stroke:rgba(212,168,88,.18);stroke-width:1}
@keyframes orbitRing{from{stroke-dashoffset:0}to{stroke-dashoffset:600}}
.center-orb .body{filter:drop-shadow(0 8px 30px rgba(212,168,88,.5))}
.center-orb .label{font-family:var(--serif);font-weight:900;fill:#fff;text-anchor:middle;pointer-events:none;text-shadow:0 4px 12px rgba(0,0,0,.8)}
.center-orb .meta{font-family:var(--mono);fill:rgba(255,255,255,.7);text-anchor:middle;pointer-events:none;letter-spacing:.1em}

.float-orb{cursor:pointer;transition:transform .35s cubic-bezier(.4,1,.6,1)}
.float-orb:hover{transform:scale(1.12)}
.float-orb .body{filter:drop-shadow(0 4px 16px rgba(0,0,0,.4))}
.float-orb .name{font-family:var(--serif);font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.float-orb .type-tag{font-family:var(--mono);fill:rgba(255,255,255,.65);text-anchor:middle;pointer-events:none;letter-spacing:.06em}
.float-orb .label-bg{fill:rgba(0,0,0,.7);stroke:currentColor;stroke-width:1;stroke-opacity:.35}

/* 连线 (center → orbs) */
.spoke{stroke:rgba(212,168,88,.18);stroke-width:1;stroke-dasharray:3 5;fill:none}

/* tooltip */
.tooltip{position:fixed;z-index:50;background:rgba(15,15,28,.95);backdrop-filter:blur(20px);border:1px solid rgba(212,168,88,.35);border-radius:12px;padding:14px 18px;max-width:340px;display:none;pointer-events:none;box-shadow:0 12px 36px rgba(0,0,0,.7)}
.tooltip.show{display:block}
.tooltip .nm{font-family:var(--serif);font-size:16px;font-weight:900;color:var(--gold);margin-bottom:4px}
.tooltip .meta{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.06em;margin-bottom:8px;text-transform:uppercase}
.tooltip .desc{font-size:12.5px;line-height:1.65;color:var(--ink);margin-bottom:8px}
.tooltip .cta{font-family:var(--mono);font-size:10px;color:var(--vermilion);letter-spacing:.12em;font-weight:700}

/* 文字内容面板 (slides in from bottom) */
.text-panel{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(2,3,10,.85);backdrop-filter:blur(12px);
  align-items:flex-start;justify-content:center;
  padding:80px 24px 24px;
  overflow-y:auto;
}
.text-panel.open{display:flex;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scroll-card{
  background:var(--paper);color:var(--paper-ink);
  border-radius:18px;max-width:880px;width:100%;
  padding:36px 44px;margin:auto;position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
  border:2px solid rgba(212,168,88,.35);
  animation:slideUp .4s cubic-bezier(.4,1,.6,1);
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.scroll-card .close-x{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:white;border:1.5px solid rgba(184,136,48,.3);cursor:pointer;font-size:18px;color:var(--paper-ink2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.scroll-card .close-x:hover{background:var(--vermilion);color:white;border-color:var(--vermilion)}

.scroll-card .type-tag{display:inline-block;font-family:var(--mono);font-size:10px;color:white;background:var(--gold);padding:4px 12px;border-radius:99px;letter-spacing:.18em;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.scroll-card .type-tag.civ{background:var(--vermilion)}
.scroll-card .type-tag.event{background:#c8732a}
.scroll-card .type-tag.person{background:#6080b0}
.scroll-card h1{font-family:var(--serif);font-size:32px;font-weight:900;color:var(--paper-ink);line-height:1.15;margin-bottom:8px}
.scroll-card .one-liner{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--paper-ink2);margin:14px 0 20px;padding:12px 16px;background:rgba(184,136,48,.08);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;font-style:italic}

.scroll-card .narrative{font-family:var(--serif);font-size:15px;line-height:1.95;color:var(--paper-ink)}
.scroll-card .narrative p{margin-bottom:14px}
.scroll-card .narrative p:last-child{margin-bottom:0}
.scroll-card .narrative strong{color:var(--vermilion);font-weight:700}

.scroll-card .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.scroll-card .info-card{background:white;border:1px solid rgba(184,136,48,.18);border-radius:10px;padding:12px 14px}
.scroll-card .info-card .lbl{font-family:var(--mono);font-size:9.5px;color:var(--gold);letter-spacing:.14em;font-weight:700;text-transform:uppercase;margin-bottom:5px}
.scroll-card .info-card .val{font-family:var(--serif);font-size:13.5px;color:var(--paper-ink);line-height:1.55}

.scroll-card .tl-item{display:flex;gap:14px;background:white;border:1px solid rgba(184,136,48,.18);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.scroll-card .tl-item .yr{font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.04em;flex-shrink:0;width:130px}
.scroll-card .tl-item .ds{flex:1;font-size:13px;line-height:1.7;color:var(--paper-ink)}

.scroll-card .chain-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:white;border:1px solid rgba(184,136,48,.2);border-radius:12px;padding:14px}
.scroll-card .chain-pill{padding:7px 14px;background:var(--paper);border:1.5px solid rgba(184,136,48,.35);border-radius:99px;font-family:var(--serif);font-size:13px;color:var(--paper-ink)}
.scroll-card .chain-pill.center{background:var(--gold);color:white;border-color:#8a6028;font-weight:700}
.scroll-card .chain-arrow{color:var(--gold);font-size:14px;font-weight:700}

.scroll-card .three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scroll-card .three-col-card{background:white;border:1px solid rgba(184,136,48,.2);border-radius:10px;padding:14px}
.scroll-card .three-col-card .lbl{font-family:var(--serif);font-size:15px;font-weight:900;color:var(--vermilion);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid rgba(200,72,32,.2)}
.scroll-card .three-col-card .txt{font-size:12.5px;line-height:1.7;color:var(--paper-ink2)}

.scroll-card .ev-card{background:white;border:1px solid rgba(184,136,48,.2);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.scroll-card .ev-card .nm{font-family:var(--serif);font-size:13.5px;font-weight:700;color:#8a6028;margin-bottom:4px}
.scroll-card .ev-card .ds{font-size:12.5px;line-height:1.6;color:var(--paper-ink)}
.scroll-card .ev-card .ho{font-family:var(--mono);font-size:10px;color:var(--paper-ink3);letter-spacing:.04em;margin-top:4px}

.scroll-card .rel-list{display:flex;flex-direction:column;gap:8px}
.scroll-card .rel-card{background:white;border:1px solid rgba(184,136,48,.2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s}
.scroll-card .rel-card:hover{border-color:var(--vermilion);transform:translateX(-2px)}
.scroll-card .rel-card .pair{font-family:var(--serif);font-size:13.5px;font-weight:700;color:var(--paper-ink);margin-bottom:4px}
.scroll-card .rel-card .pair .arrow{color:var(--vermilion);margin:0 6px}
.scroll-card .rel-card .typ{display:inline-block;font-family:var(--mono);font-size:9px;color:white;background:var(--gold);padding:2px 7px;border-radius:99px;letter-spacing:.08em;margin-bottom:5px;font-weight:700}
.scroll-card .rel-card .typ.war{background:#cc4040}.scroll-card .rel-card .typ.trade{background:#3a8868}.scroll-card .rel-card .typ.influence{background:#7a60b0}
.scroll-card .rel-card .desc{font-size:12px;line-height:1.6;color:var(--paper-ink2)}

.scroll-card .legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.scroll-card .legacy-card{background:rgba(184,136,48,.06);border:1px solid rgba(184,136,48,.2);border-radius:10px;padding:12px 14px}
.scroll-card .legacy-card .what{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--vermilion);margin-bottom:3px}

.scroll-card .friend-circle{background:white;border:1px solid rgba(184,136,48,.2);border-radius:14px;padding:16px;text-align:center}
.scroll-card .fc-svg{display:block;margin:0 auto;max-width:100%}
.fc-link{stroke:rgba(184,136,48,.55);stroke-width:1.5;fill:none}
.fc-link.family{stroke:#a070ff}
.fc-link.enemy{stroke:#ff7878;stroke-dasharray:5 3}
.fc-link.mentor{stroke:var(--gold)}
.fc-center-svg{fill:var(--gold);filter:drop-shadow(0 4px 10px rgba(184,136,48,.4))}
.fc-node-svg{cursor:pointer;transition:transform .2s}
.fc-node-svg:hover{transform:scale(1.1)}
.fc-node-bg{fill:#6080b0;filter:drop-shadow(0 3px 8px rgba(96,128,176,.4))}
.fc-name{font-family:var(--serif);font-size:11px;fill:var(--paper-ink);text-anchor:middle;pointer-events:none;font-weight:700}
.fc-center-name{font-family:var(--serif);font-size:13px;fill:white;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-weight:700}
.fc-rel-label{font-family:var(--mono);font-size:9.5px;fill:#8a6028;text-anchor:middle;pointer-events:none;letter-spacing:.04em;font-weight:700}
.fc-rel-bg{fill:var(--paper);stroke:rgba(184,136,48,.3);stroke-width:1}

.todo-note{background:rgba(200,72,32,.06);border:1px dashed rgba(200,72,32,.35);border-radius:10px;padding:14px 18px;font-size:13px;color:var(--paper-ink2);line-height:1.7;margin-top:14px}
.todo-note::before{content:'📝 ';color:var(--vermilion);font-weight:700}

.error-page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.error-page h1{font-family:var(--serif);font-size:32px;color:var(--ink);margin-bottom:14px}

@media (max-width:768px){
  .topbar-cosmos{flex-wrap:wrap;gap:6px;padding:10px}
  .scroll-card{padding:24px 20px}
  .scroll-card h1{font-size:24px}
  .scroll-card .three-col{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="cosmos">
  <div class="nebula"></div>
  <div class="stars-back"></div>
  <div class="stars-front"></div>
</div>

<div class="topbar-cosmos">
  <a href="./civ-explorer-d.html">◀ 历史宇宙</a>
  <a href="./civ-explorer-compare.html">⌂ 首页</a>
  <div class="crumb-cosmos" id="crumb"></div>
</div>

<svg class="universe-canvas" id="canvas" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>

<div class="tooltip" id="tooltip"></div>

<div class="text-panel" id="textPanel">
  <div class="scroll-card" id="scrollCard"></div>
</div>

<script src="./early_civ_deep.js"></script>
<script src="./early_civ_explorer_data.js"></script>
<script src="./chapters_data.js"></script>
<script>
const W = 1600, H = 900;
const CX = W/2, CY = H/2 - 30;

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(x=>x);
  return {type: parts[0]||'', id: parts[1]||'', section: parts[2]||''};
}
function navigate(type, id, section){
  location.hash = section ? `#/${type}/${id}/${section}` : `#/${type}/${id}`;
}

// ════════════════════════════════════════
// 工具
// ════════════════════════════════════════
function getCivInfo(id){
  if (typeof EARLY_CIV_EXPLORER!=='undefined') {
    const f = EARLY_CIV_EXPLORER.civilizations.find(c=>c.id===id);
    if (f) return f;
  }
  const fb = {egypt_predynastic:{name:'古埃及·前王朝',icon:'🌅',color:'#d4b870'},indus_early:{name:'印度河早期',icon:'🏘',color:'#a070d4'}};
  return fb[id] || {name:id,icon:'🏛',color:'#888'};
}
function findCivChapters(civId){return CHAPTERS.filter(ch=>ch.active_civs.some(cv=>cv.id===civId))}
function findEventsOfCiv(civId){
  const evs = [];
  CHAPTERS.forEach(ch=>{const cv=ch.active_civs.find(x=>x.id===civId);if(!cv)return;(cv.L3_events||[]).forEach(eid=>{if(!evs.find(x=>x.id===eid))evs.push({id:eid,deep:EVENT_DEEP[eid]})})});
  return evs;
}
function findPeopleOfCiv(civId){
  const ps = [];
  CHAPTERS.forEach(ch=>{const cv=ch.active_civs.find(x=>x.id===civId);if(!cv)return;(cv.L4_people||[]).forEach(pid=>{if(!ps.find(x=>x.id===pid))ps.push({id:pid,deep:PERSON_DEEP[pid]})})});
  return ps;
}
function findEventCiv(eid){for(const ch of CHAPTERS)for(const cv of ch.active_civs)if(cv.L3_events?.includes(eid))return{civId:cv.id,chId:ch.id};return null}
function findPersonCiv(pid){for(const ch of CHAPTERS)for(const cv of ch.active_civs)if(cv.L4_people?.includes(pid))return{civId:cv.id,chId:ch.id};return null}

function darken(hex, amount){
  if (!hex || !hex.startsWith('#')) return '#444';
  const c = hex.replace('#','');
  const r = Math.max(0, parseInt(c.slice(0,2),16) - Math.round(255*amount));
  const g = Math.max(0, parseInt(c.slice(2,4),16) - Math.round(255*amount));
  const b = Math.max(0, parseInt(c.slice(4,6),16) - Math.round(255*amount));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ════════════════════════════════════════
// 面包屑
// ════════════════════════════════════════
function renderCrumb(type, id, name){
  const c = document.getElementById('crumb');
  let html = `<a onclick="location.href='./civ-explorer-d.html'">⌂ 历史宇宙</a><span class="sep">›</span>`;
  if (type === 'civ') {
    html += `<span class="cur">${name}</span>`;
  } else if (type === 'event' || type === 'person') {
    const ctx = type==='event' ? findEventCiv(id) : findPersonCiv(id);
    if (ctx) {
      const civ = getCivInfo(ctx.civId);
      html += `<a onclick="navigate('civ','${ctx.civId}')">${civ.icon} ${civ.name}</a><span class="sep">›</span>`;
    }
    html += `<span class="cur">${name}</span>`;
  }
  c.innerHTML = html;
}

// ════════════════════════════════════════
// 通用 cosmic 渲染：center + 周围 orbs
// ════════════════════════════════════════
function renderCosmic(centerData, orbs){
  // 给 orb 计算位置
  const N = orbs.length;
  const ringSize = N <= 8 ? N : (N <= 16 ? Math.ceil(N/2) : Math.ceil(N/3));
  const rings = Math.ceil(N / ringSize);

  orbs.forEach((orb, i)=>{
    const ring = Math.floor(i / ringSize);
    const idx = i % ringSize;
    const items = (ring === rings - 1) ? (N - ring * ringSize) : ringSize;
    const angleOffset = ring * 0.2;
    const angle = -Math.PI/2 + angleOffset + idx * (Math.PI * 2 / items);
    const r = 240 + ring * 150;
    orb.x = CX + Math.cos(angle) * r;
    orb.y = CY + Math.sin(angle) * r * 0.85; // 椭圆轨道
  });

  let svg = `<defs>
    <radialGradient id="centerGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="rgba(255,255,255,.95)"/>
      <stop offset="30%" stop-color="${centerData.color}" stop-opacity=".95"/>
      <stop offset="100%" stop-color="${darken(centerData.color,0.5)}"/>
    </radialGradient>
    <radialGradient id="centerHalo">
      <stop offset="0%" stop-color="${centerData.color}" stop-opacity=".5"/>
      <stop offset="100%" stop-color="${centerData.color}" stop-opacity="0"/>
    </radialGradient>
    ${orbs.map((o,i)=>`<radialGradient id="orbGrad${i}" cx="35%" cy="30%">
      <stop offset="0%" stop-color="rgba(255,255,255,.85)"/>
      <stop offset="30%" stop-color="${o.color}" stop-opacity=".9"/>
      <stop offset="100%" stop-color="${darken(o.color,0.5)}"/>
    </radialGradient>`).join('')}
  </defs>`;

  // 轨道虚线圈
  for (let r=1; r<=rings; r++){
    const radius = 240 + (r-1) * 150;
    svg += `<ellipse cx="${CX}" cy="${CY}" rx="${radius}" ry="${radius*0.85}" fill="none" stroke="rgba(212,168,88,.08)" stroke-width="1" stroke-dasharray="3 6"/>`;
  }

  // spokes (从中心到每个 orb)
  orbs.forEach(orb=>{
    svg += `<line class="spoke" x1="${CX}" y1="${CY}" x2="${orb.x}" y2="${orb.y}"/>`;
  });

  // orbs
  orbs.forEach((orb,i)=>{
    const r = orb.size || 36;
    svg += `<g class="float-orb" data-action='${JSON.stringify(orb.action)}' transform="translate(${orb.x},${orb.y})" style="color:${orb.color}">
      <circle cx="0" cy="0" r="${r*1.6}" fill="${orb.color}" opacity="0.12"/>
      <g class="body">
        <circle cx="0" cy="0" r="${r}" fill="url(#orbGrad${i})" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
        <ellipse cx="${-r*0.18}" cy="${-r*0.32}" rx="${r*0.4}" ry="${r*0.17}" fill="rgba(255,255,255,.5)" transform="rotate(-25)"/>
        <text text-anchor="middle" dominant-baseline="central" font-size="${r*0.9}" style="pointer-events:none">${orb.icon}</text>
      </g>
      <text class="type-tag" y="${r+18}" font-size="9">${orb.typeLabel}</text>
      <g transform="translate(0,${r+38})">
        <rect class="label-bg" x="${-orb.name.length*7-8}" y="${-11}" width="${orb.name.length*14+16}" height="22" rx="11"/>
        <text class="name" y="3" font-size="12.5">${orb.name}</text>
      </g>
    </g>`;
  });

  // center orb
  const cr = centerData.size || 70;
  svg += `<g class="center-orb" transform="translate(${CX},${CY})">
    <circle cx="0" cy="0" r="${cr*2}" fill="url(#centerHalo)"/>
    <circle class="ring1" cx="0" cy="0" r="${cr+25}" stroke-dasharray="6 10"/>
    <circle class="ring2" cx="0" cy="0" r="${cr+45}" stroke-dasharray="2 16"/>
    <g class="body">
      <circle cx="0" cy="0" r="${cr}" fill="url(#centerGrad)" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
      <ellipse cx="${-cr*0.18}" cy="${-cr*0.32}" rx="${cr*0.4}" ry="${cr*0.17}" fill="rgba(255,255,255,.5)" transform="rotate(-25)"/>
      <text text-anchor="middle" dominant-baseline="central" font-size="${cr*0.7}" style="pointer-events:none">${centerData.icon}</text>
    </g>
    <text class="label" y="${cr+30}" font-size="20">${centerData.name}</text>
    ${centerData.meta?`<text class="meta" y="${cr+52}" font-size="11">${centerData.meta}</text>`:''}
  </g>`;

  document.getElementById('canvas').innerHTML = svg;

  // 绑定
  document.querySelectorAll('.float-orb').forEach(el=>{
    const action = JSON.parse(el.dataset.action);
    el.addEventListener('click', ()=>handleOrbClick(action));
    el.addEventListener('mouseenter', e=>showTooltip(e, action));
    el.addEventListener('mousemove', moveTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });
}

function handleOrbClick(action){
  hideTooltip();
  if (action.type === 'navigate') {
    navigate(action.to.type, action.to.id);
  } else if (action.type === 'showText') {
    openTextPanel(action.payload);
  }
}

// 文明 cosmic hub
// ════════════════════════════════════════
function renderCivCosmic(civId){
  const info = getCivInfo(civId);
  const deep = CIV_DEEP[civId];
  const chs = findCivChapters(civId);
  const events = findEventsOfCiv(civId);
  const people = findPeopleOfCiv(civId);

  if (chs.length === 0 && !deep) return renderError(`未找到文明：${civId}`);
  renderCrumb('civ', civId, info.name);

  const oneLiner = chs[0]?.active_civs.find(cv=>cv.id===civId)?.L1 || '';
  const timeRange = deep?.time_range || (chs.length?`${chs[0].range} – ${chs[chs.length-1].range.split('–')[1]} BCE`:'');

  const center = {
    icon: info.icon, name: info.name, color: info.color,
    meta: timeRange, size: 75,
  };

  const orbs = [];
  // 概念性的章节 orbs
  if (deep?.opening_narrative) orbs.push({icon:'📖',name:'文明叙事',color:'#d4a858',typeLabel:'NARRATIVE',size:40,
    action:{type:'showText',payload:{kind:'narrative',civId}}});
  if (deep) orbs.push({icon:'🏛',name:'基础事实',color:'#a8a060',typeLabel:'BASICS',size:36,
    action:{type:'showText',payload:{kind:'basics',civId}}});
  if (chs.length) orbs.push({icon:'📅',name:'演化阶段',color:'#c8a070',typeLabel:'TIMELINE',size:38,
    action:{type:'showText',payload:{kind:'timeline',civId}}});

  // 事件 orbs (每个独立)
  events.forEach(e=>{
    const title = e.deep?.full_title || e.id;
    orbs.push({icon:'📅',name:title.length>10?title.slice(0,10)+'...':title,color:'#c8732a',
      typeLabel:'EVENT',size:36,
      action:{type:'navigate',to:{type:'event',id:e.id}}});
  });

  // 人物 orbs
  people.forEach(p=>{
    const name = p.deep?.full_name?.split(' ')[0] || p.id;
    orbs.push({icon:'👤',name:name,color:'#6080b0',
      typeLabel:'PERSON',size:38,
      action:{type:'navigate',to:{type:'person',id:p.id}}});
  });

  // 其它章节 orbs
  if (deep?.nine_inventions) orbs.push({icon:'💡',name:'关键发明',color:'#e8a020',typeLabel:'INVENTIONS',size:36,
    action:{type:'showText',payload:{kind:'inventions',civId}}});
  orbs.push({icon:'🌍',name:'文明关系',color:'#7a60b0',typeLabel:'RELATIONS',size:36,
    action:{type:'showText',payload:{kind:'relations',civId}}});
  if (deep?.collapse_chain) orbs.push({icon:'⏳',name:'崩溃过程',color:'#b04848',typeLabel:'COLLAPSE',size:34,
    action:{type:'showText',payload:{kind:'collapse',civId}}});
  if (FINAL_OVERVIEW.civs.find(c=>c.id===civId)?.legacy) orbs.push({icon:'🎁',name:'今天遗产',color:'#3a8868',typeLabel:'LEGACY',size:34,
    action:{type:'showText',payload:{kind:'legacy',civId}}});

  renderCosmic(center, orbs);
  document.title = info.name + ' · 文明小宇宙';
}

// ════════════════════════════════════════
// 人物 cosmic hub
// ════════════════════════════════════════
function renderPersonCosmic(pid){
  const p = PERSON_DEEP[pid];
  if (!p) return renderError(`未找到人物：${pid}`);
  const name = p.full_name || pid;
  renderCrumb('person', pid, name.split(' ')[0]);

  const center = {
    icon: '👤', name: name.split(' ')[0], color: '#6080b0',
    meta: p.lifespan_real || p.lifespan_mythic || '',
    size: 70,
  };

  const orbs = [];
  if (p.biography) orbs.push({icon:'📖',name:'完整传记',color:'#d4a858',typeLabel:'BIOGRAPHY',size:42,
    action:{type:'showText',payload:{kind:'biography',pid}}});
  if (p.childhood) orbs.push({icon:'👶',name:'童年出身',color:'#c8a080',typeLabel:'CHILDHOOD',size:34,
    action:{type:'showText',payload:{kind:'childhood',pid}}});
  if (p.achievements_detail?.length) orbs.push({icon:'🏆',name:`成就 ×${p.achievements_detail.length}`,color:'#e8a020',typeLabel:'ACHIEVEMENTS',size:38,
    action:{type:'showText',payload:{kind:'achievements',pid}}});

  // 朋友圈：每个朋友单独一个 orb (可跳转)
  const direct = p.related || [];
  const incoming = [];
  Object.entries(PERSON_DEEP).forEach(([oid, o])=>{
    if (oid===pid) return;
    (o.related||[]).forEach(r=>{
      if (r.id===pid && !direct.find(x=>x.id===oid)) incoming.push({id:oid, relation:r.relation});
    });
  });
  const allFriends = [...direct, ...incoming];
  allFriends.forEach(f=>{
    const other = PERSON_DEEP[f.id];
    const fname = (other?.full_name || f.id).split(' ')[0];
    orbs.push({icon:'👤',name:fname,color:'#7080b0',typeLabel:f.relation||'关系',size:34,
      action:{type:'navigate',to:{type:'person',id:f.id}}});
  });

  // 参与事件
  const involved = Object.entries(EVENT_DEEP).filter(([eid, e]) => e.related_people?.includes(pid));
  involved.forEach(([eid, e])=>{
    const title = e.full_title;
    orbs.push({icon:'📅',name:title.length>10?title.slice(0,10)+'...':title,color:'#c8732a',typeLabel:'EVENT',size:34,
      action:{type:'navigate',to:{type:'event',id:eid}}});
  });

  if (p.death) orbs.push({icon:'⚰️',name:'死亡晚年',color:'#7a5050',typeLabel:'DEATH',size:32,
    action:{type:'showText',payload:{kind:'death',pid}}});
  if (p.legacy) orbs.push({icon:'🌟',name:'历史遗产',color:'#e8c860',typeLabel:'LEGACY',size:36,
    action:{type:'showText',payload:{kind:'plegacy',pid}}});

  renderCosmic(center, orbs);
  document.title = name + ' · 人物小宇宙';
}

function openTextPanel(payload){
  const card = document.getElementById('scrollCard');
  let html = `<button class="close-x" onclick="closeTextPanel()">✕</button>`;

  if (payload.kind === 'narrative') {
    const c = CIV_DEEP[payload.civId];

    html += `<div class="type-tag civ">${info.icon} ${info.name} · 完整叙事</div>
      <h1>📖 文明叙事</h1>

  }
  else if (payload.kind === 'basics') {
    const c = CIV_DEEP[payload.civId];
    const info = getCivInfo(payload.civId);
    const basics = [];

    if (c.territory_max) basics.push(['领土', c.territory_max]);
    if (c.population_peak) basics.push(['人口', c.population_peak]);
    if (c.language) basics.push(['语言', c.language]);

      ${rels.length?`<div class="rel-list">${rels.map(r=>`<div class="rel-card" onclick="closeTextPanel();navigate('civ','${r.targetId}')">
        <span class="typ ${r.type}">${r.typeLabel||r.type}</span>
        <div class="pair">${r.from}<span class="arrow">${r.symbol||'→'}</span>${r.to}</div>

      ${c.collapse_chain.map(t=>{

    const items = legacyStr.split(/\s*[·•|]\s*/).filter(x=>x.trim());

    html += `<div class="type-tag person">👤 ${p.full_name}</div>
      <h1>🏆 主要成就</h1>
      ${p.achievements_detail.map(a=>`<div class="ev-card">
        <div class="nm">${a.name}</div>

    html += `<div class="type-tag person">👤 ${p.full_name}</div>
      <h1>⚰️ 死亡 · 晚年</h1>
      <div class="narrative"><p>${p.death}</p></div>`;
  }
  else if (payload.kind === 'plegacy') {
    const p = PERSON_DEEP[payload.pid];
    html += `<div class="type-tag person">👤 ${p.full_name}</div>
      <h1>🌟 历史遗产</h1>
      <div class="narrative">${p.legacy.trim().split(/\n\s*\n/).map(par=>'<p>'+par.trim()+'</p>').join('')}</div>`;
  }
  else if (payload.kind === 'oneliner') {
    const e = EVENT_DEEP[payload.eid];
    html += `<div class="type-tag event">📅 ${e.full_title}</div>
      <h1>💡 一句话总结</h1>
      <div class="narrative" style="font-size:20px;line-height:1.7;text-align:center;padding:24px 0"><p>${e.one_liner}</p></div>`;
  }
  else if (payload.kind === 'chain') {
    const e = EVENT_DEEP[payload.eid];
    html += `<div class="type-tag event">📅 ${e.full_title}</div>
      <h1>🔗 因果链</h1>
      ${renderChainHtml(e)}`;

    html += `<div class="type-tag event">📅 ${e.full_title}</div>
      <h1>📜 之前 · 当时 · 之后</h1>
      <div class="three-col">
        <div class="three-col-card"><div class="lbl">之前</div><div class="txt">${e.context_before||'-'}</div></div>
        <div class="three-col-card"><div class="lbl">当时</div><div class="txt">${e.significance||e.one_liner||'-'}</div></div>
        <div class="three-col-card"><div class="lbl">之后</div><div class="txt">${e.leads_to||'-'}</div></div>
      </div>`;
  }
  else if (payload.kind === 'enarrative') {
    const e = EVENT_DEEP[payload.eid];
    html += `<div class="type-tag event">📅 ${e.full_title}</div>
      <h1>📖 事件完整叙事</h1>
      <div class="one-liner">💡 ${e.one_liner||''}</div>
      <div class="narrative">${e.narrative.trim().split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('')}</div>`;
  }
  else if (payload.kind === 'ewhat') {
    const e = EVENT_DEEP[payload.eid];
    html += `<div class="type-tag event">📅 ${e.full_title}</div>
      <h1>📅 事件时间线</h1>
      ${e.what_happened.map(t=>{
        const [yr,...rest] = t.split('·');
        return `<div class="tl-item"><div class="yr">${yr.trim()}</div><div class="ds">${rest.join('·').trim()}</div></div>`;
      }).join('')}`;
  }
  else if (payload.kind === 'evidence') {
    const e = EVENT_DEEP[payload.eid];
    html += `<div class="type-tag event">📅 ${e.full_title}</div>
      <h1>🏺 考古证据</h1>
      ${e.evidence.map(ev=>`<div class="ev-card">
        <div class="nm">${ev.artifact}</div>
        <div class="ds">${ev.what}</div>
        <div class="ho">📍 ${ev.held}</div>
      </div>`).join('')}`;
  }
  else if (payload.kind === 'significance') {
    const e = EVENT_DEEP[payload.eid];
    html += `<div class="type-tag event">📅 ${e.full_title}</div>
      <h1>🎯 历史意义</h1>
      <div class="narrative"><p>${e.significance}</p></div>`;
  }

  card.innerHTML = html;
  document.getElementById('textPanel').classList.add('open');
}
function closeTextPanel(){ document.getElementById('textPanel').classList.remove('open'); }

function renderChainHtml(e){
  const before = e.context_before ? e.context_before.split(/[。，]/)[0].slice(0,20) : null;
  const after = e.leads_to ? e.leads_to.split(/[→;；]/).map(s=>s.trim().slice(0,18)).filter(s=>s.length>0).slice(0,3) : [];
  let html = '<div class="chain-row">';
  if (before) html += `<span class="chain-pill">${before}</span><span class="chain-arrow">→</span>`;
  html += `<span class="chain-pill center">${e.full_title}</span>`;
  after.forEach(a=>{
    html += `<span class="chain-arrow">→</span><span class="chain-pill">${a}</span>`;
  });
  html += '</div>';
  return html;
}

const CIV_RELATIONS = [
  {from:'akkad', to:'sumer', type:'war', typeLabel:'征服', symbol:'⚔', desc:'Sargon 大帝约前 2350 年征服苏美尔，建立人类第一个多民族帝国。'},
  {from:'babylon', to:'sumer', type:'influence', typeLabel:'继承', symbol:'⇒', desc:'巴比伦全套继承了苏美尔的法律、文学、宗教、占星术。'},
  {from:'sumer', to:'indus', type:'trade', typeLabel:'贸易', symbol:'⇄', desc:'苏美尔商人通过波斯湾与印度河文明远程贸易青金石+红玉髓。'},
  {from:'sumer', to:'egypt_old', type:'influence', typeLabel:'间接影响', symbol:'⇢', desc:'苏美尔的城市化模型 + 文字概念可能通过黎凡特间接影响埃及。'},

  {from:'mycenaean', to:'minoan', type:'war', typeLabel:'取代', symbol:'⇒', desc:'约前 1450 年迈锡尼人征服米诺斯文明，继承爱琴海贸易主导权。'},
  {from:'mycenaean', to:'hittite', type:'trade', typeLabel:'贸易', symbol:'⇄', desc:'两国通过爱琴海贸易青铜原料。'},
  {from:'shang', to:'sumer', type:'influence', typeLabel:'平行发展', symbol:'∥', desc:'商朝与苏美尔完全独立发展，无直接联系。'},
  {from:'collapse', to:'hittite', type:'war', typeLabel:'毁灭', symbol:'✕', desc:'约前 1180 年 Sea Peoples 加干旱链使赫梯首都被烧毁。'},
  {from:'collapse', to:'mycenaean', type:'war', typeLabel:'毁灭', symbol:'✕', desc:'前 1180 年迈锡尼宫殿被烧，希腊进入 400 年黑暗时代。'},
  {from:'collapse', to:'egypt_new', type:'war', typeLabel:'削弱', symbol:'⚠', desc:'埃及虽击退 Sea Peoples，但元气大伤。'},
];
function findCivRelations(civId){
  const result = [];
  CIV_RELATIONS.forEach(r=>{
    if (r.from === civId) {
      result.push({...r, from: getCivInfo(civId).icon+' '+getCivInfo(civId).name, to: getCivInfo(r.to).icon+' '+getCivInfo(r.to).name, targetId: r.to});
    } else if (r.to === civId) {
      result.push({...r, from: getCivInfo(r.from).icon+' '+getCivInfo(r.from).name, to: getCivInfo(civId).icon+' '+getCivInfo(civId).name, targetId: r.from});
    }
  });
  return result;
}

// Tooltip
// ════════════════════════════════════════
function showTooltip(e, action){
  const tip = document.getElementById('tooltip');
  let html = '';
  if (action.type === 'navigate') {
    const t = action.to.type, id = action.to.id;
    if (t === 'person') {
      const p = PERSON_DEEP[id];
      html = `<div class="nm">👤 ${p?.full_name||id}</div>
        <div class="meta">${p?.lifespan_real||p?.lifespan_mythic||''}</div>
        <div class="desc">${(p?.biography||'').slice(0,100).trim()}...</div>
        <div class="cta">点击 → 进入小宇宙</div>`;
    } else if (t === 'event') {
      const ev = EVENT_DEEP[id];
      html = `<div class="nm">📅 ${ev?.full_title||id}</div>
        <div class="meta">${(ev?.what_happened?.[0]||'').split('·')[0].trim()}</div>
        <div class="desc">${ev?.one_liner||''}</div>
        <div class="cta">点击 → 进入小宇宙</div>`;
    } else if (t === 'civ') {
      const info = getCivInfo(id);
      html = `<div class="nm">${info.icon} ${info.name}</div>
        <div class="cta">点击 → 进入小宇宙</div>`;
    }
  } else if (action.type === 'showText') {
    html = `<div class="nm">${SECTION_HINTS[action.payload.kind]||'阅读'}</div>
      <div class="cta">点击 → 展开文字内容</div>`;
  }
  tip.innerHTML = html;
  tip.classList.add('show');
  moveTooltip(e);
}
const SECTION_HINTS = {
  narrative:'📖 完整文明叙事', basics:'🏛 基础事实', timeline:'📅 演化阶段',
  inventions:'💡 关键发明', relations:'🌍 与其他文明的关系', collapse:'⏳ 崩溃过程',
  legacy:'🎁 今天的遗产',
  biography:'📖 完整传记', childhood:'👶 童年出身', achievements:'🏆 主要成就',
  death:'⚰️ 死亡晚年', plegacy:'🌟 历史遗产',
  oneliner:'💡 一句话总结', chain:'🔗 事件因果链', three:'📜 之前·当时·之后',
  enarrative:'📖 事件完整叙事', ewhat:'📅 事件时间线',
  evidence:'🏺 考古证据', significance:'🎯 历史意义',
};
function moveTooltip(e){
  const tip = document.getElementById('tooltip');
  const x = Math.min(e.clientX + 16, window.innerWidth - 360);
  const y = Math.min(e.clientY + 16, window.innerHeight - 200);
  tip.style.left = x+'px';
  tip.style.top = y+'px';
}
function hideTooltip(){ document.getElementById('tooltip').classList.remove('show'); }

// ════════════════════════════════════════
// 路由 + 错误
// ════════════════════════════════════════
function renderError(msg){
  document.getElementById('canvas').innerHTML = '';
  document.body.insertAdjacentHTML('beforeend', `<div class="error-page" id="errorPage">
    <h1>🚧 ${msg}</h1>
    <a href="./civ-explorer-d.html" style="color:var(--gold);text-decoration:none;background:rgba(212,168,88,.15);padding:10px 20px;border-radius:99px;border:1px solid var(--gold);margin-top:14px">◀ 返回历史宇宙</a>
  </div>`);
}

function route(){
  document.getElementById('errorPage')?.remove();
  closeTextPanel();
  const {type, id} = parseHash();
  if (!type || !id) return renderError('请通过历史宇宙选择实体');
  if (type==='civ') return renderCivCosmic(id);
  if (type==='person') return renderPersonCosmic(id);
  if (type==='event') return renderEventCosmic(id);
  renderError(`未知类型：${type}`);
}

window.addEventListener('hashchange', route);
window.navigate = navigate;
window.closeTextPanel = closeTextPanel;
route();
</script>
