<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同一个事件，不同的声音 · 多角度看历史</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=4"/>
<style>
  html,body{margin:0;min-height:100%}
  #app{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column}
  .nav{display:flex;align-items:center;gap:10px;padding:12px 18px 4px;flex-wrap:wrap}
  .nav .title{font-family:var(--serif);font-weight:900;font-size:17px;color:var(--ink);text-shadow:var(--label-shadow)}
  .nav .sub{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.08em}
  .events{display:flex;gap:7px;flex-wrap:wrap;padding:10px 18px}
  .epill{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:var(--r-pill);padding:6px 13px;cursor:pointer;transition:all .15s;backdrop-filter:blur(10px)}
  .epill:hover{color:var(--gold);border-color:var(--gold)}
  .epill.on{color:#fff;background:var(--gold);border-color:var(--gold)}
  .stage{max-width:1000px;margin:6px auto 50px;width:100%;box-sizing:border-box;padding:0 18px}
  .etitle{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--ink);text-align:center;margin:8px 0 2px}
  .eera{font-family:var(--mono);font-size:11px;color:var(--gold);text-align:center;letter-spacing:.1em;margin-bottom:12px}
  .fact{font-size:14px;color:var(--ink);line-height:1.7;background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:13px;padding:13px 16px;text-align:center;backdrop-filter:blur(10px)}
  .fact .lbl{font-family:var(--mono);font-size:10px;color:var(--ink3);display:block;margin-bottom:5px;letter-spacing:.1em}
  .voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px;margin:16px 0}
  .voice{background:var(--panel-bg);border:1px solid var(--panel-line);border-top:4px solid var(--gold);border-radius:14px;padding:15px 16px;backdrop-filter:blur(10px)}
  .voice .who{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
  .voice .who .fl{font-size:22px}
  .voice .acct{font-size:14px;color:var(--ink);line-height:1.7;margin:10px 0;font-style:italic}
  .voice .acct:before{content:'“';color:var(--gold);font-size:20px;font-weight:900}
  .voice .acct:after{content:'”';color:var(--gold);font-size:20px;font-weight:900}
  .voice .emp{font-size:11.5px;color:var(--ink2);line-height:1.6;border-top:1px dashed var(--panel-line);padding-top:8px}
  .revealbtn{display:block;margin:6px auto 0;font-family:var(--sans);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(90deg,#5aa0c8,#8a7ad0);border:none;border-radius:var(--r-pill);padding:11px 24px;cursor:pointer}
  .reflect{margin-top:14px;background:rgba(90,160,200,.1);border-left:4px solid var(--cyan,#5aa0c8);border-radius:10px;padding:14px 16px;font-size:14.5px;color:var(--ink);line-height:1.8;display:none}
  .reflect.show{display:block}
  .reflect b{color:var(--cyan,#5aa0c8)}
  .reflect .h{font-family:var(--serif);font-weight:900;display:block;margin-bottom:6px;color:var(--ink)}
</style>
</head>
<body data-theme="deepblue">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="nav">
    <a href="./index.html" class="ds-pill">⌂ 返回</a>
    <span class="title">🗣️ 同一个事件，不同的声音</span>
    <span class="sub">历史，要听见不止一方的说法</span>
    <div class="ds-theme-switch" style="margin-left:auto" id="themeSwitch">
      <button data-t="deepblue"></button><button data-t="museum"></button><button data-t="textbook"></button><button data-t="parchment"></button>
    </div>
  </div>
  <div class="events" id="events"></div>
  <div class="stage" id="stage"></div>
</div>
<script src="./track.js?v=1"></script>
<script src="./perspectives_data.js?v=1"></script>
<script>
let cur=PERSPECTIVES[0];
document.getElementById('events').innerHTML=PERSPECTIVES.map((p,i)=>`<span class="epill${i===0?' on':''}" data-i="${i}">${p.emoji} ${p.title}</span>`).join('');
document.querySelectorAll('.epill').forEach(p=>p.onclick=()=>{document.querySelectorAll('.epill').forEach(x=>x.classList.remove('on'));p.classList.add('on');cur=PERSPECTIVES[+p.dataset.i];render();});
function render(){
  if(window.Track)Track.log('多角度');
  let h=`<div class="etitle">${cur.emoji} ${cur.title}</div><div class="eera">${cur.era}</div>
    <div class="fact"><span class="lbl">大家都同意的事实</span>${cur.fact}</div>
    <div class="voices">`;
  cur.voices.forEach(v=>{
    h+=`<div class="voice"><div class="who"><span class="fl">${v.flag}</span>${v.who}</div>
      <div class="acct">${v.account}</div><div class="emp">📌 ${v.emphasis}</div></div>`;
  });
  h+=`</div><button class="revealbtn" id="rb">💡 为什么同一件事，说法这么不一样？</button>
    <div class="reflect" id="rf"><span class="h">史家的思考</span>${cur.reflection}</div>`;
  document.getElementById('stage').innerHTML=h;
  document.getElementById('rb').onclick=()=>document.getElementById('rf').classList.add('show');
}
document.querySelectorAll('#themeSwitch button').forEach(b=>b.onclick=()=>document.body.dataset.theme=b.dataset.t);
render();
</script>
</body>
</html>
