<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 荆轲刺秦 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「风萧萧兮易水寒,壮士一去兮不复还。」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 《史记·刺客列传》</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·荆轲刺秦"(母题:向死的勇气/明知必死也要去,与温泉关·列奥尼达同一条找规律线)。史实据《史记·刺客列传》:战国末年,秦已灭韩、破赵,大军压到燕国边境的易水,燕国朝不保夕。燕太子丹尊侠士荆轲为上卿,托他去刺杀秦王嬴政(后来的秦始皇),想逼秦退还土地或令秦大乱。为接近秦王,荆轲带上秦国叛将樊於期的首级(樊於期为此自刎相赠)和燕国督亢地图(地图卷里藏着淬毒匕首),以少年秦舞阳为副手。明知几乎必死,荆轲仍义无反顾;易水送行,众人白衣,高渐离击筑,荆轲高歌"风萧萧兮易水寒,壮士一去兮不复还"。行刺时"图穷匕见",刺秦王未中,绕柱追逐,被秦王拔剑击断左股,荆轲掷匕不中,身中八创,倚柱笑骂而死。此举激怒秦王,秦随即发兵灭燕。荆轲虽败,其"明知不可为而为之"的勇气与信义被千古传颂。与温泉关·列奥尼达对照:都明知必死也要前行,为了比生命更重要的东西(列奥尼达:责任与自由;荆轲:知遇之恩与道义)。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论。';
const DOSSIER=[
  {i:'🗡️',t:'你是谁',b:'你是<b>荆轲</b>,卫国人,爱读书、好击剑,沉稳而重情义的侠士。你漂泊到燕国,常和好友<b>高渐离</b>(善击筑)饮酒高歌、旁若无人。燕太子丹敬重你,尊你为上卿,待你极厚。'},
  {i:'🐉',t:'天下的形势',b:'秦国已经<b>灭了韩、破了赵</b>,大军压到燕国边境的<b>易水</b>。秦统一天下的大势已成,弱小的燕国,危在旦夕。'},
  {i:'🙇',t:'太子丹的托付',b:'走投无路的<b>燕太子丹</b>,想出一个孤注一掷的办法:派一个刺客去劫持或刺杀秦王嬴政,逼他退还诸侯的土地,或者干脆杀了他、让秦国大乱。<br>他选中的人,是<b>你</b>。'},
  {i:'🎁',t:'行刺的代价',b:'要靠近戒备森严的秦王,你需要两样他最想要的东西:秦国叛将<b>樊於期的首级</b>(樊於期为此<b>自刎相赠</b>)、和燕国<b>督亢的地图</b>——地图卷的最里面,藏着一把淬了毒、见血即死的匕首。副手,是个叫秦舞阳的少年。'},
  {i:'⚰️',t:'几乎必死',b:'秦宫层层戒备,就算行刺成功,你也几乎<b>不可能活着回来</b>。易水边送行那天,人人穿着白衣,高渐离击筑,你和着拍子高声唱:"<b>风萧萧兮易水寒,壮士一去兮不复还。</b>"'},
  {i:'⚡',t:'眼前的难题',b:'你可以为了这份<b>知遇之恩和道义</b>,明知必死也去;可以<b>婉言推辞</b>,保住性命;也可以<b>再等一等</b>,寻一个更有把握的时机。<br>但太子丹在催,秦军在逼。<b>你去,还是不去?</b>'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">公元前 227 年 · 燕 · 易水</div>
  <div class="htitle">明知一去不还,你上路吗?</div>
  <div class="hsub">即将由你 —— 荆轲 —— 决定</div>
  <div class="scene">公元前227年,你是燕国的侠士<b>荆轲</b>。太子丹把整个燕国的命运,押在了你一个人身上——去刺杀那个即将吞并天下的秦王。<br><br>这几乎是一条有去无回的路。你即将做一个决定——它关乎你的生死,也关乎一个"明知不可为"的信义,将如何被后人记住。<br><br>但在你决定之前,<b>先别急。</b> 先把这件事,想清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先把这件事想清楚 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">想清楚这件事</div>
  <div class="dossier-intro">点开下面每一张卡片,弄懂你是谁、形势多危、这件事的分量与代价。<br>全部看完,你才有资格替荆轲做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张卡片后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是荆轲</div>
  <div class="ask">去,还是不去?</div>
  <div class="asksub">你已经想清楚了——燕国的危亡、太子的重托、樊於期的人头、还有那几乎注定的死亡。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>慨然赴死——为知遇之恩、为道义,明知九死一生也要去刺秦。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>婉言推辞——这几乎是去送死,我没有把握,不如保命另谋出路。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>拖延等待——再等一个更有把握的时机和帮手,别这么仓促上路。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">荆轲,选了 A</div>
  <div class="scene">他上路了。带着樊於期的人头和那卷藏着匕首的地图,走进了秦国的宫殿。<br><br>献图时,地图<b>一寸寸展开,到尽头,匕首露了出来</b>——"<b>图穷匕见</b>"。他一把抓起匕首刺向秦王,却没刺中;秦王绕着柱子奔逃,他在后面紧追……最终秦王拔剑砍断了他的左腿。<br><br>身受八处重伤、再也站不起来的荆轲,<b>倚着柱子放声大笑、痛骂秦王</b>,从容赴死。他失败了,却把一份气概,永远留在了易水边。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……后来呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 一次失败的行刺,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 短期</div><div class="lt">行刺失败,荆轲身中八创被杀,临死仍笑骂不止。"图穷匕见"成了千古成语。</div></div>
    <div class="line"><div class="lh">🥀 长远(它招来的)</div><div class="lt">此举彻底激怒秦王,秦随即发大军<b>猛攻并灭掉了燕国</b>——刺杀,反而加速了燕的灭亡。</div></div>
    <div class="line"><div class="lh">🌟 不灭的回响</div><div class="lt">但荆轲"<b>明知不可为而为之</b>"的勇气与信义,被《史记》郑重记下,千古传颂。"风萧萧兮易水寒",成了中国人心中最悲壮的一幕。</div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看他的赴死? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一次赴死,不同的声音</div>
  <div class="voice"><div class="vw">🙇 太子丹</div><div class="va">"是我把他推上了绝路……可除此之外,弱小的燕国,还有别的活路吗?"</div></div>
  <div class="voice"><div class="vw">🎵 高渐离(挚友)</div><div class="va">"我送他到易水,那首歌我一辈子忘不了。后来,我也想替他,再去刺一次秦王。"</div></div>
  <div class="voice"><div class="vw">📜 后世(陶渊明)</div><div class="va">"其人虽已没,千载有余情。"——他虽然失败了,那份气概,千年之后依然动人。</div></div>
  <div class="voice"><div class="vw">🤔 一个务实的人</div><div class="va">"用一个刺客,想挡住整个秦国的统一?这从一开始,就注定是徒劳吧。"</div></div>
  <div class="note">同一个抉择,没有标准答案。 · 史料:《史记·刺客列传》</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">他留下了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 失败,却留下比成功更长的回响</div>
  <div class="scene">荆轲刺秦失败了,反而加速了燕国的灭亡、秦的统一。从"<b>成败</b>"看,他输得彻底。<br><br>可是——"<b>风萧萧兮易水寒</b>"和"<b>图穷匕见</b>",成了中国文化里关于<b>勇气、信义与悲壮</b>的永恒符号,传诵了两千多年。<br><br>一次失败的刺杀,留下了<b>比成功更长久的回响</b>。原来,有些事,衡量它的不是成败,而是那一份"明知不可为而为之"的<b>气概</b>。</div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=zhanguo">🗺 去地图看 战国</a>
    <a class="ghost" href="./decision-leonidas.html">🛡 去看温泉关(列奥尼达的死守)</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">列奥尼达明知守不住,死守温泉关;荆轲明知刺不成,也踏上易水。都<b>明知必死也要去</b>——人,为什么会为了某种东西,连命都不要?</div>
  <div class="q">在你心里,有没有什么东西,是你觉得<b>比"安全""舒服"更重要</b>的?换作是你,你会上易水这条路吗?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和荆轲(A)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你从荆轲的抉择里,看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:有些事,衡量它的不是成败,而是敢不敢去……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到「向死的勇气」这条线:和温泉关放一起找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'jingke',DOSSIER:DOSSIER,beats:beats,reactions:{A:'壮烈!可这一去几乎必死,你真的甘心用自己的命,去赌一个渺茫的机会吗?',
    B:'保命是本能。可樊於期已经为这件事献出了人头,太子丹待你恩重——你推得开吗?',
    C:'谨慎。但秦军已压到易水,燕国等不起;再拖,机会可能就没有了。'},confirmLabel:'👉 看真实的荆轲怎么选'};
</script>
<script src="./decision-engine.js?v=2"></script>
<script src="./ai_float.js?v=3"></script>
</body>
</html>
