<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 萨拉丁的宽待 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「我不愿用他们当年的血,玷污这座圣城。」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 萨拉丁(其心境)· 1187 耶路撒冷</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·萨拉丁的宽待"(母题:胜利者的宽容/赢了之后怎么对待败者)。史实:1187年,埃及与叙利亚的穆斯林苏丹萨拉丁(Saladin,本名萨拉赫丁)在哈丁战役大败十字军后,围攻并攻下了被十字军占据的耶路撒冷。88年前(1099年第一次十字军攻占耶路撒冷时,曾对城中穆斯林和犹太居民进行了血腥大屠杀)。如今轮到萨拉丁取胜,城中的基督徒(包括许多平民、妇女儿童)惶恐等待报复。萨拉丁本可以"以血还血"为先辈复仇,但他选择了宽待:他与守城方谈判,允许城中居民缴纳赎金离城(男子约10第纳尔、女子5、儿童2);并且他还释放了大量付不起赎金的穷人——据记载,萨拉丁和他的弟弟阿迪勒等人主动释放了成百上千付不起赎金的人,凡年老体弱者获准免费离开。他阻止了1099年那样的屠城惨剧,让基督徒得以有序撤离。结果:萨拉丁的仁慈与骑士风度被基督徒和穆斯林双方共同传颂,成为"宽容的征服者"的典范。教学要点:这是"胜利者如何对待战败者"的经典抉择——明明可以名正言顺地报复,却选择了克制与宽容,与几百年前波斯居鲁士善待巴比伦/释放犹太人属于同一母题。讲述涉及不同宗教时保持客观中立,只叙史实,不褒贬任何信仰。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论;战争的残酷处点到为止。';
const DOSSIER=[
  {i:'🕌',t:'你是谁',b:'你是<b>萨拉丁</b>,统一了埃及与叙利亚的苏丹,以勇武和公正闻名。这一年,你在大战中重创了十字军,兵临<b>耶路撒冷</b>城下。'},
  {i:'🏰',t:'一座三教圣城',b:'耶路撒冷,是基督徒、穆斯林、犹太人共同的<b>圣城</b>。八十多年来,它被十字军占据。如今,它就要回到你手里了。'},
  {i:'🩸',t:'八十八年前的血',b:'你记得:<b>八十八年前(1099年)</b>,十字军第一次攻下这座城时,曾对城里的居民进行了<b>血腥的大屠杀</b>。这笔血债,许多人都记着。'},
  {i:'😰',t:'城里的人在发抖',b:'城里挤满了惶恐的<b>基督徒平民</b>——老人、妇女、孩子。他们知道你打赢了,正<b>战战兢兢</b>地等着:这一次,会不会轮到他们被屠杀?'},
  {i:'🗣️',t:'部下的期待',b:'你的不少部下和信众,都盼着你<b>以血还血</b>:用当年屠城的方式回敬他们,既报了先辈的仇,也能立下赫赫威名。<b>"该轮到他们尝尝滋味了。"</b>'},
  {i:'⚖️',t:'眼前的难题',b:'<b>报复屠城</b>——名正言顺、大快人心,却会让这座圣城再次血流成河;<b>宽待他们</b>——放过仇人,可能被骂软弱、被人说你忘了先辈的血。'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">1187 年 · 耶路撒冷城下</div>
  <div class="htitle">轮到你赢了,要为先辈复仇吗?</div>
  <div class="hsub">即将由你 —— 萨拉丁 —— 决定</div>
  <div class="scene">1187年,你是苏丹<b>萨拉丁</b>,刚刚攻下被十字军占据了88年的耶路撒冷。<br><br>88年前,十字军攻城时曾血腥屠城。如今城里挤满惶恐的基督徒平民,你的部下盼着你<b>以血还血</b>。<br><br><b>报复,还是宽待?</b> 先别急,先把这座圣城看清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先弄懂这座圣城 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">看清这座刚夺回的圣城</div>
  <div class="dossier-intro">点开每一张情报卡,弄懂这座城的分量、八十八年前的血、和城里人的恐惧。<br>全部看完,你才有资格替萨拉丁做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张情报卡后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是萨拉丁</div>
  <div class="ask">报复,还是宽待?</div>
  <div class="asksub">报复名正言顺、大快人心;宽待却可能被骂软弱、忘了先辈的血。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>宽待——允许居民缴赎金离城,放过付不起的老弱,绝不重演屠城。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>以血还血——像当年十字军那样屠城,为先辈复仇、立下威名。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>全部掳为奴隶——既不屠杀也不放走,把他们卖掉换取钱财。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">萨拉丁,选了 A</div>
  <div class="scene">他选择了<b>宽待</b>。他与守城方谈判,允许城里的居民<b>缴一笔赎金就可以平安离开</b>;对那些<b>付不起赎金</b>的穷人、老人,他和身边的人主动出钱,<b>放他们自由离去</b>。<br><br>他没有让八十八年前的惨剧重演——这座圣城,这一次<b>没有血流成河</b>。<br><br>战败的基督徒,得以拖家带口、有序地离开了耶路撒冷。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……它带来了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 一次宽待,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 当下</div><div class="lt">城里的平民得以<b>有序撤离</b>,避免了一场屠杀。萨拉丁甚至自掏腰包,放走了大批付不起赎金的穷人。</div></div>
    <div class="line"><div class="lh">🌅 名声</div><div class="lt">他的仁慈与骑士风度,被<b>穆斯林和基督徒双方一致传颂</b>。连他的敌人,都不得不敬重这位"宽容的征服者"。</div></div>
    <div class="line"><div class="lh">📜 一个回响</div><div class="lt">这一幕,和几百年前波斯<b>居鲁士</b>善待巴比伦、放犹太人回家,遥遥呼应——<b>真正的强者,赢了之后选择了克制。</b></div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看这件事? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一座城,不同的声音</div>
  <div class="voice"><div class="vw">😢 一个获释的基督徒</div><div class="va">"我们以为必死无疑……他却放我们走,连付不起钱的也放了。这位敌人,值得敬重。"</div></div>
  <div class="voice"><div class="vw">🗡️ 一个主张复仇的部下</div><div class="va">"八十八年前他们屠了我们的人!如今为什么不以血还血?"</div></div>
  <div class="voice"><div class="vw">🕌 萨拉丁</div><div class="va">"他们当年的残忍,不该成为我残忍的理由。我不愿用血,玷污这座圣城。"</div></div>
  <div class="voice"><div class="vw">📜 后世史家</div><div class="va">"1099年的屠城与1187年的宽待,成了鲜明对照:它证明——征服,不一定要靠灭绝。"</div></div>
  <div class="note">同一个抉择,没有标准答案。 · 史料:据阿拉伯与十字军双方编年史</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">它藏着什么规律? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 不靠灭绝,也能证明强大</div>
  <div class="scene">手握复仇的"正当理由",萨拉丁却选择了克制。他没有让仇恨牵着走,而是放战败者一条生路——结果,他赢得的不只是一座城,还有连敌人都敬重的<b>名声</b>。<br><br>把他和几百年前的波斯王<b>居鲁士</b>放在一起,你会看到同一条线:<b>当胜利者握有生杀大权时,真正的伟大,是选择宽容而不是报复。</b><br><br>一个释放被掳的犹太人、让各族回家;一个放走战败的基督徒、不让圣城再流血。隔着千年与不同信仰,他们告诉后人同一句话:<b>真正的强大,不必靠灭绝来证明。</b></div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=crusades">🗺 去地图看 十字军时代</a>
    <a class="ghost" href="./decision-cyrus.html">👑 看居鲁士的同款宽容 →</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">当你有了"<b>报复的正当理由</b>"、对方又毫无还手之力时——你忍得住不去报复吗?</div>
  <div class="q">"以血还血"会让仇恨一代代传下去。萨拉丁选择<b>停下这个循环</b>。你觉得,需要更大勇气的,是报复,还是<b>放下</b>?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和萨拉丁(A)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:别人对我残忍,不该成为我也残忍的理由——停下仇恨的循环,更需要勇气……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到抉择,顺着母题线找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'saladin',DOSSIER:DOSSIER,beats:beats,reactions:{A:'以宽容回应残忍,需要极大的定力。可你也要顶住"忘了先辈血"的骂名——你扛得住吗?',
    B:'以血还血,确实"解气"、能立威。可仇恨就这样一代代循环下去——这真的是你想要的胜利吗?',
    C:'卖为奴隶,既得了钱又不沾"屠杀"之名?可这依然是把活人当货物——和宽容,差得很远。'},confirmLabel:'👉 看真实的萨拉丁怎么选'};
</script>
<script src="./decision-engine.js?v=1"></script>
<script src="./ai_float.js?v=3"></script>
</body>
</html>
