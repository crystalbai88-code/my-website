<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 阿塔瓦尔帕·卡哈马卡 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「我有千军万马,何惧这一百多个异乡人?」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 印加 · 阿塔瓦尔帕(其心境)</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·阿塔瓦尔帕在卡哈马卡"(母题:看不懂的来客/面对前所未见的强敌)。史实:1532年,印加帝国皇帝阿塔瓦尔帕(Atahualpa)刚在一场与兄长瓦斯卡尔的内战中获胜、统一帝国,正带着大军在卡哈马卡(今秘鲁北部)休整。西班牙人弗朗西斯科·皮萨罗(Pizarro)只带了约180名士兵、几十匹马和少量火器,深入内陆。皮萨罗邀阿塔瓦尔帕到卡哈马卡的广场会面。阿塔瓦尔帕自恃身边有数万大军(随行数千人多为仪仗、随从,武器轻便或未携重武器),并不把这一百多个异乡人放在眼里,于11月16日轻装(随行者多无重武器)进入广场赴会。皮萨罗预先把士兵、骑兵和火炮埋伏在广场四周的建筑里,趁印加方毫无防备发动突袭,史称"卡哈马卡伏击/屠杀",当场俘虏了阿塔瓦尔帕。被俘后,阿塔瓦尔帕提出用一屋子的黄金、两屋子的白银赎身(房间约长7米、宽5米,黄金堆到举手高度),金银从帝国各地源源运来、如约填满;但西班牙人拿到赎金后仍以叛国等罪名审判他,1533年8月将其处死(受洗后改为绞刑)。印加帝国随之走向崩溃。教学要点:阿塔瓦尔帕的致命点在于"轻敌/误判"——他有压倒性兵力,却因为看不起这一小撮陌生人而放松戒备、轻装赴会,被对方用计反杀。这和阿兹特克蒙特祖马迎科尔特斯属于同一母题:两个美洲大帝国都因误判欧洲来客而覆灭。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论;残酷处点到为止。';
const DOSSIER=[
  {i:'🌄',t:'你是谁',b:'你是<b>阿塔瓦尔帕</b>,<b>印加帝国</b>的新皇帝。你刚刚打赢了和兄长争位的内战,统一了这个横跨安第斯山脉的庞大帝国。此刻,你正带着大军在<b>卡哈马卡</b>休整。'},
  {i:'⛵',t:'山里来的怪客',b:'一小队从没见过的人闯进了你的国土:白皮肤、大胡子,骑着"巨兽"(<b>马</b>),带着会喷火的"铁管"(<b>火枪</b>)。他们的首领叫<b>皮萨罗</b>,派人来邀你到城里的广场会面。'},
  {i:'🔢',t:'人数悬殊',b:'你身边有<b>数以万计</b>的人马,而皮萨罗一伙,满打满算才<b>一百八十来人</b>。在你看来,这点人马,简直不值一提——你<b>根本没把他们当回事</b>。'},
  {i:'🐎',t:'你没见过的东西',b:'可你也从没见过他们那些东西:奔跑如飞的<b>马</b>、能在远处轰响伤人的<b>火枪</b>、刀枪不入的<b>铁甲</b>。这些,你和你的勇士们,统统<b>没有交过手</b>。'},
  {i:'🏛️',t:'广场上的邀约',b:'皮萨罗把你请到卡哈马卡的<b>广场</b>赴会。广场四周,是一圈空荡荡的房子。你可以<b>大军压境、严阵以待</b>,也可以像往常巡幸那样,<b>轻车简从、风风光光</b>地去会一会这些不起眼的异乡人。'},
  {i:'⚠️',t:'被忽略的疑点',b:'有件事你没多想:对方为什么非要约在<b>四面是房子的广场</b>?那些房子里,会不会<b>藏着什么</b>?自恃兵多的你,觉得不必担心——可这,恰恰是最该警惕的地方。'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">1532 年 · 卡哈马卡(今秘鲁)· 广场</div>
  <div class="htitle">这一百多个异乡人,值得提防吗?</div>
  <div class="hsub">即将由你 —— 阿塔瓦尔帕 —— 决定</div>
  <div class="scene">1532年,你是<b>印加</b>皇帝阿塔瓦尔帕,刚打赢内战、手握数万大军。<br><br>一小队陌生人闯进国土,首领皮萨罗只有<b>一百八十来人</b>,却请你到广场会面。在你眼里,这点人不值一提。<br><br><b>大军压境,还是轻装赴会?</b> 先别急——先把这群人和这个广场看清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先弄懂这场会面 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">看清这场会面</div>
  <div class="dossier-intro">点开每一张情报卡,弄懂这群人是谁、你强在哪、又有哪个疑点被你忽略了。<br>全部看完,你才有资格替阿塔瓦尔帕做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张情报卡后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是阿塔瓦尔帕</div>
  <div class="ask">大军压境,还是轻装赴会?</div>
  <div class="asksub">你有千军万马,对方只有一百多人;可他们身上,全是你没见过的东西。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>轻装赴会——他们不值一提,带着仪仗风光赴约,显出帝王的从容。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>带兵戒备——照常赴会,但让全副武装的大军在身边严阵以待。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>先围而不打——按兵不动,先派人摸清这群怪客的虚实再说。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">阿塔瓦尔帕,选了 A</div>
  <div class="scene">他根本没把这一百多人当威胁。11月16日,他<b>轻装</b>由众多随从簇拥着,风风光光地进了广场——随行的人,大多没带像样的武器。<br><br>可他不知道,广场四周那些空房子里,<b>早已埋伏好</b>了皮萨罗的骑兵、火枪手和火炮。<br><br>一声令下,伏兵尽出。毫无防备的印加人乱作一团,皇帝<b>阿塔瓦尔帕当场被擒</b>。一支数万人的大军,因为皇帝被抓,瞬间瓦解。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……后来呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 轻敌这一步,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 短期</div><div class="lt">被俘的阿塔瓦尔帕提出<b>用满屋黄金白银赎身</b>:一屋金、两屋银。金银从帝国各地源源运来,如约填满了房间。</div></div>
    <div class="line"><div class="lh">💔 他自己</div><div class="lt">可西班牙人<b>拿了赎金、仍不放人</b>。1533年,他们以"叛国"等罪名审判阿塔瓦尔帕,把他<b>处死</b>了。一屋黄金,没能换回他的命。</div></div>
    <div class="line"><div class="lh">🌎 整个美洲</div><div class="lt">皇帝一死,<b>印加帝国走向崩溃</b>。继阿兹特克之后,又一个美洲大帝国,栽在了对陌生来客的<b>轻敌与误判</b>上。</div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看这件事? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一场伏击,不同的声音</div>
  <div class="voice"><div class="vw">🌄 阿塔瓦尔帕</div><div class="va">"我有千军万马,何惧这一百多个异乡人?——是这份轻视,害了我,也害了整个帝国。"</div></div>
  <div class="voice"><div class="vw">⚔️ 一位印加将领</div><div class="va">"陛下若肯让我们带足兵器、严阵以待,哪怕广场有埋伏,他们也讨不到便宜!"</div></div>
  <div class="voice"><div class="vw">🐎 皮萨罗的士兵</div><div class="va">"我们只有一百多人,可对方毫无防备。出其不意,以少胜多——靠的是计谋和那一刻的胆量。"</div></div>
  <div class="voice"><div class="vw">📜 后世史家</div><div class="va">"短短十几年,阿兹特克和印加先后覆灭,剧本几乎一样:都败在对前所未见之敌的误判上。"</div></div>
  <div class="note">同一个抉择,没有标准答案。 · 史料:据西班牙征服者与印加方面记载(需互相印证)</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">它改变了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 两个帝国,同一个剧本</div>
  <div class="scene">阿塔瓦尔帕兵力占尽上风,却因为<b>看不起</b>那一小撮陌生人,放松了戒备、轻装赴会——结果被对方用一场埋伏,连人带帝国一起掀翻。<br><br>把它和十几年前阿兹特克蒙特祖马的故事摆在一起看,你会发现一个惊人的相似:<b>两个美洲大帝国,都不是输在兵力,而是输在"看不懂、又看不起"陌生的对手。</b><br><br>面对前所未见的来客,<b>盲目信任会送命,盲目轻视也会送命</b>——最难、也最要紧的,是先放下成见,把对手看清楚。</div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=inca">🗺 去地图看 印加</a>
    <a class="ghost" href="./decision-moctezuma.html">🦅 看阿兹特克的同款抉择 →</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">当你<b>实力远胜对方</b>时,你会不会也忍不住<b>轻敌</b>?阿塔瓦尔帕的教训,提醒了你什么?</div>
  <div class="q">两个美洲帝国,一个"太信任",一个"太轻视",都因为<b>误判陌生对手</b>而覆灭。你觉得,这两种错,根子上是不是同一个?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和阿塔瓦尔帕(A)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你从卡哈马卡看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:越是觉得对手不值一提,越容易栽跟头——再强,也不能小看看不懂的对手……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到抉择,顺着母题线找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'atahualpa',DOSSIER:DOSSIER,beats:beats,reactions:{A:'帝王的从容,也是致命的轻敌。你确定那四面的空房子里,什么都没藏?',
    B:'带兵戒备,稳妥得多。可这会不会显得堂堂印加皇帝,竟怕一百多个异乡人?',
    C:'不急着见面,先摸底。可对方会不会趁你犹豫,先一步设好圈套?'},confirmLabel:'👉 看真实的阿塔瓦尔帕怎么选'};
</script>
<script src="./decision-engine.js?v=2"></script>
<script src="./ai_float.js?v=3"></script>
</body>
</html>
