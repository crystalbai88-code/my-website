<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 世界文明实验室 · 选择课程</title>
<meta name="description" content="AI 世界文明实验室:实验室课(世界文明·理解探索)与 历史学习课(中考历史·强化复习)两个并行入口。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<style>
  html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent}
  #app{position:relative;z-index:10;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px 50px;box-sizing:border-box}
  .hero{text-align:center;margin-bottom:8px}
  .hero .globe{font-size:50px;line-height:1;animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,6.5vw,38px);color:var(--ink);margin:10px 0 4px;text-shadow:var(--label-shadow)}
  .hero p{font-family:var(--serif);font-size:14.5px;color:var(--ink2);line-height:1.7;margin:0 auto;max-width:22em}
  .choose{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;font-weight:700;margin:22px 0 2px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:760px;width:100%;margin-top:12px}
  .c{position:relative;display:flex;flex-direction:column;text-decoration:none;overflow:hidden;cursor:pointer;
    background:var(--panel-bg);border:1.5px solid var(--panel-line);border-top:5px solid var(--ac);border-radius:20px;
    padding:24px 22px 22px;backdrop-filter:blur(10px);transition:transform .16s,box-shadow .16s,border-color .16s}
  .c:hover{transform:translateY(-4px);box-shadow:0 16px 38px rgba(0,0,0,.18);border-color:var(--ac)}
  .c .ic{font-size:44px;line-height:1}
  .c .t{font-family:var(--serif);font-weight:900;font-size:23px;color:var(--ink);margin:12px 0 2px}
  .c .s{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ac);text-transform:uppercase;font-weight:700}
  .c .d{font-family:var(--serif);font-size:14.5px;color:var(--ink);line-height:1.75;margin:12px 0 0}
  .c .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .c .tag{font-family:var(--sans);font-size:11.5px;color:var(--ink2);background:var(--bg2,rgba(255,255,255,.05));border:1px solid var(--panel-line);border-radius:8px;padding:4px 9px}
  .c .cta{margin-top:16px;align-self:flex-start;font-family:var(--sans);font-weight:800;font-size:14px;color:#fff;
    background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:999px;padding:11px 20px;box-shadow:0 6px 16px rgba(0,0,0,.16)}
  .foot{font-family:var(--sans);font-size:12px;color:var(--ink3);text-align:center;margin-top:28px;line-height:1.7}
</style>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="hero">
    <div class="globe">🌍</div>
    <h1>AI 世界文明实验室</h1>
    <p>两种走进历史的方式,挑一个进去 👇</p>
  </div>
  <div class="choose">· 选择课程 ·</div>
  <div class="cards">
    <a class="c" style="--ac:#e08a2c;--ac2:#e2603f" href="./index.html">
      <div class="ic">🌍</div>
      <div class="t">实验室课</div>
      <div class="s">世界文明 · 理解与探索</div>
      <div class="d">在世界地图时间轴上自由探索,代入历史人物做抉择、找规律、走进一座城——<b>看大局、懂人性,不背年代</b>。</div>
      <div class="tags"><span class="tag">🗺️ 世界地图</span><span class="tag">🕸️ 关系网</span><span class="tag">🎯 抉择</span><span class="tag">🏙️ 走进一座城</span><span class="tag">🤖 AI 助手</span></div>
      <span class="cta">进入实验室 →</span>
    </a>
    <a class="c" style="--ac:#2f9e86;--ac2:#3a9ec8" href="../history-course/index.html">
      <div class="ic">📚</div>
      <div class="t">历史学习课</div>
      <div class="s">中考历史 · 强化与复习</div>
      <div class="d">面向初中生:把三年知识点装进一张<b>中考知识地图</b>,按阶段×专题整体学,配速记与游戏化巩固——<b>冲刺应试、好懂好记</b>。</div>
      <div class="tags"><span class="tag">🗺️ 中考地图</span><span class="tag">💡 速记钩子</span><span class="tag">🃏 记忆游戏</span><span class="tag">🎮 闯关检验</span></div>
      <span class="cta">进入学习课 →</span>
    </a>
  </div>
  <div class="foot">两个板块并行:一个管<b>理解</b>,一个管<b>应试</b>。<br>由白白的 AI 教育实验室打造</div>
</div>
</body>
</html>
