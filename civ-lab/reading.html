<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>时代书屋 · 金句与名场面 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<style>
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #app{position:relative;z-index:10;height:100dvh;display:flex;flex-direction:column}
  .top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:9px;padding:11px 15px;
    background:linear-gradient(180deg,rgba(var(--scrim,0,0,0),.3),transparent)}
  .top a.back{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:.1em;
    background:var(--topbar-bg);border:1px solid var(--panel-line);border-radius:999px;padding:7px 13px;backdrop-filter:blur(8px)}
  .top .brand{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--ink);text-shadow:var(--label-shadow)}
  .top .sub{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:auto}
  #stage{flex:1;position:relative;overflow:hidden}
  #card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:78px 28px 120px;box-sizing:border-box;text-align:center;cursor:default}
  .anim-up{animation:inUp .44s cubic-bezier(.22,1,.36,1)}
  .anim-down{animation:inDown .44s cubic-bezier(.22,1,.36,1)}
  @keyframes inUp{from{opacity:0;transform:translateY(54px)}to{opacity:1;transform:none}}
  @keyframes inDown{from{opacity:0;transform:translateY(-54px)}to{opacity:1;transform:none}}
  .c-type{display:inline-block;font-family:var(--sans);font-size:11.5px;font-weight:800;color:#fff;border-radius:999px;
    padding:4px 14px;letter-spacing:.05em;margin-bottom:18px}
  .quote-mark{font-family:var(--serif);font-size:54px;line-height:.5;color:var(--gold);opacity:.5;height:24px}
  .c-text{font-family:var(--serif);font-weight:700;font-size:clamp(20px,5.2vw,28px);color:var(--ink);
    line-height:1.62;max-width:20em;margin:6px 0}
  .c-src{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--gold);margin-top:18px}
  .c-by{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:3px}
  .c-why{font-family:var(--sans);font-size:14px;color:var(--ink2);line-height:1.7;max-width:21em;
    margin-top:20px;padding-top:16px;border-top:1px solid var(--panel-line)}
  .c-link{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-family:var(--sans);font-size:13px;font-weight:800;
    color:#fff;background:linear-gradient(90deg,var(--gold),var(--vermilion));border:none;border-radius:999px;
    padding:10px 20px;cursor:pointer;text-decoration:none;box-shadow:0 5px 16px rgba(0,0,0,.18)}
  .c-link:active{transform:scale(.97)}
  #prog{position:fixed;right:9px;top:50%;transform:translateY(-50%);z-index:25;width:3px;height:118px;
    background:rgba(var(--scrim,0,0,0),.1);border-radius:3px;overflow:hidden}
  #prog i{display:block;width:100%;background:linear-gradient(180deg,var(--gold),var(--vermilion));border-radius:3px}
  .swipe-hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:25;
    font-family:var(--sans);font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;animation:bob 2s infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
  .navbtns{position:fixed;right:14px;bottom:22px;z-index:26;display:flex;flex-direction:column;gap:8px}
  .navbtns button{width:42px;height:42px;border-radius:50%;border:1px solid var(--panel-line);
    background:var(--panel-bg);color:var(--ink);font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink2);font-family:var(--sans);gap:10px;padding:30px;text-align:center}
</style>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./map.html">⌂ 地图</a>
    <span class="brand">📚 时代书屋</span>
    <span class="sub" id="eraSub"></span>
  </div>
  <div id="stage"><div id="card"></div></div>
  <div id="prog"><i></i></div>
  <div class="swipe-hint" id="swipeHint"><span style="font-size:18px">↑</span><span>上滑 看下一张</span></div>
  <div class="navbtns"><button id="upBtn">↑</button><button id="downBtn">↓</button></div>
</div>
<script src="./track.js?v=1"></script>
<script src="./reading_data.js?v=1"></script>
<script>
const ERA_NAME={early:'早期文明 · 前3500–前1000',classical:'古典 · 前1000–550',medieval:'中世纪 · 500–1500',global:'全球连接 · 1500–1800',modern:'工业与现代 · 1750–1945',contemporary:'当代 · 1945–今'};
const TYPE={'金句':'#c87a3a','名场面':'#3f9e86','名物':'#b06aa0'};
const params=new URLSearchParams(location.search);
const era=params.get('era')||'early';
const cards=(window.READING&&READING[era])||[];
document.getElementById('eraSub').textContent=ERA_NAME[era]||'';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
let idx=0;
const cardEl=document.getElementById('card');

function render(dir){
  const c=cards[idx]; if(!c)return;
  const col=TYPE[c.t]||'#c87a3a';
  let h=`<div class="c-type" style="background:${col}">${esc(c.t)}</div>`;
  if(c.t==='金句') h+=`<div class="quote-mark">"</div>`;
  h+=`<div class="c-text">${esc(c.text)}</div>`;
  h+=`<div class="c-src">— ${esc(c.src)}</div>`;
  if(c.by) h+=`<div class="c-by">${esc(c.by)}</div>`;
  if(c.why) h+=`<div class="c-why">${esc(c.why)}</div>`;
  if(c.civ) h+=`<a class="c-link" href="./map.html?civ=${encodeURIComponent(c.civ)}">🗺 去地图看 ${esc(c.civName||'这个文明')} →</a>`;
  cardEl.className=''; void cardEl.offsetWidth;
  cardEl.className=dir==='down'?'anim-down':'anim-up';
  cardEl.innerHTML=h;
  document.querySelector('#prog i').style.height=((idx+1)/cards.length*100)+'%';
  if(idx>0) document.getElementById('swipeHint').style.display='none';
  if(window.Track) Track.log('阅读之旅');
}
function go(d){ const n=Math.max(0,Math.min(cards.length-1,idx+d)); if(n===idx)return; const dir=d>0?'up':'down'; idx=n; render(dir); }

if(!cards.length){
  document.getElementById('stage').innerHTML='<div class="empty"><div style="font-size:40px">📚</div><div>这个时代的书屋正在筹备中…</div><a class="c-link" href="./map.html">⌂ 回地图</a></div>';
  document.getElementById('prog').style.display='none'; document.getElementById('swipeHint').style.display='none'; document.querySelector('.navbtns').style.display='none';
}else{
  // 手势/输入
  let lock=false;
  document.getElementById('stage').addEventListener('wheel',e=>{e.preventDefault();if(lock)return;if(Math.abs(e.deltaY)<8)return;lock=true;go(e.deltaY>0?1:-1);setTimeout(()=>lock=false,440);},{passive:false});
  let ty0=null,tmoved=false;
  document.getElementById('stage').addEventListener('touchstart',e=>{ty0=e.touches[0].clientY;tmoved=false;},{passive:true});
  document.getElementById('stage').addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientY-ty0)>10)tmoved=true;},{passive:true});
  document.getElementById('stage').addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-ty0;if(tmoved&&Math.abs(dy)>45)go(dy<0?1:-1);},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();go(1);}else if(e.key==='ArrowUp'){e.preventDefault();go(-1);}});
  document.getElementById('upBtn').onclick=()=>go(-1);
  document.getElementById('downBtn').onclick=()=>go(1);
  render('up');
}
</script>
</body>
</html>
