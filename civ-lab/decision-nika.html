<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抉择时刻 · 尼卡暴动·留还是逃 · CivLab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./cosmos-design-system.css?v=6"/>
<link rel="stylesheet" href="./decision.css?v=1"/>
</head>
<body data-theme="warm">
<div class="ds-cosmos"><div class="nebula"></div><div class="stars"></div><div class="stars twinkle"></div></div>
<div id="app">
  <div class="top">
    <a class="back" href="./stories.html">⌂ 抉择</a>
    <span class="brand">🎯 抉择时刻</span>
    <div class="prog" id="prog"></div>
  </div>
  <div class="wrap"><div class="beat" id="beat"></div><div class="epigraph" style="margin:20px auto 4px;max-width:30em;text-align:center;font-family:'Noto Serif SC',serif;color:var(--ink2);font-size:15px;line-height:1.75;border-top:1px dashed var(--panel-line);padding-top:16px">「紫袍,是最体面的寿衣。」<div style="font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.04em">—— 皇后狄奥多拉 · 尼卡暴动</div></div></div>
</div>
<script src="./track.js?v=1"></script>
<script>
window.__aiCtx='用户正在体验"抉择时刻·尼卡暴动(留还是逃)"(母题:向死的勇气/守还是退)。史实:公元532年,东罗马(拜占庭)皇帝查士丁尼一世在首都君士坦丁堡。赛车场(竞技场)两大派系"蓝党"与"绿党"本是死对头,却因不满高税与官员暴政联合暴动,口号"Nika(尼卡,意为胜利)",史称尼卡暴动。暴民焚烧半个城市(包括旧圣索菲亚大教堂),拥立新皇帝,围困皇宫。查士丁尼一度准备乘船弃城逃跑;关键时刻皇后狄奥多拉发表著名演说,大意:能逃,但她宁愿留下,"紫袍(帝王之色)是最体面的寿衣/最好的裹尸布",劝丈夫宁可战死也不做逃亡的皇帝。查士丁尼留下,派大将贝利撒留与蒙杜斯设伏,把暴民诱困在赛车场内镇压,约三万人被杀。暴动平息后,查士丁尼坐稳皇位,重建了宏伟的圣索菲亚大教堂(至今矗立伊斯坦布尔),并编纂《查士丁尼法典》、一度收复地中海故土。注意:狄奥多拉出身卑微(传为演员/马戏团之女),却成为帝国最有权势的皇后之一。请用适合10-12岁孩子的语言陪他思考,多反问,不要替他下结论。这是"守还是退"的抉择,和列奥尼达温泉关、荆轲刺秦属于同一母题。';
const DOSSIER=[
  {i:'👑',t:'你是谁',b:'你是<b>查士丁尼一世</b>,东罗马(拜占庭)的皇帝。你雄心勃勃,想收复古罗马失去的疆土、重整法律——可你也加重了赋税,城里早已怨声载道。'},
  {i:'🏟️',t:'一座城的火药桶',b:'君士坦丁堡最热闹的地方是<b>赛车场</b>。看台上分"<b>蓝党</b>"和"<b>绿党</b>"两大球迷派系,平时势同水火。可这一次,他们竟然<b>联手</b>了。'},
  {i:'🔥',t:'"尼卡!尼卡!"',b:'两党因不满苛税和暴吏,一起冲上街头,高喊"<b>尼卡(胜利)</b>"。他们放火烧城——半座城市、连同旧的大教堂都被烧毁,还<b>另立了一个新皇帝</b>。'},
  {i:'🚪',t:'皇宫被围',b:'暴民把<b>皇宫团团围住</b>。大臣们慌作一团,劝你:海港就在旁边,船已备好,<b>趁早乘船逃命</b>,留得青山在。'},
  {i:'👸',t:'皇后的声音',b:'就在你要登船时,皇后<b>狄奥多拉</b>站了出来。她出身卑微,却最有胆识。她说:逃,当然能逃;可她宁愿留下——"<b>紫袍,是最体面的寿衣</b>"。意思是:<b>宁可作为皇帝战死,也不要做逃亡的废人。</b>'},
  {i:'🛡️',t:'你手里还有牌',b:'你身边还有两员忠诚的大将——<b>贝利撒留</b>和蒙杜斯,以及一支精锐卫队。暴民虽多,却乱成一团、全都挤在赛车场里狂欢。<b>机会,也许还在。</b>'},
];
const beats=[];
beats.push(()=>`
  <div class="kicker">公元 532 年 · 君士坦丁堡 · 皇宫</div>
  <div class="htitle">登船逃命,还是留下死守?</div>
  <div class="hsub">即将由你 —— 查士丁尼 —— 决定</div>
  <div class="scene">公元532年,你是拜占庭皇帝<b>查士丁尼</b>。城里爆发大暴动,半座城被烧,暴民围住皇宫、另立新君。<br><br>大臣们劝你:<b>船已备好,快逃。</b> 可皇后狄奥多拉说:"紫袍,是最体面的寿衣。"——她劝你留下。<br><br>逃,还是留?<b>先别急。</b> 先把这座火山口看清楚。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(1)">📂 先弄懂这场暴动 →</button></div>`);
beats.push(()=>`
  <div class="kicker">第一步 · 了解</div>
  <div class="htitle" style="font-size:23px">看清这座火山口</div>
  <div class="dossier-intro">点开每一张情报卡,弄懂暴动从何而来、你被逼到了哪一步、手里还有什么。<br>全部看完,你才有资格替查士丁尼做决定。</div>
  <div class="dcount" id="dcount">已了解 0 / ${DOSSIER.length}</div>
  <div id="dwrap">${DOSSIER.map((d,i)=>`
    <div class="dcard" data-i="${i}" onclick="flip(${i})">
      <div class="dhead"><span class="ddot"></span><span class="di">${d.i}</span><span class="dt">${d.t}</span><span class="dchev">▶</span></div>
      <div class="dbody" id="db${i}"><div class="dbody-in">${d.b}</div></div>
    </div>`).join('')}</div>
  <div class="btnrow"><button class="nextbtn" id="toChoice" onclick="go(2)" disabled>换作是你,你会怎么做? →</button></div>
  <div class="gate" id="gate">(看完全部 ${DOSSIER.length} 张情报卡后解锁)</div>`);
beats.push(()=>`
  <div class="kicker">第二步 · 此刻,你就是查士丁尼</div>
  <div class="ask">登船,还是留下?</div>
  <div class="asksub">船在港口等着,皇后在身边劝你留下,城外是几万愤怒的暴民。<br>现在,这个决定由你来下。</div>
  <div class="choices">
    <div class="choice" data-k="A" onclick="choose('A')"><span class="ckey">A</span>留下死守——宁可作为皇帝战死,也不做逃亡的废人,放手一搏平定暴动。</div>
    <div class="choice" data-k="B" onclick="choose('B')"><span class="ckey">B</span>乘船逃命——留得青山在,先逃到别处,日后再图东山再起。</div>
    <div class="choice" data-k="C" onclick="choose('C')"><span class="ckey">C</span>向暴民让步——交出被骂的官员、答应减税,花钱买平安。</div>
  </div>
  <div class="reaction" id="reaction"></div>`);
beats.push(()=>`
  <div class="kicker">第三步 · 真实的他</div>
  <div class="htitle" style="font-size:22px">查士丁尼,选了 A</div>
  <div class="scene">狄奥多拉那句"<b>紫袍是最体面的寿衣</b>",让他打消了逃跑的念头。他决定<b>留下</b>。<br><br>他派出忠诚的大将<b>贝利撒留</b>和蒙杜斯,买通了暴民拥立的新君身边的人,再率精兵从两个入口悄悄包抄——把还在赛车场里狂欢的暴民<b>困在了里面</b>。<br><br>那一天,赛车场成了修罗场,据说约<b>三万人</b>丧生。暴动,被血腥地平息了。</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(4)">那……后来呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第四步 · 留下这一步,延伸出三条线</div>
  <div class="lines">
    <div class="line"><div class="lh">⚡ 短期</div><div class="lt">暴动被镇压,查士丁尼<b>坐稳了皇位</b>。代价极其惨重:约三万人死在赛车场,半座城在大火中化为废墟。</div></div>
    <div class="line"><div class="lh">🌅 长远</div><div class="lt">他在废墟上<b>重建了圣索菲亚大教堂</b>——一座惊世的穹顶建筑,矗立至今(在今天的伊斯坦布尔);还编纂了影响后世千年的<b>《查士丁尼法典》</b>。</div></div>
    <div class="line"><div class="lh">👸 那个皇后</div><div class="lt">出身卑微的<b>狄奥多拉</b>,因这一夜的胆识被后世铭记。是她的一句话,让一个准备逃跑的皇帝<b>留了下来</b>。</div></div>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(5)">别人怎么看这一夜? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第五步 · 同一场暴动,不同的声音</div>
  <div class="voice"><div class="vw">👸 皇后狄奥多拉</div><div class="va">"逃出去,我们什么都不是。我宁愿作为皇后死在这里。紫袍,是最体面的寿衣。"</div></div>
  <div class="voice"><div class="vw">🔥 一个绿党暴民</div><div class="va">"我们只是受够了苛税和暴吏!可换来的,是三万条人命……"</div></div>
  <div class="voice"><div class="vw">🛡️ 大将贝利撒留</div><div class="va">"陛下肯留下,我才有仗可打。一旦皇帝先逃,军心就散了。"</div></div>
  <div class="voice"><div class="vw">📜 后世史家</div><div class="va">"这一夜,既保住了一个伟大的时代,也留下了三万人的血。果决,还是残酷?"</div></div>
  <div class="note">同一个抉择,没有标准答案。 · 史料:据普罗柯比《战争史》</div>
  <div class="btnrow"><button class="nextbtn" onclick="go(6)">它改变了什么? →</button></div>`);
beats.push(()=>`
  <div class="kicker">第六步 · 一句话,留住了一个时代</div>
  <div class="scene">如果那一夜查士丁尼登了船,历史也许就是另一个样子:没有重建的圣索菲亚大教堂,没有《查士丁尼法典》,拜占庭的黄金时代可能就此夭折。<br><br>是皇后的一句"<b>紫袍是寿衣</b>",把一个想逃的皇帝<b>钉在了王座上</b>。守,意味着可能战死,也意味着三万人的血;退,意味着保命,却也意味着放弃一切。<br><br>"<b>守还是退</b>"——这个古老的难题,温泉关的列奥尼达答过,易水边的荆轲也答过。</div>
  <div class="btnrow" style="margin-top:16px">
    <a class="ghost" href="./map.html?civ=byzantine">🗺 去地图看 拜占庭</a>
    <a class="ghost" href="./medieval-network.html?all=1">🕸 看拜占庭的人物关系网</a>
  </div>
  <div class="btnrow"><button class="nextbtn" onclick="go(7)">那……换作是你呢? →</button></div>`);
beats.push(()=>`
  <div class="kicker">最后 · 回到你</div>
  <div class="htitle" style="font-size:22px">换作是你呢?</div>
  <div class="q">当"逃跑"能保命、"留下"可能送命——你会像狄奥多拉那样,选择<b>留下死守</b>吗?</div>
  <div class="q">查士丁尼守住了王座,代价是三万人的命。一个决定<b>保住了一个时代</b>,也<b>背上了血</b>。你怎么看这笔账?</div>
  <div class="q">你最开始选的是 <b id="myPick">?</b>,和查士丁尼(A)一样吗?走到这里,你的想法<b>变了</b>吗?</div>
  <div style="font-family:var(--sans);font-weight:700;color:var(--ink);margin-top:18px">✍️ 写下你从这一夜看懂的一句话:</div>
  <textarea id="myNote" placeholder="比如:有的人宁可站着倒下,也不愿逃着活着——可代价也要算进去……"></textarea>
  <div class="btnrow"><button class="nextbtn" onclick="saveNote(event)">💾 记下我的收获</button></div>
  <div class="btnrow" style="margin-top:14px">
    <a class="nextbtn" href="./stories.html" style="text-decoration:none">🧩 回到抉择,顺着母题线找规律 →</a>
  </div>
  <div class="btnrow" style="margin-top:8px">
    <button class="ghost" onclick="if(window.toggleAIFloat)toggleAIFloat()">🤖 和 AI 聊聊这个抉择</button>
    <button class="ghost" onclick="restart()">↺ 重新走一遍</button>
  </div>`);

window.DECISION={key:'nika',DOSSIER:DOSSIER,beats:beats,reactions:{A:'宁站着倒下,不逃着活着!可这一搏要赌上身家性命,还可能血流成河——你担得起吗?',
    B:'保命要紧。可皇帝一旦先逃,军心民心就全散了——你这一走,可能再也回不来了。',
    C:'花钱买平安。可暴民已经另立了皇帝、烧了半座城——他们要的,恐怕已经不只是减税了。'},confirmLabel:'👉 看真实的查士丁尼怎么选'};
</script>
<script src="./decision-engine.js?v=3"></script>
<script src="./ai_float.js?v=3"></script>
</body>
</html>
