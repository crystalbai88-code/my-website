<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI 世界文明实验室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0a06; --ink:#f0e6d0; --ink2:#c8ab80; --ink3:#8a7055;
  --amber:#d4a435; --amber2:#f0c060; --warm:#e05c20;
  --dot-done:#f0c060; --dot-active:#ff8c30; --dot-locked:#3a2e1e;
  --era-land:#8b6914; --era-water:#1a3a5a; --era-sky:#0e0a06;
  --panel-bg:rgba(20,14,6,0.92);
  --serif:'Georgia','Noto Serif SC',serif;
  --sans:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}

/* ─── SCREENS ─── */
.screen{position:fixed;inset:0;transition:opacity .5s,transform .5s;will-change:opacity,transform}
.screen.hidden{opacity:0;pointer-events:none;transform:translateY(30px)}

/* ─── STARS ─── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}

/* ═══════════════════════════════════════════
   SCREEN 1 — TIMELINE
═══════════════════════════════════════════ */
#s-timeline{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;padding:0 40px;
}

/* Decorative horizontal glow line behind everything */
#s-timeline::before{
  content:'';position:absolute;
  top:50%;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,164,53,.08) 20%,rgba(212,164,53,.08) 80%,transparent);
  pointer-events:none;
}

.tl-header{text-align:center;margin-bottom:56px;position:relative;z-index:2;animation:fadeUpIn .8s .2s both}
.tl-header h1{
  font-family:var(--serif);font-size:clamp(28px,4.5vw,56px);font-weight:300;
  letter-spacing:.2em;color:var(--amber2);
  text-shadow:0 0 60px rgba(240,192,96,.45),0 0 120px rgba(240,192,96,.15);
  margin-bottom:12px;line-height:1.2;
}
.tl-header p{
  font-size:12px;color:var(--ink3);letter-spacing:.3em;text-transform:uppercase;
  opacity:.7;
}
.tl-subtitle{
  font-size:14px;color:var(--ink2);margin-top:8px;letter-spacing:.05em;
  opacity:.6;font-style:italic;
}

.tl-wrap{
  position:relative;width:92vw;max-width:1160px;
  padding:90px 20px 50px;z-index:2;
  animation:fadeUpIn .8s .5s both;
}

/* The line */
.tl-line{
  position:absolute;top:64px;left:20px;right:20px;height:3px;
  background:linear-gradient(90deg,transparent,rgba(58,46,30,.8) 8%,rgba(58,46,30,.8) 92%,transparent);
  border-radius:2px;
}
.tl-line-fill{
  position:absolute;top:0;left:0;height:100%;
  background:linear-gradient(90deg,var(--dot-done),var(--amber));
  transition:width 1.4s cubic-bezier(.4,0,.2,1);border-radius:2px;
  box-shadow:0 0 16px rgba(240,192,96,.6),0 0 40px rgba(240,192,96,.2);
}

/* Dots row */
.tl-dots{display:flex;justify-content:space-between;position:relative}
.tl-dot-wrap{
  display:flex;flex-direction:column;align-items:center;gap:0;
  cursor:pointer;flex:1;position:relative;
  transition:transform .2s;
}
.tl-dot-wrap:hover{transform:translateY(-4px)}

.tl-dot{
  width:22px;height:22px;border-radius:50%;
  background:var(--dot-locked);border:2px solid rgba(58,46,30,.9);
  transition:all .35s;position:relative;z-index:3;
  margin-top:53px;
  box-shadow:inset 0 0 6px rgba(0,0,0,.4);
}
.tl-dot.done{
  background:radial-gradient(circle at 40% 35%,#ffe090,var(--dot-done));
  border-color:var(--dot-done);
  box-shadow:0 0 18px rgba(240,192,96,.8),0 0 40px rgba(240,192,96,.3);
}
.tl-dot.active{
  background:radial-gradient(circle at 40% 35%,#ffb060,var(--dot-active));
  border-color:var(--dot-active);
  box-shadow:0 0 24px rgba(255,140,48,1),0 0 50px rgba(255,140,48,.4);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 20px rgba(255,140,48,.8),0 0 40px rgba(255,140,48,.3)}
  50%{box-shadow:0 0 35px rgba(255,140,48,1),0 0 70px rgba(255,140,48,.5)}
}

/* Vertical tick mark on line */
.tl-dot-wrap::after{
  content:'';position:absolute;top:62px;left:50%;transform:translateX(-50%);
  width:1px;height:8px;background:rgba(58,46,30,.6);z-index:2;
}

.tl-label-time{
  font-size:11px;font-weight:700;color:var(--amber);letter-spacing:.06em;
  margin-bottom:4px;text-align:center;opacity:.9;
  min-height:18px;
}
.tl-label-title{
  font-size:11px;color:var(--ink3);margin-top:12px;
  max-width:88px;text-align:center;line-height:1.5;
  transition:color .2s;
}
.tl-dot-wrap:hover .tl-label-title{color:var(--ink2)}
.tl-dot-wrap.active-lesson .tl-label-title{color:var(--amber2)}

/* The walking figure */
#tl-figure{
  position:absolute;top:0;z-index:10;
  transition:left 1.4s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  filter:drop-shadow(0 0 8px rgba(240,192,96,.6));
}
#tl-figure svg{width:36px;height:60px;overflow:visible}

/* Range label under the full timeline */
.tl-range{
  display:flex;justify-content:space-between;
  width:92vw;max-width:1160px;
  padding:0 20px;
  font-size:10px;color:rgba(138,112,85,.5);
  letter-spacing:.1em;text-transform:uppercase;
  margin-top:-12px;
}

/* Legend + hint */
.tl-hint{
  text-align:center;margin-top:36px;color:var(--ink3);font-size:12px;
  letter-spacing:.08em;animation:fadeUpIn 1s 1.2s both;
}
.tl-legend{display:flex;justify-content:center;gap:32px;margin-top:14px}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3)}
.leg-dot{width:11px;height:11px;border-radius:50%}

/* Semester label */
.tl-semester{
  position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  font-size:9px;color:rgba(212,164,53,.4);letter-spacing:.2em;text-transform:uppercase;
  white-space:nowrap;
}

@keyframes fadeUpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════
   SCREEN 2 — MAP
═══════════════════════════════════════════ */
#s-map{
  z-index:20;
  display:flex;flex-direction:column;
  transition:background .8s;
}

.map-topbar{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:rgba(0,0,0,.4);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;z-index:5;
}
.map-topbar .back-btn{
  background:none;border:1px solid var(--ink3);color:var(--ink2);
  padding:6px 14px;cursor:pointer;font-size:12px;letter-spacing:.08em;
  border-radius:2px;transition:all .2s;
}
.map-topbar .back-btn:hover{border-color:var(--amber);color:var(--amber)}
.map-time-chip{
  font-size:11px;padding:4px 12px;border-radius:20px;
  background:rgba(212,164,53,.15);border:1px solid rgba(212,164,53,.4);
  color:var(--amber);letter-spacing:.06em;font-weight:600;
}
.map-lesson-title{
  font-family:var(--serif);font-size:17px;font-weight:400;color:var(--ink);
}
.map-progress-hint{margin-left:auto;font-size:11px;color:var(--ink3)}

/* Map + panel layout */
.map-body{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden;position:relative}

/* SVG map area */
.map-area{position:relative;overflow:hidden;background:var(--era-water)}
#world-svg{width:100%;height:100%;display:block}

/* Civilization marker */
.civ-marker{cursor:pointer;transition:transform .2s}
.civ-marker:hover{transform:scale(1.15)}
.civ-marker .civ-glow{opacity:0;transition:opacity .3s}
.civ-marker.selected .civ-glow{opacity:1}
.civ-marker .civ-label{
  font-size:11px;fill:var(--ink);font-family:var(--sans);
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}

/* Side panel */
.map-panel{
  background:var(--panel-bg);border-left:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-civ-header{
  padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.panel-civ-era{font-size:10px;color:var(--amber);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.panel-civ-name{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--ink);margin-bottom:8px}
.panel-civ-desc{font-size:12px;color:var(--ink2);line-height:1.7}
.panel-civ-people{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.person-chip{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;background:rgba(212,164,53,.1);border:1px solid rgba(212,164,53,.2);
  border-radius:20px;font-size:11px;color:var(--ink2);
}
.person-chip .person-icon{font-size:15px}

.panel-events-title{
  padding:14px 22px 8px;font-size:10px;letter-spacing:.15em;color:var(--amber);
  text-transform:uppercase;flex-shrink:0;
}
.panel-events{flex:1;overflow-y:auto;padding:0 12px 16px;
  scrollbar-width:thin;scrollbar-color:rgba(212,164,53,.2) transparent;}
.event-card{
  padding:14px 14px;border-radius:4px;cursor:pointer;
  border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);
  margin-bottom:8px;transition:all .2s;position:relative;
}
.event-card:hover{background:rgba(212,164,53,.08);border-color:rgba(212,164,53,.3)}
.event-card.learned{border-left:3px solid var(--dot-done)}
.event-year{font-size:10px;color:var(--amber);letter-spacing:.08em;margin-bottom:4px}
.event-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px;line-height:1.4}
.event-brief{font-size:11px;color:var(--ink3);line-height:1.6}
.event-check{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:14px;opacity:0;transition:opacity .2s;
}
.event-card.learned .event-check{opacity:1;color:var(--dot-done)}

.panel-no-civ{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--ink3);padding:32px;text-align:center;
}
.panel-no-civ .arrow-icon{font-size:32px;opacity:.3;animation:arrowPulse 2s ease-in-out infinite}
@keyframes arrowPulse{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

.map-complete-btn{
  margin:16px;padding:12px;background:linear-gradient(135deg,var(--warm),var(--amber));
  border:none;border-radius:3px;color:#fff;font-size:13px;letter-spacing:.08em;
  cursor:pointer;transition:opacity .2s;display:none;font-family:var(--sans);
}
.map-complete-btn:hover{opacity:.85}
.map-complete-btn.visible{display:block}

/* ═══════════════════════════════════════════
   EVENT OVERLAY
═══════════════════════════════════════════ */
#event-overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(10,6,2,.75);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#event-overlay.open{opacity:1;pointer-events:all}
.event-modal{
  background:linear-gradient(135deg,#1a120a,#120d06);
  border:1px solid rgba(212,164,53,.25);border-radius:6px;
  max-width:600px;width:100%;max-height:80vh;overflow-y:auto;
  padding:36px;position:relative;
}
.event-modal-close{
  position:absolute;top:14px;right:14px;background:none;border:none;
  color:var(--ink3);cursor:pointer;font-size:20px;transition:color .2s;
}
.event-modal-close:hover{color:var(--amber)}
.event-modal-tag{font-size:10px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;margin-bottom:10px}
.event-modal h2{font-family:var(--serif);font-size:24px;font-weight:400;margin-bottom:6px;color:var(--ink)}
.event-modal-year{font-size:12px;color:var(--ink3);margin-bottom:20px}
.event-modal-body{font-size:14px;color:var(--ink2);line-height:2;margin-bottom:20px}
.event-modal-insight{
  background:rgba(212,164,53,.08);border-left:3px solid var(--amber);
  padding:14px 16px;border-radius:0 4px 4px 0;font-size:13px;color:var(--ink2);
  line-height:1.8;margin-bottom:24px;
}
.event-modal-insight strong{color:var(--amber);display:block;margin-bottom:4px;font-size:11px;letter-spacing:.1em}
.event-learn-btn{
  padding:12px 28px;background:var(--amber);border:none;color:#1a0e04;
  font-size:13px;letter-spacing:.08em;cursor:pointer;border-radius:2px;
  font-weight:700;transition:background .2s;font-family:var(--sans);
}
.event-learn-btn:hover{background:var(--amber2)}
.event-learn-btn.learned{background:var(--dot-done);cursor:default}

/* ═══════════════════════════════════════════
   SCREEN 3 — KNOWLEDGE CARD
═══════════════════════════════════════════ */
#s-summary{
  z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;
}
.summary-card{
  background:linear-gradient(135deg,#1e1408 0%,#0e0a06 60%);
  border:1px solid rgba(212,164,53,.3);border-radius:8px;
  max-width:680px;width:100%;max-height:90vh;overflow-y:auto;
  padding:48px;text-align:center;position:relative;
}
.summary-card::before{
  content:'';position:absolute;inset:0;border-radius:8px;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(212,164,53,.08) 0%,transparent 70%);
  pointer-events:none;
}
.summary-era-icon{font-size:64px;margin-bottom:20px}
.summary-tag{font-size:10px;color:var(--amber);letter-spacing:.25em;text-transform:uppercase;margin-bottom:14px}
.summary-title{font-family:var(--serif);font-size:clamp(24px,4vw,36px);font-weight:400;color:var(--ink);margin-bottom:16px;line-height:1.4}
.summary-quote{
  font-size:15px;color:var(--ink2);font-style:italic;line-height:2;
  margin-bottom:32px;padding:16px;
  border-top:1px solid rgba(212,164,53,.2);border-bottom:1px solid rgba(212,164,53,.2);
}
.summary-points{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;text-align:left}
.summary-point{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 16px;background:rgba(255,255,255,.03);border-radius:4px;
  border-left:3px solid var(--amber);
}
.summary-point-num{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;
  background:var(--amber);color:#1a0e04;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.summary-point p{font-size:13px;color:var(--ink2);line-height:1.7}
.summary-civs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:32px}
.summary-civ-tag{
  padding:6px 14px;border-radius:20px;font-size:12px;
  background:rgba(212,164,53,.1);border:1px solid rgba(212,164,53,.25);color:var(--amber);
}
.summary-actions{display:flex;gap:12px;justify-content:center}
.summary-btn-primary{
  padding:13px 32px;background:linear-gradient(135deg,var(--warm),var(--amber));
  border:none;color:#fff;font-size:13px;letter-spacing:.1em;cursor:pointer;
  border-radius:2px;font-weight:700;transition:opacity .2s;font-family:var(--sans);
}
.summary-btn-primary:hover{opacity:.85}
.summary-btn-secondary{
  padding:13px 24px;background:none;border:1px solid var(--ink3);
  color:var(--ink2);font-size:13px;letter-spacing:.08em;cursor:pointer;
  border-radius:2px;transition:all .2s;font-family:var(--sans);
}
.summary-btn-secondary:hover{border-color:var(--amber);color:var(--amber)}

/* ─── Responsive ─── */
@media(max-width:768px){
  .map-body{grid-template-columns:1fr}
  .map-panel{position:fixed;bottom:0;left:0;right:0;height:50vh;border-left:none;border-top:1px solid rgba(255,255,255,.06)}
}
</style>
</head>
<body>

<!-- STARS -->
<div id="stars"></div>

<!-- ══════════════════════════════════════
     SCREEN 1: TIMELINE
══════════════════════════════════════ -->
<div class="screen" id="s-timeline">
  <div class="tl-header">
    <h1>AI 世界文明实验室</h1>
    <p>Global Civilization · 公元前3000年 — 公元1000年</p>
    <div class="tl-subtitle">选择一个时间点，进入那个时代的文明世界</div>
  </div>

  <div class="tl-wrap" id="tlWrap">
    <div class="tl-semester">第一学期 · 文明诞生到公元1000年</div>
    <div class="tl-line"><div class="tl-line-fill" id="tlLineFill"></div></div>
    <div class="tl-dots" id="tlDots">
      <!-- rendered by JS -->
    </div>
    <!-- Walking figure -->
    <div id="tl-figure">
      <svg viewBox="-16 -52 32 52" xmlns="http://www.w3.org/2000/svg">
        <!-- Head glow -->
        <circle cx="0" cy="-44" r="10" fill="rgba(240,192,96,.15)"/>
        <!-- Head -->
        <circle cx="0" cy="-44" r="7" fill="#f0c060" stroke="none"/>
        <!-- Eye dots -->
        <circle cx="-2.5" cy="-45" r="1.2" fill="#1a0e04"/>
        <circle cx="2.5" cy="-45" r="1.2" fill="#1a0e04"/>
        <!-- Body -->
        <line x1="0" y1="-37" x2="0" y2="-18" stroke="#f0c060" stroke-width="3" stroke-linecap="round"/>
        <!-- Arms -->
        <line x1="0" y1="-32" x2="-10" y2="-24" stroke="#f0c060" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="-32" x2="10" y2="-24" stroke="#f0c060" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Legs -->
        <line x1="0" y1="-18" x2="-8" y2="-4" stroke="#f0c060" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="-18" x2="8" y2="-4" stroke="#f0c060" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Shadow -->
        <ellipse cx="0" cy="-2" rx="10" ry="3" fill="rgba(0,0,0,.3)"/>
      </svg>
    </div>
  </div>

  <div class="tl-hint">
    <p>点击任意时间点，进入那个时代的文明世界</p>
    <div class="tl-legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--dot-done)"></div>已探索</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--dot-active);box-shadow:0 0 8px rgba(255,140,48,.8)"></div>当前位置</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--dot-locked)"></div>待解锁</div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 2: MAP
══════════════════════════════════════ -->
<div class="screen hidden" id="s-map">
  <div class="map-topbar">
    <button class="back-btn" onclick="goBack()">← 时间轴</button>
    <div class="map-time-chip" id="mapTimeChip">公元前3000年</div>
    <div class="map-lesson-title" id="mapTitle">文明从哪里开始？</div>
    <div class="map-progress-hint" id="mapProgressHint">点击地图上的文明标记开始探索</div>
  </div>
  <div class="map-body">
    <div class="map-area">
      <svg id="world-svg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="civGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f0c060" stop-opacity=".6"/>
            <stop offset="100%" stop-color="#f0c060" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- Ocean -->
        <rect id="ocean" width="1000" height="520" fill="#1a3a5a"/>
        <!-- Continents group -->
        <g id="continents">
          <!-- North America -->
          <path id="north-america" fill="#7a6020"
            d="M 90,60 C 120,45 160,40 195,55 L 230,70 255,90 270,120 265,160 280,190 270,220 255,260 235,300 215,330 190,340 165,320 145,290 120,265 100,235 85,200 75,165 70,130 80,95 Z"/>
          <!-- Central America -->
          <path fill="#7a6020" d="M 215,330 L 230,340 225,360 210,370 200,355 205,340 Z"/>
          <!-- South America -->
          <path id="south-america" fill="#6a5518"
            d="M 205,370 C 225,365 255,370 270,390 L 285,420 285,460 270,490 245,505 220,500 200,475 190,445 195,415 200,390 Z"/>
          <!-- Europe -->
          <path id="europe" fill="#6b7840"
            d="M 445,75 C 465,65 495,68 515,80 L 525,95 530,115 515,135 500,148 475,150 460,138 445,120 440,100 Z"/>
          <!-- Iberian -->
          <path fill="#6b7840" d="M 440,120 L 450,130 445,148 430,150 425,135 430,122 Z"/>
          <!-- Britain -->

let state = {
  currentLesson: null,
  currentCiv: null,
  currentEvent: null,
  completed: JSON.parse(localStorage.getItem('civ_completed')||'[]'),
  learned: JSON.parse(localStorage.getItem('civ_learned')||'{}'),
};

function saveState(){
  localStorage.setItem('civ_completed', JSON.stringify(state.completed));
  localStorage.setItem('civ_learned', JSON.stringify(state.learned));
}

function createStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<120;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.cssText=`width:${Math.random()*2.5+.5}px;height:${Math.random()*2.5+.5}px;
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      --d:${Math.random()*4+2}s;animation-delay:${Math.random()*5}s;opacity:${Math.random()*.5+.1}`;
    c.appendChild(s);
  }
}

// ═══════════════════════════════════════════════════════
// TIMELINE
// ═══════════════════════════════════════════════════════
function renderTimeline(){
  const dotsEl = document.getElementById('tlDots');
  dotsEl.innerHTML = LESSONS.map((lesson,i) => {
    const done = state.completed.includes(lesson.id);
    const active = !done && (i===0 || state.completed.includes(LESSONS[i-1]?.id));
    const cls = done?'done':active?'active':'';
    const icon = done ? '✦' : active ? '◉' : '○';
    return `
      <div class="tl-dot-wrap ${active?'active-lesson':''}" onclick="enterLesson('${lesson.id}')" data-id="${lesson.id}">
        <div class="tl-label-time">${lesson.time}</div>
        <div class="tl-dot ${cls}" id="dot-${lesson.id}"></div>
        <div class="tl-label-title">${lesson.icon} ${lesson.title}</div>
      </div>`;
  }).join('');

  // Fill line — based on rightmost completed dot position
  const pct = state.completed.length / LESSONS.length * 100;
  document.getElementById('tlLineFill').style.width = Math.max(0,pct)+'%';

  // Position figure
  positionFigure();
}

function positionFigure(){
  const wrap = document.getElementById('tlWrap');
  const dots = document.querySelectorAll('.tl-dot-wrap');
  if(!dots.length) return;
  const fig = document.getElementById('tl-figure');
  // Find current active dot
  let idx = state.completed.length;
  if(idx >= dots.length) idx = dots.length-1;
  const dot = dots[idx];
  const wRect = wrap.getBoundingClientRect();
  const dRect = dot.getBoundingClientRect();
  const leftPx = dRect.left + dRect.width/2 - wRect.left - 16;
  fig.style.left = leftPx+'px';
}

// ═══════════════════════════════════════════════════════
// ENTER LESSON → MAP
// ═══════════════════════════════════════════════════════
function enterLesson(id){
  const lesson = LESSONS.find(l=>l.id===id);
  if(!lesson) return;
  state.currentLesson = lesson;
  state.currentCiv = null;

  // Update map header
  document.getElementById('mapTimeChip').textContent = lesson.time;
  document.getElementById('mapTitle').textContent = lesson.title;
  document.getElementById('mapProgressHint').textContent = '点击地图上的文明标记开始探索';

  // Apply era colors
  applyEraColors(id);

  // Render civ markers
  renderCivMarkers(lesson);

  // Reset panel
  showPanelNoCiv();

  // Switch screens
  showScreen('s-map');
}

function applyEraColors(id){
  const c = ERA_COLORS[id]||ERA_COLORS.L01;
  const root = document.documentElement;
  root.style.setProperty('--era-land', c.land);
  root.style.setProperty('--era-water', c.water);
  root.style.setProperty('--era-sky', c.sky);

  // Update continent fills with era land color
  document.querySelectorAll('#continents path').forEach(p=>{
    const base = hexToRgb(c.land);
    const variation = (Math.random()-.5)*.15;
    p.setAttribute('fill', adjustColor(c.land, variation));
  });
  document.getElementById('ocean').setAttribute('fill', c.water);
  document.getElementById('s-map').style.background = `linear-gradient(180deg, ${c.sky} 0%, ${adjustColor(c.sky,.05)} 100%)`;
}

function renderCivMarkers(lesson){
  const g = document.getElementById('civ-markers');
  g.innerHTML = '';
  lesson.civs.forEach(civ=>{
    const learned = (state.learned[lesson.id]||{})[civ.id];
    const learnedCount = lesson.civs.reduce((sum,c)=>sum+(state.learned[lesson.id]?.[c.id]?.length||0),0);
    const totalEvents = lesson.civs.reduce((sum,c)=>sum+c.events.length,0);

    const group = document.createElementNS('http://www.w3.org/2000/svg','g');
    group.classList.add('civ-marker');
    group.setAttribute('data-id',civ.id);
    group.setAttribute('transform',`translate(${civ.x},${civ.y})`);
    group.addEventListener('click',()=>selectCiv(civ.id));

    const glow = document.createElementNS('http://www.w3.org/2000/svg','circle');
    glow.classList.add('civ-glow');
    glow.setAttribute('r',civ.radius*2);
    glow.setAttribute('fill',`${civ.color}40`);
    glow.style.filter='url(#glow)';
    group.appendChild(glow);

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('r',civ.radius);
    circle.setAttribute('fill',civ.color+'cc');
    circle.setAttribute('stroke',civ.color);
    circle.setAttribute('stroke-width','2');
    group.appendChild(circle);

    // Person silhouette
    const personG = document.createElementNS('http://www.w3.org/2000/svg','g');
    const scale = civ.radius/22;
    personG.setAttribute('transform',`scale(${scale})`);
    personG.innerHTML = `
      <circle cx="0" cy="-10" r="5" fill="rgba(255,255,255,.85)"/>
      <line x1="0" y1="-5" x2="0" y2="4" stroke="rgba(255,255,255,.85)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-5" y1="-2" x2="5" y2="-2" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="4" x2="-4" y2="12" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="4" x2="4" y2="12" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round"/>`;
    group.appendChild(personG);

    // Label
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.classList.add('civ-label');
    text.setAttribute('text-anchor','middle');
    text.setAttribute('x','0');
    text.setAttribute('y', civ.radius+16);
    text.setAttribute('fill','#f0e6d0');
    text.setAttribute('font-size','12');
    text.setAttribute('font-family','PingFang SC,sans-serif');
    text.textContent = civ.name;
    group.appendChild(text);

    // Done badge if all events learned
    const civLearned = state.learned[lesson.id]?.[civ.id]||[];
    if(civLearned.length >= civ.events.length){
      const badge = document.createElementNS('http://www.w3.org/2000/svg','text');
      badge.setAttribute('x',civ.radius);badge.setAttribute('y',-civ.radius);
      badge.setAttribute('font-size','14');badge.textContent='✓';
      group.appendChild(badge);
    }

    g.appendChild(group);
  });
}

function selectCiv(civId){
  const lesson = state.currentLesson;
  const civ = lesson.civs.find(c=>c.id===civId);
  if(!civ) return;
  state.currentCiv = civ;

  // Highlight marker
  document.querySelectorAll('.civ-marker').forEach(m=>{
    m.classList.toggle('selected', m.dataset.id===civId);
  });

  // Fill panel
  document.getElementById('panelNoCiv').style.display='none';
  const content = document.getElementById('panelCivContent');
  content.style.display='flex';

  document.getElementById('panelEra').textContent = civ.era;
  document.getElementById('panelCivName').textContent = civ.name;
  document.getElementById('panelCivDesc').textContent = civ.desc;

  // People chips
  document.getElementById('panelPeople').innerHTML = (civ.people||[]).map(p=>
    `<div class="person-chip"><span class="person-icon">${p.icon}</span><span><strong>${p.label}</strong> · ${p.note}</span></div>`
  ).join('');

  // Events
  const learned = state.learned[lesson.id]?.[civ.id]||[];
  document.getElementById('panelEvents').innerHTML = civ.events.map(ev=>{
    const isLearned = learned.includes(ev.id);
    return `
      <div class="event-card ${isLearned?'learned':''}" onclick="openEvent('${ev.id}')">
        <div class="event-year">${ev.emoji} ${ev.year}</div>
        <div class="event-title">${ev.title}</div>
        <div class="event-brief">${ev.body.substring(0,60)}…</div>
        <div class="event-check">✓</div>
      </div>`;
  }).join('');

  checkCompleteButton();
}

function checkCompleteButton(){
  const lesson = state.currentLesson;
  const totalEvents = lesson.civs.reduce((s,c)=>s+c.events.length,0);
  const learnedEvents = lesson.civs.reduce((s,c)=>{
    return s+(state.learned[lesson.id]?.[c.id]||[]).length;
  },0);
  const btn = document.getElementById('mapCompleteBtn');
  if(learnedEvents >= Math.ceil(totalEvents*0.5)){
    btn.classList.add('visible');
  }
}

// ═══════════════════════════════════════════════════════
// EVENT OVERLAY
// ═══════════════════════════════════════════════════════
function openEvent(eventId){
  const lesson = state.currentLesson;
  const civ = state.currentCiv;
  const ev = civ.events.find(e=>e.id===eventId);
  if(!ev) return;
  state.currentEvent = ev;

  document.getElementById('evModalTag').textContent = civ.name+' · '+lesson.time;
  document.getElementById('evModalTitle').textContent = ev.emoji+' '+ev.title;
  document.getElementById('evModalYear').textContent = ev.year;
  document.getElementById('evModalBody').textContent = ev.body;
  document.getElementById('evModalInsight').textContent = ev.insight;

  const learned = (state.learned[lesson.id]?.[civ.id]||[]).includes(ev.id);
  const btn = document.getElementById('evLearnBtn');
  btn.textContent = learned ? '✓ 已学习' : '✓ 已学习，继续探索';
  btn.className = 'event-learn-btn'+(learned?' learned':'');

  document.getElementById('event-overlay').classList.add('open');
}

function closeEvent(){
  document.getElementById('event-overlay').classList.remove('open');
}

function markEventLearned(){
  const lesson = state.currentLesson;
  const civ = state.currentCiv;
  const ev = state.currentEvent;
  if(!lesson||!civ||!ev) return;

  if(!state.learned[lesson.id]) state.learned[lesson.id]={};
  if(!state.learned[lesson.id][civ.id]) state.learned[lesson.id][civ.id]=[];
  if(!state.learned[lesson.id][civ.id].includes(ev.id)){
    state.learned[lesson.id][civ.id].push(ev.id);
    saveState();
  }
  closeEvent();
  selectCiv(civ.id); // refresh panel
  renderCivMarkers(lesson); // refresh map markers
  checkCompleteButton();
}

// ═══════════════════════════════════════════════════════
// KNOWLEDGE CARD
// ═══════════════════════════════════════════════════════
function showSummary(){
  const lesson = state.currentLesson;
  const tk = lesson.takeaway;

  document.getElementById('sumIcon').textContent = lesson.icon;
  document.getElementById('sumTitle').textContent = tk.title;
  document.getElementById('sumQuote').textContent = '「'+tk.quote+'」';
  document.getElementById('sumPoints').innerHTML = tk.points.map((p,i)=>
    `<div class="summary-point">
      <div class="summary-point-num">${i+1}</div>
      <p>${p}</p>
    </div>`
  ).join('');
  document.getElementById('sumCivs').innerHTML = lesson.civs.map(c=>
    `<div class="summary-civ-tag" style="border-color:${c.color}60;color:${c.color}">${c.name}</div>`
  ).join('');

  showScreen('s-summary');
}

function completeLesson(){
  const lesson = state.currentLesson;
  if(!state.completed.includes(lesson.id)){
    state.completed.push(lesson.id);
    saveState();
  }
  showScreen('s-timeline');
  setTimeout(()=>{
    renderTimeline();
  },100);
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.toggle('hidden', s.id!==id);
  });
}

function goBack(){
  const map = document.getElementById('s-map');
  const sum = document.getElementById('s-summary');
  if(!sum.classList.contains('hidden')){
    showScreen('s-map');
  } else {
    showScreen('s-timeline');
  }
}

function showPanelNoCiv(){
  document.getElementById('panelNoCiv').style.display='flex';
  document.getElementById('panelCivContent').style.display='none';
  document.getElementById('mapCompleteBtn').classList.remove('visible');
}

// ═══════════════════════════════════════════════════════
// COLOR UTILS
// ═══════════════════════════════════════════════════════
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function adjustColor(hex, amt){
  const {r,g,b}=hexToRgb(hex);
  const adj=Math.round(amt*255);
  const clamp=v=>Math.max(0,Math.min(255,v));
  return `rgb(${clamp(r+adj)},${clamp(g+adj)},${clamp(b+adj)})`;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
createStars();
renderTimeline();

// Keyboard: ESC closes event overlay
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeEvent();
});
// Click outside event modal
document.getElementById('event-overlay').addEventListener('click',e=>{
  if(e.target===e.currentTarget) closeEvent();
});
// Resize: re-position figure
window.addEventListener('resize', ()=>{ if(state) positionFigure(); });
</script>
