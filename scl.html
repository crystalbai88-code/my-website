function spawnSubstance(id, x, y, vy = 0) {
  const s = SUBSTANCES[id];
  if (!s) return [];
  userStats.substancesPlaced = (userStats.substancesPlaced || 0) + 1;
  saveStats();
  checkAchievements();
  const created = [];
  // 空气阻力调小 —— 物体运动更顺滑、更接近真空中的轨迹
  const baseOpts = { label: id, restitution: 0.15, friction: 0.4, slop: 0.01, frictionAir: 0.002 };
  switch (s.model) {
    case "drop": case "gas": {
      const count = s.model === "gas" ? 4 : 8;
      const r = s.model === "gas" ? 4 : 6;
      for (let i = 0; i < count; i++) {
        const dx = (Math.random() - 0.5) * 18;
        const dy = (Math.random() - 0.5) * 8;
        const b = Bodies.circle(x + dx, y + dy, r, {
          ...baseOpts,
          density: s.model === "gas" ? 0.0001 : 0.0008,
          friction: 0,
          frictionAir: s.model === "gas" ? 0.015 : 0.005,
          restitution: 0.35, slop: 0.005,
          render: { visible: false }
        });
        b.substanceId = id; b.modelKind = s.model;
        b.waterColor = s.c;
        if (s.model === "gas") { b.isGas = true; }
        created.push(b);
      }
      break;
    }
    case "chunk": {
      const b = Bodies.rectangle(x, y, 22, 22, {
        ...baseOpts, density: 0.005, chamfer: { radius: 3 },
        render: { visible: false }
      });
      b.substanceId = id; b.modelKind = "chunk";
      b.shape = { w: 22, h: 22 };
      b.colors = { c: s.c, c2: s.c2 || s.c, c3: s.c3 || darken(s.c, 30) };
      created.push(b);
      break;
    }
    case "bar": {
      const b = Bodies.rectangle(x, y, 10, 32, {
        ...baseOpts, density: 0.008, chamfer: { radius: 2 },
        render: { visible: false }
      });
      b.substanceId = id; b.modelKind = "bar";
      b.shape = { w: 10, h: 32 };
      b.colors = { c: s.c, c2: s.c2 || s.c, c3: s.c3 || darken(s.c, 30) };
      created.push(b);
      break;
    }
    case "crystal": {
      const b = Bodies.polygon(x, y, 4, 13, {
        ...baseOpts, density: 0.004,
        render: { visible: false }
      });
      b.substanceId = id; b.modelKind = "crystal";
      b.shape = { r: 13 };
      b.colors = { c: s.c, c2: s.c2 || "#fff", c3: s.c3 || darken(s.c, 30) };
      created.push(b);
      break;
    }
    case "powder": {
      for (let i = 0; i < 6; i++) {  // 减少粉末粒子数
        const dx = (Math.random() - 0.5) * 22;
        const dy = (Math.random() - 0.5) * 10;
        const b = Bodies.circle(x + dx, y + dy, 3, {
          ...baseOpts, density: 0.002, friction: 0.7,
          render: { visible: false }
        });
        b.substanceId = id; b.modelKind = "powder";
        b.shape = { r: 3 };
        b.colors = { c: s.c, c2: s.c2 || s.c, c3: s.c3 || darken(s.c, 30) };
        created.push(b);
      }
      break;
    }
  }
  created.forEach(b => {
    Body.setVelocity(b, { x: (Math.random() - 0.5) * 1, y: vy });
    Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.1);
    Composite.add(world, b);
  });
  return created;
}

Events.on(engine, "beforeUpdate", () => {
  // 一次遍历完成：气体浮力 + 速度上限（同时也对器械生效）
  const maxV = 16;
  const bodies = Composite.allBodies(world);
  for (let i = 0, n = bodies.length; i < n; i++) {
    const b = bodies[i];
    if (b.isGas) {
      Body.applyForce(b, b.position, { x: 0, y: -b.mass * 0.0015 });
    }
    if (b.isSleeping) continue;
    if (!b.substanceId && b !== beakerBody && b !== lid && !b.instrumentType) continue;
    const vx = b.velocity.x, vy = b.velocity.y;
    if (Math.abs(vx) > maxV || Math.abs(vy) > maxV) {
      Body.setVelocity(b, {
        x: Math.max(-maxV, Math.min(maxV, vx)),
        y: Math.max(-maxV, Math.min(maxV, vy))
      });
    }
  }
});

function darken(hex, p) {
  if (hex.startsWith("#")) hex = hex.slice(1);
  if (hex.length === 3) hex = hex.split("").map(c => c+c).join("");
  let r = parseInt(hex.slice(0,2),16) - p;
  let g = parseInt(hex.slice(2,4),16) - p;
  let b = parseInt(hex.slice(4,6),16) - p;
  return `rgb(${Math.max(0,r)},${Math.max(0,g)},${Math.max(0,b)})`;
}

// 气体云雾贴图缓存：按颜色生成一张径向渐变贴图，多粒子用 drawImage 累加（'lighter' 混合）
// 比每帧 createRadialGradient 快很多，是大量气体粒子时的关键优化
const GAS_PUFF_SIZE = 64;
const gasPuffCache = new Map();
function getGasPuff(color) {
  let puff = gasPuffCache.get(color);
  if (puff) return puff;
  let h = (color || "#c8e0ff").trim();
  if (h.startsWith("#")) h = h.slice(1);
  if (h.length === 3) h = h.split("").map(c => c+c).join("");
  const r = parseInt(h.slice(0,2),16) || 200;
  const g = parseInt(h.slice(2,4),16) || 220;
  const b = parseInt(h.slice(4,6),16) || 240;
  puff = document.createElement("canvas");
  puff.width = GAS_PUFF_SIZE; puff.height = GAS_PUFF_SIZE;
  const pctx = puff.getContext("2d");
  const cx = GAS_PUFF_SIZE / 2;
  const grd = pctx.createRadialGradient(cx, cx, 0, cx, cx, cx);
  grd.addColorStop(0,    `rgba(${r},${g},${b},0.55)`);
  grd.addColorStop(0.35, `rgba(${r},${g},${b},0.28)`);
  grd.addColorStop(0.7,  `rgba(${r},${g},${b},0.08)`);
  grd.addColorStop(1,    `rgba(${r},${g},${b},0)`);
  pctx.fillStyle = grd;
  pctx.fillRect(0, 0, GAS_PUFF_SIZE, GAS_PUFF_SIZE);
  gasPuffCache.set(color, puff);
  return puff;
}
function lighten(hex, p) {
  // 支持 #rgb / #rrggbb / rgb(...)；返回 rgb(...)
  let r, g, b;
  if (hex.startsWith("rgb")) {
    const m = hex.match(/-?\d+/g);
    if (!m) return hex;
    r = +m[0]; g = +m[1]; b = +m[2];
  } else {
    let h = hex.startsWith("#") ? hex.slice(1) : hex;
    if (h.length === 3) h = h.split("").map(c => c+c).join("");
    r = parseInt(h.slice(0,2),16);
    g = parseInt(h.slice(2,4),16);
    b = parseInt(h.slice(4,6),16);
  }
  return `rgb(${Math.min(255,r+p)},${Math.min(255,g+p)},${Math.min(255,b+p)})`;
}

// ★ 在 canvas 上绘制已放置的物质（chunk/bar/crystal/powder），按 currentTexture 风格
// 设计意图：
//   "简单" = 纯平涂 + 描边，像教科书示意图，模式之间反差靠"无渐变"来体现
//   "写实" = 渐变 + 高光 + 暗角，质感明显
function drawSubstanceBody(ctx, b, realistic) {
  const { c, c2, c3 } = b.colors;
  if (b.modelKind === "chunk") {
    const w = b.shape.w, h = b.shape.h;
    if (realistic) {
      // 主色斜向渐变
      const g = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
      g.addColorStop(0, c2); g.addColorStop(0.45, c); g.addColorStop(1, c3);
      ctx.fillStyle = g;
      roundRect(ctx, -w/2, -h/2, w, h, 3); ctx.fill();
      // 高光斑
      const hl = ctx.createRadialGradient(-w*0.18, -h*0.28, 1, -w*0.18, -h*0.28, w*0.55);
      hl.addColorStop(0, "rgba(255,255,255,0.95)"); hl.addColorStop(0.4, "rgba(255,255,255,0.2)"); hl.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = hl;
      roundRect(ctx, -w/2, -h/2, w, h, 3); ctx.fill();
      // 暗角
      const sh = ctx.createRadialGradient(w*0.15, h*0.3, 1, w*0.15, h*0.3, w*0.6);
      sh.addColorStop(0, "rgba(0,0,0,0.5)"); sh.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = sh;
      roundRect(ctx, -w/2, -h/2, w, h, 3); ctx.fill();
      // 描边
      ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = 0.8;
      roundRect(ctx, -w/2, -h/2, w, h, 3); ctx.stroke();
    } else {
      // 简单：纯平涂 + 描边
      ctx.fillStyle = c;
      roundRect(ctx, -w/2, -h/2, w, h, 3); ctx.fill();
      ctx.strokeStyle = c3; ctx.lineWidth = 1.5;
      roundRect(ctx, -w/2, -h/2, w, h, 3); ctx.stroke();
    }
    return;
  }
  if (b.modelKind === "bar") {
    const w = b.shape.w, h = b.shape.h;
    if (realistic) {
      // 圆柱反光
      const g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
      g.addColorStop(0, c3); g.addColorStop(0.2, c); g.addColorStop(0.45, c2);
      g.addColorStop(0.55, c2); g.addColorStop(0.8, c); g.addColorStop(1, c3);
      ctx.fillStyle = g;
      roundRect(ctx, -w/2, -h/2, w, h, 2); ctx.fill();
      // 顶/底暗
      const g2 = ctx.createLinearGradient(0, -h/2, 0, h/2);
      g2.addColorStop(0, "rgba(0,0,0,0.5)"); g2.addColorStop(0.12, "rgba(0,0,0,0)");
      g2.addColorStop(0.88, "rgba(0,0,0,0)"); g2.addColorStop(1, "rgba(0,0,0,0.6)");
      ctx.fillStyle = g2;
      roundRect(ctx, -w/2, -h/2, w, h, 2); ctx.fill();
    } else {
      // 简单：纯平涂 + 描边
      ctx.fillStyle = c;
      roundRect(ctx, -w/2, -h/2, w, h, 2); ctx.fill();
      ctx.strokeStyle = c3; ctx.lineWidth = 1.5;
      roundRect(ctx, -w/2, -h/2, w, h, 2); ctx.stroke();
    }
    return;
  }
  if (b.modelKind === "crystal") {
    const r = b.shape.r;
    // 菱形（4 顶点正多边形，朝上）
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    if (realistic) {
      const g = ctx.createLinearGradient(-r, -r, r, r);
      g.addColorStop(0, "rgba(255,255,255,0.9)");
      g.addColorStop(0.25, c2);
      g.addColorStop(0.55, c);
      g.addColorStop(1, "rgba(0,0,0,0.45)");
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1; ctx.stroke();
      // 折射光斑
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath();
      ctx.ellipse(-r*0.25, -r*0.25, r*0.22, r*0.12, -0.5, 0, Math.PI*2);
      ctx.fill();
    } else {
      // 简单：纯平涂 + 描边
      ctx.fillStyle = c; ctx.fill();
      ctx.strokeStyle = c3; ctx.lineWidth = 1.5; ctx.stroke();
    }
    return;
  }
  if (b.modelKind === "powder") {
    const r = b.shape.r;
    if (realistic) {
      // 写实粉末：放大 1px 显示颗粒感，渐变 + 亮斑 + 暗点
      const R = r + 1;
      const g = ctx.createRadialGradient(-R*0.3, -R*0.3, 0, 0, 0, R);
      g.addColorStop(0, c2); g.addColorStop(0.55, c); g.addColorStop(1, c3);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.fill();
      // 亮斑
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.beginPath(); ctx.arc(-R*0.35, -R*0.35, R*0.32, 0, Math.PI*2); ctx.fill();
      // 暗点（颗粒阴影侧）
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath(); ctx.arc(R*0.3, R*0.3, R*0.22, 0, Math.PI*2); ctx.fill();
    } else {
      // 简单：纯色实心，无渐变
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    }
    return;
  }
}

function roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

let selectedId = null;
const ghost = document.getElementById("ghost");
function selectSubstance(id) {
  if (selectedId === id) { deselectSubstance(); return; }

  if (selectedInstrument) {
    selectedInstrument = null;

  ghost.innerHTML = "";
  ghost.appendChild(buildModelDOM(id));

  canvas.style.pointerEvents = "none";

    el.classList.toggle("selected", el.dataset.id === id);

           "在实验台任意位置点击 → 物质在鼠标位置生成。连续点放多次。再点同图标 / Esc 取消。", "");
}
function deselectSubstance() {
  selectedId = null;
  ghost.style.display = "none";
  canvas.style.pointerEvents = "auto";
  labEl.classList.remove("drop-target");
  document.querySelectorAll(".item").forEach(el => el.classList.remove("selected"));
}
document.addEventListener("pointermove", e => {
  if (!selectedId && !selectedInstrument && !nukeMode) return;
  ghost.style.left = e.clientX + "px";
  ghost.style.top  = e.clientY + "px";
  const rect = labEl.getBoundingClientRect();
  if (e.clientX >= rect.left && e.clientX <= rect.right &&
      e.clientY >= rect.top  && e.clientY <= rect.bottom) {
    labEl.classList.add("drop-target");
  } else {
    labEl.classList.remove("drop-target");
  }
});

// ★ 在鼠标位置生成物质 / 器械
let lastClickTime = 0;
labEl.addEventListener("click", e => {
  const rect = labEl.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right ||
      e.clientY < rect.top  || e.clientY > rect.bottom) return;
  const now = performance.now();
  if (now - lastClickTime < 80) return;
  lastClickTime = now;
  const baseX = Math.max(40, Math.min(W - 40, e.clientX - rect.left));
  const baseY = Math.max(40, Math.min(H - 60, e.clientY - rect.top));
  // ★ 核弹模式
  if (nukeMode) {
    dropNuke(baseX, baseY);
    return;
  }
  // 优先放置器械
  if (selectedInstrument) {
    spawnInstrument(selectedInstrument, baseX, baseY);
    audio.place();
    return;
  }
  if (!selectedId) return;
  const N = state.quantity;
  audio.place();
  for (let i = 0; i < N; i++) {
    setTimeout(() => {
      const spread = Math.min(60, 6 * N);
      const xx = baseX + (Math.random() - 0.5) * spread;
      const yy = baseY + (Math.random() - 0.5) * Math.min(30, 3 * N);
      spawnSubstance(selectedId, xx, yy, 0);
    }, i * 80);
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    deselectSubstance();
    deselectInstrument();
    if (eraserMode) toggleEraser();
    if (nukeMode) cancelNuke();
  }
});

// 提前加载用户资料，让成就/统计可以按账户分别存储
let userProfile = JSON.parse(localStorage.getItem("scl-user") || "null");
function isGuest()   { return !userProfile; }
function accountId() { return userProfile ? "u:" + userProfile.phone : "guest"; }
function achKey()    { return "scl-achievements:" + accountId(); }
function statsKey()  { return "scl-stats:" + accountId(); }

// 兼容历史数据：把旧的全局 key 迁移到 guest 命名空间
(function migrateLegacyAccountData() {
  const legacyAch = localStorage.getItem("scl-achievements");
  if (legacyAch && !localStorage.getItem("scl-achievements:guest")) {
    localStorage.setItem("scl-achievements:guest", legacyAch);
  }
  const legacyStats = localStorage.getItem("scl-stats");
  if (legacyStats && !localStorage.getItem("scl-stats:guest")) {
    localStorage.setItem("scl-stats:guest", legacyStats);
  }
})();

const STATS_DEFAULT = () => ({
  reactionsTotal: 0,
  reactionTypes: {},
  substancesPlaced: 0,
  instrumentsUsed: {},
});

let userAchievements = JSON.parse(localStorage.getItem(achKey()) || "{}");
let userStats = Object.assign(STATS_DEFAULT(), JSON.parse(localStorage.getItem(statsKey()) || "{}"));

function saveAchievements() {
  localStorage.setItem(achKey(), JSON.stringify(userAchievements));
}
function saveStats() {
  localStorage.setItem(statsKey(), JSON.stringify(userStats));
}

// 切换账户后重新加载成就/统计并刷新 UI
function reloadAccountData() {
  userAchievements = JSON.parse(localStorage.getItem(achKey()) || "{}");
  userStats = Object.assign(STATS_DEFAULT(), JSON.parse(localStorage.getItem(statsKey()) || "{}"));
  renderAchievements();
}

function unlockAchievement(id) {
  if (isGuest()) return; // 游客模式不解锁成就
  if (userAchievements[id]) return;
  userAchievements[id] = Date.now();
  saveAchievements();
  showAchievementToast(id);
  renderAchievements();
}

function showAchievementToast(id) {
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (!a) return;
  const name = currentLang === "en" && a.nameEn ? a.nameEn : a.name;
  const desc = currentLang === "en" && a.descEn ? a.descEn : a.desc;
  const toast = document.createElement("div");
  toast.className = "ach-toast";
  toast.innerHTML = `
    <div class="icon">${a.icon}</div>
    <div class="info">
      <div class="label">${t("ach_unlocked")}</div>
      <div class="name">${name}</div>
      <div class="desc">${desc}</div>
    </div>
  `;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 600);
  }, 3500);
}

function renderAchievements() {
  const grid = document.getElementById("achievementGrid");
  if (!grid) return;
  grid.innerHTML = "";
  // 游客模式：显示登录引导，不渲染成就网格
  if (isGuest()) {
    grid.classList.add("guest-locked");
    grid.innerHTML = `
      <div class="ach-guest">
        <div class="ach-guest-title">${t("ach_guest_lock")}</div>
        <div class="ach-guest-desc">${t("ach_guest_hint")}</div>
        <button class="ach-guest-btn" id="achGuestLogin">${t("ach_login_now")}</button>
      </div>
    `;
    const btn = document.getElementById("achGuestLogin");
    if (btn) btn.onclick = () => { if (typeof openLoginModal === "function") openLoginModal(); };
    const c = document.getElementById("achCount");
    if (c) c.textContent = `🔒 / ${ACHIEVEMENTS.length}`;
    return;
  }
  grid.classList.remove("guest-locked");
  let unlocked = 0;
  // 检测每行列数（响应式）
  const cols = window.matchMedia("(max-width: 600px)").matches ? 5 : 4;
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    const has = !!userAchievements[a.id];
    if (has) unlocked++;
    const item = document.createElement("div");
    const tipBelow = i < cols; // 第一行下方显示提示
    item.className = "ach-item" + (has ? " unlocked" : "") + (tipBelow ? " tip-below" : "");
    const name = currentLang === "en" && a.nameEn ? a.nameEn : a.name;
    const desc = currentLang === "en" && a.descEn ? a.descEn : a.desc;
    // 未解锁不展示提示词；已解锁才显示名字 + 描述
    const tipHTML = has
      ? `<div class="tip"><div class="name">${a.icon} ${name}</div>${desc}</div>`
      : "";
    item.innerHTML = `
      <div class="icon">${has ? a.icon : "🔒"}</div>
      <div class="label">${has ? name : "???"}</div>
      ${tipHTML}
    `;
    grid.appendChild(item);
  }
  const c = document.getElementById("achCount");
  if (c) c.textContent = `${unlocked} / ${ACHIEVEMENTS.length}`;
}

// 触发条件检查
function checkAchievements() {
  if (userStats.reactionsTotal >= 1)   unlockAchievement("first_react");
  if (userStats.reactionsTotal >= 10)  unlockAchievement("react_10");
  if (userStats.reactionsTotal >= 50)  unlockAchievement("react_50");
  if (userStats.reactionsTotal >= 100) unlockAchievement("react_100");
  if (userStats.substancesPlaced >= 1)   unlockAchievement("first_place");
  if (userStats.substancesPlaced >= 100) unlockAchievement("placed_100");
  if (Object.keys(userStats.reactionTypes).length >= 10) unlockAchievement("diverse_react");
  if (Object.keys(userStats.instrumentsUsed).length >= 4) unlockAchievement("all_instr");
}

const AVATARS = ["🐰","🐱","🐶","🦊","🐼","🐯","🦁","🐸","🐧","🦉","🐝","🐢","🦄","🐲","🦋","🌟","🚀","🍀","🎨","⚡","🔮","🌈","🍓","🍎","🍑","🍕","☕","🎵","🎮","🎯"];
function saveUser() {
  if (userProfile) localStorage.setItem("scl-user", JSON.stringify(userProfile));
  else localStorage.removeItem("scl-user");
}

function maskPhone(p) {
  if (!p || p.length !== 11) return p || "";
  return p.slice(0, 3) + "****" + p.slice(7);
}

function renderUserArea() {
  const ua = document.getElementById("userArea");
  ua.innerHTML = "";
  if (userProfile) {
    const d = document.createElement("div");
    d.className = "user-display";
    d.innerHTML = `<div class="avatar">${userProfile.avatar}</div><div class="name">${userProfile.username}</div>`;
    d.onclick = (e) => {
      e.stopPropagation();
      const panel = document.getElementById("profilePanel");
      const open = panel.classList.toggle("open");
      // 关闭设置面板（互斥）
      if (open) {
        document.getElementById("settingsPanel").classList.remove("open");
        document.getElementById("settingsBtn").classList.remove("open");
      }
    };
    ua.appendChild(d);
  } else {
    const b = document.createElement("button");
    b.className = "login-btn";
    b.textContent = t("login_btn");
    b.onclick = openLoginModal;
    ua.appendChild(b);
  }
}

function renderProfileInSettings() {
  // 没登录就关闭个人面板
  if (!userProfile) {
    document.getElementById("profilePanel").classList.remove("open");
    return;
  }
  const avEl = document.getElementById("profileAvatar");
  if (avEl) avEl.textContent = userProfile.avatar;
  // 头像网格
  const grid = document.getElementById("avatarGrid");
  grid.innerHTML = "";
  for (const av of AVATARS) {
    const b = document.createElement("button");
    b.className = "avatar-option" + (av === userProfile.avatar ? " active" : "");
    b.textContent = av;
    b.onclick = () => {
      userProfile.avatar = av;
      saveUser();
      renderUserArea();
      renderProfileInSettings();
      unlockAchievement("avatar_change");
    };
    grid.appendChild(b);
  }
  // 用户名输入
  const input = document.getElementById("usernameInput");
  input.value = userProfile.username;
  input.oninput = () => {
    userProfile.username = (input.value || "用户").slice(0, 12);
    saveUser();
    renderUserArea();
    const el = document.getElementById("profileName");
    if (el) el.textContent = userProfile.username;
  };
}

function openLoginModal() {
  document.getElementById("loginPhone").value = "";
  document.getElementById("loginTip").textContent = "";
  document.getElementById("loginModal").classList.add("show");
}
function closeLoginModal() {
  document.getElementById("loginModal").classList.remove("show");
}
document.getElementById("loginSkip").onclick = closeLoginModal;
document.getElementById("loginSubmit").onclick = () => {
  const phone = document.getElementById("loginPhone").value.trim();
  const tip   = document.getElementById("loginTip");
  if (!/^1\d{10}$/.test(phone)) {
    tip.textContent = t("tip_invalid_phone");
    return;
  }
  // 登录成功（无需验证码）
  userProfile = {
    phone: phone,
    username: (currentLang === "en" ? "User" : "用户") + phone.slice(-4),
    avatar: AVATARS[Math.floor(Math.random() * AVATARS.length)],
    createdAt: Date.now()
  };
  saveUser();
  reloadAccountData();
  renderUserArea();
  renderProfileInSettings();
  closeLoginModal();
  unlockAchievement("logged_in");
};
const loginAuthBtnEl = document.getElementById("loginAuthBtn");
if (loginAuthBtnEl) loginAuthBtnEl.onclick = openLoginModal;
document.getElementById("logoutBtn").onclick = () => {
  if (!confirm(currentLang === "en" ? "Log out of your account?" : "确认退出登录？")) return;
  userProfile = null;
  saveUser();
  reloadAccountData();
  renderUserArea();
  renderProfileInSettings();
};

let tutStep = 0;
function showTutorial() {
  tutStep = 0;
  document.getElementById("tutorial").classList.add("show");
  renderTutStep();
}
function closeTutorial() {
  document.getElementById("tutorial").classList.remove("show");
  localStorage.setItem("scl-tutorial-seen", "1");
  unlockAchievement("tutorial_done");
}
function renderTutStep() {
  const steps = TUT_STEPS[currentLang] || TUT_STEPS.zh;
  const cur = steps[tutStep];
  document.getElementById("tutIcon").textContent  = cur.icon;
  document.getElementById("tutTitle").textContent = cur.title;
  document.getElementById("tutDesc").textContent  = cur.desc;
  document.getElementById("tutStepNum").textContent = `${tutStep + 1} / ${steps.length}`;
  const dots = document.getElementById("tutDots");
  dots.innerHTML = "";
  for (let i = 0; i < steps.length; i++) {
    const d = document.createElement("span");
    d.className = "dot" + (i === tutStep ? " active" : "");
    dots.appendChild(d);
  }
  document.getElementById("tutNext").textContent =
    tutStep < steps.length - 1 ? t("tut_next") : t("tut_start");
  const actions = document.getElementById("tutActions");
  actions.classList.toggle("has-prev", tutStep > 0);
}
document.getElementById("tutSkip").onclick = closeTutorial;
document.getElementById("tutPrev").onclick = () => {
  if (tutStep > 0) { tutStep--; renderTutStep(); }
};
document.getElementById("tutNext").onclick = () => {
  const steps = TUT_STEPS[currentLang] || TUT_STEPS.zh;
  if (tutStep < steps.length - 1) { tutStep++; renderTutStep(); }
  else { closeTutorial(); }
};
document.getElementById("tutReplayBtn").onclick = () => {
  document.getElementById("settingsPanel").classList.remove("open");
  document.getElementById("settingsBtn").classList.remove("open");
  showTutorial();
};

function repairSite() {
  if (!ruinedMode) return;
  unlockAchievement("repair");
  ruinedMode = false;
  document.body.classList.remove("ruined");
  ["ruinedGlow", "ruinedOverlay", "ruinedAsh", "ruinedCracks"].forEach(id => {
    const el = document.getElementById(id);

function dropNuke(targetX, targetY) {
  unlockAchievement("nuke");
  // 让 ghost / 选中状态退出
  ghost.style.display = "none";
  canvas.style.pointerEvents = "auto";
  labEl.classList.remove("erase-mode");

  // 在实验台顶部生成下落的核弹
  const nuke = document.createElement("div");
  nuke.className = "falling-nuke";
  nuke.textContent = "☢️";
  nuke.style.left = targetX + "px";
  nuke.style.top  = "-80px";
  labEl.appendChild(nuke);

  const startY = -80, endY = targetY;
  const dur = 1100;
  const t0 = performance.now();
  function fall() {
    const t = (performance.now() - t0) / dur;
    if (t >= 1) {
      nuke.remove();
      explodeNuke(targetX, targetY);
      return;
    }
    nuke.style.top = (startY + (endY - startY) * t) + "px";
    const sc = 1 + t * 1.4;
    nuke.style.transform = `translateX(-50%) rotate(${t * 1080}deg) scale(${sc})`;
    requestAnimationFrame(fall);
  }
  requestAnimationFrame(fall);
}

function explodeNuke(x, y) {
  // 1. 屏幕白闪
  const flash = document.createElement("div");
  flash.className = "nuke-flash";
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1600);

  // 2. 冲击波环（多层）
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const shock = document.createElement("div");
      shock.className = "nuke-shockwave";
      shock.style.left = x + "px";
      shock.style.top  = y + "px";
      labEl.appendChild(shock);
      setTimeout(() => shock.remove(), 1700);
    }, i * 150);
  }
  // 3. 火球
  const fire = document.createElement("div");
  fire.className = "nuke-fireball";
  fire.style.left = x + "px";
  fire.style.top  = y + "px";
  labEl.appendChild(fire);
  setTimeout(() => fire.remove(), 2100);
  // 4. 蘑菇云（纯 CSS，不用 emoji）
  setTimeout(() => {
    const mush = document.createElement("div");
    mush.className = "nuke-mushroom";
    mush.style.left = (x - 180) + "px";  // 居中（容器宽 360）
    mush.style.top  = (y - 480) + "px";  // 容器高 480，底部对齐爆心
    labEl.appendChild(mush);
    setTimeout(() => mush.remove(), 4100);
  }, 350);

  // 5. 屏幕震动
  document.body.classList.add("shake-screen");
  setTimeout(() => document.body.classList.remove("shake-screen"), 1200);

  // 6. 物理冲击 —— 给所有物体施加远离爆心的爆炸力
  for (const b of Composite.allBodies(world)) {
    if (b.isStatic) continue;  // 静态边界不动
    const dx = b.position.x - x;
    const dy = b.position.y - y - 40;  // 略向上偏
    const dist = Math.max(30, Math.hypot(dx, dy));
    const power = 0.08 + Math.random() * 0.05;
    const fx = (dx / dist) * power * b.mass * Math.min(1, 400 / dist);
    const fy = (dy / dist) * power * b.mass * Math.min(1, 400 / dist) - 0.04 * b.mass;
    Body.applyForce(b, b.position, { x: fx, y: fy });
    // 给一点旋转
    Body.setAngularVelocity(b, b.angularVelocity + (Math.random() - 0.5) * 0.5);
  }

  // 7. 1.5 秒后炸毁所有物质（保留烧杯/盖子/器械作为残骸）
  setTimeout(() => {
    for (const b of Composite.allBodies(world).slice()) {
      if (b.substanceId) Composite.remove(world, b);
    }
  }, 1500);

  // ★ 8. 整个网站进入废墟态（强光 + 焦黑 + 裂纹 + 烟尘）
  setTimeout(() => enterRuinedMode(), 800);

  // 9. 重置兔子图标（但兔子要保留 5 次修复机制）
  bunnyBtn.classList.remove("armed");
  bunnyBtn.textContent = "🐰";
  nukeMode = false;
}

function eraseAt(clientX, clientY) {
  const rect = labEl.getBoundingClientRect();
  if (clientX < rect.left || clientX > rect.right ||
      clientY < rect.top  || clientY > rect.bottom) return;
  const x = clientX - rect.left, y = clientY - rect.top;
  const hit = Query.point(Composite.allBodies(world), { x, y });
  for (const b of hit) {
    // 烧杯（包括 parts）和盖子不能擦
    if (b === beakerBody || (b.parent && b.parent === beakerBody) || b === lid) continue;
    if (b.substanceId || b.instrumentType) {
      Composite.remove(world, b);
      // 擦除后清理引用
      if (b.instrumentType) renderInstStatus();
    }
  }
}

function hideTooltip() {

function placeTooltipAt(clientX, clientY) {

labEl.addEventListener("pointermove", e => {

labEl.addEventListener("pointerleave", hideTooltip);
labEl.addEventListener("pointerdown",  hideTooltip);  // 开始拖动时立刻隐藏

let reactionTick = 0;
// ★ 防止同一规则连续触发导致产物堆积
const ruleCooldowns = new WeakMap();
const RULE_COOLDOWN_MS = 1500;
// ★ 全局反应检测：实验台上任何位置的物质都参与反应（杯子内外都行）
function getBeakerContents() {
  const result = {};
  for (const b of Composite.allBodies(world)) {
    if (!b.substanceId) continue;
    if (!result[b.substanceId]) result[b.substanceId] = { count: 0, bodies: [] };
    result[b.substanceId].count++;
    result[b.substanceId].bodies.push(b);
  }
  return result;
}
function isMultiBodyId(id) {
  const s = SUBSTANCES[id];
  return s && (s.model === "drop" || s.model === "gas" || s.model === "powder");
}
// ★ 反应必须发生在反应物相互靠近的"反应区"
const REACTION_RADIUS = 150;  // 放宽到 150px，覆盖整个烧杯内部范围
const REACTION_R2     = REACTION_RADIUS * REACTION_RADIUS;

// 反应进度跟踪 —— 反应不是瞬时的：到位置后等够时间 / 摇晃够才发生
const ruleProgress = new Map();  // rule -> { startedAt, shakeAccum, lastTickAt }

// 摇晃指数 — 只看烧杯本身的速度，物质自己掉落/反弹不算
let globalShake = 0;
function updateGlobalShake() {
  // 烧杯运动速度（鼠标拖动时才有显著值）
  const v = Math.hypot(beakerBody.velocity.x, beakerBody.velocity.y);
  // 角速度也算（旋转摇晃）
  const w = Math.abs(beakerBody.angularVelocity) * 30;
  const cur = v + w;
  globalShake = globalShake * 0.8 + cur * 0.2;
}

// 颜色插值 —— 反应过程中液体颜色一点点变化
function hexToRgb(h) {
  if (h.startsWith("#")) h = h.slice(1);
  if (h.length === 3) h = h.split("").map(c => c+c).join("");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHex(r, g, b) {
  const h = x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, "0");
  return "#" + h(r) + h(g) + h(b);
}
function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return rgbToHex(a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t);
}

// 给每条规则分配一个稳定 key，标记到参与过的粒子上避免重复反应
function getRuleKey(rule) {
  if (!rule._key) rule._key = "r" + REACTIONS.indexOf(rule);
  return rule._key;
}

// 找一个能让 rule 触发的"反应位点" — 选第一个反应物的某个粒子作为锚点，
// 看其它反应物是否都有粒子在锚点的 REACTION_RADIUS 范围内
function findReactionSite(rule) {
  const ruleKey = getRuleKey(rule);
  const candidates = {};
  for (const id of rule.needs) candidates[id] = [];
  for (const b of Composite.allBodies(world)) {
    if (b.substanceId && rule.needs.includes(b.substanceId)) {
      // 已经参与过这条规则的粒子不再算入（防止重复反应）
      if (b._reactedRules && b._reactedRules[ruleKey]) continue;
      candidates[b.substanceId].push(b);
    }
  }
  for (const id of rule.needs) if (candidates[id].length === 0) return null;
  const firstId = rule.needs[0];
  for (const anchor of candidates[firstId]) {
    const grouped = { [firstId]: [anchor] };
    let allOk = true;
    for (let i = 1; i < rule.needs.length; i++) {
      const id = rule.needs[i];
      const near = [];
      for (const b of candidates[id]) {
        const dx = b.position.x - anchor.position.x;
        const dy = b.position.y - anchor.position.y;
        if (dx*dx + dy*dy <= REACTION_R2) near.push(b);
      }
      if (near.length === 0) { allOk = false; break; }
      grouped[id] = near;
    }
    if (!allOk) continue;
    // 只要每种反应物附近至少有 1 个粒子就算够了（多体粒子被打散后也能反应）
    return { grouped, anchor };
  }
  return null;
}

function checkReactions() {
  const contents = getBeakerContents();
  updateContentsUI(contents);
  updateGlobalShake();
  const now = performance.now();
  let reportedPrep = null;
  for (const rule of REACTIONS) {
    const until = ruleCooldowns.get(rule) || 0;
    if (until > now) { ruleProgress.delete(rule); continue; }
    if (rule.requires) {
      const placed = getPlacedInstruments();
      if (!rule.requires.every(r => placed.has(r))) { ruleProgress.delete(rule); continue; }
    }
    const site = findReactionSite(rule);
    if (!site) { ruleProgress.delete(rule); continue; }

    // 反应需要时间 / 摇晃
    const rawPrepTime = rule.prepTime || 0;
    // ★ 所有带 recolor 的反应都至少有 1.5 秒颜色过渡，保证慢慢变色
    const prepTime    = rule.yields.recolor ? Math.max(rawPrepTime, 1500) : rawPrepTime;
    const needsShake  = rule.needsShake || false;
    const shakeReq    = rule.shakeReq   || 2.5;

    let prog = ruleProgress.get(rule);
    if (!prog) {
      prog = { startedAt: now, shakeAccum: 0, lastTickAt: now };
      ruleProgress.set(rule, prog);
    }
    // 摇晃累积：指数快速衰减 + 当前摇晃贡献（不摇就明显下降）
    const dt = now - prog.lastTickAt;
    prog.lastTickAt = now;
    prog.shakeAccum = prog.shakeAccum * Math.exp(-dt / 350) + globalShake * dt / 250;
    if (prog.shakeAccum > shakeReq * 1.5) prog.shakeAccum = shakeReq * 1.5;

    const elapsed = now - prog.startedAt;
    // 时间和摇晃分别算进度，两者乘积才是总进度
    const timeProgress  = prepTime > 0 ? Math.min(1, elapsed / prepTime) : 1;
    const shakeProgress = needsShake ? Math.min(1, prog.shakeAccum / shakeReq) : 1;
    const totalProgress = timeProgress * shakeProgress;

    // ★ 渐变染色 —— 只要有 recolor 就总是渐变（不再要求 prepTime 或 needsShake）
    if (rule.yields.recolor) {
      for (const id of rule.needs) {
        if (SUBSTANCES[id] && SUBSTANCES[id].model === "drop") {
          for (const b of site.grouped[id]) {
            if (!b._origColor) b._origColor = b.waterColor;
            b.waterColor = lerpColor(b._origColor, rule.yields.recolor, totalProgress);
          }
        }
      }
    }

    if (totalProgress >= 0.99) {
      triggerReactionAt(rule, site);
      ruleCooldowns.set(rule, now + RULE_COOLDOWN_MS);
      ruleProgress.delete(rule);
      return;
    }
    // 反应"正在酝酿" —— 留作最早的那条规则汇报
    if (!reportedPrep) {
      reportedPrep = { rule, timeProgress, shakeProgress, totalProgress, needsShake };
    }
  }

  if (reportedPrep) showPrepHint(reportedPrep);
}

function showPrepHint(p) {
  const y = p.rule.yields;
  const parts = [`即将发生：${y.title}`];
  parts.push(`时间 ${Math.round(p.timeProgress*100)}%`);
  if (p.needsShake) parts.push(`摇晃 ${Math.round(p.shakeProgress*100)}%`);
  parts.push(`总进度 ${Math.round(p.totalProgress*100)}%`);
  document.getElementById("info").innerHTML = `
    <div class="title">⏳ 反应进行中…</div>
    <div class="desc">${parts.join("　·　")}</div>
    <div class="equation">${y.eq}</div>
  `;
}

function triggerReactionAt(rule, site) {
  const y = rule.yields;
  showInfo(y.title, y.desc, y.eq);
  // 成就埋点
  userStats.reactionsTotal++;
  userStats.reactionTypes[getRuleKey(rule)] = true;
  saveStats();
  checkAchievements();
  if (rule.needsShake) unlockAchievement("shake_done");
  if (y.recolor) unlockAchievement("color_change");
  const fx = (y.fx || []).join(",");
  if (fx.includes("flame")) unlockAchievement("combustion");
  if (fx.includes("spark") && fx.includes("flame") && fx.includes("smoke")) unlockAchievement("explosion");
  if (y.add && y.add.some(id => /^(AgCl|AgI|AgBr|BaSO4|CuOH2|FeOH3|MgOH2|AlOH3|CaCO3)$/.test(id))) {
    unlockAchievement("precipitate");
  }
  // 反应中心 = 所有参与粒子的平均位置
  let cx = 0, cy = 0, cnt = 0;
  for (const id of rule.needs) {
    for (const b of site.grouped[id]) { cx += b.position.x; cy += b.position.y; cnt++; }
  }
  const pos = { x: cx / cnt, y: cy / cnt };
  (y.fx || []).forEach(fx => playEffect(fx, pos));
  if (y.recolor) {
    for (const id of Object.keys(site.grouped)) {
      if (SUBSTANCES[id].model === "drop") {
        for (const b of site.grouped[id]) b.waterColor = y.recolor;
      }
    }
  }
  if (y.remove) {
    for (const id of y.remove) {
      const list = site.grouped[id];
      if (!list) continue;
      // 多体物质（液/气/粉）每次反应消耗 8 个粒子
      const rmCount = isMultiBodyId(id) ? Math.min(8, list.length) : 1;
      for (let i = 0; i < rmCount && i < list.length; i++) {
        Composite.remove(world, list[i]);
      }
    }
  }
  if (y.add) {
    for (const id of y.add) {
      spawnSubstance(id, pos.x + (Math.random()-0.5)*30, pos.y - 15, 0);
    }
  }
  // ★ 只对"零消耗"反应（纯染色 / 纯催化）标记，防止反复无意义触发
  //   消耗型反应（有 remove）的残留物质应当能与新加入的反应物再次反应
  const noConsume = !y.remove || y.remove.length === 0;
  if (noConsume) {
    const ruleKey = getRuleKey(rule);
    for (const id of rule.needs) {
      if (!site.grouped[id]) continue;
      for (const b of site.grouped[id]) {
        if (!b._reactedRules) b._reactedRules = {};
        b._reactedRules[ruleKey] = true;
      }
    }
  }
}
Events.on(engine, "afterUpdate", () => {
  if (lidLocked) syncLidToBeaker();
  for (const b of Composite.allBodies(world).slice()) {
    if (b.substanceId && (b.position.y > H + 100 || b.position.x < -100 || b.position.x > W + 100)) {
      Composite.remove(world, b);
    }
  }
  reactionTick++;
  if (reactionTick > 30 * SUBSTEPS) { reactionTick = 0; checkReactions(); }
});

Events.on(render, "afterRender", () => {
  wctx.clearRect(0, 0, W, H);
  gctx.clearRect(0, 0, W, H);
  const realistic = currentTexture === "realistic";
  // 单次取 allBodies，本回调内的多个循环共用 —— 避免重复构建大数组
  const allBodies = Composite.allBodies(world);

  // 拆分 drop / gas 桶，分别采用不同的渲染策略
  const dropBuckets = {};
  const gasBuckets = {};
  for (let i = 0, n = allBodies.length; i < n; i++) {
    const b = allBodies[i];
    if (b.modelKind === "drop") {
      const c = b.waterColor || "#4fc3f7";
      (dropBuckets[c] || (dropBuckets[c] = [])).push(b);
    } else if (b.modelKind === "gas") {
      const c = b.waterColor || "#c8e0ff";
      (gasBuckets[c] || (gasBuckets[c] = [])).push(b);
    }
  }
  // 液体：waterCanvas 上实心圆叠加（goo 滤镜帮它形成 metaball）
  for (const color in dropBuckets) {
    const bodies = dropBuckets[color];
    wctx.fillStyle = color;
    for (let i = 0, n = bodies.length; i < n; i++) {
      const b = bodies[i];
      wctx.beginPath();
      wctx.arc(b.position.x, b.position.y, 10, 0, Math.PI * 2);
      wctx.fill();
    }
  }
  // 气体：gasCanvas 上画云雾贴图，普通 source-over 叠加
  // —— 不用 'lighter'，避免气体浓度累加透过半透明烧杯壁造成"烧杯一会浓一会淡"的错觉
  const puffDrawSize = 42;
  const half = puffDrawSize / 2;
  for (const color in gasBuckets) {
    const puff = getGasPuff(color);
    const bodies = gasBuckets[color];
    for (let i = 0, n = bodies.length; i < n; i++) {
      const b = bodies[i];
      gctx.drawImage(puff, b.position.x - half, b.position.y - half, puffDrawSize, puffDrawSize);
    }
  }

  const ctx = render.context;

  // ★ 自绘 chunk / bar / crystal / powder — 跟 currentTexture 走（用缓存 allBodies）
  for (let i = 0, n = allBodies.length; i < n; i++) {
    const b = allBodies[i];
    if (!b.modelKind || !b.colors) continue;
    if (b.modelKind === "drop" || b.modelKind === "gas") continue;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    drawSubstanceBody(ctx, b, realistic);
    ctx.restore();
  }

  const geoCx = (bLeft.position.x + bRight.position.x) / 2;
  const geoCy = (bLeft.position.y + bRight.position.y) / 2;
  ctx.save();
  ctx.translate(geoCx, geoCy);
  ctx.rotate(beakerBody.angle);
  ctx.fillStyle = "rgba(207, 234, 255, 0.7)";
  ctx.strokeStyle = "#dff0ff";
  ctx.lineWidth = 1.5;
  const lipY = -beakerH / 2;
  ctx.fillRect(-beakerW/2 - 8, lipY - 4, 18, 8);
  ctx.strokeRect(-beakerW/2 - 8, lipY - 4, 18, 8);
  ctx.fillRect(beakerW/2 - 10, lipY - 4, 18, 8);
  ctx.strokeRect(beakerW/2 - 10, lipY - 4, 18, 8);
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 1;
  for (let i = 1; i <= 5; i++) {
    const yy = -beakerH/2 + 30 + i * 35;
    ctx.beginPath();
    ctx.moveTo(-beakerW/2 + wallThick + 4, yy);
    ctx.lineTo(-beakerW/2 + wallThick + 14, yy);
    ctx.stroke();
  }
  ctx.restore();

  // 画已放置的器械（跟随刚体旋转）
  const tNow = performance.now();
  for (let i = 0, n = allBodies.length; i < n; i++) {
    const b = allBodies[i];
    if (!b.instrumentType) continue;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    if (b.instrumentType === "heat")  drawAlcoholLamp(ctx, 0, 0, tNow);
    if (b.instrumentType === "power") drawPowerSupply(ctx, 0, 0, tNow);
    if (b.instrumentType === "uv")    drawUVLamp(ctx, 0, 0, tNow);
    if (b.instrumentType === "cool")  drawIceBath(ctx, 0, 0, tNow);
    ctx.restore();
  }

  if (lidLocked) {
    ctx.save();
    ctx.translate(lid.position.x, lid.position.y);
    ctx.rotate(lid.angle);
    const handleW = LID_HANDLE_HALF * 2;
    const handleH = 8;
    ctx.fillStyle = "rgba(255, 216, 107, 0.95)";
    ctx.strokeStyle = "#ffb800";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-handleW/2, -lidH/2 - handleH, handleW, handleH, 3);
    else ctx.rect(-handleW/2, -lidH/2 - handleH, handleW, handleH);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#8b5a00";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🔒", 0, -lidH/2 - handleH/2);
    ctx.restore();
  }
});

//=========================================================
// 器械绘制 — 真实玻璃 / 金属质感（同烧杯材质）
//=========================================================
const GLASS_FILL   = "rgba(200,230,255,0.55)";
const GLASS_STROKE = "#cfeaff";
const GLASS_HIGHL  = "rgba(255,255,255,0.5)";

// 酒精灯：玻璃瓶 + 金属灯颈 + 灯芯 + 顶部跳动火焰
function drawAlcoholLamp(ctx, x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  const W = 76, H = 92;
  // 桌面阴影
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(0, H/2 + 4, W/2 - 6, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // —— 玻璃瓶身（与烧杯同样的半透明蓝玻璃） ——
  const bottleTop = -H/2 + 30;
  const bottleBot = H/2 - 2;
  const bottleW = 60;
  ctx.fillStyle = GLASS_FILL;
  ctx.strokeStyle = GLASS_STROKE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-bottleW/2,   bottleTop + 12);
  ctx.quadraticCurveTo(-bottleW/2 - 4, bottleTop + 6, -bottleW/2 + 4, bottleTop);
  ctx.lineTo(bottleW/2 - 4, bottleTop);
  ctx.quadraticCurveTo(bottleW/2 + 4, bottleTop + 6, bottleW/2, bottleTop + 12);
  ctx.lineTo(bottleW/2, bottleBot - 8);
  ctx.quadraticCurveTo(bottleW/2, bottleBot, bottleW/2 - 8, bottleBot);
  ctx.lineTo(-bottleW/2 + 8, bottleBot);
  ctx.quadraticCurveTo(-bottleW/2, bottleBot, -bottleW/2, bottleBot - 8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 内部酒精液面（半透明蓝色填到瓶身中下部）
  const liqTop = bottleTop + 16;
  ctx.fillStyle = "rgba(120, 180, 220, 0.35)";
  ctx.beginPath();
  ctx.moveTo(-bottleW/2 + 3, liqTop);
  ctx.lineTo(bottleW/2 - 3, liqTop);
  ctx.lineTo(bottleW/2 - 3, bottleBot - 6);
  ctx.quadraticCurveTo(bottleW/2 - 3, bottleBot - 3, bottleW/2 - 9, bottleBot - 3);
  ctx.lineTo(-bottleW/2 + 9, bottleBot - 3);
  ctx.quadraticCurveTo(-bottleW/2 + 3, bottleBot - 3, -bottleW/2 + 3, bottleBot - 6);
  ctx.closePath();
  ctx.fill();
  // 液面线
  ctx.strokeStyle = "rgba(180, 220, 240, 0.7)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-bottleW/2 + 5, liqTop);
  ctx.lineTo(bottleW/2 - 5, liqTop);
  ctx.stroke();
  // 高光（左侧）
  ctx.strokeStyle = GLASS_HIGHL;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-bottleW/2 + 8, bottleTop + 16);
  ctx.lineTo(-bottleW/2 + 8, bottleBot - 14);
  ctx.stroke();

  // —— 金属灯颈（带渐变） ——
  const neckW = 22, neckH = 14;
  const neckGrad = ctx.createLinearGradient(-neckW/2, 0, neckW/2, 0);
  neckGrad.addColorStop(0,    "#555");
  neckGrad.addColorStop(0.45, "#cfd3da");
  neckGrad.addColorStop(0.55, "#e8ebef");
  neckGrad.addColorStop(1,    "#555");
  ctx.fillStyle = neckGrad;
  ctx.strokeStyle = "#3a3a3a";
  ctx.lineWidth = 1;
  ctx.fillRect(-neckW/2, bottleTop - neckH, neckW, neckH);
  ctx.strokeRect(-neckW/2, bottleTop - neckH, neckW, neckH);
  // 灯颈上的螺纹
  ctx.strokeStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.moveTo(-neckW/2 + 2, bottleTop - neckH + 4);
  ctx.lineTo(neckW/2 - 2,  bottleTop - neckH + 4);
  ctx.moveTo(-neckW/2 + 2, bottleTop - neckH + 8);
  ctx.lineTo(neckW/2 - 2,  bottleTop - neckH + 8);
  ctx.stroke();
  // 灯芯
  const wickTop = bottleTop - neckH - 9;
  ctx.fillStyle = "#2a1a08";
  ctx.fillRect(-2.5, wickTop, 5, 9);
  ctx.fillStyle = "#5a3018";
  ctx.fillRect(-2.5, wickTop, 5, 3);

  // —— 火焰 ——（基于灯芯顶端跳动）
  ctx.translate(0, wickTop);
  const flicker = 0.92 + 0.08 * Math.sin(t / 80) + 0.04 * Math.sin(t / 53);
  const swayX = Math.sin(t / 110) * 1.2;
  ctx.translate(swayX, 0);
  ctx.scale(1, flicker);
  // 外焰
  const flameH = 38;
  const flameOuter = ctx.createRadialGradient(0, -flameH * 0.4, 2, 0, -flameH * 0.25, flameH * 0.8);
  flameOuter.addColorStop(0,    "#fff8d8");
  flameOuter.addColorStop(0.25, "#ffe282");
  flameOuter.addColorStop(0.55, "#ffae00");
  flameOuter.addColorStop(0.85, "#ff4500");
  flameOuter.addColorStop(1,    "rgba(255, 60, 0, 0)");
  ctx.fillStyle = flameOuter;
  ctx.beginPath();
  ctx.moveTo(-11, 4);
  ctx.quadraticCurveTo(-14, -flameH * 0.4, 0, -flameH);
  ctx.quadraticCurveTo(14, -flameH * 0.4, 11, 4);
  ctx.closePath();
  ctx.fill();
  // 内焰（蓝色焰心）
  ctx.fillStyle = "rgba(90, 150, 255, 0.65)";
  ctx.beginPath();
  ctx.moveTo(-4, 2);
  ctx.quadraticCurveTo(-5, -8, 0, -flameH * 0.5);
  ctx.quadraticCurveTo(5, -8, 4, 2);
  ctx.closePath();
  ctx.fill();
  // 最内的白心
  ctx.fillStyle = "rgba(255, 250, 200, 0.85)";
  ctx.beginPath();
  ctx.moveTo(-1.5, 0);
  ctx.quadraticCurveTo(-1.5, -5, 0, -flameH * 0.3);
  ctx.quadraticCurveTo(1.5, -5, 1.5, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// 电源：金属/玻璃面板 + LCD + 接线柱 + 电极弧
function drawPowerSupply(ctx, x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  const W = 120, H = 80;
  // 阴影
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(0, H/2 + 4, W/2 - 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // —— 主机壳（金属面，浅色阶状渐变） ——
  const caseGrad = ctx.createLinearGradient(0, -H/2, 0, H/2);
  caseGrad.addColorStop(0,    "#525a68");
  caseGrad.addColorStop(0.5,  "#3a4250");
  caseGrad.addColorStop(1,    "#262c36");
  ctx.fillStyle = caseGrad;
  ctx.strokeStyle = "#1a1f28";
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-W/2, -H/2 + 4, W, H - 8, 6);
  else ctx.rect(-W/2, -H/2 + 4, W, H - 8);
  ctx.fill(); ctx.stroke();
  // 高光
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-W/2 + 4, -H/2 + 6);
  ctx.lineTo(W/2 - 4, -H/2 + 6);
  ctx.stroke();

  // —— LCD 显示屏（玻璃面） ——
  const scrX = -W/2 + 14, scrY = -22, scrW = 64, scrH = 22;
  const scrGlass = ctx.createLinearGradient(0, scrY, 0, scrY + scrH);
  scrGlass.addColorStop(0, "#062818");
  scrGlass.addColorStop(1, "#0c3a20");
  ctx.fillStyle = scrGlass;
  ctx.strokeStyle = "#1a1a1a";
  ctx.fillRect(scrX, scrY, scrW, scrH);
  ctx.strokeRect(scrX, scrY, scrW, scrH);
  // 屏幕反光
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(scrX, scrY, scrW, scrH / 2);
  // 屏幕字
  ctx.fillStyle = "#7eff9c";
  ctx.shadowColor = "#5ed3ff"; ctx.shadowBlur = 4;
  ctx.font = "bold 13px monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("12.0V", scrX + 8, scrY + scrH / 2 - 1);
  ctx.font = "9px monospace";
  ctx.fillText("2.5A", scrX + 8, scrY + scrH / 2 + 8);
  ctx.shadowBlur = 0;

  // —— 旋钮（金属圆形 + 反光） ——
  const knobX = W/2 - 18, knobY = -10;
  const knobGrad = ctx.createRadialGradient(knobX - 3, knobY - 3, 2, knobX, knobY, 11);
  knobGrad.addColorStop(0, "#c8ced4");
  knobGrad.addColorStop(1, "#3a3e44");
  ctx.fillStyle = knobGrad;
  ctx.strokeStyle = "#1a1a1a";
  ctx.beginPath(); ctx.arc(knobX, knobY, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(knobX, knobY - 8); ctx.lineTo(knobX, knobY - 3); ctx.stroke();

  // —— 接线柱（红黑） ——
  const trmY = H/2 - 14;
  ctx.fillStyle = "#e53935";
  ctx.strokeStyle = "#7a1a1a"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-25, trmY, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#0a0a0a";
  ctx.beginPath(); ctx.arc( 25, trmY, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("+", -25, trmY + 4);
  ctx.fillText("−",  25, trmY + 4);

  // —— 电极导线 + 顶端电极（弯出主机向上） ——
  ctx.lineCap = "round";
  ctx.strokeStyle = "#e53935"; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-25, trmY);
  ctx.quadraticCurveTo(-35, 0, -22, -H/2 - 24);
  ctx.stroke();
  ctx.strokeStyle = "#0a0a0a";
  ctx.beginPath();
  ctx.moveTo(25, trmY);
  ctx.quadraticCurveTo(35, 0, 22, -H/2 - 24);
  ctx.stroke();
  // 顶端电极头（银色金属）
  ctx.fillStyle = "#cfd3da"; ctx.strokeStyle = "#666"; ctx.lineWidth = 1;
  ctx.fillRect(-26, -H/2 - 30, 8, 10);
  ctx.strokeRect(-26, -H/2 - 30, 8, 10);
  ctx.fillRect(18, -H/2 - 30, 8, 10);
  ctx.strokeRect(18, -H/2 - 30, 8, 10);

  // —— 电极间电弧（持续闪烁） ——
  const sparkOn = Math.sin(t / 90) > 0.3;
  if (sparkOn) {
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.shadowColor = "#5ed3ff"; ctx.shadowBlur = 14;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-22, -H/2 - 30);
    for (let i = 0; i < 6; i++) {
      const px = -22 + i * 8.8 + (Math.random() - 0.5) * 4;
      const py = -H/2 - 32 + (Math.random() - 0.5) * 6;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(22, -H/2 - 30);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// 紫外灯：金属灯头 + 紫色玻璃灯管 + 支架 + 向下光锥
function drawUVLamp(ctx, x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  const W = 110, H = 70;
  // 阴影
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(0, H/2 + 4, W/2 - 6, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // —— 底座 ——
  const baseGrad = ctx.createLinearGradient(0, H/2 - 12, 0, H/2);
  baseGrad.addColorStop(0, "#666");
  baseGrad.addColorStop(1, "#2a2a30");
  ctx.fillStyle = baseGrad;
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-32, H/2 - 12, 64, 10, 3);
  else ctx.rect(-32, H/2 - 12, 64, 10);
  ctx.fill(); ctx.stroke();

  // —— 支架柱 ——
  const standGrad = ctx.createLinearGradient(-4, 0, 4, 0);
  standGrad.addColorStop(0, "#3a3e44");
  standGrad.addColorStop(0.5, "#8a8e94");
  standGrad.addColorStop(1, "#3a3e44");
  ctx.fillStyle = standGrad;
  ctx.fillRect(-4, -8, 8, H/2 - 4);
  ctx.strokeStyle = "#1a1a1a";
  ctx.strokeRect(-4, -8, 8, H/2 - 4);

  // —— 灯头外壳（金属包裹） ——
  const headW = 90, headH = 22;
  const headGrad = ctx.createLinearGradient(0, -H/2, 0, -H/2 + headH);
  headGrad.addColorStop(0, "#3a3e44");
  headGrad.addColorStop(0.5, "#666e78");
  headGrad.addColorStop(1, "#2a2e34");
  ctx.fillStyle = headGrad;
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-headW/2, -H/2, headW, headH, 6);
  else ctx.rect(-headW/2, -H/2, headW, headH);
  ctx.fill(); ctx.stroke();
  // 灯头反光
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-headW/2 + 6, -H/2 + 3);
  ctx.lineTo(headW/2 - 6, -H/2 + 3);
  ctx.stroke();

  // —— 紫外灯管（玻璃 + 紫色发光） ——
  const pulse = 0.7 + 0.3 * Math.sin(t / 200);
  const tubeY = -H/2 + headH - 8;
  const tubeW = 80, tubeH = 10;
  // 玻璃管壁
  ctx.fillStyle = GLASS_FILL;
  ctx.strokeStyle = GLASS_STROKE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-tubeW/2, tubeY - tubeH/2, tubeW, tubeH, tubeH/2);
  else ctx.rect(-tubeW/2, tubeY - tubeH/2, tubeW, tubeH);
  ctx.fill(); ctx.stroke();
  // 内部发光
  const tubeGlow = ctx.createLinearGradient(-tubeW/2, 0, tubeW/2, 0);
  tubeGlow.addColorStop(0,   `rgba(186, 104, 200, ${pulse * 0.85})`);
  tubeGlow.addColorStop(0.5, `rgba(225, 150, 255, ${pulse})`);
  tubeGlow.addColorStop(1,   `rgba(186, 104, 200, ${pulse * 0.85})`);
  ctx.fillStyle = tubeGlow;
  ctx.shadowColor = "#ba68c8"; ctx.shadowBlur = 18;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-tubeW/2 + 4, tubeY - tubeH/2 + 2, tubeW - 8, tubeH - 4, (tubeH-4)/2);
  else ctx.rect(-tubeW/2 + 4, tubeY - tubeH/2 + 2, tubeW - 8, tubeH - 4);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 玻璃高光
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.fillRect(-tubeW/2 + 8, tubeY - tubeH/2 + 1, tubeW - 16, 1.5);

  // —— 向下光锥 ——
  const coneTop = tubeY + tubeH/2;
  const coneBot = coneTop + 90;
  const beamGrad = ctx.createLinearGradient(0, coneTop, 0, coneBot);
  beamGrad.addColorStop(0, `rgba(186, 104, 200, ${pulse * 0.4})`);
  beamGrad.addColorStop(1, "rgba(186, 104, 200, 0)");
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(-tubeW/2 + 4, coneTop);
  ctx.lineTo(-tubeW/2 - 14, coneBot);
  ctx.lineTo( tubeW/2 + 14, coneBot);
  ctx.lineTo( tubeW/2 - 4, coneTop);
  ctx.closePath();
  ctx.fill();
  // 光束粉尘
  for (let i = 0; i < 8; i++) {
    const seed = i * 53;
    const px = -38 + ((seed + t / 30) % 76);
    const py = coneTop + ((seed * 1.7 + t / 28) % 90);
    const alpha = (1 - (py - coneTop) / 90) * 0.7;
    ctx.fillStyle = `rgba(255, 230, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 冰浴：玻璃容器 + 冰块 + 上升冷雾
function drawIceBath(ctx, x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  const W = 130, H = 90;
  // 阴影
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(0, H/2 + 4, W/2 - 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // —— 玻璃容器（梯形烧杯样式，同烧杯材质） ——
  const topY = -H/2 + 4;
  const botY = H/2 - 4;
  const topW = W - 8;
  const botW = W - 18;
  ctx.fillStyle = GLASS_FILL;
  ctx.strokeStyle = GLASS_STROKE;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-topW/2, topY);
  ctx.lineTo(-botW/2, botY - 4);
  ctx.quadraticCurveTo(-botW/2, botY, -botW/2 + 6, botY);
  ctx.lineTo(botW/2 - 6, botY);
  ctx.quadraticCurveTo(botW/2, botY, botW/2, botY - 4);
  ctx.lineTo(topW/2, topY);
  ctx.stroke();
  // 玻璃壁本身（薄）
  ctx.fillStyle = "rgba(180, 220, 240, 0.18)";
  ctx.beginPath();
  ctx.moveTo(-topW/2, topY);
  ctx.lineTo(-botW/2, botY - 4);
  ctx.quadraticCurveTo(-botW/2, botY, -botW/2 + 6, botY);
  ctx.lineTo(botW/2 - 6, botY);
  ctx.quadraticCurveTo(botW/2, botY, botW/2, botY - 4);
  ctx.lineTo(topW/2, topY);
  ctx.closePath();
  ctx.fill();
  // 杯口口沿
  ctx.fillStyle = GLASS_FILL;
  ctx.fillRect(-topW/2 - 6, topY - 4, 16, 6);
  ctx.fillRect( topW/2 - 10, topY - 4, 16, 6);
  ctx.strokeRect(-topW/2 - 6, topY - 4, 16, 6);
  ctx.strokeRect( topW/2 - 10, topY - 4, 16, 6);
  // 高光（左侧竖线）
  ctx.strokeStyle = GLASS_HIGHL;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-topW/2 + 8, topY + 14);
  ctx.lineTo(-botW/2 + 10, botY - 10);
  ctx.stroke();

  // —— 冰块（多块堆叠） ——
  const cubes = [
    { cx: -36, cy: -2,  s: 22, r: -8  },
    { cx:  -8, cy: 6,   s: 24, r: 10  },
    { cx:  28, cy: 0,   s: 22, r: 25  },
    { cx: -18, cy: -18, s: 18, r: -15 },
    { cx:  20, cy: -16, s: 20, r: 18  },
    { cx:   0, cy: 22,  s: 18, r: 5   },
    { cx: -36, cy: 22,  s: 16, r: -5  },
    { cx:  38, cy: 22,  s: 18, r: 15  },
  ];
  for (const c of cubes) {
    ctx.save();
    ctx.translate(c.cx, c.cy);
    ctx.rotate(c.r * Math.PI / 180);
    // 冰块渐变
    const iceGrad = ctx.createLinearGradient(-c.s/2, -c.s/2, c.s/2, c.s/2);
    iceGrad.addColorStop(0,    "rgba(255,255,255,0.95)");
    iceGrad.addColorStop(0.5,  "rgba(220,240,255,0.85)");
    iceGrad.addColorStop(1,    "rgba(190,220,240,0.7)");
    ctx.fillStyle = iceGrad;
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-c.s/2, -c.s/2, c.s, c.s, 3);
    else ctx.rect(-c.s/2, -c.s/2, c.s, c.s);
    ctx.fill(); ctx.stroke();
    // 高光面（左上）
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.moveTo(-c.s/2 + 3, -c.s/2 + 3);
    ctx.lineTo(-c.s/2 + 3 + c.s/3, -c.s/2 + 3);
    ctx.lineTo(-c.s/2 + 3, -c.s/2 + 3 + c.s/3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // —— 升起的冷雾 ——
  for (let i = 0; i < 12; i++) {
    const phase = ((i * 37) + t / 22) % 120;
    const my = topY - 6 - phase * 0.6;
    const mx = -W/2 + 10 + ((i * 19) + phase * 0.18) % (W - 20);
    const alpha = Math.max(0, (1 - phase / 120) * 0.5);
    const r = 5 + phase * 0.09;
    ctx.fillStyle = `rgba(220, 240, 255, ${alpha})`;
    ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
  }
  // 雪花标识
  ctx.fillStyle = "#80deea";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("❄", 0, botY - 12);

  ctx.restore();
}

const fxLayer = document.getElementById("fx");
function playEffect(name, pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const complex = currentFx === "complex";
  if (name === "bubbles" || name === "bubblesFast") {
    const n = complex ? (name === "bubblesFast" ? 48 : 24) : (name === "bubblesFast" ? 30 : 14);
    for (let i = 0; i < n; i++) setTimeout(() => spawnBubble(null, pos), i * (name === "bubblesFast" ? 40 : 110));
    // 起头连续 3 声气泡，间隔随速度变化
    const gap = name === "bubblesFast" ? 60 : 140;
    audio.bubble();
    setTimeout(() => audio.bubble(), gap);
    setTimeout(() => audio.bubble(), gap * 2);
  }
  if (name === "spark") {
    const n = complex ? 28 : 18;
    for (let i = 0; i < n; i++) setTimeout(() => spawnSpark(null, pos), i * 28);
    audio.fizz(0.35);
  }
  if (name === "sparkle") {
    const n = complex ? 22 : 14;
    for (let i = 0; i < n; i++) setTimeout(() => spawnSparkle(pos), i * 80);
    audio.sparkle();
  }
  if (name === "flame") {
    spawnFlame(pos);
    audio.flame();
    if (complex) {
      // 小火苗上方少量余烬
      for (let i = 0; i < 5; i++) setTimeout(() => spawnSpark(null, pos), 400 + i * 130);
    }
  }
  if (name === "smoke") {
    const n = complex ? 9 : 5;
    for (let i = 0; i < n; i++) setTimeout(() => spawnSmoke(null, pos), i * (complex ? 280 : 400));
    audio.pop();
  }
  if (name === "heat") {
    const n = complex ? 10 : 6;
    for (let i = 0; i < n; i++) setTimeout(() => spawnSmoke("rgba(255,180,120,0.55)", pos), i * 280);
    audio.fizz(0.6);
    if (complex) {
      // 复杂模式加热浪 + 火星
      for (let i = 0; i < 3; i++) setTimeout(() => spawnHeat(pos), i * 500);
      for (let i = 0; i < 10; i++) setTimeout(() => spawnSpark(null, pos), 200 + i * 150);
    }
  }
  // 新增：爆炸特效（复杂模式自动触发更夸张）
  if (name === "blast") {
    spawnBlast(pos);
    audio.boom();
    for (let i = 0; i < (complex ? 30 : 16); i++) setTimeout(() => spawnSpark(null, pos), i * 25);
    for (let i = 0; i < (complex ? 14 : 8); i++) setTimeout(() => spawnSmoke(null, pos), 200 + i * 200);
  }
}
function spawnBubble(color, pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const b = document.createElement("div");
  const complex = currentFx === "complex";
  b.className = complex ? "bubble-c" : "bubble";
  const size = complex ? (5 + Math.random() * 18) : (6 + Math.random() * 14);
  b.style.width = b.style.height = size + "px";
  b.style.left = (pos.x - (complex ? 50 : 30) + Math.random() * (complex ? 100 : 60)) + "px";
  b.style.top  = (pos.y + 20) + "px";
  b.style.animationDuration = (complex ? 1.8 + Math.random() * 1.4 : 1.5 + Math.random() * 1.2) + "s";
  if (color && !complex) b.style.background = color;
  fxLayer.appendChild(b);
  setTimeout(() => b.remove(), complex ? 3600 : 3000);
}
function spawnSpark(color, pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const complex = currentFx === "complex";
  const s = document.createElement("div");
  s.className = complex ? "spark-c" : "spark";
  s.style.left = (pos.x - 28 + Math.random() * 56) + "px";
  s.style.top  = (pos.y - 18 + Math.random() * 36) + "px";
  const dx = (Math.random() * (complex ? 140 : 100) - (complex ? 70 : 50));
  const dy = -(40 + Math.random() * (complex ? 140 : 100));
  s.style.setProperty("--dx", dx + "px");
  s.style.setProperty("--dy", dy + "px");
  if (complex) {
    const core = document.createElement("div"); core.className = "core";
    const trail = document.createElement("div"); trail.className = "trail";
    const angle = Math.atan2(dy, dx);
    trail.style.transform = `rotate(${angle}rad)`;
    trail.style.transformOrigin = "right center";
    s.appendChild(trail); s.appendChild(core);
    if (color) {
      core.style.background = `radial-gradient(circle, ${color} 0%, transparent 80%)`;
      core.style.boxShadow = `0 0 14px ${color}, 0 0 28px ${color}`;
    }
  } else if (color) {
    s.style.background = color;
    s.style.boxShadow = `0 0 8px ${color}, 0 0 16px ${color}`;
  }
  fxLayer.appendChild(s);
  setTimeout(() => s.remove(), complex ? 1400 : 1300);
}
function spawnSparkle(pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const complex = currentFx === "complex";
  if (!complex) return spawnSpark("#fff", pos);
  const s = document.createElement("div");
  s.className = "sparkle-c";
  s.style.left = (pos.x - 40 + Math.random() * 80) + "px";
  s.style.top  = (pos.y - 30 + Math.random() * 60) + "px";
  fxLayer.appendChild(s);
  setTimeout(() => s.remove(), 1300);
}
function spawnSmoke(color, pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const complex = currentFx === "complex";
  const s = document.createElement("div");
  s.className = complex ? "smoke-c" : "smoke";
  s.style.left = (pos.x + (Math.random() - 0.5) * (complex ? 60 : 40)) + "px";
  s.style.top  = (pos.y - 20) + "px";
  if (color) s.style.background = `radial-gradient(circle, ${color}, transparent 70%)`;
  fxLayer.appendChild(s);
  setTimeout(() => s.remove(), complex ? 4000 : 3000);
}
function spawnFlame(pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const complex = currentFx === "complex";
  const f = document.createElement("div");
  f.className = complex ? "flame-c" : "flame";
  f.style.left = pos.x + "px";
  f.style.top  = (pos.y - (complex ? 80 : 60)) + "px";
  if (complex) {
    f.innerHTML = `<div class="layer l0"></div><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div><div class="heat-distort"></div>`;
  }
  fxLayer.appendChild(f);
  setTimeout(() => f.remove(), complex ? 1600 : 1200);
}
function spawnHeat(pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const h = document.createElement("div");
  h.className = "heat-c";
  h.style.left = pos.x + "px";
  h.style.top  = (pos.y - 50) + "px";
  fxLayer.appendChild(h);
  setTimeout(() => h.remove(), 2600);
}
function spawnBlast(pos) {
  pos = pos || { x: beakerBody.position.x, y: beakerBody.position.y };
  const b = document.createElement("div");
  b.className = "blast-c";
  b.style.left = pos.x + "px";
  b.style.top  = pos.y + "px";
  fxLayer.appendChild(b);
  setTimeout(() => b.remove(), 1000);
}

function showInfo(title, desc, eq) {
  document.getElementById("info").innerHTML = `
    <div class="title">${title}</div>
    <div class="desc">${desc}</div>
    ${eq ? `<div class="equation">${eq}</div>` : ""}
  `;
}
function updateContentsUI(contents) {
  const el = document.getElementById("contents");
  el.innerHTML = "";
  for (const [id, info] of Object.entries(contents)) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = `${SUBSTANCES[id].sym} ×${info.count}`;
    el.appendChild(tag);
  }
}
function handleResize() {
  W = labEl.clientWidth; H = labEl.clientHeight;
  canvas.width = W; canvas.height = H;
  waterCanvas.width = W; waterCanvas.height = H;
  gasCanvas.width = W; gasCanvas.height = H;
  render.options.width = W; render.options.height = H;
  // 重新放置静态边界（地板/墙壁）
  for (const b of Composite.allBodies(world).slice()) {
    if (b.isStatic && !b.instrumentType && b !== bLeft && b !== bRight && b !== bBottom) {
      Composite.remove(world, b);
    }
  }
  Composite.add(world, [
    Bodies.rectangle(W/2, H - 20, W, 40, wallOpts),
    Bodies.rectangle(-30, H/2, 60, H * 2, wallOpts),
    Bodies.rectangle(W + 30, H/2, 60, H * 2, wallOpts),
    Bodies.rectangle(W/2, -200, W, 40, wallOpts),
  ]);
  // 如果烧杯飘到屏幕外了就重新放回中间
  const bp = beakerBody.position;
  if (bp.x < 60 || bp.x > W - 60 || bp.y > H - 40) {
    Body.setPosition(beakerBody, { x: W/2, y: Math.min(80, H/2) });
    Body.setAngle(beakerBody, 0);
    Body.setVelocity(beakerBody, { x: 0, y: 0 });
    Body.setAngularVelocity(beakerBody, 0);
  }
}
window.addEventListener("resize", handleResize);
window.addEventListener("orientationchange", handleResize);

renderCatL1();
renderCatL2();
renderSubstances();
renderInstruments();
renderInstStatus();
updateLidStatus();
setQuantity(1);
// 标记欢迎信息以便切换语言时重新写入
document.getElementById("info").dataset.welcome = "1";
applyLanguage();
applyTheme();
</script>
